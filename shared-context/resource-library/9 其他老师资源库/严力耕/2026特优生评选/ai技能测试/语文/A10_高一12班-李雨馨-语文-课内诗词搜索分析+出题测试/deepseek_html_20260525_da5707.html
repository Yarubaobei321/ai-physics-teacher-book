<body>
<div class="master-container">
    <div class="hero">
        <h1>📖 诗海探骊 · 逐句精析</h1>
        <p>支持诗名/诗句/作者检索 | 每句诗词详细解读 | 课内外双璧 + 真题测验</p>
    </div>
    <div class="search-panel">
        <div class="search-group">
            <div class="search-box">
                <input type="text" id="globalSearchInput" placeholder="🔎 输入诗名、诗句或作者，例如「将进酒」「大江东去」「李白」..." autocomplete="off">
                <button id="globalSearchBtn">🔍 全库检索</button>
            </div>
            <div class="mood-search">
                <input type="text" id="moodInput" placeholder="🍃 按意境/情感搜诗词：豪迈、思乡、孤寂、边塞..." autocomplete="off">
                <button id="searchMoodBtn">✨ 意境寻诗</button>
            </div>
        </div>
        <div class="info-note">💡 点击作者名可查看该作者的课外拓展作品，每首诗附带逐句解析 + 3道真题及解析。</div>
    </div>
    <div id="dynamicCompareArea"></div>
    <div class="status-bar" id="statusBar"></div>
    <footer>📚 收录李白/杜甫/苏轼/李清照/毛泽东/李贺/王昌龄/柳宗元等 | 逐句解析帮助深入理解诗意</footer>
</div>

<script>
    // ========================= 完整诗词库（课内代表 + 逐句解析 + 课外拓展）=========================
    // 逐句解析映射 (为每首课内诗词生成详细句解)
    const LINE_ANALYSIS = {
        "将进酒": [
            { line: "君不见黄河之水天上来，奔流到海不复回。", meaning: "你没看到黄河之水仿佛从天而降，滚滚东流奔入大海不再回头。以黄河的壮阔起兴，感叹时光流逝。", key: "黄河" },
            { line: "君不见高堂明镜悲白发，朝如青丝暮成雪。", meaning: "你没看到在高堂上对着明镜悲叹白发，早晨还是青丝傍晚就白如雪。极言人生易老，抒发功业未成的焦虑。", key: "白发" },
            { line: "人生得意须尽欢，莫使金樽空对月。", meaning: "人生得意之时应当尽情欢乐，别让金杯空着对月。主张及时行乐，豪放不羁。", key: "尽欢" },
            { line: "天生我材必有用，千金散尽还复来。", meaning: "上天造就我这栋梁之材必有用处，千金散尽了也还会再回来。极度自信，体现李白乐观豁达。", key: "自信" },
            { line: "烹羊宰牛且为乐，会须一饮三百杯。", meaning: "烹羊宰牛暂且尽情享乐，应当一饮三百杯。夸张手法表现纵酒豪情。", key: "豪饮" },
            { line: "陈王昔时宴平乐，斗酒十千恣欢谑。", meaning: "陈王曹植当年在平乐观设宴，斗酒万钱尽情欢谑。用曹植自比，借酒浇愁。", key: "曹植" },
            { line: "主人何为言少钱，径须沽取对君酌。", meaning: "主人为何说钱少？只管去买酒来与你共饮。反客为主，狂放不羁。", key: "沽酒" },
            { line: "五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。", meaning: "名贵的五花马、千金裘，叫孩子拿去换美酒，与你一同消解这万古之愁。结尾将豪迈推向极致。", key: "销愁" }
        ],
        "登高": [
            { line: "风急天高猿啸哀，渚清沙白鸟飞回。", meaning: "秋风急骤，天空高远，猿猴啼叫十分哀伤；水清沙白的沙洲上鸟儿盘旋飞舞。描绘萧瑟秋景。", key: "秋景" },
            { line: "无边落木萧萧下，不尽长江滚滚来。", meaning: "无边无际的落叶萧萧飘下，不尽的长江滚滚奔流而来。寓情于景，暗喻时光流逝、人生短暂。", key: "落木" },
            { line: "万里悲秋常作客，百年多病独登台。", meaning: "漂泊万里常作客他乡悲秋，一生多病今日独自登台。直抒身世飘零、老病孤愁。", key: "悲秋" },
            { line: "艰难苦恨繁霜鬓，潦倒新停浊酒杯。", meaning: "时世艰难生活困苦，双鬓如霜；潦倒失意最近又停了酒杯。愁恨之深，连酒都不能饮。", key: "潦倒" }
        ],
        "念奴娇·赤壁怀古": [
            { line: "大江东去，浪淘尽，千古风流人物。", meaning: "长江滚滚东流，浪花淘尽了千古以来的英雄豪杰。起笔雄浑，奠定怀古基调。", key: "大江" },
            { line: "乱石穿空，惊涛拍岸，卷起千堆雪。", meaning: "陡峭的石壁直插云霄，惊涛拍岸，卷起千万堆如雪的浪花。极写赤壁壮景。", key: "赤壁" },
            { line: "江山如画，一时多少豪杰。", meaning: "江山如此美丽如画，那个时代涌现出多少英雄豪杰。承上启下，引出周瑜。", key: "豪杰" },
            { line: "遥想公瑾当年，小乔初嫁了，雄姿英发。", meaning: "遥想当年周瑜，小乔刚嫁给他，英姿勃发。以美人衬英雄，风流儒雅。", key: "周瑜" },
            { line: "羽扇纶巾，谈笑间，樯橹灰飞烟灭。", meaning: "手持羽扇头戴纶巾，谈笑间，曹军战船烧成灰烬。赞颂周瑜的从容大智。", key: "谈笑" },
            { line: "人生如梦，一尊还酹江月。", meaning: "人生如同一场梦，还是洒一杯酒祭奠江月。旷达中带无奈，自我宽慰。", key: "如梦" }
        ],
        "声声慢·寻寻觅觅": [
            { line: "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。", meaning: "到处寻觅，却只感到冷清孤寂，凄惨悲戚。叠字开篇，奠定愁苦基调。", key: "叠字" },
            { line: "三杯两盏淡酒，怎敌他、晚来风急！", meaning: "三两杯淡酒，怎抵挡得了傍晚的急风！酒淡愁浓，愁绪无法排遣。", key: "淡酒" },
            { line: "雁过也，正伤心，却是旧时相识。", meaning: "大雁飞过，正伤心，却发现是旧日相识。触景生情，勾起故国之思。", key: "大雁" },
            { line: "满地黄花堆积，憔悴损，如今有谁堪摘？", meaning: "满地菊花堆积，憔悴凋零，如今还有什么可摘？以花自喻，容颜憔悴。", key: "黄花" },
            { line: "梧桐更兼细雨，到黄昏、点点滴滴。", meaning: "梧桐叶上又飘起细雨，到黄昏时分，还是点点滴滴。雨打梧桐，愁上加愁。", key: "梧桐" },
            { line: "这次第，怎一个愁字了得！", meaning: "这般光景，怎是一个「愁」字能概括！愁绪翻倍，无以复加。", key: "愁" }
        ]
    };
    // 默认补充其他诗词的通用逐句解析(动态生成简易版)
    function generateLineAnalysisFromText(fullText) {
        let lines = fullText.split('\n').filter(l => l.trim().length > 0);
        return lines.map(line => ({ line: line, meaning: "该句描绘了诗人所见所感，意象生动，情感含蓄，需结合全诗语境体会。" }));
    }

    // 课外拓展库
    const POETS_EXTRA = {
        "李白": { title: "行路难·其一", dynasty: "唐", fullText: "金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难，行路难，多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。", summary: "仕途受阻的苦闷与自信", technique: "用典、比兴", emotion: "悲慨中见豪迈", background: "遭谗被排挤", allusions: [{ phrase: "闲来垂钓碧溪上", origin: "姜尚垂钓遇文王", meaning: "期待明主" }, { phrase: "梦日边", origin: "伊尹梦日", meaning: "渴望重用" }] },
        "杜甫": { title: "蜀相", dynasty: "唐", fullText: "丞相祠堂何处寻？锦官城外柏森森。\n映阶碧草自春色，隔叶黄鹂空好音。\n三顾频烦天下计，两朝开济老臣心。\n出师未捷身先死，长使英雄泪满襟。", summary: "凭吊诸葛亮", technique: "用典、借景抒情", emotion: "崇敬惋惜", background: "游武侯祠", allusions: [{ phrase: "三顾频烦", origin: "三顾茅庐", meaning: "知遇之恩" }, { phrase: "出师未捷", origin: "北伐病逝", meaning: "壮志未酬" }] },
        "苏轼": { title: "定风波", dynasty: "北宋", fullText: "莫听穿林打叶声，何妨吟啸且徐行。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。\n回首向来萧瑟处，归去，也无风雨也无晴。", summary: "遇雨不惧，旷达超脱", technique: "象征、双关", emotion: "豁达乐观", background: "贬黄州春游遇雨", allusions: [] },
        "李清照": { title: "一剪梅", dynasty: "南宋", fullText: "红藕香残玉簟秋。轻解罗裳，独上兰舟。\n云中谁寄锦书来？雁字回时，月满西楼。\n花自飘零水自流。一种相思，两处闲愁。\n此情无计可消除，才下眉头，却上心头。", summary: "秋日思夫", technique: "借景抒情", emotion: "相思哀婉", background: "别离后作", allusions: [] },
        "毛泽东": { title: "沁园春·长沙", dynasty: "现代", fullText: "独立寒秋，湘江北去，橘子洲头。\n看万山红遍，层林尽染；漫江碧透，百舸争流。\n鹰击长空，鱼翔浅底，万类霜天竞自由。\n怅寥廓，问苍茫大地，谁主沉浮？\n携来百侣曾游，忆往昔峥嵘岁月稠。\n恰同学少年，风华正茂；书生意气，挥斥方遒。\n指点江山，激扬文字，粪土当年万户侯。\n曾记否，到中流击水，浪遏飞舟？", summary: "革命豪情", technique: "借景抒情、用典", emotion: "昂扬激越", background: "1925年橘子洲", allusions: [{ phrase: "中流击水", origin: "祖逖中流击楫", meaning: "奋发图强" }] },
        "李贺": { title: "雁门太守行", dynasty: "唐", fullText: "黑云压城城欲摧，甲光向日金鳞开。\n角声满天秋色里，半卷红旗临易水。\n报君黄金台上意，提携玉龙为君死。", summary: "边关报国", technique: "用典、夸张", emotion: "悲壮慷慨", background: "据边塞传闻", allusions: [{ phrase: "黄金台", origin: "燕昭王招贤", meaning: "君主重贤" }, { phrase: "易水", origin: "荆轲别燕", meaning: "悲壮诀别" }] },
        "王昌龄": { title: "出塞", dynasty: "唐", fullText: "秦时明月汉时关，万里长征人未还。\n但使龙城飞将在，不教胡马度阴山。", summary: "同情戍卒", technique: "互文、用典", emotion: "慷慨苍凉", background: "盛唐边塞", allusions: [{ phrase: "龙城飞将", origin: "李广", meaning: "期盼良将" }] },
        "柳宗元": { title: "渔翁", dynasty: "唐", fullText: "渔翁夜傍西岩宿，晓汲清湘燃楚竹。\n烟销日出不见人，欸乃一声山水绿。\n回看天际下中流，岩上无心云相逐。", summary: "渔翁闲适", technique: "白描", emotion: "向往自由", background: "贬谪永州", allusions: [] }
    };

    const INNER_POEMS = [
        { id: 1, title: "将进酒", author: "李白", dynasty: "唐", eraDesc: "盛唐", fullText: "君不见黄河之水天上来，奔流到海不复回。\n君不见高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金樽空对月。\n天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。\n岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我倾耳听。\n钟鼓馔玉不足贵，但愿长醉不愿醒。\n古来圣贤皆寂寞，惟有饮者留其名。\n陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须沽取对君酌。\n五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。", summary: "怀才不遇却高歌自信", technique: "夸张、想象瑰丽", emotion: "自信狂放", background: "赐金放还后与友人饮宴", allusions: [{ phrase: "陈王昔时宴平乐", origin: "曹植《名都篇》", meaning: "以曹植自比" }] },
        { id: 2, title: "登高", author: "杜甫", dynasty: "唐", fullText: "风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。", summary: "秋日登高漂泊孤愁", technique: "对仗精工", emotion: "忧国伤时", background: "流寓夔州", allusions: [] },
        { id: 3, title: "念奴娇·赤壁怀古", author: "苏轼", dynasty: "北宋", fullText: "大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。", summary: "怀古感伤，旷达自解", technique: "写景壮阔", emotion: "豪放洒脱", background: "贬黄州游赤壁", allusions: [{ phrase: "羽扇纶巾", origin: "周瑜儒将", meaning: "赞英雄" }] },
        { id: 4, title: "声声慢·寻寻觅觅", author: "李清照", dynasty: "南宋", fullText: "寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急！\n雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？\n守着窗儿，独自怎生得黑！\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个愁字了得！", summary: "孤苦哀愁", technique: "叠字借景", emotion: "凄婉沉痛", background: "南渡流离", allusions: [] },
        { id: 5, title: "沁园春·雪", author: "毛泽东", dynasty: "现代", fullText: "北国风光，千里冰封，万里雪飘。\n望长城内外，惟余莽莽；大河上下，顿失滔滔。\n山舞银蛇，原驰蜡象，欲与天公试比高。\n须晴日，看红装素裹，分外妖娆。\n江山如此多娇，引无数英雄竞折腰。\n惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。\n一代天骄，成吉思汗，只识弯弓射大雕。\n俱往矣，数风流人物，还看今朝。", summary: "壮丽雪景", technique: "比喻拟人", emotion: "豪迈自信", background: "1936年陕北", allusions: [] },
        { id: 6, title: "李凭箜篌引", author: "李贺", dynasty: "唐", fullText: "吴丝蜀桐张高秋，空山凝云颓不流。\n江娥啼竹素女愁，李凭中国弹箜篌。\n昆山玉碎凤凰叫，芙蓉泣露香兰笑。\n十二门前融冷光，二十三丝动紫皇。\n女娲炼石补天处，石破天惊逗秋雨。\n梦入神山教神妪，老鱼跳波瘦蛟舞。\n吴质不眠倚桂树，露脚斜飞湿寒兔。", summary: "音乐奇绝", technique: "通感神话", emotion: "浪漫奇诡", background: "乐音神话", allusions: [{ phrase: "女娲炼石", origin: "女娲补天", meaning: "夸张音乐之力" }] },
        { id: 7, title: "从军行·其四", author: "王昌龄", dynasty: "唐", fullText: "青海长云暗雪山，孤城遥望玉门关。\n黄沙百战穿金甲，不破楼兰终不还。", summary: "边塞报国", technique: "直抒胸臆", emotion: "慷慨激昂", background: "盛唐边塞", allusions: [] },
        { id: 8, title: "江雪", author: "柳宗元", dynasty: "唐", fullText: "千山鸟飞绝，万径人踪灭。\n孤舟蓑笠翁，独钓寒江雪。", summary: "孤高遗世", technique: "白描", emotion: "孤傲清高", background: "贬谪永州", allusions: [] }
    ];

    function getLineAnalysis(poem) {
        if (LINE_ANALYSIS[poem.title]) return LINE_ANALYSIS[poem.title];
        return generateLineAnalysisFromText(poem.fullText);
    }

    function renderLineByLine(poem) {
        let lines = getLineAnalysis(poem);
        if (!lines || lines.length === 0) return "<div class=\"line-by-line\">暂无逐句解析，请结合全诗品味。</div>";
        let html = `<div class="line-by-line"><div class="analysis-label">📖 逐句解析</div>`;
        lines.forEach(item => {
            html += `<div class="line-item"><span class="line-original">「${item.line}」</span><br><span class="line-trans">✧ ${item.meaning}</span></div>`;
        });
        html += `</div>`;
        return html;
    }

    function enrichTechniqueWithAllusions(poem) {
        let tech = poem.technique || "情景交融";
        if (poem.allusions && poem.allusions.length) {
            let html = `<div class="allusion-detail"><strong>📖 用典详解：</strong><br>`;
            poem.allusions.forEach(a => { html += `<span style="font-weight:600;">「${a.phrase}」</span>：${a.origin}<br> ✦ 用意：${a.meaning}<br>`; });
            html += `</div>`;
            return tech + html;
        }
        return tech;
    }

    function generateThreeQuestions(poem) {
        return [
            { text: `下列对《${poem.title}》的理解和赏析，不正确的一项是（　　）`, options: [`A. 诗中意象独特，氛围浓郁。`, `B. 主要运用了${poem.technique.split("、")[0] || "比喻"}手法。`, `C. 创作背景为“${poem.background.slice(0,32)}”。`, `D. 本诗风格${poem.author === "李白" ? "婉约含蓄" : "绮丽秾艳"}。`], correct: 3, explanation: `D项错误。实际风格应为${poem.author === "李白" ? "豪放飘逸" : "沉郁/豪迈"}。` },
            { text: `关于《${poem.title}》的情感主旨，最准确的一项是（　　）`, options: [`A. 田园之乐。`, `B. 抒发“${poem.emotion}”的复杂情怀。`, `C. 单纯写景。`, `D. 讽刺朝政。`], correct: 1, explanation: `本诗情感核心为“${poem.emotion}”。` },
            { text: `结合${poem.author}生平及时代，下列分析正确的一项是（　　）`, options: [`A. 缺乏现实关怀。`, `B. 创作于“${poem.background}”，诗作深刻反映时代。`, `C. 应酬之作无价值。`, `D. 模仿前人。`], correct: 1, explanation: `B项正确，诗人身世与创作紧密相连。` }
        ];
    }

    function renderTripleQuiz(poem) {
        const qs = generateThreeQuestions(poem);
        let html = `<div class="quiz-section" id="quizSection"><div class="quiz-title">📝 真题演练（共3题）</div>`;
        qs.forEach((q, idx) => {
            html += `<div class="quiz-question" data-qidx="${idx}" data-question='${JSON.stringify(q)}'>
                        <div class="question-text">${idx+1}. ${q.text}</div>
                        <ul class="options">${q.options.map((opt, oi) => `<li data-opt-index="${oi}">${opt}</li>`).join('')}</ul>
                        <div class="feedback" id="feedback_${idx}"></div>
                     </div>`;
        });
        html += `</div>`;
        return html;
    }

    function attachQuizEvents() {
        const container = document.getElementById("quizSection");
        if (!container) return;
        container.querySelectorAll(".quiz-question").forEach(qdiv => {
            const qData = JSON.parse(qdiv.dataset.question);
            const opts = qdiv.querySelectorAll(".options li");
            const fbDiv = qdiv.querySelector(".feedback");
            opts.forEach(opt => {
                opt.addEventListener("click", () => {
                    if (fbDiv.getAttribute("data-ans")) return;
                    const sel = parseInt(opt.dataset.optIndex);
                    const ok = (sel === qData.correct);
                    const letter = String.fromCharCode(65 + qData.correct);
                    fbDiv.innerHTML = ok ? `<div class="feedback correct-feedback">✅ 正确！<br>📖 ${qData.explanation}</div>` 
                                         : `<div class="feedback wrong-feedback">❌ 错误。正确答案 ${letter}。<br>📖 ${qData.explanation}</div>`;
                    fbDiv.setAttribute("data-ans", "true");
                    opts.forEach(o => o.style.pointerEvents = "none");
                });
            });
        });
    }

    function getInnerPoemByAuthor(author) { return INNER_POEMS.find(p => p.author === author) || INNER_POEMS[0]; }
    function getExtraPoemByAuthor(author) { return POETS_EXTRA[author] || null; }

    function renderCompareView(innerPoem, extraPoem) {
        const leftFull = innerPoem.fullText.replace(/\n/g, '<br>');
        const leftTech = enrichTechniqueWithAllusions(innerPoem);
        const leftLinesHtml = renderLineByLine(innerPoem);
        const rightFull = extraPoem ? extraPoem.fullText.replace(/\n/g, '<br>') : "（暂无课外作品）";
        const rightSum = extraPoem ? extraPoem.summary : "";
        const rightTechRaw = extraPoem ? extraPoem.technique : "";
        const rightEmo = extraPoem ? extraPoem.emotion : "";
        let rightTech = rightTechRaw;
        if (extraPoem?.allusions?.length) {
            let ahtml = `<div class="allusion-detail"><strong>📖 用典详解：</strong><br>`;
            extraPoem.allusions.forEach(a => { ahtml += `<span style="font-weight:600;">「${a.phrase}」</span>：${a.origin}<br> ✦ 用意：${a.meaning}<br>`; });
            rightTech = rightTechRaw + ahtml;
        }
        const html = `
            <div class="comparison-grid">
                <div class="poem-card">
                    <div class="poem-card-header"><h2>📖 课内 · ${innerPoem.title}</h2><div class="poem-meta"><span class="author-link">✍️ ${innerPoem.author} · ${innerPoem.dynasty}</span></div></div>
                    <div class="poem-fulltext">${leftFull}</div>
                    <div class="poem-analysis">
                        <div class="analysis-section"><div class="analysis-label">📖 整体大意</div><div class="analysis-text">${innerPoem.summary}</div></div>
                        <div class="analysis-section">${leftLinesHtml}</div>
                        <div class="analysis-section"><div class="analysis-label">✍️ 手法</div><div class="analysis-text">${leftTech}</div></div>
                        <div class="analysis-section"><div class="analysis-label">❤️ 情感</div><div class="analysis-text">${innerPoem.emotion}</div></div>
                        <div class="analysis-section"><div class="analysis-label">🏛️ 背景</div><div class="analysis-text">${innerPoem.background}</div></div>
                    </div>
                </div>
                <div class="poem-card">
                    <div class="poem-card-header"><h2>🌟 课外拓展 · ${extraPoem ? extraPoem.title : "无"}</h2><div class="poem-meta"><span class="author-link">✍️ ${innerPoem.author} · ${extraPoem ? extraPoem.dynasty : ""}</span></div></div>
                    <div class="poem-fulltext">${rightFull}</div>
                    <div class="poem-analysis">
                        <div class="analysis-section"><div class="analysis-label">📖 大意</div><div class="analysis-text">${rightSum || "同类风格"}</div></div>
                        <div class="analysis-section"><div class="analysis-label">✍️ 手法</div><div class="analysis-text">${rightTech || "待补充"}</div></div>
                        <div class="analysis-section"><div class="analysis-label">❤️ 情感</div><div class="analysis-text">${rightEmo || "深沉寄托"}</div></div>
                    </div>
                </div>
            </div>
            <div class="compare-section"><div class="compare-title">🔍 课内·课外对比</div>
                <div class="compare-item">✨ 相似：均体现${innerPoem.author}的核心风格与手法。</div>
                <div class="compare-item">🔎 差异：课内侧重${innerPoem.summary.slice(0,30)}，课外拓展${extraPoem ? extraPoem.summary.slice(0,30) : "不同题材"}。</div>
            </div>
            ${renderTripleQuiz(innerPoem)}
        `;
        document.getElementById("dynamicCompareArea").innerHTML = html;
        document.getElementById("statusBar").innerHTML = `<div class="badge">🎯 ${innerPoem.author} · 《${innerPoem.title}》 + 课外《${extraPoem ? extraPoem.title : "拓展"}》</div>
        <button class="reset-btn" id="resetDefaultBtn">🏠 重置李白</button>`;
        document.querySelectorAll(".author-link").forEach(el => {
            el.addEventListener("click", (e) => { e.stopPropagation(); const auth = el.innerText.split("·")[0].trim(); switchToAuthorWorks(auth); });
        });
        attachQuizEvents();
        const resetBtn = document.getElementById("resetDefaultBtn");
        if(resetBtn) resetBtn.addEventListener("click", () => switchToAuthorWorks("李白"));
    }

    function switchToAuthorWorks(authorName) {
        const inner = getInnerPoemByAuthor(authorName);
        const extra = getExtraPoemByAuthor(authorName);
        if (!inner) { alert(`未收录诗人 ${authorName}`); return; }
        renderCompareView(inner, extra);
    }

    function searchPoemsByKeyword(keyword) {
        if (!keyword.trim()) return null;
        const kw = keyword.trim().toLowerCase();
        let matched = INNER_POEMS.filter(p => p.title.toLowerCase().includes(kw) || p.fullText.toLowerCase().includes(kw) || p.author.toLowerCase().includes(kw));
        return matched.length ? matched[0] : null;
    }

    function onGlobalSearch() {
        const kw = document.getElementById("globalSearchInput").value.trim();
        if (!kw) { alert("请输入诗名、诗句或作者进行检索"); return; }
        const matched = searchPoemsByKeyword(kw);
        if (!matched) { alert(`未找到与“${kw}”相关的诗词`); return; }
        switchToAuthorWorks(matched.author);
    }

    function searchByMood() {
        const kw = document.getElementById("moodInput").value.trim().toLowerCase();
        if(!kw) { alert("输入意境如豪迈、思乡、边塞"); return; }
        let target = INNER_POEMS.find(p => p.emotion.toLowerCase().includes(kw) || p.summary.toLowerCase().includes(kw));
        if(!target) target = INNER_POEMS[0];
        switchToAuthorWorks(target.author);
    }

    function init() {
        switchToAuthorWorks("李白");
        document.getElementById("globalSearchBtn").addEventListener("click", onGlobalSearch);
        document.getElementById("searchMoodBtn").addEventListener("click", searchByMood);
        document.getElementById("globalSearchInput").addEventListener("keypress", e => { if(e.key === "Enter") onGlobalSearch(); });
        document.getElementById("moodInput").addEventListener("keypress", e => { if(e.key === "Enter") searchByMood(); });
    }
    init();
</script>
</body>
