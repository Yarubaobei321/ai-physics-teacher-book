<!DOCTYPE html>
<!--
  教学网页通用骨架（三段式：原理讲解 → 交互演示 → 配套习题）
  用法：在 ZCode 中把本文件作为起点，让 AI 在各 <section> 内按 PRD 填充具体内容。
  约定：单文件、不依赖外网、平板优先。视觉规范见 AGENTS.md。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教学网页骨架 · 课题名称</title>
  <style>
    :root{
      --yc-blue:#1E5FB4; --yc-ink-blue:#0B3D91;
      --bg:#F5F7FA; --text:#1F2D3D; --card:#FFFFFF; --line:#E2E8F0;
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      background:var(--bg);color:var(--text);font-size:18px;line-height:1.7;}
    header{background:var(--yc-blue);color:#fff;padding:20px 16px;text-align:center;}
    header h1{margin:0;font-size:24px;}
    main{max-width:960px;margin:0 auto;padding:16px;}
    section{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:20px;margin:16px 0;}
    section h2{color:var(--yc-ink-blue);border-left:6px solid var(--yc-blue);
      padding-left:12px;margin-top:0;font-size:22px;}
    .controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:12px 0;}
    .controls label{display:flex;flex-direction:column;font-size:16px;}
    button{min-height:44px;min-width:44px;padding:10px 18px;border:none;border-radius:8px;
      background:var(--yc-blue);color:#fff;font-size:18px;cursor:pointer;}
    .readout{font-size:24px;font-weight:bold;color:var(--yc-ink-blue);}
    .quiz-item{border-top:1px solid var(--line);padding:14px 0;}
    .quiz-item:first-child{border-top:none;}
    details summary{cursor:pointer;color:var(--yc-blue);font-weight:bold;}
    canvas{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;}
    @media (max-width:600px){ body{font-size:17px;} header h1{font-size:20px;} }
  </style>
</head>
<body>
  <header>
    <h1>课题名称（请替换）</h1>
  </header>
  <main>

    <!-- ① 原理讲解区 -->
    <section id="principle">
      <h2>一、原理讲解</h2>
      <p>在此填写概念、公式与教学类比。公式示例：T = 2π√(L/g)。</p>
    </section>

    <!-- ② 交互演示区 -->
    <section id="demo">
      <h2>二、交互演示</h2>
      <div class="controls">
        <label>参数A
          <input type="range" id="paramA" min="0" max="100" value="50" />
        </label>
        <button id="playBtn">播放/暂停</button>
        <button id="resetBtn">重置</button>
        <span class="readout" id="readout">数值：—</span>
      </div>
      <canvas id="stage" width="900" height="360"></canvas>
    </section>

    <!-- ③ 配套习题区 -->
    <section id="quiz">
      <h2>三、配套习题</h2>
      <div class="quiz-item">
        <p>【基础】题干……</p>
        <details><summary>查看答案</summary><p>答案与详解……</p></details>
      </div>
      <div class="quiz-item">
        <p>【中等】题干……</p>
        <details><summary>查看答案</summary><p>答案与详解……</p></details>
      </div>
      <div class="quiz-item">
        <p>【挑战 / 误区辨析】题干……</p>
        <details><summary>查看答案</summary><p>答案与详解……</p></details>
      </div>
    </section>

  </main>

  <script>
    // 交互演示占位逻辑：由 AI 按 PRD 替换为具体动画与计算
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const readout = document.getElementById('readout');
    let playing = false, t = 0;
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const a = +document.getElementById('paramA').value;
      ctx.fillStyle = '#1E5FB4';
      ctx.beginPath();
      ctx.arc(canvas.width/2 + Math.sin(t/30)*a*2, canvas.height/2, 16, 0, Math.PI*2);
      ctx.fill();
      readout.textContent = '数值：' + a;
      if(playing){ t++; requestAnimationFrame(draw); }
    }
    document.getElementById('playBtn').onclick = ()=>{ playing=!playing; if(playing) draw(); };
    document.getElementById('resetBtn').onclick = ()=>{ playing=false; t=0; draw(); };
    document.getElementById('paramA').oninput = draw;
    draw();
  </script>
</body>
</html>
