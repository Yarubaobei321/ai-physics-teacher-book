<body>
    <div id="info-panel">
        <div id="title">🧪 [班级已隐去][姓名已隐去]化学烃类有机物及其反应的演示</div>
        <div id="desc">烷烃(四面体键角~109.5°) · 烯烃(平面双键) | 取代反应(Cl₂ → CH₃Cl + HCl) | 加成反应 | 加聚反应</div>
    </div>
    <div class="controls">
        <button id="btn-alkane" class="active">🔥 烷烃</button>
        <div class="slider-container">
            <span>碳原子数:</span>
            <input type="range" id="carbonSlider" min="2" max="8" step="1" value="3">
            <span id="carbonCountDisplay">3</span>
        </div>
        <button id="btn-alkene">⚡ 烯烃 (乙烯)</button>
        <div class="reaction-group">
            <span style="font-size:12px;">🧪 动态反应:</span>
            <button id="btn-substitution">取代反应 (CH₄+Cl₂)</button>
            <button id="btn-addition">加成反应 (C₂H₄+Br₂)</button>

        </div>
    </div>
    <div class="instruction">🖱️ 鼠标拖拽旋转 | 右键平移 | 滚轮缩放 | 反应动画自动演示原子迁移/键变化 | 滑杆调整烷烃碳链长度</div>
    <div class="status-msg" id="statusMsg">✅ 当前: 丙烷 (C₃H₈) 四面体键角~109°</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 7);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.target.set(0, 0, 0);

        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(2, 5, 3);
        mainLight.castShadow = true;
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0x4466cc, 0.3);
        fillLight.position.set(-2, 1, 2);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xffaa66, 0.25);
        backLight.position.set(0, 1, -3);
        scene.add(backLight);
        const gridHelper = new THREE.GridHelper(12, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.8;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.25;
        scene.add(gridHelper);
        
        // 星空
        const starField = () => {
            const vertices = [];
            for (let i = 0; i < 800; i++) {
                vertices.push((Math.random() - 0.5) * 200);
                vertices.push((Math.random() - 0.5) * 100);
                vertices.push((Math.random() - 0.5) * 80 - 40);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertices), 3));
            const material = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.08, transparent: true, opacity: 0.5 });
            scene.add(new THREE.Points(geometry, material));
        };
        starField();

        let currentModelGroup = null;
        let activeAnimation = null;

        // 工具函数
        function createAtom(element, radius, color, pos) {
            const geometry = new THREE.SphereGeometry(radius, 64, 64);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(pos);
            sphere.userData = { element, radius };
            return sphere;
        }
        function createBond(pos1, pos2, radius = 0.08, color = 0xccccaa) {
            const start = new THREE.Vector3(pos1.x, pos1.y, pos1.z);
            const end = new THREE.Vector3(pos2.x, pos2.y, pos2.z);
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();
            const center = start.clone().add(end).multiplyScalar(0.5);
            const cylinder = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, length, 12),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.4, metalness: 0.2 })
            );
            cylinder.position.copy(center);
            cylinder.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.clone().normalize());
            return cylinder;
        }
        function makeLabel(text, color, position, fontSize = '0.85rem') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = fontSize;
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0px black';
            div.style.background = 'rgba(20,20,40,0.75)';
            div.style.padding = '2px 8px';
            div.style.borderRadius = '20px';
            div.style.border = `1px solid ${color}`;
            div.style.backdropFilter = 'blur(4px)';
            div.style.fontFamily = 'monospace';
            div.style.whiteSpace = 'nowrap';
            const label = new CSS2DObject(div);
            label.position.copy(position);
            return label;
        }
        function removeCurrentModel() {
            if (activeAnimation) {
                if (typeof activeAnimation === 'number') cancelAnimationFrame(activeAnimation);
                else clearTimeout(activeAnimation);
                activeAnimation = null;
            }
            if (currentModelGroup) {
                while(currentModelGroup.children.length) {
                    const child = currentModelGroup.children[0];
                    currentModelGroup.remove(child);
                }
                scene.remove(currentModelGroup);
                currentModelGroup = null;
            }
        }

        // ================= 烷烃: 任意碳链 (四面体键角 ~109.5°) 每个碳正确连接氢 =================
        function buildAlkane(carbonCount) {
            const group = new THREE.Group();
            const carbonPositions = [];
            const bondLength = 1.58;
            for (let i = 0; i < carbonCount; i++) {
                let x = (i - (carbonCount-1)/2) * bondLength;
                let y = 0;
                let z = (i % 2 === 0 ? 0.25 : -0.25);
                const pos = new THREE.Vector3(x, y, z);
                carbonPositions.push(pos);
                const carbon = createAtom('C', 0.48, 0x708090, pos);
                group.add(carbon);
            }
            for (let i = 0; i < carbonCount-1; i++) {
                group.add(createBond(carbonPositions[i], carbonPositions[i+1], 0.1, 0xbc9a6c));
            }
            // 四面体单位向量基
            const tetraDirs = [
                new THREE.Vector3(0.577, 0.577, 0.577).normalize(),
                new THREE.Vector3(0.577, -0.577, -0.577).normalize(),
                new THREE.Vector3(-0.577, 0.577, -0.577).normalize(),
                new THREE.Vector3(-0.577, -0.577, 0.577).normalize()
            ];
            const hBondLen = 1.05;
            for (let i = 0; i < carbonCount; i++) {
                const cPos = carbonPositions[i];
                // 端基碳连接3个氢，中间碳连接2个氢
                let hCount = (i === 0 || i === carbonCount-1) ? 3 : 2;
                let occupiedDirs = [];
                if (i > 0) {
                    const neighborDir = new THREE.Vector3().subVectors(carbonPositions[i-1], cPos).normalize();
                    occupiedDirs.push(neighborDir);
                }
                if (i < carbonCount-1) {
                    const neighborDir = new THREE.Vector3().subVectors(carbonPositions[i+1], cPos).normalize();
                    occupiedDirs.push(neighborDir);
                }
                let availableDirs = tetraDirs.filter(dir => {
                    for (let occ of occupiedDirs) {
                        if (dir.dot(occ) > 0.65) return false;
                    }
                    return true;
                });
                for (let j = 0; j < hCount && j < availableDirs.length; j++) {
                    const hDir = availableDirs[j];
                    const hPos = cPos.clone().add(hDir.clone().multiplyScalar(hBondLen));
                    const h = createAtom('H', 0.3, 0xc0dbe0, hPos);
                    group.add(h);
                    group.add(createBond(cPos, hPos, 0.08, 0xbc9a6c));
                }
            }
            const formula = carbonCount === 2 ? '乙烷 C₂H₆' : (carbonCount === 3 ? '丙烷 C₃H₈' : `C${carbonCount}H${2*carbonCount+2}`);
            group.add(makeLabel(`烷烃 ${formula} (键角~109.5°)`, '#ffd966', new THREE.Vector3(0, -1.6, 0), '0.9rem'));
            return group;
        }

        // ================= 烯烃: 乙烯 =================
        function buildEthene() {
            const group = new THREE.Group();
            const c1Pos = new THREE.Vector3(-0.85, 0, 0);
            const c2Pos = new THREE.Vector3(0.85, 0, 0);
            const c1 = createAtom('C', 0.45, 0x708090, c1Pos);
            const c2 = createAtom('C', 0.45, 0x708090, c2Pos);
            group.add(c1, c2);
            group.add(createBond(c1Pos, c2Pos, 0.09, 0xbc9a6c));
            const bond2 = createBond(c1Pos.clone().add(new THREE.Vector3(0,0.12,0.12)), c2Pos.clone().add(new THREE.Vector3(0,0.12,0.12)), 0.09, 0xbc9a6c);
            group.add(bond2);
            const hPositions = [
                new THREE.Vector3(-1.45, 0.7, 0), new THREE.Vector3(-1.45, -0.7, 0),
                new THREE.Vector3(1.45, 0.7, 0), new THREE.Vector3(1.45, -0.7, 0)
            ];
            hPositions.forEach(pos => {
                const h = createAtom('H', 0.28, 0xc0dbe0, pos);
                group.add(h);
                const carbonPos = pos.x < 0 ? c1Pos : c2Pos;
                group.add(createBond(carbonPos, pos, 0.07, 0xbc9a6c));
            });
            group.add(makeLabel('乙烯 C₂H₄ · 碳碳双键 (平面结构)', '#ffaa66', new THREE.Vector3(0, -1.3, 0), '0.85rem'));
            return group;
        }

        // ================= 取代反应: CH₄ + Cl₂ → CH₃Cl + HCl =================
        // 精确模拟: 氢原子先断开化学键再离开碳原子
        function buildSubstitutionCorrect() {
            const group = new THREE.Group();
            const cPos = new THREE.Vector3(0, 0, 0);
            const carbon = createAtom('C', 0.52, 0x708090, cPos);
            group.add(carbon);
            // 四面体氢
            const tetraDirs = [
                new THREE.Vector3(0.577, 0.577, 0.577).normalize(),
                new THREE.Vector3(0.577, -0.577, -0.577).normalize(),
                new THREE.Vector3(-0.577, 0.577, -0.577).normalize(),
                new THREE.Vector3(-0.577, -0.577, 0.577).normalize()
            ];
            const hBondLen = 1.02;
            const hAtoms = [];
            const hPositions = tetraDirs.map(dir => cPos.clone().add(dir.multiplyScalar(hBondLen)));
            const hBonds = [];
            hPositions.forEach(pos => {
                const h = createAtom('H', 0.31, 0xc0dbe0, pos);
                group.add(h);
                hAtoms.push(h);
                const bond = createBond(cPos, pos, 0.08, 0xbc9a6c);
                group.add(bond);
                hBonds.push(bond);
            });
            // 氯气分子
            const cl1 = createAtom('Cl', 0.48, 0x6c9e3f, new THREE.Vector3(2.3, 0.7, 0.6));
            const cl2 = createAtom('Cl', 0.48, 0x6c9e3f, new THREE.Vector3(3.1, 0.1, 0.7));
            group.add(cl1, cl2);
            const clClBond = createBond(cl1.position, cl2.position, 0.09, 0x88aa77);
            group.add(clClBond);
            group.userData = { carbon, hAtoms, hPositions, hBonds, cl1, cl2, clClBond, substitutionDone: false };
            group.add(makeLabel('取代反应: CH₄ + Cl₂ → CH₃Cl + HCl', '#ffaa88', new THREE.Vector3(0, -1.8, 0), '0.85rem'));
            group.add(makeLabel('⚡ 步骤: ①Cl-Cl键断裂 ②C-H键断裂，H脱离 ③Cl连接碳，H与另一Cl结合成HCl', '#bbddff', new THREE.Vector3(0, -2.3, 0), '0.7rem'));
            return group;
        }

        function animateSubstitutionCorrect(modelGroup) {
            if (modelGroup.userData.substitutionDone) return;
            const { carbon, hAtoms, hBonds, cl1, cl2, clClBond } = modelGroup.userData;
            const targetH = hAtoms[0];
            const targetHBond = hBonds[0];
            const targetHPos = targetH.position.clone();
            const startClPos = cl1.position.clone();
            const targetClPos = targetHPos.clone();
            
            // 第一步: 立即断裂Cl-Cl键视觉
            if (clClBond) clClBond.visible = false;
            
            const startTime = performance.now();
            const duration = 2500;      // 总动画时间2.5秒
            let hclGroup = null;
            const cl2StartPos = cl2.position.clone();
            let bondBroken = false;      // 标记C-H键是否已断裂
            
            function step(now) {
                const elapsed = now - startTime;
                if (elapsed >= duration) {
                    // 最终状态: 确保C-H键已断裂，Cl连接到碳，HCl已飞离
                    cl1.position.copy(targetClPos);
                    targetH.visible = false;
                    if (targetHBond) targetHBond.visible = false;
                    // 创建新的C-Cl键
                    const newCBond = createBond(carbon.position, cl1.position, 0.1, 0x88aa55);
                    modelGroup.add(newCBond);
                    const clLabel = makeLabel('Cl', '#b0ff90', cl1.position.clone().add(new THREE.Vector3(0.2,0.2,0.2)), '0.8rem');
                    modelGroup.add(clLabel);
                    if (hclGroup) {
                        hclGroup.children.forEach(ch => { if(ch.isMesh) ch.visible = false; });
                        modelGroup.remove(hclGroup);
                    }
                    const note = makeLabel('✔ 取代完成: C-H键断裂，H脱离，Cl连接碳，生成CH₃Cl和HCl', '#ffff99', new THREE.Vector3(0, 1.5, 0), '0.75rem');
                    modelGroup.add(note);
                    modelGroup.userData.substitutionDone = true;
                    setTimeout(() => modelGroup.remove(note), 4500);
                    activeAnimation = null;
                    return;
                }
                
                let t = Math.min(1, elapsed / duration);
                
                // 阶段1 (0-0.4s): 氯原子开始分离并向碳靠近
                const easeMove = t < 0.6 ? t * 1.2 : 1;
                const newCl1Pos = startClPos.clone().lerp(targetClPos, Math.min(1, easeMove));
                cl1.position.copy(newCl1Pos);
                
                // 阶段2 (0.3s-0.7s): 氢原子断开C-H键并开始脱离
                if (!bondBroken && elapsed > 400) {
                    bondBroken = true;
                    // 断裂C-H键: 隐藏键
                    if (targetHBond) targetHBond.visible = false;
                }
                // 氢原子脱离动画: 从原位置向外飞出 (在0.4s后开始移动)
                if (bondBroken && elapsed > 450) {
                    const escapeT = Math.min(1, Math.max(0, (elapsed - 450) / 800));
                    const outDir = targetHPos.clone().normalize();
                    const flyOffset = outDir.multiplyScalar(escapeT * 1.2);
                    targetH.position.copy(targetHPos.clone().add(flyOffset));
                }
                
                // 阶段3: 被取代的氢与第二个氯结合形成HCl并飞离 (在动画开始0.7秒后)
                if (elapsed > 750 && !hclGroup) {
                    const hLeaving = targetH;
                    const hclGroupObj = new THREE.Group();
                    const hClone = createAtom('H', 0.31, 0xc0dbe0, hLeaving.position);
                    const clPartner = cl2;
                    hclGroupObj.add(hClone, clPartner);
                    const hclBond = createBond(hClone.position, clPartner.position, 0.08, 0xdd99aa);
                    hclGroupObj.add(hclBond);
                    modelGroup.add(hclGroupObj);
                    hclGroup = hclGroupObj;
                    // 让HCl整体飞离
                    const startHClPos = hClone.position.clone().add(clPartner.position).multiplyScalar(0.5);
                    const flyDir = new THREE.Vector3(1.8, 1.5, 1.2).normalize();
                    const targetHClPos = startHClPos.clone().add(flyDir.multiplyScalar(2.8));
                    const hclStart = performance.now();
                    function flyHCl(timestamp) {
                        const hclElapsed = timestamp - hclStart;
                        if (hclElapsed >= 1300 || !hclGroup) return;
                        const hclT = hclElapsed / 1300;
                        const currentCenter = startHClPos.clone().lerp(targetHClPos, hclT);
                        const offset = hClone.position.clone().sub(startHClPos);
                        hClone.position.copy(currentCenter.clone().add(offset));
                        clPartner.position.copy(currentCenter.clone().sub(offset));
                        const bondMesh = hclGroupObj.children[2];
                        if (bondMesh && bondMesh.isMesh) {
                            const newStart = hClone.position;
                            const newEnd = clPartner.position;
                            const newDir = new THREE.Vector3().subVectors(newEnd, newStart);
                            const newLen = newDir.length();
                            bondMesh.geometry.dispose();
                            bondMesh.geometry = new THREE.CylinderGeometry(0.08, 0.08, newLen, 8);
                            bondMesh.position.copy(newStart.clone().add(newEnd).multiplyScalar(0.5));
                            bondMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), newDir.clone().normalize());
                        }
                        requestAnimationFrame(flyHCl);
                    }
                    requestAnimationFrame(flyHCl);
                }
                
                // 第二个氯原子逐渐向被取代氢靠近 (形成HCl)
                if (hclGroup && elapsed > 850) {
                    const factor = Math.min(1, (elapsed - 850) / 900);
                    const targetForCl2 = targetHPos.clone().add(new THREE.Vector3(0.1, 0.1, 0.1));
                    cl2.position.lerpVectors(cl2StartPos, targetForCl2, factor);
                }
                
                activeAnimation = requestAnimationFrame(step);
            }
            activeAnimation = requestAnimationFrame(step);
        }

        // ================= 加成反应 (Br₂加成到乙烯) =================
        function buildAddition() {
            const group = new THREE.Group();
            const c1Pos = new THREE.Vector3(-0.9, 0, 0);
            const c2Pos = new THREE.Vector3(0.9, 0, 0);
            const c1 = createAtom('C', 0.45, 0x708090, c1Pos);
            const c2 = createAtom('C', 0.45, 0x708090, c2Pos);
            group.add(c1, c2);
            const bondSingle = createBond(c1Pos, c2Pos, 0.09, 0xbc9a6c);
            const bondDouble = createBond(c1Pos.clone().add(new THREE.Vector3(0,0.12,0.12)), c2Pos.clone().add(new THREE.Vector3(0,0.12,0.12)), 0.09, 0xbc9a6c);
            group.add(bondSingle, bondDouble);
            const hPositions = [[-1.55,0.7,0],[-1.55,-0.7,0],[1.55,0.7,0],[1.55,-0.7,0]];
            hPositions.forEach(pos => {
                const h = createAtom('H', 0.28, 0xc0dbe0, new THREE.Vector3(pos[0], pos[1], pos[2]));
                group.add(h);
                const carbonPos = new THREE.Vector3(pos[0] < 0 ? -0.9 : 0.9, 0, 0);
                group.add(createBond(carbonPos, h.position, 0.07, 0xbc9a6c));
            });
            const br1 = createAtom('Br', 0.5, 0xcd5c5c, new THREE.Vector3(2.2, 0.6, 0.8));
            const br2 = createAtom('Br', 0.5, 0xcd5c5c, new THREE.Vector3(3.0, 0.0, 0.7));
            group.add(br1, br2);
            const brBrBond = createBond(br1.position, br2.position, 0.09, 0xaa8866);
            group.add(brBrBond);
            group.userData = { c1, c2, bondDouble, br1, br2, brBrBond, added: false };
            group.add(makeLabel('加成反应: C=C + Br₂ → BrCH₂-CH₂Br', '#ffcc88', new THREE.Vector3(0, -1.7, 0), '0.85rem'));
            return group;
        }

        function animateAddition(modelGroup) {
            if (modelGroup.userData.added) return;
            const { c1, c2, bondDouble, br1, br2, brBrBond } = modelGroup.userData;
            if (brBrBond) brBrBond.visible = false;
            if (bondDouble) bondDouble.visible = false;
            const startPos1 = br1.position.clone();
            const startPos2 = br2.position.clone();
            const target1 = new THREE.Vector3(-1.3, 0.55, 0.4);
            const target2 = new THREE.Vector3(1.3, 0.55, 0.4);
            const startTime = performance.now();
            const duration = 1500;
            function step(now) {
                const elapsed = now - startTime;
                if (elapsed >= duration) {
                    br1.position.copy(target1);
                    br2.position.copy(target2);
                    const bond1 = createBond(c1.position, br1.position, 0.1, 0xcc8866);
                    const bond2 = createBond(c2.position, br2.position, 0.1, 0xcc8866);
                    modelGroup.add(bond1, bond2);
                    const note = makeLabel('✨ 加成完成: 双键打开, Br原子加成生成二溴乙烷', '#aaffdd', new THREE.Vector3(0, 1.3, 0), '0.75rem');
                    modelGroup.add(note);
                    modelGroup.userData.added = true;
                    setTimeout(() => modelGroup.remove(note), 4000);
                    activeAnimation = null;
                    return;
                }
                const t = elapsed / duration;
                const ease = 1 - Math.pow(1 - t, 1.2);
                br1.position.lerpVectors(startPos1, target1, ease);
                br2.position.lerpVectors(startPos2, target2, ease);
                activeAnimation = requestAnimationFrame(step);
            }
            activeAnimation = requestAnimationFrame(step);
        }

        // ================= 加聚反应: 双键断开并形成链 =================
        function buildPolymerization() {
            const group = new THREE.Group();
            const monomers = [];
            const offsets = [-2.4, 0, 2.4];
            offsets.forEach(x => {
                const mono = new THREE.Group();
                const cL = createAtom('C', 0.42, 0x708090, new THREE.Vector3(x - 0.7, 0.1, 0));
                const cR = createAtom('C', 0.42, 0x708090, new THREE.Vector3(x + 0.7, 0.1, 0));
                mono.add(cL, cR);
                const bond1 = createBond(cL.position, cR.position, 0.08, 0xbc9a6c);
                const bond2 = createBond(cL.position.clone().add(new THREE.Vector3(0,0.1,0.1)), cR.position.clone().add(new THREE.Vector3(0,0.1,0.1)), 0.08, 0xbc9a6c);
                mono.add(bond1, bond2);
                const hL1 = createAtom('H', 0.26, 0xc0dbe0, new THREE.Vector3(x - 1.15, 0.65, 0.25));
                const hL2 = createAtom('H', 0.26, 0xc0dbe0, new THREE.Vector3(x - 1.15, -0.45, -0.25));
                const hR1 = createAtom('H', 0.26, 0xc0dbe0, new THREE.Vector3(x + 1.15, 0.65, 0.25));
                const hR2 = createAtom('H', 0.26, 0xc0dbe0, new THREE.Vector3(x + 1.15, -0.45, -0.25));
                mono.add(hL1, hL2, hR1, hR2);
                mono.add(createBond(cL.position, hL1.position, 0.06), createBond(cL.position, hL2.position, 0.06));
                mono.add(createBond(cR.position, hR1.position, 0.06), createBond(cR.position, hR2.position, 0.06));
                group.add(mono);
                monomers.push({ group: mono, leftC: cL, rightC: cR, bondDouble: bond2 });
            });
            group.userData = { monomers, polymerized: false };
            group.add(makeLabel('加聚反应: n CH₂=CH₂ → [—CH₂—CH₂—]ₙ', '#ffcc99', new THREE.Vector3(0, -1.6, 0), '0.85rem'));
            group.add(makeLabel('🔗 动态: 每个单体双键断开，单体间形成新的碳-碳单键', '#bbddff', new THREE.Vector3(0, -2.1, 0), '0.7rem'));
            return group;
        }

        function animatePolymerization(modelGroup) {
            if (modelGroup.userData.polymerized) return;
            const { monomers } = modelGroup.userData;
            setTimeout(() => {
                monomers.forEach(mono => {
                    if (mono.bondDouble) mono.bondDouble.visible = false;
                });
                for (let i = 0; i < monomers.length - 1; i++) {
                    const leftM = monomers[i];
                    const rightM = monomers[i+1];
                    const bond = createBond(leftM.rightC.position, rightM.leftC.position, 0.09, 0xccaa77);
                    modelGroup.add(bond);
                }
                const note = makeLabel('✅ 加聚完成: 双键全部打开, 单体间形成单键连接成聚乙烯链', '#aaffdd', new THREE.Vector3(0, 1.4, 0), '0.75rem');
                modelGroup.add(note);
                modelGroup.userData.polymerized = true;
                setTimeout(() => modelGroup.remove(note), 5000);
            }, 800);
        }

        // 加载函数
        let currentCarbonCount = 3;
        function loadAlkane() {
            removeCurrentModel();
            const newGroup = buildAlkane(currentCarbonCount);
            currentModelGroup = newGroup;
            scene.add(currentModelGroup);
            const names = {2:'乙烷',3:'丙烷',4:'丁烷',5:'戊烷',6:'己烷',7:'庚烷',8:'辛烷'};
            document.getElementById('statusMsg').innerHTML = `✅ 烷烃: ${names[currentCarbonCount] || '烷烃'} (C${currentCarbonCount}H${2*currentCarbonCount+2}) 四面体键角~109.5°`;
        }
        function loadModel(builder, isAnimated, animCallback, infoMsg) {
            removeCurrentModel();
            const newGroup = builder();
            currentModelGroup = newGroup;
            scene.add(currentModelGroup);
            document.getElementById('statusMsg').innerHTML = infoMsg;
            if (isAnimated && animCallback) animCallback(currentModelGroup);
        }

        // 事件绑定
        document.getElementById('btn-alkane').addEventListener('click', () => {
            loadAlkane();
            setActive('btn-alkane');
        });
        const slider = document.getElementById('carbonSlider');
        const countDisplay = document.getElementById('carbonCountDisplay');
        slider.addEventListener('input', (e) => {
            currentCarbonCount = parseInt(e.target.value);
            countDisplay.innerText = currentCarbonCount;
            if (document.getElementById('btn-alkane').classList.contains('active')) {
                loadAlkane();
            }
        });
        document.getElementById('btn-alkene').addEventListener('click', () => {
            loadModel(buildEthene, false, null, '⚡ 乙烯 C₂H₄ · 碳碳双键平面结构');
            setActive('btn-alkene');
        });
        document.getElementById('btn-substitution').addEventListener('click', () => {
            loadModel(buildSubstitutionCorrect, true, animateSubstitutionCorrect, '🧪 取代反应: Cl₂断键 → C-H键断裂，H脱离 → Cl连接碳，生成HCl');
            setActive('btn-substitution');
        });
        document.getElementById('btn-addition').addEventListener('click', () => {
            loadModel(buildAddition, true, animateAddition, '🧪 加成反应: Br₂加成到双键生成二溴乙烷');
            setActive('btn-addition');
        });
        document.getElementById('btn-polymerization').addEventListener('click', () => {
            loadModel(buildPolymerization, true, animatePolymerization, '🧪 加聚反应: 双键断开并连接成聚乙烯链');
            setActive('btn-polymerization');
        });
        function setActive(activeId) {
            ['btn-alkane','btn-alkene','btn-substitution','btn-addition','btn-polymerization'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.classList.remove('active');
            });
            document.getElementById(activeId).classList.add('active');
        }
        loadAlkane();
        setActive('btn-alkane');

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
