<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动量守恒定律 - 交互式演示</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-secondary: #5a6c7d;
            --ball1-color: #ff6b6b;
            --ball1-glow: #ff8787;
            --ball2-color: #4dabf7;
            --ball2-glow: #74c0fc;
            --track-color: #cbd5e0;
            --track-fill: #e2e8f0;
            --accent: #f59e0b;
            --accent-green: #10b981;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #f0f4f8 30%, #eaf0f6 60%, #f5f3f0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .main-container {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            padding: 6px 0;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: #718096;
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.04em;
        }

        /* Canvas卡片 */
        .canvas-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 16px 20px 12px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .canvas-card:hover {
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.14);
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-width: 820px;
            cursor: default;
        }

        /* 碰撞闪光提示 */
        .collision-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            font-size: 2.2rem;
            font-weight: 900;
            color: #f59e0b;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.8), 0 0 60px rgba(245, 158, 11, 0.4);
            transition: none;
            z-index: 10;
            white-space: nowrap;
            letter-spacing: 0.06em;
        }
        .collision-flash.active {
            animation: flashPop 0.7s ease-out forwards;
        }
        @keyframes flashPop {
            0% {
                transform: translate(-50%, -50%) scale(0.3);
                opacity: 1;
            }
            35% {
                transform: translate(-50%, -50%) scale(1.25);
                opacity: 0.95;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.6);
                opacity: 0;
            }
        }

        /* 数据面板 */
        .data-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .data-panel {
                grid-template-columns: 1fr;
            }
        }
        .data-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .data-card h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .data-card h3 .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .dot-before {
            background: #a0aec0;
        }
        .dot-after {
            background: #f59e0b;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(245, 158, 11, 0);
            }
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f7fafc;
            font-size: 0.9rem;
            color: #4a5568;
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-row .label {
            font-weight: 500;
            color: #718096;
        }
        .data-row .value {
            font-weight: 600;
            color: #2d3748;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }
        .data-row.highlight {
            background: #fffbeb;
            border-radius: 6px;
            padding: 8px 10px;
            margin: 2px -6px;
        }
        .data-row.highlight .value {
            color: #d97706;
            font-size: 0.95rem;
        }
        .data-row.highlight .label {
            color: #b45309;
            font-weight: 600;
        }
        .conservation-badge {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-left: 6px;
        }

        /* 控制面板 */
        .control-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 24px;
        }
        @media (max-width: 600px) {
            .control-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 7px;
            letter-spacing: 0.03em;
        }
        .control-group label .color-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
        }
        .dot-red {
            background: var(--ball1-color);
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }
        .dot-blue {
            background: var(--ball2-color);
            box-shadow: 0 0 10px rgba(77, 171, 247, 0.5);
        }
        .control-group input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 7px;
            border-radius: 10px;
            background: #e2e8f0;
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .control-group input[type="range"]:hover {
            background: #cbd5e0;
        }
        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid #4a5568;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }
        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            border-color: #2d3748;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            transform: scale(1.05);
        }
        .range-value {
            font-weight: 700;
            color: #2d3748;
            font-size: 0.85rem;
            min-width: 40px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
        }
        .range-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .range-row input[type="range"] {
            flex: 1;
        }

        /* 碰撞类型选择 */
        .collision-type-selector {
            display: flex;
            gap: 0;
            border-radius: 25px;
            overflow: hidden;
            border: 2px solid #e2e8f0;
            background: #f7fafc;
            width: fit-content;
        }
        .collision-type-btn {
            padding: 9px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #718096;
            transition: all 0.25s;
            letter-spacing: 0.03em;
            white-space: nowrap;
            font-family: inherit;
        }
        .collision-type-btn.active {
            background: #2d3748;
            color: #fff;
            box-shadow: 0 2px 12px rgba(45, 55, 72, 0.3);
        }
        .collision-type-btn:hover:not(.active) {
            background: #edf2f7;
            color: #4a5568;
        }

        /* 按钮 */
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
            align-items: center;
        }
        .btn {
            padding: 11px 26px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.04em;
            transition: all 0.25s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .btn-start {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }
        .btn-start:hover {
            background: #059669;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
            transform: translateY(-1px);
        }
        .btn-start:active {
            transform: scale(0.97);
        }
        .btn-reset {
            background: #fff;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }
        .btn-reset:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
            transform: translateY(-1px);
        }
        .btn-preset {
            background: #fff;
            color: #5a6c7d;
            border: 1.5px solid #e2e8f0;
            font-size: 0.78rem;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .btn-preset:hover {
            background: #f0f4f8;
            border-color: #cbd5e0;
            transform: translateY(-1px);
        }
        .btn-preset:active {
            background: #e2e8f0;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 响应式 */
        @media (max-width: 700px) {
            .header h1 {
                font-size: 1.5rem;
            }
            .canvas-card {
                padding: 10px 8px 6px;
            }
            .control-card {
                padding: 14px 14px;
            }
            .btn {
                padding: 9px 18px;
                font-size: 0.8rem;
            }
            .btn-preset {
                padding: 6px 12px;
                font-size: 0.72rem;
            }
            .collision-type-btn {
                padding: 7px 14px;
                font-size: 0.78rem;
            }
            .data-card {
                padding: 12px 14px;
            }
            .data-row {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 标题 -->
        <div class="header">
            <h1>🔬 动量守恒定律演示</h1>
            <p class="subtitle">p = mv &nbsp;·&nbsp; 碰撞前后总动量保持不变</p>
        </div>

        <!-- Canvas动画区域 -->
        <div class="canvas-card">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="mainCanvas"></canvas>
                <div class="collision-flash" id="collisionFlash">💥 碰撞！</div>
            </div>
        </div>

        <!-- 数据面板 -->
        <div class="data-panel">
            <div class="data-card" id="beforeCard">
                <h3><span class="dot dot-before"></span>碰撞前数据</h3>
                <div class="data-row"><span class="label">球1 速度 v₁</span><span class="value" id="beforeV1">— m/s</span></div>
                <div class="data-row"><span class="label">球2 速度 v₂</span><span class="value" id="beforeV2">— m/s</span></div>
                <div class="data-row"><span class="label">球1 动量 p₁</span><span class="value" id="beforeP1">— kg·m/s</span></div>
                <div class="data-row"><span class="label">球2 动量 p₂</span><span class="value" id="beforeP2">— kg·m/s</span></div>
                <div class="data-row highlight"><span class="label">总动量 P_total</span><span class="value" id="beforePTotal">— kg·m/s</span></div>
                <div class="data-row"><span class="label">总动能 E_k</span><span class="value" id="beforeEk">— J</span></div>
            </div>
            <div class="data-card" id="afterCard">
                <h3><span class="dot dot-after"></span>碰撞后数据</h3>
                <div class="data-row"><span class="label">球1 速度 v₁'</span><span class="value" id="afterV1">— m/s</span></div>
                <div class="data-row"><span class="label">球2 速度 v₂'</span><span class="value" id="afterV2">— m/s</span></div>
                <div class="data-row"><span class="label">球1 动量 p₁'</span><span class="value" id="afterP1">— kg·m/s</span></div>
                <div class="data-row"><span class="label">球2 动量 p₂'</span><span class="value" id="afterP2">— kg·m/s</span></div>
                <div class="data-row highlight"><span class="label">总动量 P_total' <span class="conservation-badge" id="conservationBadge" style="display:none;">✅ 守恒</span></span><span class="value" id="afterPTotal">— kg·m/s</span></div>
                <div class="data-row"><span class="label">总动能 E_k'</span><span class="value" id="afterEk">— J</span></div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-card">
            <div class="control-grid">
                <div class="control-group">
                    <label><span class="color-dot dot-red"></span>球1 质量 m₁</label>
                    <div class="range-row">
                        <input type="range" id="mass1" min="1" max="10" value="3" step="0.1">
                        <span class="range-value" id="mass1Val">3.0 kg</span>
                    </div>
                </div>
                <div class="control-group">
                    <label><span class="color-dot dot-blue"></span>球2 质量 m₂</label>
                    <div class="range-row">
                        <input type="range" id="mass2" min="1" max="10" value="3" step="0.1">
                        <span class="range-value" id="mass2Val">3.0 kg</span>
                    </div>
                </div>
                <div class="control-group">
                    <label><span class="color-dot dot-red"></span>球1 初速度 v₁（向右→）</label>
                    <div class="range-row">
                        <input type="range" id="vel1" min="0" max="6" value="3" step="0.1">
                        <span class="range-value" id="vel1Val">3.0 m/s</span>
                    </div>
                </div>
                <div class="control-group">
                    <label><span class="color-dot dot-blue"></span>球2 初速度 v₂（向左←为负）</label>
                    <div class="range-row">
                        <input type="range" id="vel2" min="-5" max="5" value="0" step="0.1">
                        <span class="range-value" id="vel2Val">0.0 m/s</span>
                    </div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;">
                <span style="font-weight:600;font-size:0.84rem;color:#4a5568;letter-spacing:0.03em;">碰撞类型：</span>
                <div class="collision-type-selector" id="collisionTypeSelector">
                    <button class="collision-type-btn active" data-type="elastic">⚡ 弹性碰撞</button>
                    <button class="collision-type-btn" data-type="inelastic">🔗 完全非弹性碰撞</button>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn btn-start" id="btnStart" title="开始模拟">▶ 开始模拟</button>
                <button class="btn btn-reset" id="btnReset" title="重置模拟">↺ 重置</button>
                <button class="btn btn-preset" data-preset="equal">预设：等质量交换</button>
                <button class="btn btn-preset" data-preset="heavy1">预设：大撞小</button>
                <button class="btn btn-preset" data-preset="heavy2">预设：小撞大</button>
                <button class="btn btn-preset" data-preset="headon">预设：迎面碰撞</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM 元素 ============
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const canvasWrapper = document.getElementById('canvasWrapper');
            const collisionFlash = document.getElementById('collisionFlash');
            const btnStart = document.getElementById('btnStart');
            const btnReset = document.getElementById('btnReset');
            const collisionTypeSelector = document.getElementById('collisionTypeSelector');

            // 滑块
            const sliderMass1 = document.getElementById('mass1');
            const sliderMass2 = document.getElementById('mass2');
            const sliderVel1 = document.getElementById('vel1');
            const sliderVel2 = document.getElementById('vel2');
            const valMass1 = document.getElementById('mass1Val');
            const valMass2 = document.getElementById('mass2Val');
            const valVel1 = document.getElementById('vel1Val');
            const valVel2 = document.getElementById('vel2Val');

            // 数据展示
            const beforeV1 = document.getElementById('beforeV1');
            const beforeV2 = document.getElementById('beforeV2');
            const beforeP1 = document.getElementById('beforeP1');
            const beforeP2 = document.getElementById('beforeP2');
            const beforePTotal = document.getElementById('beforePTotal');
            const beforeEk = document.getElementById('beforeEk');
            const afterV1 = document.getElementById('afterV1');
            const afterV2 = document.getElementById('afterV2');
            const afterP1 = document.getElementById('afterP1');
            const afterP2 = document.getElementById('afterP2');
            const afterPTotal = document.getElementById('afterPTotal');
            const afterEk = document.getElementById('afterEk');
            const conservationBadge = document.getElementById('conservationBadge');

            // ============ 物理参数 ============
            const SCALE = 75; // 像素/米 (1米 = 75px)
            const TRACK_Y_FRAC = 0.52; // 轨道在Canvas中的垂直位置比例

            // 物理量（SI单位）
            let mass1 = 3.0; // kg
            let mass2 = 3.0; // kg
            let initVel1 = 3.0; // m/s (向右为正)
            let initVel2 = 0.0; // m/s
            let collisionType = 'elastic'; // 'elastic' | 'inelastic'

            // 模拟状态
            let ball1 = { x: 0, v: 0, r: 0 }; // 物理单位
            let ball2 = { x: 0, v: 0, r: 0 };
            let simulationRunning = false;
            let collisionOccurred = false;
            let collisionCooldown = 0;
            let merged = false; // 完全非弹性碰撞后是否合并
            let mergedV = 0;
            let mergedOffset = 0; // 两球在合并体中的相对偏移
            let beforeCollisionData = null; // 碰撞前瞬间的数据快照
            let afterCollisionData = null;
            let trackLeft = 0; // 物理坐标
            let trackRight = 0;
            let particles = [];
            let lastTime = null;
            let animFrameId = null;
            let collisionFlashTimer = null;

            // Canvas实际像素尺寸
            let canvasPixelWidth = 820;
            let canvasPixelHeight = 310;
            let dpr = 1;

            // 物理空间中的球半径（与质量相关）
            function calcRadius(mass) {
                return 0.16 + mass * 0.022; // 1kg→0.182m, 10kg→0.38m
            }

            // 物理坐标转Canvas像素X
            function toPixelX(physX) {
                const trackPixelLeft = 70;
                const trackPixelRight = canvasPixelWidth - 70;
                const trackPhysWidth = trackRight - trackLeft;
                return trackPixelLeft + ((physX - trackLeft) / trackPhysWidth) * (trackPixelRight -
                trackPixelLeft);
            }

            // Canvas像素X转物理坐标
            function toPhysX(pixelX) {
                const trackPixelLeft = 70;
                const trackPixelRight = canvasPixelWidth - 70;
                const trackPhysWidth = trackRight - trackLeft;
                return trackLeft + ((pixelX - trackPixelLeft) / (trackPixelRight - trackPixelLeft)) *
                    trackPhysWidth;
            }

            function getTrackY() {
                return canvasPixelHeight * TRACK_Y_FRAC;
            }

            function toPixelR(physR) {
                return physR * SCALE;
            }

            // ============ 初始化物理空间 ============
            function initPhysicsSpace() {
                // 轨道物理范围（米）
                trackLeft = 0.4;
                trackRight = 10.0;
                const trackLen = trackRight - trackLeft;
                // 球1初始在轨道左侧约20%处，球2在轨道右侧约60%处
                ball1.x = trackLeft + trackLen * 0.20;
                ball2.x = trackLeft + trackLen * 0.62;
                ball1.r = calcRadius(mass1);
                ball2.r = calcRadius(mass2);
                ball1.v = initVel1;
                ball2.v = initVel2;
                // 确保初始不重叠
                const minDist = ball1.r + ball2.r + 0.05;
                if (ball2.x - ball1.x < minDist) {
                    ball2.x = ball1.x + minDist;
                    if (ball2.x + ball2.r > trackRight) {
                        ball2.x = trackRight - ball2.r;
                        ball1.x = ball2.x - minDist;
                        if (ball1.x - ball1.r < trackLeft) {
                            ball1.x = trackLeft + ball1.r;
                            ball2.x = ball1.x + minDist;
                        }
                    }
                }
            }

            function resetState() {
                simulationRunning = false;
                collisionOccurred = false;
                collisionCooldown = 0;
                merged = false;
                mergedV = 0;
                mergedOffset = 0;
                beforeCollisionData = null;
                afterCollisionData = null;
                particles = [];
                lastTime = null;
                if (animFrameId) cancelAnimationFrame(animFrameId);
                animFrameId = null;
                if (collisionFlashTimer) clearTimeout(collisionFlashTimer);
                collisionFlashTimer = null;
                collisionFlash.classList.remove('active');
                btnStart.textContent = '▶ 开始模拟';
                btnStart.disabled = false;
                updateDataPanelPreCollision();
                clearAfterData();
                conservationBadge.style.display = 'none';
            }

            function applyParams() {
                mass1 = parseFloat(sliderMass1.value);
                mass2 = parseFloat(sliderMass2.value);
                initVel1 = parseFloat(sliderVel1.value);
                initVel2 = parseFloat(sliderVel2.value);
                ball1.r = calcRadius(mass1);
                ball2.r = calcRadius(mass2);
                ball1.v = initVel1;
                ball2.v = initVel2;
                initPhysicsSpace();
                updateSliderLabels();
                updateDataPanelPreCollision();
                clearAfterData();
                conservationBadge.style.display = 'none';
            }

            function updateSliderLabels() {
                valMass1.textContent = mass1.toFixed(1) + ' kg';
                valMass2.textContent = mass2.toFixed(1) + ' kg';
                valVel1.textContent = initVel1.toFixed(1) + ' m/s';
                valVel2.textContent = initVel2.toFixed(1) + ' m/s';
            }

            function updateDataPanelPreCollision() {
                const v1 = ball1.v;
                const v2 = ball2.v;
                const p1 = mass1 * v1;
                const p2 = mass2 * v2;
                const pTotal = p1 + p2;
                const ek = 0.5 * mass1 * v1 * v1 + 0.5 * mass2 * v2 * v2;
                beforeV1.textContent = v1.toFixed(2) + ' m/s';
                beforeV2.textContent = v2.toFixed(2) + ' m/s';
                beforeP1.textContent = p1.toFixed(2) + ' kg·m/s';
                beforeP2.textContent = p2.toFixed(2) + ' kg·m/s';
                beforePTotal.textContent = pTotal.toFixed(2) + ' kg·m/s';
                beforeEk.textContent = ek.toFixed(2) + ' J';
            }

            function clearAfterData() {
                afterV1.textContent = '— m/s';
                afterV2.textContent = '— m/s';
                afterP1.textContent = '— kg·m/s';
                afterP2.textContent = '— kg·m/s';
                afterPTotal.textContent = '— kg·m/s';
                afterEk.textContent = '— J';
                conservationBadge.style.display = 'none';
            }

            function updateAfterData(v1, v2) {
                const p1 = mass1 * v1;
                const p2 = mass2 * v2;
                const pTotal = p1 + p2;
                const ek = 0.5 * mass1 * v1 * v1 + 0.5 * mass2 * v2 * v2;
                afterV1.textContent = v1.toFixed(2) + ' m/s';
                afterV2.textContent = v2.toFixed(2) + ' m/s';
                afterP1.textContent = p1.toFixed(2) + ' kg·m/s';
                afterP2.textContent = p2.toFixed(2) + ' kg·m/s';
                afterPTotal.textContent = pTotal.toFixed(2) + ' kg·m/s';
                afterEk.textContent = ek.toFixed(2) + ' J';
                // 显示守恒标识
                if (beforeCollisionData) {
                    const pBefore = beforeCollisionData.pTotal;
                    const diff = Math.abs(pTotal - pBefore);
                    if (diff < 0.02) {
                        conservationBadge.style.display = 'inline-block';
                        conservationBadge.textContent = '✅ 守恒';
                        conservationBadge.style.background = '#d1fae5';
                        conservationBadge.style.color = '#065f46';
                    } else {
                        conservationBadge.style.display = 'inline-block';
                        conservationBadge.textContent = '⚠️ 偏差: ' + diff.toFixed(2);
                        conservationBadge.style.background = '#fef3c7';
                        conservationBadge.style.color = '#92400e';
                    }
                }
            }

            // ============ 碰撞物理计算 ============
            function calcElasticCollision(m1, m2, v1, v2) {
                // 弹性碰撞公式
                const v1f = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
                const v2f = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
                return { v1f, v2f };
            }

            function calcInelasticCollision(m1, m2, v1, v2) {
                // 完全非弹性碰撞：共同速度
                const vf = (m1 * v1 + m2 * v2) / (m1 + m2);
                return { v1f: vf, v2f: vf };
            }

            // ============ 粒子系统 ============
            function spawnParticles(physX, physY) {
                const px = toPixelX(physX);
                const py = getTrackY();
                const count = 28;
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 60 + Math.random() * 280;
                    particles.push({
                        x: px,
                        y: py,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - Math.random() * 120,
                        life: 0.5 + Math.random() * 0.7,
                        maxLife: 0.5 + Math.random() * 0.7,
                        radius: 1.5 + Math.random() * 3.5,
                        color: Math.random() < 0.5 ? '#f59e0b' : (Math.random() < 0.5 ?
                            '#ff6b6b' : '#4dabf7'),
                    });
                }
            }

            function updateParticles(dt) {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 200 * dt; // 重力
                    p.life -= dt;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function drawParticles(ctx) {
                for (const p of particles) {
                    const alpha = Math.max(0, p.life / p.maxLife);
                    const r = p.radius * alpha;
                    ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb',
                        'rgba');
                    if (p.color.startsWith('#')) {
                        const hex = p.color;
                        const r_hex = parseInt(hex.slice(1, 3), 16);
                        const g_hex = parseInt(hex.slice(3, 5), 16);
                        const b_hex = parseInt(hex.slice(5, 7), 16);
                        ctx.fillStyle = `rgba(${r_hex},${g_hex},${b_hex},${alpha})`;
                    }
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ============ Canvas绘制 ============
            function resizeCanvas() {
                const rect = canvasWrapper.getBoundingClientRect();
                const w = Math.min(rect.width - 4, 840);
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvasPixelWidth = w;
                canvasPixelHeight = Math.round(w * 0.37);
                if (canvasPixelHeight < 240) canvasPixelHeight = 240;
                if (canvasPixelHeight > 340) canvasPixelHeight = 340;
                canvas.width = canvasPixelWidth * dpr;
                canvas.height = canvasPixelHeight * dpr;
                canvas.style.width = canvasPixelWidth + 'px';
                canvas.style.height = canvasPixelHeight + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                initPhysicsSpace();
            }

            function drawTrack(ctx) {
                const trackY = getTrackY();
                const leftPx = toPixelX(trackLeft);
                const rightPx = toPixelX(trackRight);

                // 轨道底座阴影
                ctx.fillStyle = 'rgba(0,0,0,0.06)';
                ctx.fillRect(leftPx - 8, trackY - 8, rightPx - leftPx + 16, 28);

                // 轨道主体
                const grad = ctx.createLinearGradient(0, trackY - 6, 0, trackY + 8);
                grad.addColorStop(0, '#d5dce6');
                grad.addColorStop(0.3, '#e8ecf1');
                grad.addColorStop(0.5, '#f1f4f7');
                grad.addColorStop(0.7, '#e8ecf1');
                grad.addColorStop(1, '#c8d0da');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(leftPx - 4, trackY - 5, rightPx - leftPx + 8, 18, 9);
                ctx.fill();

                // 轨道顶面高光线
                ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(leftPx + 4, trackY - 1);
                ctx.lineTo(rightPx - 4, trackY - 1);
                ctx.stroke();

                // 刻度标记
                ctx.fillStyle = '#a0aec0';
                ctx.font = '10px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                const physStart = Math.ceil(trackLeft);
                const physEnd = Math.floor(trackRight);
                for (let m = physStart; m <= physEnd; m++) {
                    const px = toPixelX(m);
                    // 小刻度线
                    ctx.strokeStyle = 'rgba(160,174,192,0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(px, trackY + 6);
                    ctx.lineTo(px, trackY + 12);
                    ctx.stroke();
                    // 数字
                    ctx.fillText(m + 'm', px, trackY + 24);
                }

                // 端点
                [leftPx, rightPx].forEach(ep => {
                    ctx.fillStyle = '#8899aa';
                    ctx.beginPath();
                    ctx.arc(ep, trackY + 4, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(ep, trackY + 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            function drawBall(ctx, physX, physY, physR, color, glowColor, label, velocity, alpha = 1) {
                const px = toPixelX(physX);
                const py = physY;
                const r = toPixelR(physR);
                const clampedR = Math.max(r, 10);

                // 光晕
                const glowGrad = ctx.createRadialGradient(px, py, clampedR * 0.5, px, py, clampedR * 1.8);
                glowGrad.addColorStop(0, glowColor.replace(')', ',0.35)').replace('rgb', 'rgba'));
                glowGrad.addColorStop(1, 'rgba(255,255,255,0)');
                if (glowColor.startsWith('#')) {
                    // 使用hex颜色创建glow
                    ctx.fillStyle = glowColor + '30';
                    ctx.beginPath();
                    ctx.arc(px, py, clampedR * 1.7, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(px, py, clampedR * 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 球体主体渐变
                const ballGrad = ctx.createRadialGradient(px - clampedR * 0.25, py - clampedR * 0.35, clampedR * 0.08,
                    px, py, clampedR);
                ballGrad.addColorStop(0, '#ffffff');
                ballGrad.addColorStop(0.25, color);
                ballGrad.addColorStop(1, '#1a1a2e');
                ctx.fillStyle = ballGrad;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(px, py, clampedR, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // 高光点
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(px - clampedR * 0.28, py - clampedR * 0.32, clampedR * 0.22, 0, Math.PI * 2);
                ctx.fill();

                // 标签
                ctx.fillStyle = '#ffffff';
                ctx.font = `bold ${Math.max(clampedR*0.55,11)}px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(label, px, py);

                // 速度箭头（在球的上方）
                if (Math.abs(velocity) > 0.005 && alpha > 0.5) {
                    const arrowY = py - clampedR - 14;
                    const arrowLen = Math.min(Math.abs(velocity) * 22, 70);
                    const arrowDir = Math.sign(velocity);
                    const arrowStartX = px - arrowDir * Math.min(arrowLen * 0.35, 20);
                    const arrowEndX = px + arrowDir * arrowLen;

                    ctx.strokeStyle = 'rgba(30,30,40,0.75)';
                    ctx.lineWidth = 2.8;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(arrowStartX, arrowY);
                    ctx.lineTo(arrowEndX, arrowY);
                    ctx.stroke();

                    // 箭头尖端
                    const tipSize = 8;
                    ctx.fillStyle = 'rgba(30,30,40,0.8)';
                    ctx.beginPath();
                    ctx.moveTo(arrowEndX, arrowY);
                    ctx.lineTo(arrowEndX - arrowDir * tipSize, arrowY - tipSize * 0.65);
                    ctx.lineTo(arrowEndX - arrowDir * tipSize, arrowY + tipSize * 0.65);
                    ctx.closePath();
                    ctx.fill();

                    // 速度标签
                    ctx.fillStyle = '#2d3748';
                    ctx.font =
                        `600 ${Math.max(clampedR*0.38,9.5)}px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText(velocity.toFixed(1) + ' m/s', px, arrowY - 15);
                }
            }

            function drawScene() {
                ctx.clearRect(0, 0, canvasPixelWidth, canvasPixelHeight);

                // 背景网格
                ctx.fillStyle = '#fafbfc';
                ctx.fillRect(0, 0, canvasPixelWidth, canvasPixelHeight);
                ctx.strokeStyle = 'rgba(200,210,220,0.25)';
                ctx.lineWidth = 0.5;
                const gridSize = 30;
                for (let x = gridSize; x < canvasPixelWidth; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasPixelHeight);
                    ctx.stroke();
                }
                for (let y = gridSize; y < canvasPixelHeight; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasPixelWidth, y);
                    ctx.stroke();
                }

                drawTrack(ctx);

                const trackY = getTrackY();
                const b1r = ball1.r;
                const b2r = ball2.r;

                if (merged && collisionOccurred) {
                    // 合并状态：两个球粘在一起
                    const midX = ball1.x; // ball1.x存储的是合并体质心位置
                    const b1x = midX - mergedOffset / 2;
                    const b2x = midX + mergedOffset / 2;
                    drawBall(ctx, b1x, trackY, b1r, '#ff6b6b', '#ff8787', '1', mergedV, 0.88);
                    drawBall(ctx, b2x, trackY, b2r, '#4dabf7', '#74c0fc', '2', mergedV, 0.88);
                    // 连接线
                    const px1 = toPixelX(b1x);
                    const px2 = toPixelX(b2x);
                    const r1p = toPixelR(b1r);
                    const r2p = toPixelR(b2r);
                    ctx.strokeStyle = 'rgba(160,170,185,0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 4]);
                    ctx.beginPath();
                    ctx.moveTo(px1 + r1p, trackY);
                    ctx.lineTo(px2 - r2p, trackY);
                    ctx.stroke();
                    ctx.setLineDash([]);
                } else {
                    drawBall(ctx, ball1.x, trackY, b1r, '#ff6b6b', '#ff8787', '1', ball1.v);
                    drawBall(ctx, ball2.x, trackY, b2r, '#4dabf7', '#74c0fc', '2', ball2.v);
                }

                // 粒子
                drawParticles(ctx);

                // 图例
                const legY = 28;
                const legX = toPixelX(trackLeft) + 10;
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(legX, legY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2d3748';
                ctx.font = '12px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('球1  m₁=' + mass1.toFixed(1) + 'kg', legX + 13, legY);

                const legX2 = legX + 140;
                ctx.fillStyle = '#4dabf7';
                ctx.beginPath();
                ctx.arc(legX2, legY, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillText('球2  m₂=' + mass2.toFixed(1) + 'kg', legX2 + 13, legY);

                // 状态提示
                if (!simulationRunning && !collisionOccurred) {
                    ctx.fillStyle = 'rgba(0,0,0,0.45)';
                    ctx.font = '15px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('👆 调整参数后，点击「开始模拟」', canvasPixelWidth / 2, canvasPixelHeight - 20);
                }
                if (collisionOccurred && beforeCollisionData) {
                    ctx.fillStyle = 'rgba(16,185,129,0.7)';
                    ctx.font = 'bold 13px "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    const pBefore = beforeCollisionData.pTotal;
                    const pAfter = afterCollisionData ? (mass1 * (merged ? mergedV : ball1.v) + mass2 * (merged ?
                        mergedV : ball2.v)) : pBefore;
                    ctx.fillText('✅ 动量守恒：总动量保持 ' + pBefore.toFixed(2) + ' kg·m/s', canvasPixelWidth / 2,
                        canvasPixelHeight - 20);
                }
            }

            // ============ 动画循环 ============
            function animate(timestamp) {
                if (!simulationRunning && particles.length === 0 && !collisionFlash.classList.contains('active')) {
                    drawScene();
                    animFrameId = null;
                    return;
                }

                if (lastTime === null) lastTime = timestamp;
                let dt = (timestamp - lastTime) / 1000;
                lastTime = timestamp;

                // 限制最大步长
                if (dt > 0.1) dt = 0.1;
                if (dt <= 0) dt = 0.016;

                if (simulationRunning) {
                    // 冷却计时
                    if (collisionCooldown > 0) {
                        collisionCooldown -= dt;
                        if (collisionCooldown < 0) collisionCooldown = 0;
                    }

                    if (merged) {
                        // 合并状态：整体移动
                        const newX = ball1.x + mergedV * dt;
                        // 边界检测
                        const combinedHalfWidth = mergedOffset / 2 + Math.max(ball1.r, ball2.r);
                        const leftLimit = trackLeft + combinedHalfWidth;
                        const rightLimit = trackRight - combinedHalfWidth;
                        if (newX < leftLimit) {
                            ball1.x = leftLimit + (leftLimit - newX);
                            mergedV = Math.abs(mergedV);
                            spawnParticles(ball1.x - mergedOffset / 2, getTrackY() / SCALE);
                        } else if (newX > rightLimit) {
                            ball1.x = rightLimit - (newX - rightLimit);
                            mergedV = -Math.abs(mergedV);
                            spawnParticles(ball1.x + mergedOffset / 2, getTrackY() / SCALE);
                        } else {
                            ball1.x = newX;
                        }
                        ball2.x = ball1.x;
                        ball1.v = mergedV;
                        ball2.v = mergedV;
                    } else {
                        // 独立运动
                        ball1.x += ball1.v * dt;
                        ball2.x += ball2.v * dt;

                        // 边界反弹
                        if (ball1.x - ball1.r < trackLeft) {
                            ball1.x = trackLeft + ball1.r;
                            ball1.v = Math.abs(ball1.v);
                            spawnParticles(ball1.x, getTrackY() / SCALE);
                        }
                        if (ball1.x + ball1.r > trackRight) {
                            ball1.x = trackRight - ball1.r;
                            ball1.v = -Math.abs(ball1.v);
                            spawnParticles(ball1.x, getTrackY() / SCALE);
                        }
                        if (ball2.x - ball2.r < trackLeft) {
                            ball2.x = trackLeft + ball2.r;
                            ball2.v = Math.abs(ball2.v);
                            spawnParticles(ball2.x, getTrackY() / SCALE);
                        }
                        if (ball2.x + ball2.r > trackRight) {
                            ball2.x = trackRight - ball2.r;
                            ball2.v = -Math.abs(ball2.v);
                            spawnParticles(ball2.x, getTrackY() / SCALE);
                        }

                        // 碰撞检测
                        const dist = ball2.x - ball1.x; // 球2在球1右边时为正
                        const minDist = ball1.r + ball2.r;
                        const relVel = ball1.v - ball2.v; // 相对速度，>0表示正在靠近
                        if (!collisionOccurred && dist <= minDist && relVel > 0.001 && collisionCooldown <= 0) {
                            // 碰撞发生！
                            collisionOccurred = true;
                            collisionCooldown = 0.6;
                            // 记录碰撞前数据
                            beforeCollisionData = {
                                v1: ball1.v,
                                v2: ball2.v,
                                p1: mass1 * ball1.v,
                                p2: mass2 * ball2.v,
                                pTotal: mass1 * ball1.v + mass2 * ball2.v,
                                ek: 0.5 * mass1 * ball1.v * ball1.v + 0.5 * mass2 * ball2.v * ball2.v,
                            };
                            updateDataPanelPreCollisionWithData(beforeCollisionData);

                            // 调整位置使两球刚好接触
                            const overlap = minDist - dist;
                            if (overlap > 0) {
                                const totalMass = mass1 + mass2;
                                ball1.x -= overlap * (mass2 / totalMass);
                                ball2.x += overlap * (mass1 / totalMass);
                            }

                            // 碰撞物理
                            let v1f, v2f;
                            if (collisionType === 'elastic') {
                                const result = calcElasticCollision(mass1, mass2, ball1.v, ball2.v);
                                v1f = result.v1f;
                                v2f = result.v2f;
                            } else {
                                const result = calcInelasticCollision(mass1, mass2, ball1.v, ball2.v);
                                v1f = result.v1f;
                                v2f = result.v2f;
                                // 合并
                                merged = true;
                                mergedV = v1f;
                                mergedOffset = ball1.r + ball2.r;
                                ball1.x = (ball1.x + ball2.x) / 2;
                                ball2.x = ball1.x;
                            }
                            ball1.v = v1f;
                            ball2.v = v2f;
                            afterCollisionData = { v1: v1f, v2: v2f };
                            updateAfterData(v1f, v2f);

                            // 粒子效果
                            const collisionPhysX = (ball1.x + ball2.x) / 2;
                            spawnParticles(collisionPhysX, getTrackY() / SCALE);

                            // 闪光文字
                            triggerCollisionFlash();
                        } else if (collisionOccurred && collisionCooldown <= 0 && !merged && dist <= minDist &&
                            ball1.v - ball2.v > 0.001) {
                            // 二次碰撞
                            collisionCooldown = 0.5;
                            const overlap = minDist - dist;
                            if (overlap > 0) {
                                const totalMass = mass1 + mass2;
                                ball1.x -= overlap * (mass2 / totalMass);
                                ball2.x += overlap * (mass1 / totalMass);
                            }
                            const result = calcElasticCollision(mass1, mass2, ball1.v, ball2.v);
                            ball1.v = result.v1f;
                            ball2.v = result.v2f;
                            afterCollisionData = { v1: ball1.v, v2: ball2.v };
                            updateAfterData(ball1.v, ball2.v);
                            spawnParticles((ball1.x + ball2.x) / 2, getTrackY() / SCALE);
                            triggerCollisionFlash();
                        }
                    }

                    // 更新碰撞前数据面板（实时显示当前速度）
                    if (!collisionOccurred) {
                        updateDataPanelPreCollision();
                    }
                }

                // 更新粒子
                updateParticles(dt);

                // 绘制
                drawScene();

                // 如果模拟停止且没有粒子，停止动画循环
                if (!simulationRunning && particles.length === 0 && !collisionFlash.classList.contains('active')) {
                    animFrameId = null;
                    return;
                }

                animFrameId = requestAnimationFrame(animate);
            }

            function updateDataPanelPreCollisionWithData(data) {
                beforeV1.textContent = data.v1.toFixed(2) + ' m/s';
                beforeV2.textContent = data.v2.toFixed(2) + ' m/s';
                beforeP1.textContent = data.p1.toFixed(2) + ' kg·m/s';
                beforeP2.textContent = data.p2.toFixed(2) + ' kg·m/s';
                beforePTotal.textContent = data.pTotal.toFixed(2) + ' kg·m/s';
                beforeEk.textContent = data.ek.toFixed(2) + ' J';
            }

            function triggerCollisionFlash() {
                collisionFlash.classList.remove('active');
                void collisionFlash.offsetWidth;
                collisionFlash.classList.add('active');
                if (collisionFlashTimer) clearTimeout(collisionFlashTimer);
                collisionFlashTimer = setTimeout(() => {
                    collisionFlash.classList.remove('active');
                    collisionFlashTimer = null;
                }, 750);
            }

            function startSimulation() {
                if (simulationRunning) return;
                resetState();
                applyParams();
                simulationRunning = true;
                collisionOccurred = false;
                merged = false;
                mergedV = 0;
                mergedOffset = 0;
                beforeCollisionData = null;
                afterCollisionData = null;
                particles = [];
                lastTime = null;
                btnStart.textContent = '⏸ 运行中...';
                btnStart.disabled = true;
                updateDataPanelPreCollision();
                clearAfterData();
                conservationBadge.style.display = 'none';
                collisionFlash.classList.remove('active');
                if (animFrameId) cancelAnimationFrame(animFrameId);
                animFrameId = requestAnimationFrame(animate);
            }

            function resetSimulation() {
                resetState();
                applyParams();
                drawScene();
            }

            // ============ 事件监听 ============
            btnStart.addEventListener('click', startSimulation);
            btnReset.addEventListener('click', resetSimulation);

            // 碰撞类型选择
            collisionTypeSelector.addEventListener('click', (e) => {
                const btn = e.target.closest('.collision-type-btn');
                if (!btn) return;
                collisionTypeSelector.querySelectorAll('.collision-type-btn').forEach(b => b.classList
                    .remove('active'));
                btn.classList.add('active');
                collisionType = btn.dataset.type;
                resetSimulation();
            });

            // 预设按钮
            document.querySelectorAll('.btn-preset').forEach(btn => {
                btn.addEventListener('click', () => {
                    const preset = btn.dataset.preset;
                    switch (preset) {
                        case 'equal':
                            sliderMass1.value = 3;
                            sliderMass2.value = 3;
                            sliderVel1.value = 3;
                            sliderVel2.value = 0;
                            break;
                        case 'heavy1':
                            sliderMass1.value = 8;
                            sliderMass2.value = 2;
                            sliderVel1.value = 3;
                            sliderVel2.value = 0;
                            break;
                        case 'heavy2':
                            sliderMass1.value = 2;
                            sliderMass2.value = 8;
                            sliderVel1.value = 4;
                            sliderVel2.value = 0;
                            break;
                        case 'headon':
                            sliderMass1.value = 3;
                            sliderMass2.value = 3;
                            sliderVel1.value = 3;
                            sliderVel2.value = -2;
                            break;
                    }
                    resetSimulation();
                });
            });

            // 滑块变化
            [sliderMass1, sliderMass2, sliderVel1, sliderVel2].forEach(slider => {
                slider.addEventListener('input', () => {
                    applyParams();
                    resetState();
                    drawScene();
                });
            });

            // 窗口大小调整
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    resizeCanvas();
                    applyParams();
                    resetState();
                    drawScene();
                }, 300);
            });

            // 键盘快捷键
            window.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    if (!simulationRunning) {
                        startSimulation();
                    } else {
                        resetSimulation();
                    }
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    resetSimulation();
                }
            });

            // ============ 初始化 ============
            function init() {
                resizeCanvas();
                applyParams();
                resetState();
                updateDataPanelPreCollision();
                clearAfterData();
                conservationBadge.style.display = 'none';
                drawScene();
            }

            // roundRect polyfill
            if (!ctx.roundRect) {
                ctx.roundRect = function(x, y, w, h, r) {
                    if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
                    ctx.beginPath();
                    ctx.moveTo(x + r.tl, y);
                    ctx.lineTo(x + w - r.tr, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
                    ctx.lineTo(x + w, y + h - r.br);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
                    ctx.lineTo(x + r.bl, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
                    ctx.lineTo(x, y + r.tl);
                    ctx.quadraticCurveTo(x, y, x + r.tl, y);
                    ctx.closePath();
                };
            }

            init();

            console.log('🚀 动量守恒演示已就绪');
            console.log('   🖱️ 点击「开始模拟」观看碰撞动画');
            console.log('   ⌨️ 按空格键 开始/重置');
            console.log('   🎯 观察碰撞前后总动量是否保持不变');
            console.log('   💡 试试不同预设场景，体验动量守恒的神奇！');
        })();
    </script>
</body>
</html>
