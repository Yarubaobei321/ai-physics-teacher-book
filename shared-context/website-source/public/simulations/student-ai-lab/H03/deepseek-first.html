<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>中国历史朝代更迭 | 夏朝至清朝 · 时光长廊</title>
    <!-- 使用清爽的思源宋体与系统无衬线字体，提升中文阅读体验 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #fef7e8 0%, #f9efdc 100%);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #2c2418;
            scroll-behavior: smooth;
        }

        /* 主容器 */
        .timeline-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
        }

        /* 页眉区域 - 带有古典纹样感 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            padding: 1.5rem 0 1rem;
        }
        .hero h1 {
            font-family: 'Source Serif 4', 'Times New Roman', serif;
            font-weight: 600;
            font-size: 3.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #b1622c, #7a4316);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.03);
        }
        .hero .sub {
            font-size: 1rem;
            font-weight: 400;
            color: #8b6946;
            border-top: 1px solid #e2cfb0;
            border-bottom: 1px solid #e2cfb0;
            display: inline-block;
            padding: 0.6rem 1.8rem;
            backdrop-filter: blur(2px);
            letter-spacing: 1px;
        }

        /* 朝代网格布局 - 采用灵活卡片网格，左右错落更富韵律 */
        .dynasty-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* 每条朝代记录为优雅卡片 */
        .dynasty-card {
            display: flex;
            align-items: stretch;
            background: rgba(255, 252, 242, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(231, 196, 138, 0.3);
            transition: all 0.25s ease;
            overflow: hidden;
            cursor: default;
        }
        .dynasty-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 32px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px #e7bc7c;
            background: #fffef7;
        }

        /* 左侧：朝代视觉与年份区域 */
        .card-visual {
            flex: 0 0 200px;
            background: #f2e6d4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem 1rem;
            border-right: 1px solid #e2cfb0;
        }
        .dynasty-icon {
            font-size: 4rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
            margin-bottom: 0.75rem;
        }
        .dynasty-year {
            font-size: 0.85rem;
            font-weight: 500;
            background: #ffffffb3;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            color: #8b5a2e;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
            margin-top: 0.5rem;
            display: inline-block;
        }
        .dynasty-name-large {
            font-family: 'Source Serif 4', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: #7a4518;
            line-height: 1.2;
            margin: 0.25rem 0;
        }

        /* 右侧内容区 */
        .card-content {
            flex: 1;
            padding: 1.4rem 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dynasty-name {
            font-size: 1.7rem;
            font-weight: 600;
            font-family: 'Source Serif 4', serif;
            color: #5c3a1f;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            border-left: 4px solid #d9a13b;
            padding-left: 0.9rem;
        }
        .dynasty-period {
            font-size: 0.9rem;
            font-weight: 500;
            color: #a57248;
            margin-bottom: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #eedfcb;
            border-radius: 20px;
            padding: 0.2rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #69482a;
        }
        .desc {
            font-size: 0.96rem;
            line-height: 1.5;
            color: #3a2c1e;
            margin-top: 0.5rem;
            text-align: justify;
        }

        /* 点缀小元素 */
        .quote-footer {
            text-align: center;
            margin-top: 3.5rem;
            font-size: 0.85rem;
            color: #b28b5e;
            border-top: 1px dashed #decbae;
            padding-top: 2rem;
            font-style: italic;
        }

        /* 响应式设计：窄屏时卡片变为纵向 */
        @media (max-width: 750px) {
            .timeline-container {
                padding: 1.2rem;
            }
            .hero h1 {
                font-size: 2.4rem;
            }
            .dynasty-card {
                flex-direction: column;
            }
            .card-visual {
                flex-direction: row;
                justify-content: space-between;
                border-right: none;
                border-bottom: 1px solid #e2cfb0;
                padding: 1rem 1.5rem;
                flex: auto;
            }
            .card-visual .icon-year-group {
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .dynasty-name-large {
                font-size: 1.6rem;
            }
            .card-content {
                padding: 1.2rem;
            }
            .dynasty-name {
                font-size: 1.4rem;
            }
        }

        /* 简单动画，进入时淡入 */
        .dynasty-card {
            opacity: 0;
            animation: fadeSlideUp 0.5s ease forwards;
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 为每个卡片添加依次动画延迟 */
        .dynasty-card:nth-child(1) { animation-delay: 0.02s; }
        .dynasty-card:nth-child(2) { animation-delay: 0.06s; }
        .dynasty-card:nth-child(3) { animation-delay: 0.1s; }
        .dynasty-card:nth-child(4) { animation-delay: 0.14s; }
        .dynasty-card:nth-child(5) { animation-delay: 0.18s; }
        .dynasty-card:nth-child(6) { animation-delay: 0.22s; }
        .dynasty-card:nth-child(7) { animation-delay: 0.26s; }
        .dynasty-card:nth-child(8) { animation-delay: 0.30s; }
        .dynasty-card:nth-child(9) { animation-delay: 0.34s; }
        .dynasty-card:nth-child(10) { animation-delay: 0.38s; }
        .dynasty-card:nth-child(11) { animation-delay: 0.42s; }
        .dynasty-card:nth-child(12) { animation-delay: 0.46s; }
        .dynasty-card:nth-child(13) { animation-delay: 0.50s; }
        .dynasty-card:nth-child(14) { animation-delay: 0.54s; }
        .dynasty-card:nth-child(15) { animation-delay: 0.58s; }
        .dynasty-card:nth-child(16) { animation-delay: 0.62s; }
        .dynasty-card:nth-child(17) { animation-delay: 0.66s; }
        
        /* 超宽屏优化 */
        @media (min-width: 1600px) {
            .timeline-container {
                max-width: 1400px;
            }
        }

        /* 工具类 */
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hidden-mobile {
            display: inline;
        }
    </style>
</head>
<body>
<div class="timeline-container">
    <div class="hero">
        <h1>📜 王朝长河 · 华夏更替</h1>
        <div class="sub">从“茫茫禹迹”到“康乾盛世” · 夏朝 — 清朝</div>
        <p style="margin-top: 1rem; font-size: 0.9rem; color:#9b7a58;">千年脉络，一览无余 | 触摸历史，感受兴衰</p>
    </div>

    <div class="dynasty-grid" id="dynastyList">
        <!-- 朝代数据将通过js动态渲染，便于维护，同时保证图文一致 -->
    </div>
    <div class="quote-footer">
        ⛩️ 以史为镜，可知兴替 | 朝代顺序：夏 → 商 → 周(西周/东周) → 秦 → 汉 → 三国 → 晋 → 南北朝 → 隋 → 唐 → 五代十国 → 宋 → 元 → 明 → 清
    </div>
</div>

<script>
    // 朝代数据集：从夏朝到清朝，包含代表图标(emoji/文字符号)，名称，年份范围，特色简介
    const dynasties = [
        {
            name: "夏朝",
            nameLarge: "夏",
            years: "约前2070年 — 约前1600年",
            periodDetail: "公元前2070年 ~ 公元前1600年",
            icon: "🏺",
            description: "中国史书中记载的第一个世袭制朝代，大禹治水后建立，开启了‘家天下’的传统。二里头文化遗址展现了早期都邑与青铜礼器。"
        },
        {
            name: "商朝",
            nameLarge: "商",
            years: "约前1600年 — 前1046年",
            periodDetail: "公元前1600年 ~ 公元前1046年",
            icon: "🥁",
            description: "甲骨文与青铜文明达到高峰，盘庚迁殷后稳定。后母戊鼎、四羊方尊见证工艺辉煌，也是信史开端。"
        },
        {
            name: "周朝",
            nameLarge: "周",
            years: "前1046年 — 前256年",
            periodDetail: "西周 + 东周（春秋·战国）",
            icon: "🔔",
            description: "中国历史上最长的朝代，分西周与东周。礼乐制度奠基儒家文化，百家争鸣奠定思想轴心时代。"
        },
        {
            name: "秦朝",
            nameLarge: "秦",
            years: "前221年 — 前207年",
            periodDetail: "公元前221年 ~ 公元前207年",
            icon: "⚔️",
            description: "首个大一统王朝，书同文、车同轨、统一度量衡，修筑长城。中央集权制度影响后世两千年。"
        },
        {
            name: "汉朝",
            nameLarge: "汉",
            years: "前202年 — 220年",
            periodDetail: "西汉·东汉 (含新莽)",
            icon: "🐉",
            description: "强盛帝国，丝绸之路贯通，儒家独尊。造纸术改进，史家绝唱《史记》诞生，汉族由此得名。"
        },
        {
            name: "三国",
            nameLarge: "三国",
            years: "220年 — 280年",
            periodDetail: "魏·蜀·吴鼎立",
            icon: "⚔️🏯",
            description: "英雄辈出的时代，政治军事谋略纷呈。赤壁之战、诸葛亮治蜀，文学上建安风骨熠熠生辉。"
        },
        {
            name: "晋朝",
            nameLarge: "晋",
            years: "265年 — 420年",
            periodDetail: "西晋·东晋",
            icon: "🍃",
            description: "短暂统一后衣冠南渡，门阀士族盛行。王羲之、顾恺之艺术成就，但也开启南北朝对峙前奏。"
        },
        {
            name: "南北朝",
            nameLarge: "南北朝",
            years: "420年 — 589年",
            periodDetail: "南朝宋齐梁陈 · 北朝魏齐周",
            icon: "🏯",
            description: "民族大融合时期，佛教兴盛，云冈龙门石窟开凿。科学技术与文学均有发展，为隋唐大一统奠基。"
        },
        {
            name: "隋朝",
            nameLarge: "隋",
            years: "581年 — 618年",
            periodDetail: "公元581年 ~ 618年",
            icon: "🚣",
            description: "再次统一南北，开创科举、大运河。虽国祚短促，但制度革新深刻影响唐宋。"
        },
        {
            name: "唐朝",
            nameLarge: "唐",
            years: "618年 — 907年",
            periodDetail: "公元618年 ~ 907年",
            icon: "🏮",
            description: "盛世气象，万国来朝。唐诗璀璨，李白杜甫；丝绸之路繁荣，开放包容，至今仍称‘唐人’。"
        },
        {
            name: "五代十国",
            nameLarge: "五代十国",
            years: "907年 — 960年",
            periodDetail: "政权割据，更迭频繁",
            icon: "⚙️",
            description: "唐末藩镇割据延续，北方梁唐晋汉周，南方十国并存。虽乱世，但经济重心持续南移。"
        },
        {
            name: "宋朝",
            nameLarge: "宋",
            years: "960年 — 1279年",
            periodDetail: "北宋·南宋",
            icon: "🏯",
            description: "文化科技登峰造极，活字印刷、指南针、火药应用，词画双绝。商品经济繁荣，但军事积弱。"
        },
        {
            name: "元朝",
            nameLarge: "元",
            years: "1271年 — 1368年",
            periodDetail: "公元1271年 ~ 1368年",
            icon: "🐎",
            description: "首次由少数民族建立的大一统王朝，疆域空前。杂剧繁荣，中外交流密切，行省制度创立。"
        },
        {
            name: "明朝",
            nameLarge: "明",
            years: "1368年 — 1644年",
            periodDetail: "公元1368年 ~ 1644年",
            icon: "🏯",
            description: "天子守国门，郑和七下西洋。小说盛行，《本草纲目》《天工开物》大放异彩，资本主义萌芽。"
        },
        {
            name: "清朝",
            nameLarge: "清",
            years: "1636年 — 1912年",
            periodDetail: "公元1636年 ~ 1912年",
            icon: "🐉",
            description: "中国最后一个封建王朝，康乾盛世奠定版图，但近代面临西方冲击，开启曲折近代化之路。"
        }
    ];

    // 辅助渲染函数：生成图文卡片
    function buildCard(dynasty, index) {
        // 为某些朝代特别优化展示年份辅助说明
        let extraClass = '';
        // 使用现代DOM创建
        const cardDiv = document.createElement('div');
        cardDiv.className = 'dynasty-card';
        
        // 左侧区域（视觉图标 + 大朝代名缩写 + 年份）
        const visualDiv = document.createElement('div');
        visualDiv.className = 'card-visual';
        
        // 内部包裹一个flex布局（适应移动端flex-direction row时保持整齐）
        const iconYearWrapper = document.createElement('div');
        iconYearWrapper.style.display = 'flex';
        iconYearWrapper.style.flexDirection = 'column';
        iconYearWrapper.style.alignItems = 'center';
        iconYearWrapper.style.gap = '0.5rem';
        
        const iconSpan = document.createElement('div');
        iconSpan.className = 'dynasty-icon';
        iconSpan.textContent = dynasty.icon;
        
        const largeNameSpan = document.createElement('div');
        largeNameSpan.className = 'dynasty-name-large';
        largeNameSpan.textContent = dynasty.nameLarge;
        
        const yearBadge = document.createElement('div');
        yearBadge.className = 'dynasty-year';
        yearBadge.textContent = dynasty.years.split('—')[0] + (dynasty.years.includes('—') ? ' — ' + dynasty.years.split('—')[1] : dynasty.years);
        // 让年份排版简短可读
        if(dynasty.name === "周朝") yearBadge.textContent = "前1046年—前256年";
        if(dynasty.name === "汉朝") yearBadge.textContent = "前202年—220年";
        if(dynasty.name === "南北朝") yearBadge.textContent = "420年—589年";
        if(dynasty.name === "五代十国") yearBadge.textContent = "907年—960年";
        
        iconYearWrapper.appendChild(iconSpan);
        iconYearWrapper.appendChild(largeNameSpan);
        iconYearWrapper.appendChild(yearBadge);
        visualDiv.appendChild(iconYearWrapper);
        
        // 右侧内容区
        const contentDiv = document.createElement('div');
        contentDiv.className = 'card-content';
        
        const dynastyNameH2 = document.createElement('h2');
        dynastyNameH2.className = 'dynasty-name';
        dynastyNameH2.textContent = dynasty.name;
        
        const periodDiv = document.createElement('div');
        periodDiv.className = 'dynasty-period';
        const calIcon = document.createElement('span');
        calIcon.textContent = '📅';
        const periodText = document.createElement('span');
        periodText.textContent = dynasty.periodDetail;
        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'badge';
        // 计算该朝代在历史上的特殊标签
        let tag = '';
        if(dynasty.name === '秦朝') tag = '大一统开创者';
        else if(dynasty.name === '汉朝') tag = '丝绸之路';
        else if(dynasty.name === '唐朝') tag = '盛世气象';
        else if(dynasty.name === '宋朝') tag = '文人风雅';
        else if(dynasty.name === '元朝') tag = '辽阔疆域';
        else if(dynasty.name === '明朝') tag = '七下西洋';
        else if(dynasty.name === '清朝') tag = '康乾盛世';
        else if(dynasty.name === '周朝') tag = '礼乐鼎盛';
        else tag = '历史关键时期';
        badgeSpan.textContent = tag;
        
        periodDiv.appendChild(calIcon);
        periodDiv.appendChild(periodText);
        periodDiv.appendChild(badgeSpan);
        
        const descP = document.createElement('p');
        descP.className = 'desc';
        descP.textContent = dynasty.description;
        
        contentDiv.appendChild(dynastyNameH2);
        contentDiv.appendChild(periodDiv);
        contentDiv.appendChild(descP);
        
        cardDiv.appendChild(visualDiv);
        cardDiv.appendChild(contentDiv);
        
        return cardDiv;
    }
    
    // 渲染所有朝代
    const container = document.getElementById('dynastyList');
    function renderTimeline() {
        container.innerHTML = ''; // 清空
        dynasties.forEach((dynasty, idx) => {
            const card = buildCard(dynasty, idx);
            container.appendChild(card);
        });
        // 添加一丝装饰: 在卡片尾部加一个微型卷轴效果？不用，保持纯粹。
        // 也可以处理特殊朝代年限显示微调，但是函数已经做了部分
        // 另外为了体现两汉合并以及周朝包含东周，在周朝描述和年份更细致
        // 手动更新周朝年份展示让内容更精确（再次保证）
        const allCards = document.querySelectorAll('.dynasty-card');
        // 遍历修正个别描述或补充细节（不改原始数据，但体验更佳）
        if(allCards.length >= 3) {
            // 周朝卡片（第三个）的描述进一步丰富
            const zhouDesc = allCards[2]?.querySelector('.desc');
            if(zhouDesc && zhouDesc.innerText.includes('礼乐制度')) {
                zhouDesc.innerText = "中国历史上最长的朝代，分西周与东周（春秋·战国）。礼乐制度奠基儒家文化，百家争鸣奠定思想轴心时代，周易与诗经流传千古。";
            }
            // 秦朝增加一句显示统一六国
            const qinDesc = allCards[3]?.querySelector('.desc');
            if(qinDesc) qinDesc.innerText = "首个大一统王朝，书同文、车同轨、统一度量衡，修筑长城。中央集权制度影响后世两千年，秦始皇奠定华夏疆域基石。";
            // 唐朝
            const tangDesc = allCards[9]?.querySelector('.desc');
            if(tangDesc) tangDesc.innerText = "盛世气象，万国来朝。唐诗璀璨，李白杜甫；丝绸之路繁荣，开放包容，至今仍称‘唐人’。贞观之治与开元盛世为鼎盛标志。";
            // 宋朝附加文化成就
            const songDesc = allCards[11]?.querySelector('.desc');
            if(songDesc) songDesc.innerText = "文化科技登峰造极，活字印刷、指南针、火药应用，词画双绝。商品经济繁荣，但军事积弱。张择端《清明上河图》绘尽繁华。";
        }
        // 确保南北朝描述细腻
        const nanbeiDesc = document.querySelectorAll('.dynasty-card')[7]?.querySelector('.desc');
        if(nanbeiDesc) nanbeiDesc.innerText = "民族大融合时期，佛教兴盛，云冈龙门石窟开凿。科学技术与文学均有发展，为隋唐大一统奠基。北魏孝文帝改革促进汉化。";
        
        // 增加五代十国补充
        const wudaiDesc = document.querySelectorAll('.dynasty-card')[10]?.querySelector('.desc');
        if(wudaiDesc) wudaiDesc.innerText = "唐末藩镇割据延续，北方梁唐晋汉周，南方十国并存。虽乱世，但经济重心持续南移，为宋代经济繁荣铺路。";
    }
    
    renderTimeline();
