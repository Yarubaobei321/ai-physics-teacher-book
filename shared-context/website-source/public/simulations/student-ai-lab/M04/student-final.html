<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高中数学立体几何 · 3D交互演示与专题讲解</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent2: #f59e0b;
            --accent3: #ef4444;
            --accent4: #10b981;
            --border: #334155;
            --radius: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --transition: 0.2s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }
        .topbar {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: wrap;
        }
        .topbar .title {
            font-size: 1.15em;
            font-weight: 700;
            white-space: nowrap;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--panel-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.78em;
            transition: all var(--transition);
            white-space: nowrap;
            font-weight: 500;
        }
        .btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent);
            color: #fff;
        }
        .btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.4);
        }
        .btn.accent2 {
            border-color: var(--accent2);
            color: var(--accent2);
        }
        .btn.accent2.active {
            background: var(--accent2);
            border-color: var(--accent2);
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
        }
        .btn-icon {
            width: 32px;
            height: 32px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            min-width: 32px;
        }
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .viewer {
            flex: 1;
            position: relative;
            cursor: grab;
            min-width: 0;
            background: radial-gradient(ellipse at center, #1a2740 0%, #0a0f1a 100%);
        }
        .viewer:active {
            cursor: grabbing;
        }
        .viewer canvas {
            display: block;
        }
        .hint-overlay {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7em;
            color: #64748b;
            pointer-events: none;
            text-align: center;
            transition: opacity 1s;
        }
        .section-slider-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 5;
            transition: all var(--transition);
        }
        .section-slider-container.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(15px);
        }
        .section-slider-container label {
            font-size: 0.75em;
            white-space: nowrap;
            font-weight: 500;
            color: var(--accent2);
        }
        .section-slider-container input[type=range] {
            width: 120px;
            accent-color: var(--accent2);
            cursor: pointer;
        }
        .section-slider-container .val {
            font-size: 0.7em;
            color: var(--text-secondary);
            min-width: 70px;
            text-align: center;
            font-weight: 600;
        }
        .panel {
            width: 450px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 5;
        }
        .tab-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
            padding: 8px 10px;
            background: #0f172a;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .tab-btn {
            padding: 7px 11px;
            border-radius: 16px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.73em;
            transition: all var(--transition);
            white-space: nowrap;
            font-weight: 500;
        }
        .tab-btn:hover {
            color: #fff;
            background: #1e3a5f;
        }
        .tab-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
        }
        .tab-content {
            display: none;
            padding: 12px 14px;
            flex: 1;
            overflow-y: auto;
            gap: 10px;
            flex-direction: column;
        }
        .tab-content.active {
            display: flex;
        }
        .panel .section-title {
            font-size: 0.95em;
            font-weight: 700;
            color: #f1f5f9;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
            letter-spacing: 0.02em;
        }
        .panel .sub-title {
            font-size: 0.82em;
            font-weight: 600;
            color: #e2e8f0;
            margin-top: 6px;
            padding: 4px 8px;
            background: #1a2540;
            border-radius: 6px;
            border-left: 3px solid var(--accent2);
        }
        .panel .info-card {
            background: #1a2540;
            border-radius: var(--radius);
            padding: 10px 12px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .panel .info-card h4 {
            font-size: 0.82em;
            color: var(--accent2);
            margin-bottom: 5px;
            letter-spacing: 0.02em;
        }
        .panel .info-card p,
        .panel .info-card li {
            font-size: 0.73em;
            color: var(--text-secondary);
            line-height: 1.55;
        }
        .panel .info-card ul {
            list-style: disc;
            padding-left: 16px;
        }
        .panel .formula {
            display: inline-block;
            background: #0f172a;
            padding: 3px 8px;
            border-radius: 5px;
            font-family: 'Courier New', 'SF Mono', monospace;
            color: #fbbf24;
            font-size: 0.82em;
            margin: 2px 0;
            letter-spacing: 0.03em;
        }
        .panel .highlight-box {
            background: #1a2035;
            border-left: 3px solid var(--accent4);
            border-radius: 0 8px 8px 0;
            padding: 8px 12px;
            font-size: 0.73em;
            color: #a7f3d0;
            line-height: 1.5;
            flex-shrink: 0;
        }
        .panel .highlight-box strong {
            color: #34d399;
        }
        .panel .question-box {
            background: #1a1f30;
            border-left: 3px solid #f59e0b;
            border-radius: 0 8px 8px 0;
            padding: 10px 14px;
            font-size: 0.73em;
            color: #fcd34d;
            line-height: 1.6;
            flex-shrink: 0;
        }
        .panel .question-box .answer-toggle {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #f59e0b22;
            border: 1px solid #f59e0b55;
            color: #fbbf24;
            cursor: pointer;
            font-size: 0.85em;
            transition: all var(--transition);
        }
        .panel .question-box .answer-toggle:hover {
            background: #f59e0b44;
        }
        .panel .answer-content {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            background: #0f172a;
            border-radius: 6px;
            color: #a7f3d0;
            line-height: 1.5;
        }
        .panel .answer-content.show {
            display: block;
        }
        .panel .view-question-btn {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #3b82f644;
            border: 1px solid #3b82f6;
            color: #93c5fd;
            cursor: pointer;
            font-size: 0.8em;
            transition: all var(--transition);
        }
        .panel .view-question-btn:hover {
            background: #3b82f688;
            color: #fff;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.7em;
            flex-shrink: 0;
            padding: 4px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        @media (max-width: 860px) {
            .main-container {
                flex-direction: column;
            }
            .panel {
                width: 100%;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .viewer {
                min-height: 280px;
                flex: 1 1 auto;
            }
            .topbar {
                padding: 6px 8px;
                gap: 4px;
            }
            .btn {
                padding: 4px 8px;
                font-size: 0.68em;
                border-radius: 14px;
            }
            .tab-btn {
                font-size: 0.66em;
                padding: 5px 8px;
            }
            .panel .info-card p,
            .panel .info-card li {
                font-size: 0.68em;
            }
            .section-slider-container input[type=range] {
                width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="topbar" id="topBar">
        <span class="title">📐 立体几何 · 3D交互演示</span>
        <button class="btn btn-icon" id="btnReset" title="重置视角">🔄</button>
        <button class="btn" id="btnWireframe" title="线框模式">🔍 线框</button>
        <button class="btn" id="btnAutoRotate" title="自动旋转">🎠 旋转</button>
        <button class="btn accent2 active" id="btnCircumsphere" title="外接球显示/隐藏">⚽ 外接球</button>
    </div>
    <div class="main-container">
        <div class="viewer" id="viewer">
            <div class="section-slider-container hidden" id="sectionSliderContainer">
                <label>🔪 截面</label>
                <input type="range" id="sectionSlider" min="-2.8" max="2.8" step="0.02" value="0">
                <span class="val" id="sectionVal">d=0.00</span>
            </div>
            <div class="hint-overlay" id="hintOverlay">🖱 拖拽旋转 | 滚轮缩放 | 右键平移</div>
        </div>
        <div class="panel" id="panel">
            <div class="tab-nav" id="tabNav">
                <button class="tab-btn active" data-tab="shapeInfo">📦 图形详情</button>
                <button class="tab-btn" data-tab="parallelPerp">📏 平行与垂直</button>
                <button class="tab-btn" data-tab="angles">📐 角度专题</button>
                <button class="tab-btn" data-tab="vector">🧭 空间向量</button>
                <button class="tab-btn" data-tab="examQuestions">📝 真题演练</button>
            </div>
            <div class="tab-content active" id="tabShapeInfo"></div>
            <div class="tab-content" id="tabParallelPerp"></div>
            <div class="tab-content" id="tabAngles"></div>
            <div class="tab-content" id="tabVector"></div>
            <div class="tab-content" id="tabExamQuestions"></div>
        </div>
    </div>
    <div class="topbar" style="border-top:1px solid var(--border);border-bottom:none;justify-content:center;gap:5px;flex-wrap:wrap;padding:6px 10px;" id="shapeBar">
        <button class="btn active" data-shape="cube">正方体</button>
        <button class="btn" data-shape="cuboid">长方体</button>
        <button class="btn" data-shape="tetrahedron">正四面体</button>
        <button class="btn" data-shape="corner">墙角三棱锥</button>
        <button class="btn" data-shape="triPrism">正三棱柱</button>
        <button class="btn" data-shape="cylinder">圆柱</button>
        <button class="btn" data-shape="cone">圆锥</button>
        <button class="btn" data-shape="sphere">球体</button>
        <button class="btn" data-shape="pyramid">正四棱锥</button>
    </div>

    <script type="importmap">
        {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============ DOM元素 ============
        const viewerEl = document.getElementById('viewer');
        const hintOverlay = document.getElementById('hintOverlay');
        const sectionSliderContainer = document.getElementById('sectionSliderContainer');
        const sectionSlider = document.getElementById('sectionSlider');
        const sectionVal = document.getElementById('sectionVal');
        const btnReset = document.getElementById('btnReset');
        const btnWireframe = document.getElementById('btnWireframe');
        const btnAutoRotate = document.getElementById('btnAutoRotate');
        const btnCircumsphere = document.getElementById('btnCircumsphere');
        const shapeButtons = document.querySelectorAll('#shapeBar .btn');
        const tabBtns = document.querySelectorAll('#tabNav .tab-btn');
        const tabShapeInfo = document.getElementById('tabShapeInfo');
        const tabParallelPerp = document.getElementById('tabParallelPerp');
        const tabAngles = document.getElementById('tabAngles');
        const tabVector = document.getElementById('tabVector');
        const tabExamQuestions = document.getElementById('tabExamQuestions');
        const allTabContents = [tabShapeInfo, tabParallelPerp, tabAngles, tabVector, tabExamQuestions];

        let currentShape = 'cube';
        let isWireframe = false;
        let isAutoRotate = false;
        let showCircumsphere = true;
        let activeTab = 'shapeInfo';

        // ============ Three.js初始化 ============
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        viewerEl.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(48, 2, 0.5, 50);
        camera.position.set(5.5, 3.8, 7.5);
        camera.lookAt(0, 0, 0);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2.5;
        controls.maxDistance = 18;
        controls.maxPolarAngle = Math.PI * 0.85;
        controls.target.set(0, 0, 0);
        controls.autoRotate = false;
        controls.autoRotateSpeed = 1.5;
        controls.update();

        // 光照
        const ambientLight = new THREE.AmbientLight('#bcd4f5', 2.5);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight('#ffffff', 6);
        keyLight.position.set(8, 14, 10);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -12;
        keyLight.shadow.camera.right = 12;
        keyLight.shadow.camera.top = 12;
        keyLight.shadow.camera.bottom = -12;
        keyLight.shadow.bias = -0.0003;
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight('#8ec5fc', 2.5);
        fillLight.position.set(-3, 2, -3);
        scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight('#ffffff', 1.8);
        rimLight.position.set(0, -1, 4);
        scene.add(rimLight);

        // 地面
        const gridHelper = new THREE.PolarGridHelper(8, 40, 28, 128, '#2a3a55', '#1e2d44');
        scene.add(gridHelper);
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: '#141e2e', roughness: 0.9, metalness: 0.05 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -5;
        floor.receiveShadow = true;
        scene.add(floor);

        // ============ 场景对象组 ============
        const mainGroup = new THREE.Group();
        const wireGroup = new THREE.Group();
        const auxGroup = new THREE.Group();
        const circumGroup = new THREE.Group();
        const sectionGroup = new THREE.Group();
        const examGroup = new THREE.Group();
        scene.add(mainGroup);
        scene.add(wireGroup);
        scene.add(auxGroup);
        scene.add(circumGroup);
        scene.add(sectionGroup);
        scene.add(examGroup);
        let currentMeshes = { solids: [], wires: [], aux: [], circum: [], sectionParts: [], examParts: [] };

        // ============ 辅助函数 ============
        function clearGroup(group) {
            while (group.children.length > 0) {
                const c = group.children[0];
                disposeRecursive(c);
                group.remove(c);
            }
        }
        function disposeRecursive(obj) {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(m => m.dispose());
                } else {
                    obj.material.dispose();
                }
            }
            if (obj.children) {
                for (let i = obj.children.length - 1; i >= 0; i--) {
                    disposeRecursive(obj.children[i]);
                }
            }
        }
        function clearAll() {
            clearGroup(mainGroup);
            clearGroup(wireGroup);
            clearGroup(auxGroup);
            clearGroup(circumGroup);
            clearGroup(sectionGroup);
            clearGroup(examGroup);
            currentMeshes = { solids: [], wires: [], aux: [], circum: [], sectionParts: [], examParts: [] };
        }

        function createGlowMaterial(color, opacity = 0.5, emissiveIntensity = 0.3) {
            return new THREE.MeshPhysicalMaterial({
                color: color, metalness: 0.05, roughness: 0.35, opacity: opacity,
                transparent: true, depthWrite: true, emissive: color,
                emissiveIntensity: emissiveIntensity, clearcoat: 0.1, clearcoatRoughness: 0.4,
            });
        }
        function createSphereDot(pos, color = '#ff4444', radius = 0.07) {
            const geo = new THREE.SphereGeometry(radius, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.7, roughness: 0.3 });
            const dot = new THREE.Mesh(geo, mat);
            dot.position.copy(pos);
            dot.castShadow = true;
            return dot;
        }
        function createThickLine(points, color = '#ff3333', radius = 0.04) {
            const curve = new THREE.CatmullRomCurve3(points, false);
            const geo = new THREE.TubeGeometry(curve, 64, radius, 8, false);
            const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.1 });
            const tube = new THREE.Mesh(geo, mat);
            tube.castShadow = true;
            return tube;
        }
        function createDashedLine(p1, p2, color = '#ffffff', dashSize = 0.15, gapSize = 0.1) {
            const dir = new THREE.Vector3().subVectors(p2, p1);
            const len = dir.length();
            dir.normalize();
            const pts = [];
            let pos = 0, isDash = true;
            while (pos < len) {
                if (isDash) {
                    const e = Math.min(pos + dashSize, len);
                    pts.push(new THREE.Vector3().copy(p1).addScaledVector(dir, pos));
                    pts.push(new THREE.Vector3().copy(p1).addScaledVector(dir, e));
                    pos = e;
                } else { pos += gapSize; }
                isDash = !isDash;
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineDashedMaterial({ color: color, dashSize: dashSize, gapSize: gapSize, transparent: true, opacity: 0.7 });
            const line = new THREE.LineSegments(geo, mat);
            line.computeLineDistances();
            return line;
        }

        // ============ 外接球构建 ============
        function buildCircumsphere(radius, cx = 0, cy = 0, cz = 0) {
            clearGroup(circumGroup);
            currentMeshes.circum = [];
            const center = new THREE.Vector3(cx, cy, cz);
            const sphereGeo = new THREE.SphereGeometry(radius, 72, 54);
            const sphereMat = new THREE.MeshPhysicalMaterial({
                color: '#ff9500', metalness: 0.03, roughness: 0.35, opacity: 0.18,
                transparent: true, depthWrite: false, emissive: '#ff7700', emissiveIntensity: 0.35, clearcoat: 0.05,
            });
            const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
            sphereMesh.position.copy(center);
            sphereMesh.renderOrder = 1;
            circumGroup.add(sphereMesh);
            currentMeshes.circum.push(sphereMesh);

            const wireGeo = new THREE.SphereGeometry(radius, 36, 24);
            const wireMat = new THREE.MeshBasicMaterial({ color: '#ff9500', wireframe: true, transparent: true, opacity: 0.28, depthTest: true, depthWrite: true });
            const wireSphere = new THREE.Mesh(wireGeo, wireMat);
            wireSphere.position.copy(center);
            wireSphere.renderOrder = 2;
            circumGroup.add(wireSphere);
            currentMeshes.circum.push(wireSphere);

            const torusGeo = new THREE.TorusGeometry(radius, 0.035, 16, 128);
            const torusMat = new THREE.MeshStandardMaterial({ color: '#ffaa33', emissive: '#ff8800', emissiveIntensity: 0.5, roughness: 0.25, metalness: 0.15, depthTest: true, depthWrite: true });
            [
                [0, 0, 0],
                [Math.PI / 2, 0, 0],
                [0, 0, Math.PI / 2]
            ].forEach(rot => {
                const torus = new THREE.Mesh(torusGeo.clone(), torusMat);
                torus.position.copy(center);
                torus.rotation.set(rot[0], rot[1], rot[2]);
                torus.renderOrder = 3;
                circumGroup.add(torus);
                currentMeshes.circum.push(torus);
            });
            const centerDot = createSphereDot(center, '#ffffff', 0.1);
            centerDot.renderOrder = 4;
            circumGroup.add(centerDot);
            currentMeshes.circum.push(centerDot);
            circumGroup.visible = showCircumsphere;
        }

        // ============ 真题图形构建 ============
        function buildExamQuestion1() {
            clearGroup(examGroup);
            currentMeshes.examParts = [];
            const size = 2;
            // 正方体
            const geo = new THREE.BoxGeometry(size, size, size);

        function buildCubeSection(d) {
            clearGroup(sectionGroup);
            currentMeshes.sectionParts = [];
            if (!currentMeshes._cubeData) return;
            const { corners } = currentMeshes._cubeData;
            const v = corners.map(c => new THREE.Vector3(c[0], c[1], c[2]));
            const edges = [];
            for (let i = 0; i < 8; i++) {
                for (let j = i + 1; j < 8; j++) {
                    const df = Math.abs(v[i].x - v[j].x) + Math.abs(v[i].y - v[j].y) + Math.abs(v[i].z - v[j].z);
                    if (Math.abs(df - 2) < 0.01) edges.push([v[i].clone(), v[j].clone()]);
                }
            }
            const intersections = [];
            for (const [a, b] of edges) {
                const sa = a.x + a.y + a.z - d,
                    sb = b.x + b.y + b.z - d;
                if (Math.abs(sa - sb) < 1e-5) continue;
                if (sa * sb <= 0) {
                    const t = Math.abs(sa) / (Math.abs(sa) + Math.abs(sb));
                    const pt = new THREE.Vector3().lerpVectors(a, b, t);
                    let dup = false;
                    for (const ex of intersections) { if (ex.distanceToSquared(pt) < 1e-5) { dup = true; break; } }
                    if (!dup) intersections.push(pt);
                }
            }
            if (intersections.length < 3) return;
            const n = new THREE.Vector3(1, 1, 1).normalize();
            const u = new THREE.Vector3(1, -1, 0).normalize();
            const v2dir = new THREE.Vector3().crossVectors(n, u).normalize();
            const cp = new THREE.Vector3();
            intersections.forEach(p => cp.add(p));
            cp.divideScalar(intersections.length);
            const proj = intersections.map(p => {
                const rel = new THREE.Vector3().subVectors(p, cp);
                return { pt: p, angle: Math.atan2(rel.dot(v2dir), rel.dot(u)), px: rel.dot(u), py: rel.dot(v2dir) };
            });
            proj.sort((a, b) => a.angle - b.angle);
            const sorted = proj.map(p => p.pt);
            if (sorted.length < 3) return;
            const shape = new THREE.Shape();
            const lpts = proj.map(p => new THREE.Vector2(p.px, p.py));
            shape.moveTo(lpts[0].x, lpts[0].y);
            for (let i = 1; i < lpts.length; i++) shape.lineTo(lpts[i].x, lpts[i].y);
            shape.closePath();
            const sm = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: '#ffbb33',
                side: THREE.DoubleSide, transparent: true, opacity: 0.6, depthTest: true, depthWrite: false }));
            sm.position.copy(cp);
            sm.setRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n));
            sectionGroup.add(sm);
            currentMeshes.sectionParts.push(sm);
            const bpts = [...sorted, sorted[0]];
            const bl = new THREE.Line(new THREE.BufferGeometry().setFromPoints(bpts), new THREE.LineBasicMaterial({ color: '#ff8800',
                transparent: true, opacity: 0.85, depthTest: true }));
            sectionGroup.add(bl);
            currentMeshes.sectionParts.push(bl);
            const np = sorted.length;
            let st = np === 3 ? '三角形' : np === 4 ? '四边形' : np === 5 ? '五边形' : np === 6 ? '正六边形!' : np + '边形';
            sectionVal.textContent = `d=${d.toFixed(2)} [${st}]`;
        }

        function buildTriPrism() {

                <div class="question-box"><strong>【题3·建系法】</strong>直三棱柱ABC-A₁B₁C₁中，AB⊥AC，AB=AC=2，AA₁=3，D为BC中点。<br>(1)建立坐标系，求各点坐标；<br>(2)求异面直线AD与B₁C₁所成角的余弦值；<br>(3)求平面ADC₁与平面ABC的夹角余弦值。<br><span class="view-question-btn" data-exam="exam3">🔍 查看3D图形</span><br><span class="answer-toggle">📖 查看解析</span>
                <div class="answer-content"><strong>解析：</strong>(1)建系：A(0,0,0), B(2,0,0), C(0,2,0), A₁(0,0,3), B₁(2,0,3), C₁(0,2,3)。D(1,1,0)。<br>(2)AD→=(1,1,0), B₁C₁→=(-2,2,0)。cosθ=0，θ=90°。<br>(3)面ADC₁法向量n₁=(3,-3,2)；面ABC法向量n₂=(0,0,1)。|cosθ|=2/√22=√22/11。</div></div>
                <div class="highlight-box">💡 <strong>高考提示：</strong>建系法在高考立体几何大题中几乎是"万能解法"。关键是选好原点，正确写出各点坐标，计算法向量时注意验证。二面角需根据图形判断锐钝角。</div>
            `;
        }
        initStaticTabs();

        // ============ 事件处理 ============
        shapeButtons.forEach(btn => {
            btn.addEventListener('click', () => { const s = btn.dataset.shape; if (s && s !== currentShape) switchShape(
                    s); });
        });

        btnReset.addEventListener('click', () => { controls.target.set(0, 0, 0);
            camera.position.set(5.5, 3.8, 7.5);
            camera.lookAt(0, 0, 0);
            controls.update();
            hintOverlay.style.opacity = '1';
            setTimeout(() => { hintOverlay.style.opacity = '0.5'; }, 1500); });
        btnWireframe.addEventListener('click', () => { isWireframe = !isWireframe;
            btnWireframe.classList.toggle('active', isWireframe);
            applyWireframeMode(); });
        btnAutoRotate.addEventListener('click', () => { isAutoRotate = !isAutoRotate;
            btnAutoRotate.classList.toggle('active', isAutoRotate);
            controls.autoRotate = isAutoRotate; });
        btnCircumsphere.addEventListener('click', () => { showCircumsphere = !showCircumsphere;
            btnCircumsphere.classList.toggle('active', showCircumsphere);
            circumGroup.visible = showCircumsphere && shapesWithCircumsphere.includes(currentShape); });

        sectionSlider.addEventListener('input', () => { const d = parseFloat(sectionSlider.value); if (currentShape ===
                'cube') buildCubeSection(d); });

        // 绑定答案展开和真题图形查看事件
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('answer-toggle')) {
                e.target.nextElementSibling.classList.toggle('show');
            }
            if (e.target.classList.contains('view-question-btn')) {
                const examType = e.target.dataset.exam;
                if (examBuilders[examType]) {
                    clearGroup(examGroup);
                    currentMeshes.examParts = [];
                    examBuilders[examType]();
                    // 更新图例
                    if (currentMeshes._examLegend) {
                        let legendHtml = '<div class="legend" style="margin-top:8px;">';
                        currentMeshes._examLegend.forEach(item => {
                            legendHtml +=
                                `<span class="legend-item"><span class="legend-dot" style="background:${item.color};"></span>${item.label}</span>`;
                        });
                        legendHtml += '</div>';
                        const examTab = document.getElementById('tabExamQuestions');
                        const existingLegend = examTab.querySelector('.exam-legend');
                        if (existingLegend) existingLegend.remove();
                        const legendDiv = document.createElement('div');
                        legendDiv.className = 'exam-legend';
                        legendDiv.innerHTML = legendHtml;
                        examTab.appendChild(legendDiv);
                    }
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            const shapes = Object.keys(shapeBuilders);
            const idx = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].indexOf(e.key);
            if (idx >= 0 && idx < shapes.length && !e.ctrlKey && !e.metaKey && !e.altKey) { if (document.activeElement
                    ?.tagName === 'INPUT') return;
                switchShape(shapes[idx]); }
            if (e.key === 'r' || e.key === 'R') { if (!e.ctrlKey) btnReset.click(); }
            if (e.key === 'w' || e.key === 'W') { if (!e.ctrlKey) btnWireframe.click(); }
            if (e.key === 'a' || e.key === 'A') { if (!e.ctrlKey) btnAutoRotate.click(); }
            if (e.key === 'c' || e.key === 'C') { if (!e.ctrlKey) btnCircumsphere.click(); }
        });

        function resize() { const rect = viewerEl.getBoundingClientRect();
            renderer.setSize(rect.width, rect.height);
            camera.aspect = rect.width / Math.max(rect.height, 1);
            camera.updateProjectionMatrix(); }
        window.addEventListener('resize', resize);
        resize();
        setTimeout(() => { hintOverlay.style.opacity = '0.45'; }, 6000);
        viewerEl.addEventListener('pointerdown', () => { hintOverlay.style.opacity = '0.25'; });

        function animate() { requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera); }

        switchShape('cube');
        updateShapeInfoTab('cube');
        resize();
        animate();
        console.log('✅ 立体几何3D演示+专题讲解已就绪');
        console.log('   🖱 拖拽旋转 | 滚轮缩放 | 右键平移');
        console.log('   ⌨ 1-9切换图形 | R重置 | W线框 | A旋转 | C外接球');
        console.log('   📝 真题演练中点击"查看3D图形"可显示对应立体图形');
        console.log('   📏 平行与垂直专题已扩展为完整知识点体系');
    </script>
</body>
