<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国共产党发展历程（1921-1949）| 高中历史交互学习</title>
    <style>
        :root {
            --red-deep: #8B1A2B;
            --red-main: #C41E3A;
            --red-light: #E8455B;
            --gold: #C9A962;
            --gold-light: #E0CD8F;
            --bg: #FDF8F0;
            --bg-card: #FFFFFF;
            --bg-warm: #FFF9F2;
            --text: #2C2C2C;
            --text-light: #5A5A5A;
            --text-lighter: #7A7A7A;
            --border: #E8D5C4;
            --shadow-sm: 0 2px 8px rgba(139, 26, 43, 0.06);
            --shadow-md: 0 4px 20px rgba(139, 26, 43, 0.10);
            --shadow-lg: 0 8px 40px rgba(139, 26, 43, 0.14);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font-heading: 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', 'KaiTi', serif;
            --font-body: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Noto Sans SC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ 顶部横幅 ============ */
        .hero-banner {
            background: linear-gradient(160deg, #6B0F1B 0%, #8B1A2B 30%, #A8203A 60%, #8B1A2B 100%);
            color: #fff;
            padding: 36px 24px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(139, 26, 43, 0.25);
        }
        .hero-banner::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
        }
        .hero-banner::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.025);
            pointer-events: none;
        }
        .hero-banner .hero-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .hero-banner h1 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }
        .hero-banner .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            letter-spacing: 0.08em;
            position: relative;
            z-index: 1;
            font-weight: 300;
        }
        .hero-banner .badge-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
            position: relative;
            z-index: 1;
        }
        .hero-banner .badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            backdrop-filter: blur(4px);
            transition: var(--transition);
            cursor: default;
        }
        .hero-banner .badge:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ============ 主容器 ============ */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ============ Tab导航 ============ */
        .tab-nav {
            display: flex;
            gap: 4px;
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 6px;
            margin: -28px auto 28px;
            max-width: 700px;
            box-shadow: var(--shadow-md);
            position: sticky;
            top: 16px;
            z-index: 100;
            border: 1px solid var(--border);
        }
        .tab-nav button {
            flex: 1;
            padding: 13px 16px;
            border: none;
            background: transparent;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-light);
            transition: var(--transition);
            letter-spacing: 0.03em;
            white-space: nowrap;
            font-family: var(--font-body);
        }
        .tab-nav button:hover {
            color: var(--red-main);
            background: rgba(196, 30, 58, 0.04);
        }
        .tab-nav button.active {
            background: var(--red-main);
            color: #fff;
            box-shadow: 0 4px 14px rgba(196, 30, 58, 0.35);
        }
        .tab-nav .tab-emoji {
            margin-right: 5px;
        }

        /* ============ Tab面板 ============ */
        .tab-panel {
            display: none;
            animation: fadeSlideIn 0.45s ease;
        }
        .tab-panel.active {
            display: block;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ 时间线面板 ============ */
        .timeline-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        .timeline-scroll-area {
            flex: 0 0 420px;
            max-height: 75vh;
            overflow-y: auto;
            padding-right: 10px;
            position: sticky;
            top: 100px;
            scrollbar-width: thin;
            scrollbar-color: #d0c0b0 transparent;
        }
        .timeline-scroll-area::-webkit-scrollbar {
            width: 5px;
        }
        .timeline-scroll-area::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }
        .timeline-scroll-area::-webkit-scrollbar-thumb {
            background: #d0c0b0;
            border-radius: 10px;
        }

        .timeline-list {
            position: relative;
            padding-left: 32px;
        }
        .timeline-list::before {
            content: '';
            position: absolute;
            left: 14px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: linear-gradient(180deg, var(--red-light), var(--red-deep), var(--red-light));
            border-radius: 3px;
            opacity: 0.5;
        }
        .timeline-node {
            position: relative;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1.5px solid transparent;
            box-shadow: var(--shadow-sm);
        }
        .timeline-node:hover {
            border-color: var(--red-light);
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }
        .timeline-node.selected {
            border-color: var(--red-main) !important;
            box-shadow: var(--shadow-md) !important;
            background: #FFF5F5 !important;
            transform: translateX(6px);
        }
        .timeline-node::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 20px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--red-main);
            z-index: 2;
            transition: var(--transition);
        }
        .timeline-node.selected::before {
            background: var(--red-main);
            box-shadow: 0 0 0 6px rgba(196, 30, 58, 0.18);
            animation: pulseDot 1.2s ease-in-out;
        }
        @keyframes pulseDot {
            0%,
            100% {
                box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.2);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(196, 30, 58, 0.05);
            }
        }
        .timeline-node .node-year {
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--red-main);
            letter-spacing: 0.04em;
        }
        .timeline-node .node-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: 2px;
            color: var(--text);
        }
        .timeline-node .node-brief {
            font-size: 0.8rem;
            color: var(--text-lighter);
            margin-top: 2px;
            line-height: 1.4;
        }

        /* 详情面板 */
        .detail-panel {
            flex: 1;
            min-width: 0;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 28px 30px;
            box-shadow: var(--shadow-md);
            min-height: 400px;
            border: 1px solid var(--border);
            position: sticky;
            top: 100px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .detail-panel .placeholder-text {
            color: var(--text-lighter);
            text-align: center;
            padding: 60px 20px;
            font-size: 1rem;
            opacity: 0.7;
        }
        .detail-panel .placeholder-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }
        .detail-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--red-deep);
            margin-bottom: 6px;
            letter-spacing: 0.03em;
        }
        .detail-date {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }
        .detail-section {
            margin-bottom: 18px;
        }
        .detail-section h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-section p,
        .detail-section li {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.7;
        }
        .detail-section ul {
            list-style: disc;
            padding-left: 20px;
        }
        .difficulty-badge {
            display: inline-block;
            background: #FFF3E0;
            color: #E65100;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-right: 6px;
            letter-spacing: 0.03em;
        }
        .solution-badge {
            display: inline-block;
            background: #E8F5E9;
            color: #2E7D32;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .highlight-box {
            background: #FFFBF0;
            border-left: 4px solid var(--gold);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            margin: 10px 0;
            font-size: 0.88rem;
            color: #6B4E16;
        }

        /* ============ 思维导图面板 ============ */
        .mindmap-container {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 30px 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        .mindmap-title {
            text-align: center;
            font-family: var(--font-heading);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--red-deep);
            margin-bottom: 24px;
            letter-spacing: 0.04em;
        }
        .mindmap-tree {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            min-width: 900px;
            padding: 10px 0;
        }
        .mindmap-root {
            background: var(--red-main);
            color: #fff;
            padding: 14px 28px;
            border-radius: 28px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.35);
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .mindmap-connector-vertical {
            width: 3px;
            height: 28px;
            background: var(--red-light);
            opacity: 0.6;
            border-radius: 2px;
        }
        .mindmap-connector-horizontal {
            height: 3px;
            background: var(--red-light);
            opacity: 0.5;
            border-radius: 2px;
            flex: 1;
            min-width: 30px;
            align-self: center;
        }
        .mindmap-branches-row {
            display: flex;
            align-items: flex-start;
            gap: 0;
            width: 100%;
            justify-content: center;
        }
        .mindmap-branch-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 120px;
            max-width: 200px;
        }
        .mindmap-branch-node {
            background: #FFF5F5;
            border: 2px solid var(--red-light);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--red-deep);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            letter-spacing: 0.03em;
            position: relative;
            z-index: 2;
            width: 100%;
        }
        .mindmap-branch-node:hover {
            background: #FFE8E8;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .mindmap-branch-node.expanded {
            background: #FFE0E0;
            border-color: var(--red-main);
        }
        .mindmap-sub-connector {
            width: 2px;
            height: 14px;
            background: #e0c8c8;
            border-radius: 1px;
        }
        .mindmap-sub-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
            width: 100%;
            padding-top: 2px;
        }
        .mindmap-sub-item {
            background: #fff;
            border: 1px solid #e8d5d5;
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 0.75rem;
            color: var(--text-light);
            text-align: center;
            cursor: default;
            transition: var(--transition);
            letter-spacing: 0.02em;
            width: 90%;
        }
        .mindmap-sub-item:hover {
            background: #FFFBFB;
            border-color: var(--red-light);
            color: var(--red-deep);
        }
        .mindmap-sub-item.key-event {
            border-color: var(--gold);
            background: #FFFDF6;
            font-weight: 600;
            color: #6B4E16;
        }

        /* ============ 高考真题面板 ============ */
        .exam-container {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
        }
        .exam-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 24px 26px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: var(--transition);
            cursor: default;
        }
        .exam-card:hover {
            box-shadow: var(--shadow-md);
        }
        .exam-card .exam-type {
            display: inline-block;
            background: var(--red-main);
            color: #fff;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .exam-card .exam-question {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 12px;
            line-height: 1.6;
            color: var(--text);
        }
        .exam-card .options {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }
        .exam-card .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            border: 1.5px solid #e8e0d8;
            border-radius: 10px;
            background: #fdfaf6;
            cursor: pointer;
            font-size: 0.88rem;
            transition: var(--transition);
            color: var(--text-light);
            font-family: var(--font-body);
            letter-spacing: 0.02em;
        }
        .exam-card .option-btn:hover {
            border-color: var(--gold);
            background: #FFFDF8;
        }
        .exam-card .option-btn.correct {
            border-color: #4CAF50 !important;
            background: #E8F5E9 !important;
            color: #2E7D32 !important;
            font-weight: 700;
        }
        .exam-card .option-btn.wrong {
            border-color: #F44336 !important;
            background: #FFEBEE !important;
            color: #C62828 !important;
        }
        .exam-card .option-btn:disabled {
            pointer-events: none;
            opacity: 0.85;
        }
        .exam-answer-reveal {
            margin-top: 12px;
            padding: 14px 16px;
            background: #F9FDF6;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
            display: none;
            animation: fadeSlideIn 0.35s ease;
        }
        .exam-answer-reveal.show {
            display: block;
        }
        .exam-answer-reveal .correct-answer {
            font-weight: 700;
            color: #2E7D32;
            font-size: 0.9rem;
        }
        .exam-answer-reveal .analysis {
            font-size: 0.82rem;
            color: #555;
            margin-top: 6px;
            line-height: 1.6;
        }

        /* ============ 页脚 ============ */
        .footer-note {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-lighter);
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            opacity: 0.7;
        }

        /* ============ 响应式 ============ */
        @media (max-width: 900px) {
            .timeline-layout {
                flex-direction: column;
            }
            .timeline-scroll-area {
                flex: 0 0 auto;
                max-height: 50vh;
                position: relative;
                top: auto;
                width: 100%;
                padding-right: 0;
            }
            .detail-panel {
                position: relative;
                top: auto;
                max-height: none;
                width: 100%;
            }
            .exam-container {
                grid-template-columns: 1fr;
            }
            .mindmap-tree {
                min-width: 600px;
                transform: scale(0.85);
                transform-origin: top center;
            }
            .hero-banner h1 {
                font-size: 1.5rem;
            }
            .tab-nav {
                flex-wrap: wrap;
                gap: 3px;
                margin: -20px 8px 20px;
                border-radius: var(--radius-sm);
            }
            .tab-nav button {
                font-size: 0.8rem;
                padding: 10px 10px;
                border-radius: 12px;
            }
            .mindmap-branch-col {
                min-width: 90px;
                max-width: 140px;
            }
            .mindmap-branch-node {
                font-size: 0.72rem;
                padding: 8px 8px;
            }
            .mindmap-sub-item {
                font-size: 0.68rem;
                padding: 5px 8px;
            }
        }
        @media (max-width: 500px) {
            .timeline-scroll-area {
                max-height: 40vh;
            }
            .detail-panel {
                padding: 16px;
            }
            .exam-card {
                padding: 16px;
            }
            .mindmap-tree {
                min-width: 500px;
                transform: scale(0.7);
                transform-origin: top left;
            }
            .hero-banner {
                padding: 24px 14px 28px;
            }
            .hero-banner h1 {
                font-size: 1.3rem;
            }
            .tab-nav button {
                font-size: 0.72rem;
                padding: 8px 6px;
                border-radius: 10px;
            }
            .tab-nav .tab-emoji {
                margin-right: 1px;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== 顶部横幅 ==================== -->
    <header class="hero-banner">
        <span class="hero-icon">🚩</span>
        <h1>中国共产党的发展历程</h1>
        <p class="subtitle">1921 — 1949 · 从诞生到新中国成立</p>
        <div class="badge-row">
            <span class="badge">📚 高中历史核心考点</span>
            <span class="badge">🎯 高考真题精练</span>
            <span class="badge">🗺️ 思维导图梳理</span>
        </div>
    </header>

    <!-- ==================== 主容器 ==================== -->
    <div class="main-container">

        <!-- Tab导航 -->
        <nav class="tab-nav" role="tablist">
            <button class="active" data-tab="timeline" role="tab" aria-selected="true">
                <span class="tab-emoji">📅</span> 历史时间线
            </button>
            <button data-tab="mindmap" role="tab" aria-selected="false">
                <span class="tab-emoji">🗺️</span> 思维导图
            </button>
            <button data-tab="exam" role="tab" aria-selected="false">
                <span class="tab-emoji">📝</span> 高考真题
            </button>
        </nav>

        <!-- ========== Tab1: 历史时间线 ========== -->
        <div class="tab-panel active" id="tab-timeline">
            <div class="timeline-layout">
                <!-- 左侧时间线列表 -->
                <div class="timeline-scroll-area">
                    <div class="timeline-list" id="timelineList">
                        <!-- JS动态生成 -->
                    </div>
                </div>
                <!-- 右侧详情面板 -->
                <div class="detail-panel" id="detailPanel">
                    <span class="placeholder-icon">👆</span>
                    <p class="placeholder-text">点击左侧时间线上的事件<br>查看详细内容与考点分析</p>
                </div>
            </div>
        </div>

        <!-- ========== Tab2: 思维导图 ========== -->
        <div class="tab-panel" id="tab-mindmap">
            <div class="mindmap-container">
                <p class="mindmap-title">🧠 中国共产党发展脉络 · 思维导图</p>
                <div class="mindmap-tree" id="mindmapTree">
                    <!-- JS动态生成 -->
                </div>
                <p style="text-align:center;margin-top:16px;font-size:0.8rem;color:#999;">💡 点击各阶段节点可展开/折叠子节点</p>
            </div>
        </div>

                question: '1927年毛泽东领导秋收起义后，建立的第一个农村革命根据地是（　）',
                options: [
                    'A. 中央革命根据地',
                    'B. 井冈山革命根据地',
                    'C. 鄂豫皖革命根据地',
                    'D. 陕甘宁革命根据地'
                ],
                correctIndex: 1,
                analysis: '秋收起义受挫后，毛泽东果断转向农村，于1927年10月创建了井冈山革命根据地，这是中国第一个农村革命根据地，点燃了"工农武装割据"的星星之火。中央革命根据地是后来发展形成的。'
            }, {
                id: 'q3',
                type: '选择题',
                question: '下列关于红军长征的表述，正确的是（　）',
                options: [
                    'A. 长征的起因是第五次反"围剿"的失败',
                    'B. 遵义会议是长征途中召开的重要会议',
                    'C. 长征的胜利粉碎了国民党扼杀中国革命的企图',
                    'D. 以上都对'
                ],
                correctIndex: 3,
                analysis: 'A、B、C三项表述均正确。第五次反"围剿"失败导致长征；遵义会议在长征途中召开；长征胜利使中国革命转危为安。因此D项"以上都对"是正确答案。'
            }, {
                id: 'q4',
                type: '选择题',
                question: '中共七大的重大历史意义在于（　）',
                options: [
                    'A. 确定了建立抗日民族统一战线的方针',
                    'B. 确立毛泽东思想为党的指导思想',
                    'C. 决定发动三大战役',
                    'D. 确定了武装反抗国民党反动统治的总方针'
                ],
                correctIndex: 1,
                analysis: '中共七大（1945年）最重要的成果是确立毛泽东思想为党的指导思想。A项是瓦窑堡会议；D项是八七会议；C项是解放战争时期的决策。七大标志着党在思想上、政治上、组织上空前团结和成熟。'
            }, {
                id: 'q5',
                type: '简答题',
                question: '简述井冈山革命根据地建立的历史意义。',
                options: [],
                correctIndex: -1,
                isShortAnswer: true,
                analysis: '【参考答案要点】\n①井冈山革命根据地是中国第一个农村革命根据地，点燃了"工农武装割据"的星星之火。\n②开创了农村包围城市、武装夺取政权的正确革命道路（井冈山道路）。\n③是马克思主义基本原理同中国革命具体实践相结合的典范。\n④为其他革命根据地的建立提供了宝贵经验，推动了中国革命的发展。\n【记忆口诀】"星星之火，可以燎原；农村包围城市，武装夺取政权。"'
            }];

            // ==================== DOM引用 ====================
            const tabButtons = document.querySelectorAll('.tab-nav button');
            const tabPanels = document.querySelectorAll('.tab-panel');
            const timelineList = document.getElementById('timelineList');
            const detailPanel = document.getElementById('detailPanel');
            const mindmapTree = document.getElementById('mindmapTree');
            const examContainer = document.getElementById('examContainer');

            // ==================== Tab切换 ====================
            tabButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetTab = btn.getAttribute('data-tab');
                    tabButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    tabPanels.forEach(p => p.classList.remove('active'));
                    document.getElementById('tab-' + targetTab).classList.add('active');
                    // 更新aria
                    tabButtons.forEach(b => b.setAttribute('aria-selected', 'false'));
                    btn.setAttribute('aria-selected', 'true');
                });
            });

            // ==================== 渲染时间线 ====================
            function renderTimeline() {
                timelineList.innerHTML = '';
                timelineData.forEach((event, index) => {
                    const node = document.createElement('div');
                    node.className = 'timeline-node';
                    node.setAttribute('data-event-id', event.id);
                    node.innerHTML = `
                        <div class="node-year">${event.year}</div>
                        <div class="node-title">${event.title}</div>
                        <div class="node-brief">${event.brief}</div>
                    `;
                    node.addEventListener('click', () => {
                        document.querySelectorAll('.timeline-node').forEach(n => n.classList
                            .remove('selected'));
                        node.classList.add('selected');
                        showDetail(event);
                        // 移动端滚动到详情面板
                        if (window.innerWidth <= 900) {
                            detailPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                    timelineList.appendChild(node);
                });
                // 默认选中第一个
                if (timelineData.length > 0) {
                    const firstNode = timelineList.querySelector('.timeline-node');
                    firstNode.classList.add('selected');
                    showDetail(timelineData[0]);
                }
            }

            function showDetail(event) {
                detailPanel.innerHTML = `
                    <div class="detail-title">${event.title}</div>
                    <div class="detail-date">📅 ${event.dateDisplay}</div>
                    <div class="detail-section">
                        <h4>📋 历史背景</h4>
                        <p>${event.background}</p>
                    </div>
                    <div class="detail-section">
                        <h4>📖 事件详情</h4>
                        <p>${event.detail}</p>
                    </div>
                    <div class="detail-section">
                        <h4><span class="difficulty-badge">⚠️ 困难</span></h4>
                        <p>${event.difficulty}</p>
                    </div>
                    <div class="detail-section">
                        <h4><span class="solution-badge">✅ 解决方式</span></h4>
                        <p>${event.solution}</p>
                    </div>
                    <div class="highlight-box">
                        <strong>💡 历史意义 / 考点提示：</strong><br>${event.significance}
                    </div>
                    <div class="detail-section" style="margin-top:10px;">
                        <h4>🏷️ 关键词</h4>
                        <p>${event.keywords.map(k => '<span style="display:inline-block;background:#f0e8e8;color:#8B1A2B;padding:3px 10px;border-radius:14px;margin:3px 4px;font-size:0.8rem;">' + k + '</span>').join('')}</p>
                    </div>
                `;
            }

            // ==================== 渲染思维导图 ====================
            function renderMindmap() {
                let html = '';
                // 根节点
                html += '<div class="mindmap-root">' + mindmapData.root.replace('\n', '<br>') + '</div>';
                html += '<div class="mindmap-connector-vertical"></div>';
                // 水平连接线行
                html += '<div class="mindmap-branches-row" style="align-items:flex-start;">';
                mindmapData.branches.forEach((branch, bi) => {
                    if (bi > 0) {
                        html += '<div class="mindmap-connector-horizontal" style="max-width:20px;"></div>';
                    }
                    html += '<div class="mindmap-branch-col" data-branch-index="' + bi + '">';
                    html += '<div class="mindmap-branch-node" data-branch="' + bi + '">' + branch.label
                        .replace('\n', '<br>') + '</div>';
                    html += '<div class="mindmap-sub-connector"></div>';
                    html += '<div class="mindmap-sub-items" data-branch-subs="' + bi + '" style="display:flex;">';
                    branch.subs.forEach(sub => {
                        const cls = sub.isKey ? 'mindmap-sub-item key-event' : 'mindmap-sub-item';
                        html += '<div class="' + cls + '">' + sub.text + '</div>';
                    });
                    html += '</div>';
                    html += '</div>';
                });
                html += '</div>';
                mindmapTree.innerHTML = html;

                // 点击分支节点展开/折叠
                mindmapTree.querySelectorAll('.mindmap-branch-node').forEach(node => {
                    node.addEventListener('click', function() {
                        const bi = this.getAttribute('data-branch');
                        const subsContainer = mindmapTree.querySelector(
                            '[data-branch-subs="' + bi + '"]');
                        const connector = this.parentElement.querySelector('.mindmap-sub-connector');
                        if (subsContainer.style.display === 'none') {
                            subsContainer.style.display = 'flex';
                            if (connector) connector.style.display = '';
                            this.classList.add('expanded');
                        } else {
                            subsContainer.style.display = 'none';
                            if (connector) connector.style.display = 'none';
                            this.classList.remove('expanded');
                        }
                    });
                });
                // 默认全部展开
                mindmapTree.querySelectorAll('.mindmap-branch-node').forEach(n => n.classList.add('expanded'));
            }

            // ==================== 渲染高考真题 ====================
            function renderExam() {
                examContainer.innerHTML = '';
                examData.forEach((q, qIndex) => {
                    const card = document.createElement('div');
                    card.className = 'exam-card';
                    card.setAttribute('data-exam-id', q.id);

                    let optionsHTML = '';
                    if (!q.isShortAnswer && q.options.length > 0) {
                        optionsHTML = '<div class="options">';
                        q.options.forEach((opt, oi) => {
                            optionsHTML +=
                                '<button class="option-btn" data-q="' + qIndex + '" data-o="' + oi +
                                '">' + opt + '</button>';
                        });
                        optionsHTML += '</div>';
                    }

                    card.innerHTML = `
                        <span class="exam-type">${q.type}</span>
                        <div class="exam-question">${q.question}</div>
                        ${optionsHTML}
                        <div class="exam-answer-reveal" id="answerReveal-${qIndex}">
                            ${q.isShortAnswer ? '' : '<div class="correct-answer">✅ 正确答案：' + q.options[q.correctIndex].charAt(0) + '</div>'}
                            <div class="analysis">📝 <strong>解析：</strong>${q.analysis.replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                    examContainer.appendChild(card);
                });

                // 绑定选项点击事件
                examContainer.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const qIndex = parseInt(this.getAttribute('data-q'));
                        const oIndex = parseInt(this.getAttribute('data-o'));
                        const qData = examData[qIndex];
                        const cardEl = examContainer.querySelector('[data-exam-id="' + qData
                            .id + '"]');
                        const allBtns = cardEl.querySelectorAll('.option-btn');
                        const revealEl = document.getElementById('answerReveal-' + qIndex);

                        // 禁用所有按钮
                        allBtns.forEach(b => b.disabled = true);

                        // 标记正确和错误
                        allBtns.forEach((b, i) => {
                            if (i === qData.correctIndex) {
                                b.classList.add('correct');
                            }
                        });
                        if (oIndex !== qData.correctIndex) {
                            this.classList.add('wrong');
                        }

                        // 显示解析
                        revealEl.classList.add('show');
                        revealEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    });
                });

                // 简答题：直接显示解析
                examData.forEach((q, qi) => {
                    if (q.isShortAnswer) {
                        const revealEl = document.getElementById('answerReveal-' + qi);
                        if (revealEl) {
                            revealEl.classList.add('show');
                        }
                    }
                });
            }

            // ==================== 初始化 ====================
            function init() {
                renderTimeline();
                renderMindmap();
                renderExam();
            }

            init();

            console.log('✅ 中国共产党发展历程交互学习页面已就绪');
            console.log('📅 时间线：' + timelineData.length + '个关键节点');
            console.log('🗺️ 思维导图：' + mindmapData.branches.length + '个主要分支');
            console.log('📝 高考真题：' + examData.length + '道题目');
            console.log('💡 点击左侧时间线查看详情 | 切换到思维导图Tab查看知识框架 | 切换到高考真题Tab练习');
        })();
    </script>
</body>
</html>
