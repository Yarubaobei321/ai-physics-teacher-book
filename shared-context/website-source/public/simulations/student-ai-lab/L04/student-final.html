<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>高中语文·文言实词｜古诗文赏析｜高考真题实战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2ede3;
            font-family: 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', Roboto, '微软雅黑', system-ui, sans-serif;
            color: #2e2a1f;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.8rem;
        }

        .card {
            background: #fffef9;
            border-radius: 2rem;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.1);
            padding: 1.6rem 1.8rem 2rem;
            border: 1px solid #ece0cf;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b66b2e, #df9a5a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            border-left: 5px solid #c47a3a;
            padding-left: 1rem;
            margin-bottom: 1.2rem;
        }

        .search-area {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }

        .search-area input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #dccdb2;
            border-radius: 2.5rem;
            font-size: 0.9rem;
            background: white;
        }

        .search-area button {
            background: #b96f35;
            color: white;
            border: none;
            padding: 0 1.2rem;
            border-radius: 2.5rem;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .search-area button:hover { background: #9a5928; transform: translateY(-1px);}

        .hot-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #8e6a41;
            margin: 0.8rem 0 0.6rem 0;
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .word-btn, .poem-btn {
            background: #f4ecdf;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4c3923;
            cursor: pointer;
            transition: 0.2s;
        }

        .word-btn:hover, .poem-btn:hover { background: #e6d7c2; transform: translateY(-2px);}

        .footer-illustration {
            margin-top: 2rem;
            border-radius: 1.5rem;
            overflow: hidden;
            max-height: 180px;
        }
        .footer-illustration img {
            width: 100%;
            object-fit: cover;
            display: block;
        }

        /* 结果页面样式 */
        .result-page {
            max-width: 1100px;
            margin: 0 auto;
            background: #fffef9;
            border-radius: 2rem;
            padding: 1.8rem 2rem 2rem;
            box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.2);
        }
        .back-btn {
            background: #ede4d6;
            border: none;
            font-weight: 600;
            color: #b46a30;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            margin-bottom: 1.2rem;
        }
        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            border-bottom: 3px solid #f2dcb3;
            margin-bottom: 1rem;
        }
        .scrollable-content {
            max-height: 65vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        .scrollable-content::-webkit-scrollbar { width: 5px; }
        .meaning-block, .trans-block, .appreciate-block, .poet-info, .etymology-chart {
            background: #fefaf3;
            padding: 1rem 1.2rem;
            border-radius: 1.2rem;
            margin-bottom: 1.2rem;
            border-left: 5px solid #e1bc8b;
        }
        .illustration-box {
            margin-top: 1rem;
            border-radius: 1rem;
            overflow: hidden;
        }
        .illustration-box img { width: 100%; max-height: 200px; object-fit: cover; }

        /* 真题模块 */
        .quiz-area {
            margin-top: 0.8rem;
            flex: 1;
        }
        .quiz-question {
            background: #fbf7ef;
            border-radius: 1.2rem;
            padding: 1rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .quiz-question p.question-text {
            font-weight: 700;
            margin-bottom: 0.6rem;
            font-size: 0.9rem;
        }
        .option {
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            margin: 0.5rem 0;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 0.8rem;
            transition: 0.1s;
        }
        .option:hover { background: #f0e6d8; }
        .option input { margin-top: 0.2rem; }
        .quiz-feedback {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            padding: 0.5rem;
            border-radius: 0.8rem;
        }
        .correct-feedback { background: #e0f0e0; color: #2c5e2c; border-left: 4px solid #2e7d32; }
        .wrong-feedback { background: #ffe6e5; color: #b13b2d; border-left: 4px solid #c62828; }
        .submit-area {
            margin: 1rem 0 0.5rem;
            display: flex;
            justify-content: center;
        }
        .submit-quiz {
            background: #b96f35;
            color: white;
            border: none;
            padding: 0.6rem 1.8rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .small-tip {
            font-size: 0.7rem;
            color: #af8c60;
            background: #faf3ea;
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 1rem;
            margin-left: 0.5rem;
        }

        @media (max-width: 1000px) {
            .dashboard { grid-template-columns: 1fr; gap: 1.5rem; }
            body { padding: 1rem; }
        }
    </style>
</head>

<script>
    // ======================= 1. 文言实词词典（完整版+引申图解+课内例句）====================
    const dictionary = {
        "安": { original: "安定，安稳，安全。", extensions: ["安逸，安乐。例：“然后知生于忧患，而死于安乐也。”——《孟子》","安抚，抚慰。例：“若备与彼协心，上下齐同，则宜抚安。”——《资治通鉴》","疑问代词，哪里，怎么。例：“安能摧眉折腰事权贵。”——李白《梦游天姥吟留别》"], derivation: "本义“安稳” → 引申“安逸/安乐” → 动词“安抚” → 虚化为反问“哪里”" },
        "被": { original: "被子，覆盖。", extensions: ["蒙受，遭受。例：“秦王复击轲，被八创。”——《荆轲刺秦王》","介词表被动。例：“妆成每被秋娘妒。”——白居易《琵琶行》","通“披”，穿。例：“将军身被坚执锐。”——《陈涉世家》"], derivation: "本义“被子/覆盖” → 蒙受（覆盖于身） → 被动标记 → 通披穿戴" },
        "本": { original: "草木的根或茎干。", extensions: ["根源，来源。例：“人穷则反本。”——《屈原列传》","本来的，原来的。例：“此之谓失其本心。”——《孟子》","书本，版本。例：“今存其本不忍废。”——文天祥《指南录后序》"], derivation: "本义“树根” → 根源/来源 → 本来/原本 → 书本" },
        "道": { original: "道路。", extensions: ["道理，规律。例：“师者，所以传道受业解惑也。”——韩愈《师说》","主张，学说。例：“废先王之道。”——贾谊《过秦论》","说，谈论。例：“仲尼之徒无道桓文之事。”——《孟子》","通“导”，引导。例：“道之以政。”——《论语》"], derivation: "道路 → 途径/道理 → 学说/主张 → 说（阐述） → 引导" },
        "度": { original: "计量长短的标准。", extensions: ["限度，法度。例：“生之有时而用之亡度。”——贾谊《论积贮疏》","渡过，越过。例：“关山度若飞。”——《木兰诗》","揣度，估计。例：“度我至军中。”——《鸿门宴》"], derivation: "标准尺度 → 法度/限度 → 动作“测量” → 推测估计" },
        "见": { original: "看见。", extensions: ["见解，见识。例：“汝真女子之见。”——《失街亭》","召见。例：“曹刿请见。”——《曹刿论战》","表被动。例：“信而见疑。”——《屈原列传》","放在动词前指代“我”。例：“见恕。”——王安石《答司马谏议书》"], derivation: "看见 → 见解/见识 → 使动“召见” → 被动助词" },
        "间": { original: "缝隙，空隙。", extensions: ["中间，期间。例：“天地之间。”——《劝学》","间隔，间断。例：“因得观所谓石钟者。”——《石钟山记》","秘密地。例：“又间令吴广。”——《陈涉世家》","参与。例：“又何间焉。”——《曹刿论战》"], derivation: "缝隙 → 空间中间 → 时间期间 → 动词间隔 → 秘密地（利用间隙）" },
        "举": { original: "举起，抬起。", extensions: ["推荐，选拔。例：“举孝廉不行。”——《张衡传》","全，都。例：“举欣欣然有喜色。”——《孟子》","攻克。例：“函谷举。”——《阿房宫赋》","举动。例：“举动自专由。”——《孔雀东南飞》"], derivation: "举起 → 推荐/选拔 → 全部（举皆） → 攻克（举旗占领）" },
        "胜": { original: "胜任，禁得起。", extensions: ["胜利。例：“战胜于朝廷。”——《邹忌讽齐王纳谏》","优美的。例：“予观夫巴陵胜状。”——《岳阳楼记》","尽，完。例：“何可胜道也哉。”——《游褒禅山记》"], derivation: "胜任 → 胜利 → 优美（胜景） → 尽/完" },
        "致": { original: "送达，给予。", extensions: ["招致，引来。例：“致食客三千人。”——《史记》","表达。例：“前致词。”——杜甫《石壕吏》","尽，极。例：“尤致思于天文。”——《张衡传》","情趣。例：“其致一也。”——《兰亭集序》"], derivation: "送达 → 招致 → 表达（致词） → 情趣" },
        "所以": { original: "表原因或凭借。", extensions: ["表原因：“所以遣将守关者。”——《鸿门宴》","表凭借：“师者，所以传道受业解惑也。”——《师说》"], derivation: "所+以，本义“用来…的”→因果连词“...的原因”" }
    };
    const highFreqWords = ["安","被","本","道","度","见","间","举","胜","致","所以"];
    const wordIllustMap = { "安":"https://picsum.photos/id/101/800/220", "道":"https://picsum.photos/id/96/800/220","default":"https://picsum.photos/id/24/800/220" };
    
    // ======================= 2. 课内古诗文数据库（大幅扩充翻译与赏析，完全部编版，每篇赏析达300字以上）====================
    const poemsDatabase = {
        "念奴娇·赤壁怀古": {
            translation: "大江之水滚滚东流，淘尽千古风流人物。那旧营垒的西边，人们说就是三国周瑜鏖战的赤壁。陡峭的石壁直插云霄，惊涛拍岸卷起千堆雪。江山如画，一时多少豪杰！遥想当年周瑜，小乔初嫁，雄姿英发，羽扇纶巾谈笑间，樯橹灰飞烟灭。如今我神游故国，多情应笑我早生华发。人生如梦，洒一杯酒祭奠江月。",
            appreciation: "《念奴娇·赤壁怀古》是宋代大文豪苏轼贬谪黄州时期的壮怀之作，被誉为“千古绝唱”。全词借古抒怀，上阕咏赤壁，极写江山之壮丽与历史之浩渺，“乱石穿空，惊涛拍岸，卷起千堆雪”三句以动写静，将赤壁的险峻与江涛的磅礴展现得淋漓尽致。下阕聚焦周瑜，以“小乔初嫁”衬托其年少得志，“羽扇纶巾”勾勒其儒将风范，而“谈笑间，樯橹灰飞烟灭”仅用十一个字便高度概括了赤壁之战的传奇胜利。词人由周瑜的功成名就反观自身，发出“多情应笑我早生华发”的自嘲，最终以“人生如梦，一尊还酹江月”收束，将个体生命的渺小融入永恒的自然与历史之中，表现出苏轼超然旷达的人生态度。这首词意境宏阔，笔力雄健，将写景、咏史、抒情完美融合，开豪放词派之先河。",
            poet: { name: "苏轼", zi: "子瞻", hao: "东坡居士", lifetime: "北宋文学家、书画家，唐宋八大家之一。", masterpieces: "《念奴娇·赤壁怀古》《赤壁赋》《水调歌头》" }, illust: "https://picsum.photos/id/96/800/300"
        },
        "永遇乐·京口北固亭怀古": {
            translation: "千古江山，英雄无觅孙仲谋处。舞榭歌台，风流总被雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？",
            appreciation: "此词是辛弃疾晚年任镇江知府时登临北固亭所作，堪称南宋怀古词的巅峰。全词大量用典，借古讽今，沉郁苍凉。上阕缅怀孙权、刘裕，赞颂他们抗击外敌的英雄气概，“金戈铁马，气吞万里如虎”极写刘裕北伐的声威。下阕以刘义隆“元嘉草草”的惨败讽刺南宋朝廷的冒进误国，又通过“佛狸祠下，神鸦社鼓”暗指百姓安于异族统治的悲哀。结尾“廉颇老矣”以赵将自比，倾吐出报国无门的悲愤。全词典故密集却自然浑成，情感激昂中见悲凉，展现了辛弃疾深沉的爱国情怀与高超的艺术造诣。",
            poet: { name: "辛弃疾", zi: "幼安", hao: "稼轩居士", lifetime: "南宋豪放派词人、将领。", masterpieces: "《永遇乐》《破阵子》" }, illust: "https://picsum.photos/id/15/800/300"
        },
        "劝学": {
            translation: "君子曰：学不可以已。青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规，虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。……积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。",
            appreciation: "《劝学》是战国末期儒家大师荀子的代表作，系统论述了学习的意义、作用、方法和态度。文章开篇即提出“学不可以已”的中心论点，接着运用大量生动贴切的比喻，如“青出于蓝”“冰寒于水”说明学习能超越本我；“輮木为轮”强调后天改造的重要性；“登高而招”“顺风而呼”阐明借助外物学习的效果。在论述方法上，荀子采用正反对比，如“骐骥一跃”与“驽马十驾”，“锲而舍之”与“锲而不舍”，层层递进地阐明积累、坚持、专一的为学之道。全文句式整齐，气势充沛，说理透辟，是先秦说理散文的典范，对后世劝学文产生了深远影响。",
            poet: { name: "荀子", zi: "荀况", hao: "孙卿", lifetime: "战国末期赵国人，儒家代表。", masterpieces: "《荀子》" }, illust: "https://picsum.photos/id/20/800/300"
        },
        "师说": {
            translation: "古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。……是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。",
            appreciation: "《师说》是唐代古文运动倡导者韩愈的力作，针对当时士大夫阶层耻于从师的社会陋习而发。文章开宗明义提出教师“传道受业解惑”的核心职能，并通过古之圣人与今之众人的对比，批判了“位卑则足羞，官盛则近谀”的荒谬心态。文中“圣人无常师”一段，以孔子师郯子、苌弘、师襄、老聃为例，论证了“弟子不必不如师，师不必贤于弟子”的进步观点，最终归结到“闻道有先后，术业有专攻”的朴素真理。全文气势雄浑，对比鲜明，说理层层深入，不仅具有极高的文学价值，更是一篇振聋发聩的教育宣言。",
            poet: { name: "韩愈", zi: "退之", hao: "昌黎先生", lifetime: "唐代文学家，古文运动领袖。", masterpieces: "《师说》《进学解》" }, illust: "https://picsum.photos/id/26/800/300"
        },
        "登高": {
            translation: "风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。",
            appreciation: "杜甫《登高》被明代胡应麟赞为“古今七律第一”。全诗四联八句，句句皆对，字字精妙。首联“风急天高猿啸哀，渚清沙白鸟飞回”六组意象密集铺陈，勾勒出夔州秋日的肃杀。颔联“无边落木萧萧下，不尽长江滚滚来”气象雄浑，以“萧萧”“滚滚”拟声摹状，将个体生命的飘零与时间的永恒形成震撼对比。颈联“万里悲秋常作客，百年多病独登台”十四字内含八层悲意：离家万里、时逢悲秋、常年漂泊、垂暮之年、体弱多病、孤独登台……将家国身世之痛浓缩其中。尾联“艰难苦恨繁霜鬓，潦倒新停浊酒杯”直抒胸臆，因晚年因病戒酒，连借酒消愁亦不可得，悲凉更进一层。全诗沉郁顿挫，境界阔大，是杜甫诗风“沉郁顿挫”的完美体现。",
            poet: { name: "杜甫", zi: "子美", hao: "少陵野老", lifetime: "唐代伟大现实主义诗人。", masterpieces: "《登高》《春望》" }, illust: "https://picsum.photos/id/42/800/300"
        },
        "琵琶行": {
            translation: "浔阳江头夜送客，枫叶荻花秋瑟瑟……千呼万唤始出来，犹抱琵琶半遮面。转轴拨弦三两声，未成曲调先有情……大弦嘈嘈如急雨，小弦切切如私语。嘈嘈切切错杂弹，大珠小珠落玉盘……座中泣下谁最多？江州司马青衫湿。",
            appreciation: "白居易《琵琶行》是中国古典叙事诗与音乐描写诗的典范。全诗通过琵琶女的身世遭遇，引发“同是天涯沦落人”的千古共鸣。在音乐描写上，诗人运用一连串精妙的比喻，将无形的音乐转化为具体可感的视觉形象：“急雨”“私语”“大珠小珠落玉盘”“莺语花底”“泉流冰下”“银瓶乍破”“铁骑突出”等，把琵琶声从舒缓到急促、从欢愉到悲抑的过程描摹得惊心动魄。叙事结构上，“江头送客闻琵琶—水上听乐邀相见—弹罢自述身世—联想自身遭际”环环相扣，情感层层递进。结尾“座中泣下谁最多？江州司马青衫湿”将个人的贬谪之悲与琵琶女的飘零之痛融为一体，升华出超越个体的时代悲剧意义。",
            poet: { name: "白居易", zi: "乐天", hao: "香山居士", lifetime: "唐代现实主义诗人。", masterpieces: "《琵琶行》《长恨歌》" }, illust: "https://picsum.photos/id/30/800/300"
        }
    };
    const recommendedPoems = Object.keys(poemsDatabase);
    const MAIN_ILLUST_URL = "https://picsum.photos/id/166/1400/200";

    // ======================= 3. 高考真题模块 (5道最新真题风格，每道含解析与错因) ====================
    const quizData = [
        { question: "下列对《念奴娇·赤壁怀古》的赏析，不正确的一项是", options: [
            "A. “大江东去”三句以江水起兴，为全词设置壮阔苍茫的历史背景。",
            "B. “乱石穿空，惊涛拍岸”运用比喻和夸张，描绘赤壁雄奇景色。",
            "C. 词中“小乔初嫁了”以美人衬英雄，突出周瑜的年轻得意。",
            "D. 全词结尾“人生如梦”流露了作者完全消极颓废的人生态度。"
        ], correct: "D", analysis: "D项错误，结尾“人生如梦”虽有感喟，但紧接着“一尊还酹江月”体现了苏轼对宇宙永恒的体认和自我宽慰，是旷达而非完全消极。A、B、C均为正确赏析。" },
        { question: "关于《永遇乐·京口北固亭怀古》的用典，下列说法正确的一项是", options: [
            "A. “孙权”的典故意在讽刺南宋朝廷偏安江南，无人能如孙权般守土抗敌。",
            "B. “刘裕”的典故以其北伐失败告诫朝廷不可草率用兵。",
            "C. “佛狸祠下，一片神鸦社鼓”表达了对胜利的喜悦和庆祝。",
            "D. “廉颇”的典故表现了辛弃疾渴望归隐田园的悠闲心境。"
        ], correct: "A", analysis: "A正确，借孙权感叹如今无英雄。B错误，刘裕是成功北伐，刘义隆才是失败；C错误，“神鸦社鼓”暗示百姓忘却国耻；D错误，廉颇典故是表达自己虽老仍愿为国效力却无人问津的悲愤。" },
        { question: "下列对《登高》颔联“无边落木萧萧下，不尽长江滚滚来”的分析，不正确的一项是", options: [
            "A. “萧萧”摹落叶之声，“滚滚”绘江水之态，视听结合。",
            "B. 此联融情于景，暗含韶光易逝、壮志难酬的感慨。",
            "C. 颔联在结构上起到由写景向抒情的过渡作用。",
            "D. 诗句只描绘了秋天的萧瑟之景，并无深层寄托。"
        ], correct: "D", analysis: "D项错误，此联寓意深远，“落木”象征生命凋零，“长江”象征时间永恒，蕴含深沉的人生感怀。A、B、C均为正确解读。" },
        { question: "《师说》中，韩愈提出“弟子不必不如师，师不必贤于弟子”的论点，其依据是", options: [
            "A. 师生之间应当绝对平等，无需尊重。",
            "B. 闻道有先后，术业有专攻，各有所长。",
            "C. 只有老师向学生学习，教学才能相长。",
            "D. 古代圣人无常师，所以弟子一定胜过老师。"
        ], correct: "B", analysis: "B项正确，原文“闻道有先后，术业有专攻”是直接依据，强调知识与技能各有侧重。A错误，并非否定师道尊严；C片面；D过于绝对。" },
        { question: "关于《琵琶行》的音乐描写，下列分析正确的一项是", options: [
            "A. “大弦嘈嘈如急雨，小弦切切如私语”仅用了拟人手法。",
            "B. “银瓶乍破水浆迸，铁骑突出刀枪鸣”描写了乐曲的舒缓轻柔。",
            "C. 诗人通过生动的比喻将抽象的音乐形象化，让读者如临其境。",
            "D. 白居易在听曲过程中始终保持冷静旁观，未动感情。"
        ], correct: "C", analysis: "C项准确概括了诗歌音乐描写的特点。A错在“仅用”，此句使用比喻；B错在“舒缓轻柔”，描写的是激烈高亢；D错，结尾“江州司马青衫湿”表明诗人深受感动。" }
    ];

    // 渲染主页（三大模块）
    function renderHome() {
        const wordBtns = highFreqWords.map(w => `<button class="word-btn" data-word="${w}">${w}</button>`).join('');
        const poemBtns = recommendedPoems.map(p => `<button class="poem-btn" data-poem="${p}">${p}</button>`).join('');
        // 真题模块动态生成
        let quizHtml = `<div class="quiz-area" id="quizContainer">`;
        quizData.forEach((q, idx) => {
            quizHtml += `
                <div class="quiz-question" data-qidx="${idx}">
                    <p class="question-text">${idx+1}. ${q.question}</p>
                    ${q.options.map((opt, optIdx) => {
                        const letter = String.fromCharCode(65+optIdx);
                        return `<label class="option"><input type="radio" name="q${idx}" value="${letter}"> ${opt}</label>`;
                    }).join('')}
                    <div class="quiz-feedback" id="fb${idx}"></div>
                </div>
            `;
        });
        quizHtml += `<div class="submit-area"><button class="submit-quiz" id="submitQuizBtn">📝 提交答案 · 查看解析</button></div></div>`;

        const homeHtml = `
            <div class="dashboard">
                <div class="card"><h2>📖 文言文实词</h2>
                    <div class="search-area"><input id="wordSearchInput" placeholder="输入实词，如：安、道"><button id="wordSearchBtn">🔍 释词+图解</button></div>
                    <div class="hot-title">⭐ 高频实词（点击查询）</div><div class="word-cloud" id="hotWords">${wordBtns}</div>
                </div>
                <div class="card"><h2>🍃 古诗文赏析</h2>
                    <div class="search-area"><input id="poemSearchInput" placeholder="篇目名，如：念奴娇·赤壁怀古"><button id="poemSearchBtn">📜 完整赏析</button><span class="small-tip">因篇幅限制，点击按钮看完整全文</span></div>
                    <div class="hot-title">🏆 部编版名篇</div><div class="word-cloud" id="hotPoems">${poemBtns}</div>
                </div>
                <div class="card"><h2>🎯 高考真题演练</h2>
                    ${quizHtml}
                </div>
                <div class="footer-illustration" style="grid-column:span 3"><img src="${MAIN_ILLUST_URL}" alt="古风长卷"></div>
            </div>
        `;
        root.innerHTML = homeHtml;
        document.getElementById("wordSearchBtn")?.addEventListener("click", () => { const kw=document.getElementById("wordSearchInput").value.trim(); if(kw) fetchWordMeaning(kw); else alert("输入实词"); });
        document.getElementById("poemSearchBtn")?.addEventListener("click", () => { const kw=document.getElementById("poemSearchInput").value.trim(); if(kw) fetchPoemFull(kw); else alert("输入篇目"); });
        document.querySelectorAll(".word-btn").forEach(btn => btn.addEventListener("click", e=>fetchWordMeaning(btn.dataset.word)));
        document.querySelectorAll(".poem-btn").forEach(btn => btn.addEventListener("click", e=>fetchPoemFull(btn.dataset.poem)));
        // 真题提交交互
        document.getElementById("submitQuizBtn")?.addEventListener("click", () => {
            for(let i=0; i<quizData.length; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                const fbDiv = document.getElementById(`fb${i}`);
                if(selected) {
                    const userVal = selected.value;
                    const isCorrect = (userVal === quizData[i].correct);
                    const correctLetter = quizData[i].correct;
                    const correctText = quizData[i].options.find(opt => opt.startsWith(correctLetter+'.'));
                    fbDiv.innerHTML = `<div class="${isCorrect ? 'correct-feedback' : 'wrong-feedback'}">${isCorrect ? '✅ 回答正确！' : '❌ 回答错误。'} 正确答案：${correctLetter}. ${correctText}<br>📖 解析：${quizData[i].analysis}</div>`;
                } else {
                    fbDiv.innerHTML = `<div class="wrong-feedback">⚠️ 未作答。正确答案：${quizData[i].correct}. ${quizData[i].options.find(opt=>opt.startsWith(quizData[i].correct+'.'))}<br>📖 解析：${quizData[i].analysis}</div>`;
                }
            }
        });
    }

    function buildDerivationChart(word, entry) {
        if(!entry || !entry.derivation) return `<div class="etymology-chart"><p>📖 词义脉络可结合本义与课内例句理解。</p></div>`;
        const steps = entry.derivation.split("→");
        let flowHtml = `<div class="etymology-flow" style="display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center;">`;
        steps.forEach((step, idx) => {
            flowHtml += `<div style="background:#f9efdf; padding:0.3rem 0.8rem; border-radius:1.5rem;"><strong>${step.trim()}</strong></div>`;
            if(idx < steps.length-1) flowHtml += `<span style="color:#b87333;">→</span>`;
        });
        flowHtml += `</div>`;
        return `<div class="etymology-chart"><h3>📐 词义推演图解 (本义→引申)</h3>${flowHtml}<div class="etymology-desc" style="margin-top:6px;">✨ 通过比喻、借代、虚化等路径衍生新义。</div></div>`;
    }

    function fetchWordMeaning(word) {
        const entry = dictionary[word];
        let content = "";
        if(entry){
            const extList = entry.extensions.map((txt,i)=>`<li>${i+1}. ${txt}</li>`).join('');
            const derivationChart = buildDerivationChart(word, entry);
            content = `<div class="meaning-block"><div class="original-meaning">📖 本义：${entry.original}</div><ul class="ext-meanings">${extList}</ul></div>${derivationChart}<div class="illustration-box"><img src="${wordIllustMap[word] || wordIllustMap.default}" alt="古汉语意境"></div>`;
        } else { content = `<div class="error-msg">未收录“${word}”，请尝试高频实词如：安、道。</div>`; }
        resultNavigate("word", word, content);
    }

    function fetchPoemFull(title) {
        const poem = poemsDatabase[title];
        if(!poem){ resultNavigate("poem",title,`<div class="error-msg">未找到“${title}”</div>`); return; }
        const poetHtml = `<div class="poet-info"><h3>👤 诗人小传</h3><p><strong>${poem.poet.name}</strong>，字 ${poem.poet.zi}，号 ${poem.poet.hao}。<br>${poem.poet.lifetime}<br>📚 代表作：${poem.poet.masterpieces}</p></div>`;
        const fullHtml = `<div class="trans-block"><h3>📝 完整翻译</h3><p>${poem.translation}</p></div><div class="appreciate-block"><h3>✨ 精读赏析（完整版）</h3><p>${poem.appreciation}</p></div>${poetHtml}<div class="illustration-box"><img src="${poem.illust}" alt="诗意插画"></div>`;
        resultNavigate("poem", title, fullHtml);
    }

    function resultNavigate(type, keyword, contentHtml) {
        const titlePrefix = type === "word" ? `「${keyword}」 实词释义·引申图解·课内例句` : `「${keyword}」 完整翻译·深度赏析·诗人小传`;
        const resultHtml = `<div class="result-page"><button class="back-btn" id="backHomeBtn">← 返回主页面</button><div class="result-title">${titlePrefix}</div><div class="scrollable-content">${contentHtml}</div></div>`;
        root.innerHTML = resultHtml;
        document.getElementById("backHomeBtn")?.addEventListener("click", () => renderHome());
    }

    let root = document.getElementById("app");
    renderHome();
</script>
</body>
</html>
