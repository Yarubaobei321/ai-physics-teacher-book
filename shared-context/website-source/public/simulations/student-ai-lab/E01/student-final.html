<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>英语语法专项练 | 时态·语态·搭配·结构</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #f0f7ff 0%, #e9eef5 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
            color: #1a2c3e;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .hero { text-align: center; margin-bottom: 2rem; }
        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #1e5f74, #2c8b9e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #cbdde6;
            padding-bottom: 0.8rem;
        }
        .tab-btn {
            background: #eef3f7;
            border: none;
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #1f5e6e;
        }
        .tab-btn.active { background: #1f7e8c; color: white; box-shadow: 0 4px 10px rgba(31,126,140,0.3); }
        .tab-content { display: none; animation: fade 0.2s ease; }
        .tab-content.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

        /* 卡片 */
        .tenses-grid, .collocation-grid, .structure-grid, .voice-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }
        .card, .info-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.08);
            transition: 0.2s;
            overflow: hidden;
            cursor: pointer;
        }
        .card:hover, .info-card:hover { transform: translateY(-5px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15); }
        .card-header {
            padding: 1rem 1.5rem 0.6rem;
            border-bottom: 3px solid #48b5c0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header h3 { font-size: 1.5rem; color: #165a6b; }
        .detail-badge { background: #d9eef3; border-radius: 40px; padding: 0.2rem 0.8rem; font-size: 0.7rem; font-weight: 600; }
        .usage, .keywords, .example { padding: 0.7rem 1.5rem; border-bottom: 1px solid #e2edf2; }
        .label { font-weight: 700; color: #1f7e8c; margin-right: 8px; }
        .keywords span { background: #e1f0f3; display: inline-block; padding: 0.2rem 0.6rem; border-radius: 24px; font-size: 0.75rem; margin: 0.2rem; }

        .info-card { padding: 1.2rem 1.5rem; border-left: 6px solid #48b5c0; cursor: pointer; }
        .info-card h4 { font-size: 1.3rem; color: #165a6b; margin-bottom: 0.5rem; }
        .example-sent { background: #fef7e0; padding: 0.6rem; border-radius: 20px; margin-top: 0.6rem; font-size: 0.9rem; }

        .quiz-section {
            background: white;
            border-radius: 40px;
            padding: 1.8rem 2rem;
            margin-top: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .quiz-title {
            font-size: 1.6rem;
            font-weight: 700;
            border-left: 6px solid #3aa8b8;
            padding-left: 1rem;
            margin-bottom: 1.2rem;
        }
        .quiz-item {
            background: #fafdff;
            margin-bottom: 1.5rem;
            padding: 1rem 1.5rem;
            border-radius: 28px;
            border: 1px solid #dee9ef;
        }
        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            margin-top: 0.5rem;
        }
        .quiz-options label { background: #f1f6f9; padding: 0.3rem 1rem; border-radius: 60px; cursor: pointer; transition: 0.1s; }
        .quiz-options label:hover { background: #e2eff5; }
        .btn {
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            background: #eef3f7;
            color: #1f5e6e;
        }
        .btn-primary { background: #1f7e8c; color: white; }
        .btn-primary:hover { background: #0e6371; }
        .score-area, .mistake-area { margin-top: 1rem; padding: 1rem; border-radius: 28px; }
        .score-area { background: #eef4fa; text-align: center; font-weight: 700; }
        .mistake-area { background: #fffbf0; border-left: 6px solid #f4b942; }
        .mistake-card { background: white; border-radius: 20px; padding: 0.7rem; margin-bottom: 0.8rem; border-left: 3px solid #f4b942; }

        .chart-container {
            background: white;
            border-radius: 32px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
        }
        canvas { max-height: 280px; width: 100%; }

        .modal-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-container {
            background: white;
            max-width: 650px;
            width: 90%;
            border-radius: 48px;
            overflow: hidden;
        }
        .modal-header { background: #1f7e8c; padding: 1rem 1.5rem; color: white; display: flex; justify-content: space-between; }
        .close-modal { background: none; border: none; font-size: 1.8rem; color: white; cursor: pointer; }
        .modal-body { padding: 1.5rem; max-height: 65vh; overflow-y: auto; }
        .gaokao-insight { background: #eef2fa; padding: 0.8rem; border-radius: 24px; margin-top: 1rem; border-left: 4px solid #f4b942; }
        .phrase-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
        .phrase-tag { background: #e1f0f3; border-radius: 30px; padding: 0.2rem 0.8rem; font-size: 0.8rem; }
        footer { text-align: center; margin-top: 2rem; font-size: 0.8rem; color: #6f8f9c; }
        @media (max-width: 680px) { body { padding: 1rem; } }
    </style>
</head>
<body>
<div class="container">
    <div class="hero"><h1>📚 英语语法专项练</h1><p>时态 · 语态 · 固定搭配 · 句子结构 | 卡片弹窗高考真题 | 课后练习即时批改解析</p></div>
    <div class="nav-tabs">
        <button class="tab-btn active" data-tab="tenses">⏳ 时态知识</button>
        <button class="tab-btn" data-tab="voice">🎤 主动/被动语态</button>
        <button class="tab-btn" data-tab="collocations">🔗 固定搭配</button>
        <button class="tab-btn" data-tab="structures">📐 句子结构</button>
        <button class="tab-btn" data-tab="comprehensive">📊 综合诊断</button>
    </div>

    <!-- 时态模块 （语法练习）-->
    <div id="tensesTab" class="tab-content active">
        <div class="tenses-grid" id="tensesGrid"></div>
        <div class="quiz-section">
            <div class="quiz-title">📖 语法练习 · 时态专项</div>
            <div id="tenseQuizContainer"></div>
            <div style="display:flex;gap:1rem;justify-content:center;"><button class="btn btn-primary" id="submitTenseQuiz">提交批改</button><button class="btn" id="resetTenseQuiz">重置</button></div>
            <div id="tenseScoreArea" class="score-area" style="display:none;"></div>
            <div id="tenseMistakeArea" class="mistake-area" style="display:none;"></div>
        </div>
    </div>

    <!-- 主动/被动语态模块 (卡片+课后练习，去除括号后缀) -->
    <div id="voiceTab" class="tab-content">
        <div class="voice-grid" id="voiceGrid"></div>
        <div class="quiz-section">
            <div class="quiz-title">🎤 语态专项练习</div>
            <div id="voicePracticeContainer" class="questions-area"></div>
            <div style="display:flex;gap:1rem;justify-content:center;"><button class="btn btn-primary" id="submitVoicePractice">✅ 批改 & 解析</button><button class="btn" id="resetVoicePractice">🔄 重做</button></div>
            <div id="voicePracticeScore" class="score-area" style="display:none;"></div>
            <div id="voicePracticeMistake" class="mistake-area" style="display:none;"></div>
        </div>
    </div>

    <!-- 固定搭配模块 -->
    <div id="collocationsTab" class="tab-content">
        <div class="collocation-grid" id="collocationGrid"></div>
        <div class="quiz-section">
            <div class="quiz-title">🔖 固定搭配 · 专项练习</div>
            <div id="collocPracticeContainer" class="questions-area"></div>
            <div style="display:flex;gap:1rem;justify-content:center;"><button class="btn btn-primary" id="submitCollocPractice">✅ 批改 & 解析</button><button class="btn" id="resetCollocPractice">🔄 重做</button></div>
            <div id="collocPracticeScore" class="score-area" style="display:none;"></div>
            <div id="collocPracticeMistake" class="mistake-area" style="display:none;"></div>
        </div>
    </div>

    <!-- 句子结构模块 -->
    <div id="structuresTab" class="tab-content">
        <div class="structure-grid" id="structureGrid"></div>
        <div class="quiz-section">
            <div class="quiz-title">✍️ 句子结构 · 专项练习</div>
            <div id="structPracticeContainer" class="questions-area"></div>
            <div style="display:flex;gap:1rem;justify-content:center;"><button class="btn btn-primary" id="submitStructPractice">✅ 批改 & 解析</button><button class="btn" id="resetStructPractice">🔄 重做</button></div>
            <div id="structPracticeScore" class="score-area" style="display:none;"></div>
            <div id="structPracticeMistake" class="mistake-area" style="display:none;"></div>
        </div>
    </div>

    <!-- 综合诊断模块 (约50%高考原题) -->
    <div id="comprehensiveTab" class="tab-content">
        <div class="quiz-section">
            <div class="quiz-title">🧠 综合能力诊断 (高考真题+模拟)</div>
            <div id="compQuizContainer"></div>
            <div style="display:flex;gap:1rem;justify-content:center;"><button class="btn btn-primary" id="submitCompQuiz">生成诊断报告</button><button class="btn" id="resetCompQuiz">重置</button></div>
            <div id="compScoreArea" class="score-area" style="display:none;"></div>
            <div id="chartArea" class="chart-container" style="display:none;"><canvas id="weaknessChart"></canvas></div>
            <div id="targetedPractice" class="mistake-area" style="display:none;"></div>
        </div>
    </div>
    <footer>✨ 点击任意卡片查看高考真题+易错点 | 各模块课后练习提交后自动批改并展示详细解析</footer>
</div>

<!-- 模态弹窗 -->
<div id="modalOverlay" class="modal-overlay"><div class="modal-container"><div class="modal-header"><h3 id="modalTitle">语法详解</h3><button class="close-modal" id="closeModalBtn">&times;</button></div><div class="modal-body" id="modalBody"></div></div></div>

<script>
    // ----------------------------- 时态数据 ---------------------------------
    const tensesData = [
        { id:0, name:"🌞 一般现在时", usage:"经常性、客观真理", keywords:["always","every day"], example:"She reads every morning.", detailedRules:"三单加s/es；do/does辅助。", commonMistakes:"三单遗漏；主将从现易错。", gaokaoExample:"(2021全国乙) —What time is it? —I have no idea. But just a minute, I _____ it for you.", gaokaoAns:"will check", gaokaoExplain:"一般将来时，但一般现在时常考客观事实。" },
        { id:1, name:"⏳ 一般过去时", usage:"过去动作/状态", keywords:["yesterday","ago"], example:"They visited the museum.", detailedRules:"动词过去式；不规则变化。", commonMistakes:"不规则动词错误", gaokaoExample:"(2022浙江) I _____ some second-hand furniture for my flat yesterday.", gaokaoAns:"bought", gaokaoExplain:"yesterday 提示一般过去时。" },
        { id:2, name:"🚀 一般将来时", usage:"将来计划/预测", keywords:["tomorrow","next week"], example:"He will travel to Beijing.", detailedRules:"will+动原/be going to", commonMistakes:"will后加to", gaokaoExample:"(2020全国Ⅰ) I'm not sure. I _____ stay at home.", gaokaoAns:"might", gaokaoExplain:"情态动词表推测将来。" },
        { id:3, name:"🎯 现在进行时", usage:"此刻进行/表将来", keywords:["now","Look!"], example:"The baby is sleeping.", detailedRules:"be+doing", commonMistakes:"缺少be动词", gaokaoExample:"(2023新高考Ⅰ) Hurry up! The train _____.", gaokaoAns:"is leaving", gaokaoExplain:"现在进行时表按计划将来。" },
        { id:4, name:"🕰️ 过去进行时", usage:"过去某刻发生", keywords:["when/while"], example:"I was reading when she called.", detailedRules:"was/were+doing", commonMistakes:"主从句时态不一致", gaokaoExample:"(2019全国Ⅲ) I _____ (work) on my report when the phone rang.", gaokaoAns:"was working", gaokaoExplain:"过去进行时表示电话响时正在做。" },
        { id:5, name:"✨ 现在完成时", usage:"过去对现在影响", keywords:["since","already"], example:"She has finished homework.", detailedRules:"have/has+过去分词", commonMistakes:"与过去时间连用", gaokaoExample:"(2022全国甲) I _____ (clean) the house all morning. I'm tired.", gaokaoAns:"have been cleaning", gaokaoExplain:"现在完成进行时强调持续影响。" }
    ];

    // ----------------------------- 主动/被动语态 (卡片+课后练习) ---------------------------------
    const voiceData = [
        { id:100, name:"🎤 主动语态", usage:"主语是动作的执行者", keywords:["主语+谓语+宾语"], example:"The boy broke the window.", detailedRules:"主动句强调谁做了某事。", commonMistakes:"主动被动混淆，尤其是使役动词后省略to", gaokaoExample:"(2021全国甲) The engineer _____ (repair) the machine when we arrived.", gaokaoAns:"was repairing", gaokaoExplain:"主动语态，过去进行时表示过去正在修理。" },
        { id:101, name:"🛡️ 被动语态 (be + done)", usage:"主语是动作的承受者", keywords:["be+过去分词","by+动作执行者"], example:"The window was broken by the boy.", detailedRules:"各种时态的被动: am/is/are done, was/were done, will be done, have/has been done等", commonMistakes:"遗漏be动词或过去分词形式错误", gaokaoExample:"(2022全国乙) More efforts, as reported, _____ (make) in the years ahead to protect the environment.", gaokaoAns:"will be made", gaokaoExplain:"将来时被动，主语efforts与make被动关系。" },
        { id:102, name:"⚡ 特殊被动结构", usage:"情态动词被动 / 主动表被动", keywords:["can be done","need doing","be worth doing"], example:"The book is worth reading.", detailedRules:"need/want/require doing = need to be done; be worth doing主动表被动。", commonMistakes:"错误使用to be done", gaokaoExample:"(2020全国Ⅲ) The exhibition _____ (hold) next month is about space exploration.", gaokaoAns:"to be held", gaokaoExplain:"不定式被动作定语，表将来。" }
    ];
    const voicePracticeQuiz = [
        { text: "The new library _____ next year in our community.", options: ["will build","will be built","is building","has built"], correct: 1, explanation: "图书馆与build之间为被动关系，next year将来时，故用will be built。" },
        { text: "Great changes _____ in my hometown since 2010.", options: ["took place","have been taken place","have taken place","are taken place"], correct: 2, explanation: "take place 无被动语态，且since完成时，用have taken place。" },
        { text: "The flowers need _____, or they will die.", options: ["water","watering","to water","watered"], correct: 1, explanation: "need doing = need to be watered 主动表被动。" },
        { text: "The 2024 Olympic Games _____ in Paris, France.", options: ["will hold","will be held","are held","hold"], correct: 1, explanation: "奥运会是被举办，一般将来时被动。" },
        { text: "When we got to the cinema, the tickets _____ out.", options: ["had sold","have been sold","had been sold","were sold"], correct: 2, explanation: "票已经卖完发生在got之前，且被动，过去完成时被动。" }
    ];

    // 固定搭配卡片&练习
    const collocationGroups = [
        { title:"🔥 超高频动词短语", items:["look forward to doing","pay attention to doing","get used to doing","object to doing","lead to doing","devote to doing","contribute to doing","stick to doing"], gaokaoHint:"look forward to doing 2022全国卷" },
        { title:"📌 介词搭配黄金组合", items:["depend on","belong to","result in","result from","insist on","succeed in","approve of","account for"], gaokaoHint:"result in/from 高频" },
        { title:"🎯 形容词+介词", items:["be interested in","be proud of","be famous for","be afraid of","be aware of","be capable of","be fond of","be responsible for"], gaokaoHint:"完形高频" },
        { title:"🏆 高考核心短语", items:["take part in","catch up with","put up with","come up with","run out of","break down","bring about","carry out","take advantage of"], gaokaoHint:"完形填空高频" }
    ];
    const collocPracticeQuiz = [
        { text:"She insisted _____ going to the concert alone.", options:["on","in","at","for"], correct:0, explanation:"insist on doing 坚持做某事。" },
        { text:"We are all looking forward _____ the new film.", options:["to see","seeing","to seeing","see"], correct:2, explanation:"look forward to doing，to为介词。" },
        { text:"He succeeded _____ passing the interview after hard work.", options:["to","in","for","with"], correct:1, explanation:"succeed in doing 成功做某事。" },
        { text:"You should take advantage _____ every chance to practice English.", options:["of","for","in","at"], correct:0, explanation:"take advantage of 利用。" },
        { text:"The scientist came _____ a brilliant solution to the problem.", options:["up with","down to","across to","over with"], correct:0, explanation:"come up with 想出。" }
    ];

    // 句子结构卡片+练习
    const structureData = [
        { id:10, title:"简单句", desc:"主语+谓语", eg:"She sings.", detailedRules:"无从句", commonMistakes:"双谓语", gaokaoExample:"(2020全国) The man ____(live) next door is a doctor.", gaokaoAns:"living", gaokaoExplain:"非谓语作定语" },
        { id:11, title:"并列句", desc:"and/but/or连接", eg:"I like tea but she likes coffee.", detailedRules:"连词连接两简单句", commonMistakes:"逗号粘连", gaokaoExample:"Study hard, _____ you will fail.", gaokaoAns:"or", gaokaoExplain:"祈使句+or" },
        { id:12, title:"状语从句", desc:"when/if/because引导", eg:"If it rains, we'll stay.", detailedRules:"主将从现", commonMistakes:"时态错误", gaokaoExample:"_____ he comes, tell him.", gaokaoAns:"If", gaokaoExplain:"条件状语用现在时" },
        { id:13, title:"定语从句", desc:"关系代词引导", eg:"The book that I read is good.", detailedRules:"关系词作成分", commonMistakes:"缺少关系词", gaokaoExample:"The museum _____ we visited is famous.", gaokaoAns:"which/that", gaokaoExplain:"作宾语可省略" },
        { id:14, title:"名词性从句", desc:"主语/宾语从句", eg:"What he said is true.", detailedRules:"连词在句中充当成分", commonMistakes:"what/that混用", gaokaoExample:"_____ we need is time.", gaokaoAns:"What", gaokaoExplain:"缺宾语用what" }
    ];
    const structPracticeQuiz = [
        { text:"_____ she will join us is still unknown.", options:["Whether","That","If","What"], correct:0, explanation:"Whether引导主语从句，句首不用if。" },
        { text:"The teacher, together with his students, _____ watching the match now.", options:["is","are","were","be"], correct:0, explanation:"主语中心词teacher，单数。" },
        { text:"Only after finishing homework _____ he allowed to go out.", options:["was","did","had","is"], correct:0, explanation:"Only+状语部分倒装，时态一致。" },
        { text:"The reason _____ he was late is that his car broke down.", options:["why","which","for which","both A and C"], correct:3, explanation:"reason why / reason for which 引导定语从句。" },
        { text:"_____ from the top, the city looks magnificent.", options:["Seeing","Seen","To see","Having seen"], correct:1, explanation:"city与see被动，过去分词作状语。" }
    ];

    // 时态原有小测(语法练习)
    const tenseQuiz = [
        { text:"By the time you arrive, I _____ dinner.", options:["cook","will have cooked","am cooking","cooked"], correct:1, explanation:"将来完成时" },
        { text:"She _____ a shower when the phone rang.", options:["had","was having","has","is having"], correct:1, explanation:"过去进行时" }
    ];
    
    // 综合测试题：10道题目，约50%直接选自/改编自高考原题，确保高质量
    const comprehensiveQuiz = [
        { text:"(2022·全国乙卷) — What's that noise? — Oh, my God! I _____ to turn off the alarm. (forget)", options:["forget","forgot","have forgotten","had forgotten"], correct:2, category:"时态", explanation:"现在完成时表示过去动作对现在造成的影响(噪音还在响)。" },
        { text:"(2021·新高考Ⅰ卷) It is possible that the library _____ next month. (complete)", options:["will complete","will be completed","completes","is completed"], correct:1, category:"语态", explanation:"图书馆与complete被动关系，将来时被动。" },
        { text:"If you had taken my advice, you _____ in trouble now.", options:["are not","would not be","were not","had not been"], correct:1, category:"虚拟语气", explanation:"混合虚拟，if与过去相反，主句与现在相反。" },
        { text:"(2020·全国Ⅲ) The artist was sure that his works _____ by many people in the future.", options:["will appreciate","will be appreciated","would appreciate","would be appreciated"], correct:3, category:"语态", explanation:"主句过去时，宾语从句将来时被动。" },
        { text:"(2019·江苏卷) The doctor shares his phone number with the patients _____ they need medical assistance.", options:["if only","in case","even though","as if"], correct:1, category:"状语从句", explanation:"in case 以防万一，引导目的状语从句。" },
        { text:"Not until the rain stopped _____ the football match again.", options:["did they start","they started","started they","they start"], correct:0, category:"倒装结构", explanation:"Not until 置于句首，主句部分倒装。" },
        { text:"(2018·全国Ⅰ卷) While online shopping _____ increasingly popular, many people still prefer to shop in physical stores.", options:["has become","becomes","is becoming","became"], correct:2, category:"时态", explanation:"现在进行时表示现阶段正在发展的趋势。" },
        { text:"The reason _____ he was late for the meeting was that his car broke down on the way.", options:["why","that","which","for which"], correct:0, category:"定语从句", explanation:"reason why 引导定语从句，why在从句中作原因状语。" },
        { text:"(2023·浙江1月) The organization will provide free meals to those _____ are in urgent need.", options:["which","who","whom","whose"], correct:1, category:"定语从句", explanation:"those指代人，关系代词用who。" },
        { text:"She is looking forward to _____ the opportunity to study abroad.", options:["give","giving","be given","being given"], correct:3, category:"固定搭配", explanation:"look forward to doing，且主语与give之间为被动关系，用being given。" }
    ];

    // ---------- 通用渲染函数 ----------
    function renderTenseCards() { renderCardsToGrid('tensesGrid', tensesData, 'tense'); }
    function renderVoiceCards() { renderCardsToGrid('voiceGrid', voiceData, 'voice'); }
    function renderCollocationCards() {
        const grid = document.getElementById('collocationGrid');
        if(!grid) return;
        grid.innerHTML = collocationGroups.map((g,idx)=>`<div class="info-card" data-type="colloc" data-idx="${idx}"><h4>📚 ${g.title}</h4><div class="phrase-list">${g.items.slice(0,4).map(p=>`<span class="phrase-tag">${p}</span>`).join('')}</div><div class="example-sent">⭐ 共${g.items.length}个，点击查看全部+高考真题</div></div>`).join('');
        attachCardClick();
    }
    function renderStructureCards() { renderCardsToGrid('structureGrid', structureData, 'struct'); }
    function renderCardsToGrid(gridId, dataArr, type) {
        const grid = document.getElementById(gridId);
        if(!grid) return;
        grid.innerHTML = dataArr.map(item => `<div class="card" data-type="${type}" data-id="${item.id}"><div class="card-header"><h3>${item.name || item.title}</h3><div class="detail-badge">📖 高考解析</div></div><div class="usage"><span class="label">用法：</span>${item.usage || item.desc}</div><div class="keywords"><span class="label">要点：</span>${item.keywords ? item.keywords.map(k=>`<span>${k}</span>`).join('') : (item.example ? `<span>${item.example.substring(0,30)}</span>` : '')}</div><div class="example"><span class="label">例题：</span>${item.example || item.eg}</div></div>`).join('');
        attachCardClick();
    }
    function attachCardClick() {
        document.querySelectorAll('.card, .info-card').forEach(card => { card.removeEventListener('click', handleModalClick); card.addEventListener('click', handleModalClick); });
    }
    function handleModalClick(e) {
        const card = e.currentTarget;
        const type = card.getAttribute('data-type');
        if(type === 'tense') { const id = parseInt(card.getAttribute('data-id')); openTenseModal(tensesData.find(t=>t.id===id)); }
        else if(type === 'voice') { const id = parseInt(card.getAttribute('data-id')); openVoiceModal(voiceData.find(v=>v.id===id)); }
        else if(type === 'colloc') { const idx = parseInt(card.getAttribute('data-idx')); openCollocModal(idx); }
        else if(type === 'struct') { const id = parseInt(card.getAttribute('data-id')); openStructModal(structureData.find(s=>s.id===id)); }
    }
    function openTenseModal(tense) { openModal(tense.name, `<div><strong>📖 规则</strong><p>${tense.detailedRules}</p></div><div><strong>⚠️ 易错</strong><p>${tense.commonMistakes}</p></div><div class="gaokao-insight"><strong>🏆 高考真题</strong><p>${tense.gaokaoExample}</p><p>✅ 答案：${tense.gaokaoAns}</p><p>💡 ${tense.gaokaoExplain}</p></div>`); }
    function openVoiceModal(voice) { openModal(voice.name, `<div><strong>📖 规则明细</strong><p>${voice.detailedRules}</p></div><div><strong>⚠️ 易错考点</strong><p>${voice.commonMistakes}</p></div><div class="gaokao-insight"><strong>🏆 高考真题+解析</strong><p>📝 ${voice.gaokaoExample}</p><p>✅ ${voice.gaokaoAns}</p><p>💡 ${voice.gaokaoExplain}</p></div><div><strong>🎯 例句</strong><p>${voice.example}</p></div>`); }
    function openCollocModal(idx) { const group = collocationGroups[idx]; openModal(`📌 ${group.title}`, `<div><strong>完整短语</strong><div class="phrase-list">${group.items.map(p=>`<span class="phrase-tag">${p}</span>`).join('')}</div></div><div class="gaokao-insight"><strong>🎯 高考结合</strong><p>${group.gaokaoHint}</p><p>🧠 易错点：to为介词的短语后加doing。</p></div>`); }
    function openStructModal(struct) { openModal(struct.title, `<div><strong>📖 规则详解</strong><p>${struct.detailedRules}</p></div><div><strong>⚠️ 易错点</strong><p>${struct.commonMistakes}</p></div><div class="gaokao-insight"><strong>🏆 高考真题</strong><p>${struct.gaokaoExample}</p><p>✅ ${struct.gaokaoAns}</p><p>💡 ${struct.gaokaoExplain}</p></div>`); }
    function openModal(title, content) { document.getElementById('modalTitle').innerHTML = title; document.getElementById('modalBody').innerHTML = content; document.getElementById('modalOverlay').classList.add('active'); }

    // 通用渲染练习题 & 批改函数
    function renderPractice(quizArr, containerId) {
        const container = document.getElementById(containerId);
        if(!container) return;
        let html = '';
        quizArr.forEach((q,i)=>{ html+=`<div class="quiz-item"><div class="quiz-question">${i+1}. ${q.text}</div><div class="quiz-options">`; q.options.forEach((opt,oidx)=>{ html+=`<label><input type="radio" name="${containerId}_${i}" value="${oidx}"> ${String.fromCharCode(65+oidx)}. ${opt}</label>`; }); html+=`</div></div>`; });
        container.innerHTML = html;
    }
    function gradePractice(quizArr, prefix, scoreId, mistakeId, title) {
        let answers=[]; for(let i=0;i<quizArr.length;i++){ let s=document.querySelector(`input[name="${prefix}_${i}"]:checked`); answers.push(s?parseInt(s.value):-1); }
        if(answers.includes(-1)){ alert(`请完成${title}所有题目`); return false; }
        let correct=0, mistakes=[];
        for(let i=0;i<quizArr.length;i++){ if(answers[i]===quizArr[i].correct) correct++; else mistakes.push({idx:i, text:quizArr[i].text, user:quizArr[i].options[answers[i]], correctAns:quizArr[i].options[quizArr[i].correct], exp:quizArr[i].explanation}); }
        document.getElementById(scoreId).style.display='block'; document.getElementById(scoreId).innerHTML = `📊 ${title} 得分: ${correct}/${quizArr.length} (${Math.round(correct/quizArr.length*100)}分)`;
        let html=`<div class="mistake-title">📌 批改与解析</div>`; if(mistakes.length===0) html=`<div class="mistake-title">✅ 全对！</div>`; else mistakes.forEach(m=>{ html+=`<div class="mistake-card"><strong>${m.idx+1}. ${m.text}</strong><br>你的答案:${m.user} ✅正确答案:${m.correctAns}<br>💡 ${m.exp}</div>`; });
        document.getElementById(mistakeId).innerHTML = html; document.getElementById(mistakeId).style.display='block';
        return true;
    }
    function resetPractice(prefix, scoreId, mistakeId, length) { for(let i=0;i<length;i++) document.querySelectorAll(`input[name="${prefix}_${i}"]`).forEach(r=>r.checked=false); document.getElementById(scoreId).style.display='none'; document.getElementById(mistakeId).style.display='none'; }

    // 综合测试图表与诊断
    let weaknessChart = null;
    function generateWeaknessChart(userAnswers, quizData) {
        let catMap = { "时态":{t:0,c:0}, "语态":{t:0,c:0}, "固定搭配":{t:0,c:0}, "句子结构":{t:0,c:0}, "虚拟语气":{t:0,c:0}, "倒装结构":{t:0,c:0}, "状语从句":{t:0,c:0} };
        quizData.forEach((q,i)=>{ if(catMap[q.category]){ catMap[q.category].t++; if(userAnswers[i]===q.correct) catMap[q.category].c++; } });
        let labels=[], rates=[]; for(let [k,v] of Object.entries(catMap)) if(v.t>0){ labels.push(k); rates.push((v.c/v.t)*100); }
        const ctx = document.getElementById('weaknessChart').getContext('2d');
        if(weaknessChart) weaknessChart.destroy();
        weaknessChart = new Chart(ctx, { type:'bar', data:{ labels, datasets:[{ label:'正确率 (%)', data:rates, backgroundColor:'#48b5c0' }] }, options:{ scales:{ y:{ max:100 } } } });
        document.getElementById('targetedPractice').innerHTML = `<div class="mistake-title">📌 薄弱模块强化建议</div><p>重点复习${labels.filter((_,i)=>rates[i]<70).join('、')||'所有'}，可回顾对应卡片高考真题。</p>`;
        document.getElementById('targetedPractice').style.display='block';
    }

    function collectCompAnswers() { let a=[]; for(let i=0;i<comprehensiveQuiz.length;i++){ let r=document.querySelector(`input[name="compQuizContainer_${i}"]:checked`); a.push(r?parseInt(r.value):-1); } return a; }
    function submitComp() { let ans=collectCompAnswers(); if(ans.includes(-1)){ alert("完成综合诊断所有题目"); return; } let c=0; for(let i=0;i<comprehensiveQuiz.length;i++) if(ans[i]===comprehensiveQuiz[i].correct) c++; document.getElementById('compScoreArea').style.display='block'; document.getElementById('compScoreArea').innerHTML = `🧠 综合诊断: ${c}/${comprehensiveQuiz.length}`; document.getElementById('chartArea').style.display='block'; generateWeaknessChart(ans, comprehensiveQuiz); }
    function resetComp() { for(let i=0;i<comprehensiveQuiz.length;i++) document.querySelectorAll(`input[name="compQuizContainer_${i}"]`).forEach(r=>r.checked=false); document.getElementById('compScoreArea').style.display='none'; document.getElementById('chartArea').style.display='none'; document.getElementById('targetedPractice').style.display='none'; }

    // 时态练习批改辅助
    function evaluateModule(quizData, answers, scoreId, mistakeId, title) { let c=0,m=[]; for(let i=0;i<quizData.length;i++) if(answers[i]===quizData[i].correct) c++; else m.push({text:quizData[i].text, user:quizData[i].options[answers[i]], correct:quizData[i].options[quizData[i].correct], exp:quizData[i].explanation}); document.getElementById(scoreId).style.display='block'; document.getElementById(scoreId).innerHTML=`📊 ${title}: ${c}/${quizData.length}`; let html=`<div class="mistake-title">错题解析</div>`; if(m.length===0) html=`<div class="mistake-title">✅ 全对</div>`; else m.forEach(mm=>{ html+=`<div class="mistake-card"><strong>${mm.text}</strong><br>你的答案:${mm.user} ✅正确答案:${mm.correct}<br>💡${mm.exp}</div>`; }); document.getElementById(mistakeId).innerHTML=html; document.getElementById(mistakeId).style.display='block'; }
    function collectCompAnswersBase(len, prefix) { let a=[]; for(let i=0;i<len;i++){ let r=document.querySelector(`input[name="${prefix}_${i}"]:checked`); a.push(r?parseInt(r.value):-1); } return a; }

    // 绑定事件
    function bindEvents() {
        document.getElementById('submitTenseQuiz').onclick=()=>{ let a=collectCompAnswersBase(tenseQuiz.length,"tenseQuizContainer"); if(a.includes(-1)){alert("完成语法练习");return;} evaluateModule(tenseQuiz,a,"tenseScoreArea","tenseMistakeArea","时态练习"); };
        document.getElementById('resetTenseQuiz').onclick=()=>resetPractice("tenseQuizContainer","tenseScoreArea","tenseMistakeArea",tenseQuiz.length);
        document.getElementById('submitVoicePractice').onclick=()=>gradePractice(voicePracticeQuiz,"voicePracticeContainer","voicePracticeScore","voicePracticeMistake","语态专项");
        document.getElementById('resetVoicePractice').onclick=()=>resetPractice("voicePracticeContainer","voicePracticeScore","voicePracticeMistake",voicePracticeQuiz.length);
        document.getElementById('submitCollocPractice').onclick=()=>gradePractice(collocPracticeQuiz,"collocPracticeContainer","collocPracticeScore","collocPracticeMistake","固定搭配专项");
        document.getElementById('resetCollocPractice').onclick=()=>resetPractice("collocPracticeContainer","collocPracticeScore","collocPracticeMistake",collocPracticeQuiz.length);
        document.getElementById('submitStructPractice').onclick=()=>gradePractice(structPracticeQuiz,"structPracticeContainer","structPracticeScore","structPracticeMistake","句子结构专项");
        document.getElementById('resetStructPractice').onclick=()=>resetPractice("structPracticeContainer","structPracticeScore","structPracticeMistake",structPracticeQuiz.length);
        document.getElementById('submitCompQuiz').onclick=submitComp; document.getElementById('resetCompQuiz').onclick=resetComp;
        document.getElementById('closeModalBtn').onclick=()=>document.getElementById('modalOverlay').classList.remove('active');
        document.getElementById('modalOverlay').addEventListener('click',(e)=>{ if(e.target===document.getElementById('modalOverlay')) document.getElementById('modalOverlay').classList.remove('active'); });
        document.querySelectorAll('.tab-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); const id=btn.getAttribute('data-tab'); document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.getElementById(`${id}Tab`).classList.add('active'); }); });
    }

    function init() {
        renderTenseCards(); renderVoiceCards(); renderCollocationCards(); renderStructureCards();
        renderPractice(tenseQuiz,"tenseQuizContainer"); renderPractice(voicePracticeQuiz,"voicePracticeContainer");
        renderPractice(collocPracticeQuiz,"collocPracticeContainer"); renderPractice(structPracticeQuiz,"structPracticeContainer");
        renderPractice(comprehensiveQuiz,"compQuizContainer");
        bindEvents();
    }
    init();
</script>
</body>
</html>
