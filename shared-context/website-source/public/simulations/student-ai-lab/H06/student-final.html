    }

      font-family: 'Noto Serif SC', '楷体', 'KaiTi', serif;
      border-bottom: 2px solid #c8aa8a;
      display: inline-block;
      padding-bottom: 0.5rem;
      margin: 0 auto 0.8rem auto;

      margin: 0 auto 2rem auto;
      letter-spacing: 1px;
    }

      font-weight: 600;

      background: #faf3e8;
    }

    .timeline-list {

      flex-direction: column;
      gap: 0.8rem;
    }

      padding: 0.9rem 1.2rem;

      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 500;
      color: #4d3827;
      font-size: 0.95rem;
    }

    .timeline-item:hover {
      background: #f6eada;
      border-color: #b3926c;
      transform: translateX(4px);
      box-shadow: 0 6px 14px rgba(140, 100, 50, 0.12);
    }

    .timeline-item.active {
      background: #e7d4bb;
      border-color: #8b5a3c;
      box-shadow: 0 8px 16px rgba(130, 75, 30, 0.18);
      font-weight: 700;
      color: #311e10;
      border-left: 6px solid #7b4a2c;
    }

    .year-badge {
      background: #8b6b4f;
      color: white;
      border-radius: 2rem;
      padding: 0.25rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .detail-panel {
      flex: 2 1 650px;
      background: #fffdf7;
      border-radius: 2rem;
      padding: 1.8rem 1.8rem;
      box-shadow: 0 10px 28px rgba(100, 70, 30, 0.12);
      border: 1px solid #e6d7c0;
      display: flex;
      flex-direction: column;
    }

      font-size: 1.8rem;
      font-weight: 550;
      color: #472e1b;
      margin-bottom: 0.8rem;
      font-family: 'Noto Serif SC', serif;
      border-bottom: 2px dotted #d4b896;
      padding-bottom: 0.5rem;
    }

    .detail-description {
      font-size: 1.08rem;
      line-height: 1.75;
      color: #3f3327;
      margin-bottom: 1.6rem;
      background: #fbf5ed;
      padding: 1.2rem 1.3rem;
      border-radius: 1.2rem;
      border-left: 5px solid #c29a6b;
    }

    .key-points {
      background: #f4ede3;
      border-radius: 1.2rem;
      padding: 1.2rem 1.3rem;
      margin: 0.6rem 0 1.2rem 0;
    }

    .key-points h3 {
      font-size: 1.2rem;
      color: #5a3827;
      margin-bottom: 0.7rem;
    }

    .key-points ul {
      list-style: none;
      padding-left: 0.3rem;
    }

    .key-points li {
      margin-bottom: 0.55rem;
      font-size: 1rem;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      line-height: 1.5;
    }

    .key-points li::before {
      content: "✦";
      color: #b4723a;
      font-weight: bold;
      flex-shrink: 0;
    }

    .theory-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    .theory-card {
      background: #fff8ef;
      border: 1px solid #ddc7aa;
      border-radius: 1rem;
      padding: 0.9rem 1.1rem;
      flex: 1 1 155px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
      transition: 0.2s;
    }

    .theory-card:hover {
      background: #f8ecdb;
      border-color: #b3926c;
      transform: translateY(-2px);
    }

    .theory-card h4 {
      font-size: 1.1rem;
      color: #6b3f21;
      margin-bottom: 0.4rem;
      border-bottom: 1px dashed #cfb595;
      padding-bottom: 0.3rem;
      font-weight: 600;
    }

    .theory-card p {
      font-size: 0.92rem;
      color: #3b3126;
      line-height: 1.55;
    }

    .manifesto-highlight {
      background: #e9ddd0;
      border-radius: 1rem;
      padding: 0.9rem 1.3rem;
      margin: 1rem 0 0.5rem;
      font-weight: 500;
      color: #2f241a;
      line-height: 1.6;
      border-left: 4px solid #8b5a3c;
    }

    .revolution-badge {
      background: #d9c5ad;
      border-radius: 1rem;
      padding: 0.7rem 1rem;
      margin: 0.5rem 0;
      font-size: 0.95rem;

      align-items: flex-start;
      gap: 0.5rem;
      line-height: 1.5;

      color: #5e2d14;

      height: auto;
    }

      font-size: 0.9rem;
      margin-top: auto;
      text-align: right;
      padding-top: 0.8rem;

      background: #fcf7f0;
      border-radius: 2rem;
      padding: 1.8rem 2rem;
      border: 1px solid #e2cfb5;
      box-shadow: 0 8px 20px rgba(120, 70, 30, 0.1);

    .quiz-header {
      font-size: 1.6rem;
      font-weight: 550;
      color: #4b2e1f;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-left: 6px solid #b5835a;
      padding-left: 1rem;

    .quiz-progress {
      font-size: 0.95rem;
      color: #7a5c41;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .question-card {
      background: #fffbf5;
      border-radius: 1.2rem;
      padding: 1.5rem;
      border: 1px solid #e6d0b5;
      margin-bottom: 1rem;

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      color: #3f2a1b;
      margin-bottom: 1.2rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .option-btn {
      background: #fbf6ee;
      border: 1px solid #dac9b0;
      border-radius: 0.9rem;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
      color: #3d3027;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .option-btn:hover:not(.disabled) {
      background: #f3e8d9;
      border-color: #b3926c;
    }

    .option-btn.correct {
      background: #d4edda;
      border-color: #a3c9a8;
      color: #1e4620;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background: #f8d7da;
      border-color: #d3a5aa;
      color: #721c24;
      font-weight: 500;
    }

    .option-btn.disabled {
      opacity: 0.8;
      cursor: default;
    }

    .explanation-box {
      background: #fef9e7;
      border-left: 5px solid #c9a44c;
      border-radius: 0.8rem;
      padding: 0.9rem 1.2rem;
      margin-top: 1rem;
      font-size: 0.95rem;
      color: #4e3e28;
      display: none;
    }

    .explanation-box.show {
      display: block;
    }

    .next-question-btn {
      background: #b3926c;
      border: none;
      color: white;
      padding: 0.7rem 2rem;
      border-radius: 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
      display: inline-block;
    }

    .next-question-btn:hover {
      background: #8b6b4f;
    }

    .quiz-complete {
      text-align: center;
      font-size: 1.2rem;
      color: #4a3422;
      padding: 1rem;
      font-weight: 500;
    }

    @media (max-width: 750px) {
      .container { padding: 1.5rem; }
      h1 { font-size: 2.1rem; }
      .grid-main { flex-direction: column; }
      .theory-card { flex: 1 1 130px; }
    }
  </style>
</head>

  <div class="container">
    <h1>⚒️ 马克思主义的诞生</h1>

        <div class="key-points">
          <h3>🔑 核心背景</h3>

        <div id="extraContentArea"></div>
        <div class="footer-note"><span id="sourceHint">高中历史·必修中外历史纲要（下）</span></div>
      </div>
    </div>

    <div class="quiz-section" id="quizSection">
      <div class="quiz-header">📝 知识自测（由易到难）</div>
      <div class="quiz-progress" id="quizProgress">第 1 / 5 题</div>
      <div id="quizContainer"></div>
    </div>
  </div>

            '马克思起草《成立宣言》和《共同章程》，实际成为第一国际的灵魂',
            '在各国建立支部，团结英、法、德、意等国工人，开展罢工等斗争',
            '积极支持1871年巴黎公社革命，公社失败后帮助流亡社员',
            '1876年解散，但为各国建立独立的无产阶级政党奠定了基础'
          ],
          extraType: 'manifesto',
          manifestoText: '🌍 第一国际的历史贡献：它是第一个国际性的无产阶级革命组织，传播了科学社会主义，培养了一批工人运动的骨干，为马克思主义在工人运动中占据主导地位发挥了关键作用。'
        },
        {
          id: 'revolutions',
          year: '1848-1871',
          title: '1848年欧洲革命与巴黎公社',
          eventText: '理论指导实践·伟大尝试',
          description: '《共产党宣言》问世后，1848年欧洲革命爆发，马克思主义经受了第一次大规模实践检验。1871年巴黎公社是无产阶级建立政权的第一次伟大尝试，丰富了马克思主义关于无产阶级革命和无产阶级专政的学说。',
          keyPoints: [
            '1848年欧洲革命：马克思主义首次大规模实践检验，马克思创办《新莱茵报》',
            '1871年巴黎公社：建立无产阶级专政的第一次伟大尝试，虽失败但意义深远',
            '公社经验证明：无产阶级必须打破旧的国家机器，建立新型无产阶级政权',
            '丰富了马克思主义关于阶级斗争、革命策略和国家学说的理论宝库'
          ],
          extraType: 'revolutionPractice',
          revolutionCards: [
            { title: '1848年欧洲革命', detail: '波及法、德、奥、意等多国。马克思、恩格斯亲身参加德国革命，通过《新莱茵报》宣传革命纲领。' },
            { title: '1871年巴黎公社', detail: '法国工人阶级建立革命政权，实行了一系列社会主义性质政策，是无产阶级专政的雏形。马克思撰写《法兰西内战》总结其历史意义。' }
          ],
          // 难点配图：1848年革命与巴黎公社实践关系图
          image: `<svg viewBox="0 0 550 200" xmlns="http://www.w3.org/2000/svg" style="background:#fcf8f2; border-radius:12px;">
            <rect x="30" y="40" width="220" height="60" rx="10" fill="#e7d4bb" stroke="#b3926c" stroke-width="2"/>
            <text x="140" y="65" text-anchor="middle" fill="#4b2e1f" font-size="14" font-weight="bold">1848年欧洲革命</text>
            <text x="140" y="85" text-anchor="middle" fill="#5c3b24" font-size="11">马克思主义首次大规模实践</text>
            
            <rect x="300" y="40" width="220" height="60" rx="10" fill="#e7d4bb" stroke="#b3926c" stroke-width="2"/>
            <text x="410" y="65" text-anchor="middle" fill="#4b2e1f" font-size="14" font-weight="bold">1871年巴黎公社</text>
            <text x="410" y="85" text-anchor="middle" fill="#5c3b24" font-size="11">无产阶级专政首次尝试</text>
            
            <rect x="150" y="135" width="250" height="45" rx="12" fill="#b3926c" stroke="#6b4e3a" stroke-width="2"/>
            <text x="275" y="163" text-anchor="middle" fill="white" font-size="14" font-weight="bold">丰富马克思主义国家学说</text>
            
            <line x1="160" y1="100" x2="220" y2="135" stroke="#6b4e3a" stroke-width="2" marker-end="url(#arrow2)"/>
            <line x1="390" y1="100" x2="330" y2="135" stroke="#6b4e3a" stroke-width="2" marker-end="url(#arrow2)"/>
            <defs>
              <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M0,0 L10,5 L0,10 z" fill="#6b4e3a"/>
              </marker>
            </defs>
          </svg>`
        },
        {
          id: 'significance',
          year: '深远影响',
          title: '马克思主义的历史意义',
          eventText: '国际工人运动指南',
          description: '马克思主义的诞生，使社会主义从空想变为科学，为无产阶级提供了认识世界和改造世界的强大思想武器。它揭示了人类社会发展的一般规律，推动了国际工人运动的发展，深刻影响了人类历史进程。',
          keyPoints: [
            '社会主义由空想发展为科学，形成完备的理论体系',
            '无产阶级斗争从此有了科学理论的指导，面貌焕然一新',
            '开创了国际共产主义运动新纪元，推动了各国无产阶级政党的建立',
            '唯物史观和剩余价值学说两大发现，深刻揭示了社会发展规律'
          ],
          extraType: 'theoryCards',
          theoryCards: [
            { title: '科学变革', desc: '唯物史观和剩余价值学说使社会主义从空想走向科学。' },
            { title: '实践力量', desc: '与工人运动相结合，成为改造社会、推动历史前进的强大物质力量。' },
            { title: '世界意义', desc: '超越国界，成为全世界被压迫阶级争取解放的思想旗帜。' }
          ]
        }
      ];

      // ---------- 选择题题库（由易到难）----------
      const quizData = [
        {
          question: '马克思主义诞生的社会经济前提是？',
          options: [
            'A. 工人运动蓬勃兴起',
            'B. 马克思、恩格斯的天才头脑',
            'C. 工业革命推动资本主义迅速发展，其基本矛盾暴露',
            'D. 空想社会主义提供了思想基础'
          ],
          correct: 2,
          explanation: '工业革命使资本主义的基本矛盾（生产社会化与生产资料私有制之间的矛盾）日益暴露，经济危机周期性爆发，为马克思主义的诞生提供了社会经济前提。'
        },
        {
          question: '《共产党宣言》发表于哪一年？',
          options: ['A. 1844年', 'B. 1847年', 'C. 1848年', 'D. 1864年'],
          correct: 2,
          explanation: '1848年2月，《共产党宣言》在伦敦发表，标志着马克思主义的诞生。1847年是共产主义者同盟成立的时间；1864年是第一国际成立的时间。'
        },
        {
          question: '马克思在批判继承哪位思想家辩证法合理内核的基础上创立了唯物辩证法？',
          options: ['A. 费尔巴哈', 'B. 黑格尔', 'C. 亚当·斯密', 'D. 欧文'],
          correct: 1,
          explanation: '马克思批判继承了黑格尔辩证法的“合理内核”（发展变化的思想），并对其唯心主义体系进行了改造，创立了唯物辩证法。费尔巴哈提供了唯物主义的“基本内核”。'
        },
        {
          question: '巴黎公社的历史意义在于？',
          options: [
            'A. 标志着马克思主义诞生',
            'B. 是建立无产阶级专政的第一次伟大尝试',
            'C. 直接促成了第一国际的成立',
            'D. 导致《共产党宣言》的发表'
          ],
          correct: 1,
          explanation: '1871年巴黎公社是无产阶级推翻资产阶级统治，建立无产阶级专政的第一次伟大尝试，丰富了马克思主义关于无产阶级革命和无产阶级专政的学说。'
        },
        {
          question: '第一国际期间，马克思为其起草了哪两份重要文件？',
          options: [
            'A.《共产党宣言》和《资本论》',
            'B.《成立宣言》和《共同章程》',
            'C.《法兰西内战》和《哥达纲领批判》',
            'D.《黑格尔法哲学批判》和《神圣家族》'
          ],
          correct: 1,
          explanation: '1864年第一国际成立时，马克思受委托起草了《国际工人协会成立宣言》和《协会临时章程》（后称《共同章程》），确立了科学社会主义在第一国际中的指导地位。'
        }
      ];

      // DOM元素
      const timelineListEl = document.getElementById('timelineList');
      const detailTitleEl = document.getElementById('detailTitle');
      const detailDescEl = document.getElementById('detailDesc');
      const keyListEl = document.getElementById('keyList');
      const extraContentArea = document.getElementById('extraContentArea');
      const sourceHintEl = document.getElementById('sourceHint');
      const quizContainer = document.getElementById('quizContainer');
      const quizProgress = document.getElementById('quizProgress');

      let currentActiveId = 'background';
      let currentQuizIndex = 0;
      let quizCompleted = false;

      // ---------- 时间轴与详情渲染 ----------
      function renderTimeline() {
        timelineListEl.innerHTML = '';
        historyData.forEach(item => {
          const div = document.createElement('div');
          div.className = `timeline-item ${item.id === currentActiveId ? 'active' : ''}`;
          div.dataset.id = item.id;
          div.innerHTML = `<span class="year-badge">${item.year}</span><span class="event-text">${item.eventText}</span>`;
          div.addEventListener('click', () => updateActiveItem(item.id));
          timelineListEl.appendChild(div);
        });
      }

      function updateActiveItem(id) {
        currentActiveId = id;
        document.querySelectorAll('.timeline-item').forEach(el => {
          el.classList.toggle('active', el.dataset.id === id);
        });
        const data = historyData.find(d => d.id === id);
        if (data) renderDetail(data);
      }

      function renderDetail(data) {
        detailTitleEl.textContent = data.title;
        detailDescEl.textContent = data.description;
        keyListEl.innerHTML = '';
        data.keyPoints.forEach(point => {
          const li = document.createElement('li');
          li.textContent = point;
          keyListEl.appendChild(li);
        });
        extraContentArea.innerHTML = '';

        // 插入配图（如果存在）
        if (data.image) {
          const imgContainer = document.createElement('div');
          imgContainer.className = 'image-container';
          imgContainer.innerHTML = data.image;
          extraContentArea.appendChild(imgContainer);
        }

        // 原有额外内容
        if (data.extraType === 'theoryCards' && data.theoryCards) {
          const wrapper = document.createElement('div');
          wrapper.className = 'theory-cards';
          data.theoryCards.forEach(card => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'theory-card';
            cardDiv.innerHTML = `<h4>${card.title}</h4><p>${card.desc}</p>`;
            wrapper.appendChild(cardDiv);
          });
          extraContentArea.appendChild(wrapper);
        } else if (data.extraType === 'manifesto' && data.manifestoText) {
          const div = document.createElement('div');
          div.className = 'manifesto-highlight';
          div.textContent = data.manifestoText;
          extraContentArea.appendChild(div);
        } else if (data.extraType === 'revolutionPractice' && data.revolutionCards) {
          const wrapper = document.createElement('div');
          wrapper.style.display = 'flex';
          wrapper.style.flexDirection = 'column';
          wrapper.style.gap = '0.8rem';
          wrapper.style.marginTop = '0.8rem';
          data.revolutionCards.forEach(rev => {
            const revDiv = document.createElement('div');
            revDiv.className = 'revolution-badge';
            revDiv.innerHTML = `<strong>⚔️ ${rev.title}：</strong><span>${rev.detail}</span>`;
            wrapper.appendChild(revDiv);
          });
          extraContentArea.appendChild(wrapper);
        }

        const hintMap = {
          'background': '社会经济背景：工业革命与资本主义基本矛盾',
          'movements': '阶级基础：欧洲三大工人运动',
          'marxEngels': '理论来源：三大思想遗产的批判继承',
          'manifesto': '诞生标志：《共产党宣言》发表 · 1848年',
          'firstInternational': '国际联合：第一国际（1864—1876）',
          'revolutions': '实践检验：1848年欧洲革命与1871年巴黎公社',
          'significance': '历史意义：马克思主义诞生的深远影响'
        };
        sourceHintEl.textContent = hintMap[data.id] || '高中历史·必修中外历史纲要（下）';
      }

      // ---------- 选择题渲染与交互 ----------
      function renderQuiz() {
        if (quizCompleted) {
          quizContainer.innerHTML = '<div class="quiz-complete">🎉 恭喜你完成所有测试！你对马克思主义的诞生有了更深入的理解。</div>';
          quizProgress.textContent = '已完成';
          return;
        }

        const q = quizData[currentQuizIndex];
        quizProgress.textContent = `第 ${currentQuizIndex + 1} / ${quizData.length} 题`;
        let html = `<div class="question-card">
          <div class="question-text">${currentQuizIndex + 1}. ${q.question}</div>
          <div class="options" id="optionsContainer">`;
        q.options.forEach((opt, idx) => {
          html += `<button class="option-btn" data-index="${idx}">${opt}</button>`;
        });
        html += `</div>
          <div class="explanation-box" id="explanationBox">${q.explanation}</div>
        </div>`;
        quizContainer.innerHTML = html;

        const optionBtns = document.querySelectorAll('.option-btn');
        const explanationBox = document.getElementById('explanationBox');
        let answeredCorrectly = false;

        optionBtns.forEach(btn => {
          btn.addEventListener('click', function(e) {
            if (answeredCorrectly) return;
            const selectedIdx = parseInt(this.dataset.index);
            if (selectedIdx === q.correct) {
              this.classList.add('correct');
              explanationBox.classList.remove('show');
              answeredCorrectly = true;
              optionBtns.forEach(b => b.classList.add('disabled'));
              const nextBtn = document.createElement('button');
              nextBtn.className = 'next-question-btn';
              nextBtn.textContent = '下一题 ▶';
              nextBtn.addEventListener('click', () => {
                currentQuizIndex++;
                if (currentQuizIndex >= quizData.length) {
                  quizCompleted = true;
                }
                renderQuiz();
              });
              quizContainer.appendChild(nextBtn);
            } else {
              this.classList.add('incorrect');
              explanationBox.classList.add('show');
            }
          });
        });
      }

      // ---------- 初始化 ----------
      function init() {
        renderTimeline();
        const defaultData = historyData.find(d => d.id === 'background');
        if (defaultData) renderDetail(defaultData);
        renderQuiz();
      }

      init();
    })();
  </script>
</body>
</html>
