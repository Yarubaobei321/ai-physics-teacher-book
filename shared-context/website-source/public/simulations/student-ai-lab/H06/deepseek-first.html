<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>马克思主义的诞生 · 高中历史交互演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe8;
      font-family: 'Segoe UI', 'Noto Serif SC', '华文楷体', '楷体', 'KaiTi', '宋体', SimSun, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      color: #2e241f;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 251, 245, 0.85);
      backdrop-filter: blur(18px);
      background: #fffcf4;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(100, 70, 40, 0.15), 0 8px 20px rgba(0,0,0,0.05);
      padding: 2rem 2.2rem;
      border: 1px solid #e7d7c4;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 500;
      letter-spacing: 4px;
      color: #4b2e1f;
      text-align: center;
      margin-bottom: 0.4rem;
      font-family: 'Noto Serif SC', '楷体', 'KaiTi', serif;
      border-bottom: 2px solid #c8aa8a;
      display: inline-block;
      padding-bottom: 0.5rem;
      margin: 0 auto 0.8rem auto;
      width: auto;
    }

    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      color: #6b4e3a;
      margin-bottom: 2.2rem;
      font-style: italic;
      background: #f3e7d9;
      display: inline-block;
      padding: 0.3rem 2rem;
      border-radius: 30px;
      margin: 0 auto 2rem auto;
      letter-spacing: 1px;
    }

    .grid-main {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1.8rem;
      margin-top: 1rem;
    }

    /* 左侧时间轴交互区 */
    .timeline-panel {
      flex: 1 1 320px;
      background: #faf3e8;
      border-radius: 2rem;
      padding: 1.6rem 1.2rem;
      box-shadow: inset 0 0 0 1px #ede0cf, 0 6px 18px rgba(120, 70, 30, 0.1);
    }

    .timeline-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #5c3b24;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border-left: 6px solid #b5835a;
      padding-left: 1rem;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .timeline-item {
      background: #fffbf5;
      border-radius: 1.2rem;
      padding: 1rem 1.4rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      border: 1px solid #e2cfb5;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 500;
      color: #4d3827;
    }

    .timeline-item:hover {
      background: #f6eada;
      border-color: #b3926c;
      transform: translateX(4px);
      box-shadow: 0 6px 14px rgba(140, 100, 50, 0.12);
    }

    .timeline-item.active {
      background: #e7d4bb;
      border-color: #8b5a3c;
      box-shadow: 0 8px 16px rgba(130, 75, 30, 0.18);
      font-weight: 700;
      color: #311e10;
      border-left: 6px solid #7b4a2c;
    }

    .year-badge {
      background: #b3926c;
      color: white;
      border-radius: 2rem;
      padding: 0.25rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: #8b6b4f;
      white-space: nowrap;
    }

    .event-text {
      font-size: 1.05rem;
    }

    /* 右侧详情卡片 */
    .detail-panel {
      flex: 2 1 580px;
      background: #fffdf7;
      border-radius: 2rem;
      padding: 1.8rem 1.8rem;
      box-shadow: 0 10px 28px rgba(100, 70, 30, 0.12);
      border: 1px solid #e6d7c0;
      display: flex;
      flex-direction: column;
    }

    .detail-header {
      font-size: 1.8rem;
      font-weight: 550;
      color: #472e1b;
      margin-bottom: 0.8rem;
      font-family: 'Noto Serif SC', serif;
    }

    .detail-description {
      font-size: 1.1rem;
      line-height: 1.7;
      color: #3f3327;
      margin-bottom: 1.8rem;
      background: #fbf5ed;
      padding: 1.2rem;
      border-radius: 1.2rem;
      border-left: 5px solid #c29a6b;
    }

    .key-points {
      background: #f4ede3;
      border-radius: 1.2rem;
      padding: 1.2rem 1.3rem;
      margin: 0.8rem 0 1.2rem 0;
    }

    .key-points h3 {
      font-size: 1.2rem;
      color: #5a3827;
      margin-bottom: 0.7rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .key-points ul {
      list-style-type: none;
      padding-left: 0.3rem;
    }

    .key-points li {
      margin-bottom: 0.55rem;
      font-size: 1rem;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }

    .key-points li::before {
      content: "✦";
      color: #b4723a;
      font-weight: bold;
    }

    .theory-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .theory-card {
      background: #fff8ef;
      border: 1px solid #ddc7aa;
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      flex: 1 1 160px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: 0.2s;
    }

    .theory-card:hover {
      background: #f8ecdb;
      border-color: #b3926c;
    }

    .theory-card h4 {
      font-size: 1.15rem;
      color: #6b3f21;
      margin-bottom: 0.4rem;
      border-bottom: 1px dashed #cfb595;
      padding-bottom: 0.3rem;
    }

    .theory-card p {
      font-size: 0.95rem;
      color: #3b3126;
    }

    .manifesto-highlight {
      background: #e9ddd0;
      border-radius: 1rem;
      padding: 0.8rem 1.2rem;
      margin: 1rem 0 0.5rem;
      font-weight: 500;
      color: #2f241a;
    }

    hr {
      border: 0.5px solid #dbccb6;
      margin: 1.2rem 0 0.8rem;
    }

    .footer-note {
      color: #846b52;
      font-size: 0.9rem;
      margin-top: auto;
      text-align: right;
    }

    @media (max-width: 750px) {
      .container {
        padding: 1.5rem;
      }
      h1 {
        font-size: 2.2rem;
      }
      .grid-main {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚒️ 马克思主义的诞生</h1>
    <div style="text-align: center;">
      <div class="subtitle">科学社会主义 · 无产阶级思想体系</div>
    </div>

    <div class="grid-main">
      <!-- 左侧时间轴交互 -->
      <div class="timeline-panel">
        <div class="timeline-title">
          <span>📜 历史脉络</span>
        </div>
        <div class="timeline-list" id="timelineList">
          <!-- 通过js动态生成以保证交互一致，但也可以直接写在html；为了结构清晰用js填充 -->
        </div>
        <div style="margin-top: 1.2rem; font-size:0.9rem; color:#7b6450; padding:0.3rem;">
          <span>🖱️ 点击事件查看详细内容</span>
        </div>
      </div>

      <!-- 右侧详细展示区 -->
      <div class="detail-panel" id="detailPanel">
        <div class="detail-header" id="detailTitle">工业革命与阶级矛盾</div>
        <div class="detail-description" id="detailDesc">
          19世纪上半叶，工业革命推动资本主义迅速发展，但也暴露了其弊端。经济危机周期性爆发，工人阶级生活悲惨，阶级矛盾日益尖锐。
        </div>
        <div class="key-points" id="keyPointsContainer">
          <h3>🔑 核心背景</h3>
          <ul id="keyList">
            <li>工业革命使社会分裂为工业资产阶级和无产阶级</li>
            <li>1825年英国首次爆发经济危机</li>
            <li>三大工人运动标志无产阶级觉醒</li>
          </ul>
        </div>
        <div id="extraContentArea">
          <!-- 动态插入理论卡片或宣言内容 -->
        </div>
        <div class="footer-note">
          <span id="sourceHint">高中历史·必修中外历史纲要（下）</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 历史事件数据集（紧扣高中课本）
      const historyData = [
        {
          id: 'background',
          year: '19世纪前期',
          title: '工业革命与社会矛盾',
          eventText: '经济基础与阶级对立',
          description: '工业革命使生产力飞跃，但财富集中在少数资本家手中。工人阶级劳动条件恶劣，生活贫困。1825年英国爆发第一次经济危机，揭示了资本主义基本矛盾：生产社会化与生产资料私有制之间的矛盾。',
          keyPoints: [
            '工业无产阶级形成，成为独立政治力量',
            '资本主义经济危机周期性爆发',
            '工人阶级展开自发斗争（破坏机器）',
          ],
          extraType: 'theoryCards',
          theoryCards: [
            { title: '经济基础', desc: '机器大工业取代工场手工业，生产力巨大发展。' },
            { title: '阶级结构', desc: '社会日益分裂为资产阶级和无产阶级两大对立阶级。' }
          ]
        },
        {
          id: 'movements',
          year: '1831-1848',
          title: '三大工人运动',
          eventText: '无产阶级登上历史舞台',
          description: '法国里昂工人起义（1831、1834）、英国宪章运动（1836-1848）、德意志西里西亚织工起义（1844）。工人阶级提出了独立的政治要求，表明无产阶级已经作为独立政治力量登上历史舞台，但缺乏科学理论指导。',
          keyPoints: [
            '里昂工人起义：争取共和与工作权利',
            '英国宪章运动：争取普选权等政治权利',
            '西里西亚织工起义：反对资本主义剥削'
          ],
          extraType: 'theoryCards',
          theoryCards: [
            { title: '历史意义', desc: '标志着无产阶级开始反对资产阶级的斗争进入新阶段。' },
            { title: '迫切需要', desc: '工人运动呼唤科学的革命理论作为指导。' }
          ]
        },
        {
          id: 'marxEngels',
          year: '1844-1847',
          title: '马克思与恩格斯',
          eventText: '理论探索与转变',
          description: '马克思、恩格斯深入工人群众，批判吸收人类优秀思想成果。马克思在《黑格尔法哲学批判》导言中阐明无产阶级历史使命。恩格斯《英国工人阶级状况》揭露资本主义罪恶。两人在巴黎历史性会面，开始共同创立科学社会主义。',
          keyPoints: [
            '吸收德国古典哲学、英国古典政治经济学、英法空想社会主义',
            '完成从唯心主义到唯物主义、从革命民主主义到共产主义的转变',
            '1847年改组正义者同盟为共产主义者同盟'
          ],
          extraType: 'theoryCards',
          theoryCards: [
            { title: '思想来源', desc: '德意志古典哲学、英国古典政治经济学、英法空想社会主义。' },
            { title: '两大发现', desc: '唯物史观与剩余价值学说（后期成熟）。' }
          ]
        },
        {
          id: 'manifesto',
          year: '1848年2月',
          title: '《共产党宣言》发表',
          eventText: '马克思主义诞生标志',
          description: '1848年2月，马克思和恩格斯为共产主义者同盟起草的纲领《共产党宣言》在伦敦发表。它第一次全面阐述了科学社会主义原理，标志着马克思主义的诞生。从此，无产阶级斗争有了科学理论的指导。',
          keyPoints: [
            '阐述了阶级斗争学说，指出资产阶级的灭亡和无产阶级的胜利同样不可避免',
            '阐明了共产党的性质、特点和基本纲领',
            '号召“全世界无产者，联合起来！”'
          ],
          extraType: 'manifesto',
          manifestoText: '📖 《共产党宣言》主要内容：论证了资本主义必然灭亡、共产主义必然胜利的客观规律；指出无产阶级是资本主义的掘墓人；阐述了无产阶级革命和无产阶级专政的思想。'
        },
        {
          id: 'significance',
          year: '深远影响',
          title: '历史意义',
          eventText: '国际工人运动指南',
          description: '马克思主义的诞生，使社会主义从空想变为科学，为无产阶级提供了认识世界和改造世界的强大思想武器。它推动了国际工人运动的发展，成为世界各国无产阶级斗争的旗帜，深刻影响了人类历史进程。',
          keyPoints: [
            '社会主义由空想发展为科学',
            '无产阶级斗争有了科学理论指导',
            '开创了国际共产主义运动新纪元'
          ],
          extraType: 'theoryCards',
          theoryCards: [
            { title: '科学变革', desc: '唯物史观和剩余价值学说使社会主义从空想走向科学。' },
            { title: '实践力量', desc: '与工人运动相结合，成为改造社会的物质力量。' }
          ]
        }
      ];

      // DOM元素
      const timelineListEl = document.getElementById('timelineList');
      const detailTitleEl = document.getElementById('detailTitle');
      const detailDescEl = document.getElementById('detailDesc');
      const keyListEl = document.getElementById('keyList');
      const extraContentArea = document.getElementById('extraContentArea');
      const sourceHintEl = document.getElementById('sourceHint');

      // 当前激活的ID
      let currentActiveId = 'background';

      // 渲染时间轴列表
      function renderTimeline() {
        if (!timelineListEl) return;
        timelineListEl.innerHTML = '';
        historyData.forEach(item => {
          const div = document.createElement('div');
          div.className = `timeline-item ${item.id === currentActiveId ? 'active' : ''}`;
          div.dataset.id = item.id;
          div.innerHTML = `
            <span class="year-badge">${item.year}</span>
            <span class="event-text">${item.eventText}</span>
          `;
          div.addEventListener('click', () => {
            updateActiveItem(item.id);
          });
          timelineListEl.appendChild(div);
        });
      }

      // 更新激活状态
      function updateActiveItem(id) {
        currentActiveId = id;
        // 更新所有timeline-item的active类
        document.querySelectorAll('.timeline-item').forEach(el => {
          const itemId = el.dataset.id;
          if (itemId === id) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
        // 更新右侧详情
        const data = historyData.find(d => d.id === id);
        if (data) {
          renderDetail(data);
        }
      }

      // 渲染右侧详情
      function renderDetail(data) {
        detailTitleEl.textContent = data.title;
        detailDescEl.textContent = data.description;

        // 更新要点列表
        keyListEl.innerHTML = '';
        data.keyPoints.forEach(point => {
          const li = document.createElement('li');
          li.textContent = point;
          keyListEl.appendChild(li);
        });

        // 处理额外内容区域
        extraContentArea.innerHTML = '';
        
        if (data.extraType === 'theoryCards' && data.theoryCards) {
          const cardsWrapper = document.createElement('div');
          cardsWrapper.className = 'theory-cards';
          data.theoryCards.forEach(card => {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'theory-card';
            cardDiv.innerHTML = `<h4>${card.title}</h4><p>${card.desc}</p>`;
            cardsWrapper.appendChild(cardDiv);
          });
          extraContentArea.appendChild(cardsWrapper);
        } else if (data.extraType === 'manifesto' && data.manifestoText) {
          const manifestoDiv = document.createElement('div');
          manifestoDiv.className = 'manifesto-highlight';
          manifestoDiv.textContent = data.manifestoText;
          extraContentArea.appendChild(manifestoDiv);
        }

        // 更新底部来源提示（可动态调整）
        if (data.id === 'manifesto') {
          sourceHintEl.textContent = '标志：《共产党宣言》· 1848年';
        } else if (data.id === 'background') {
          sourceHintEl.textContent = '背景：工业革命与资本主义基本矛盾';
        } else if (data.id === 'movements') {
          sourceHintEl.textContent = '欧洲三大工人运动 · 19世纪30-40年代';
        } else if (data.id === 'marxEngels') {
          sourceHintEl.textContent = '马克思与恩格斯的革命实践';
        } else if (data.id === 'significance') {
          sourceHintEl.textContent = '马克思主义诞生的世界意义';
        } else {
          sourceHintEl.textContent = '高中历史·必修中外历史纲要（下）';
        }
      }

      // 初始化页面
      function init() {
        renderTimeline();
        // 默认展示第一个（背景）
        const defaultData = historyData.find(d => d.id === 'background');
        if (defaultData) {
          renderDetail(defaultData);
        }
      }

      // 启动一切
      init();

      // 可选：键盘导航或触摸优化（保持简洁）
    })();
  </script>
</body>
</html>
