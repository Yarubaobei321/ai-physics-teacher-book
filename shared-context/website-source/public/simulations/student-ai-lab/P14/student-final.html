<script>

    const experiments = {
        dot: {
            name: "打点计时器实验",
            sub: "自由落体 · 纸带分析验证守恒",
            principle: `<p><strong>📖 实验目的：</strong>通过自由落体运动，验证重力势能的减少量等于动能的增加量，从而证明机械能守恒。</p>
            <p><strong>⚡ 验证原理：</strong>只有重力做功时，<span class="formula">mgh = ½mv²</span>。本实验中，重锤从静止下落，测量下落高度h和对应点的瞬时速度v，比较mgh与½mv²。</p>
            <p><strong>📏 数据处理方法：</strong></p>
            <ul class="step-list">
                <li><strong>方法一（起点法）：</strong>取起始点0和任意点n，验证 <span class="formula">gh_n = ½v_n²</span></li>
                <li><strong>方法二（差值法）：</strong>任取两点A、B，验证 <span class="formula">gh_{AB} = ½v_B² - ½v_A²</span></li>
                <li><strong>方法三（图像法）：</strong>作v²/2 - h图线，斜率若等于g则守恒</li>
            </ul>
            <p><strong>⚠️ 速度计算注意：</strong>不能使用v=gt或v=√(2gh)计算，必须通过纸带 <span class="formula">v_n = (h_{n+1} - h_{n-1})/(2T)</span> 求瞬时速度。</p>`,
            hasVideo: false,  // 标记无视频
            errors: `<ul class="error-list">
                <li>1️⃣ <strong>系统误差</strong>：纸带与打点计时器限位孔摩擦、空气阻力 → 动能增加量略小于势能减少量</li>
                <li>2️⃣ <strong>偶然误差</strong>：刻度尺测量下落高度时的读数误差、计数点选取不规范</li>
                <li>3️⃣ <strong>操作误差</strong>：先放纸带后通电会导致第一个点速度不为零；重锤离计时器太远会打点过少</li>
                <li>4️⃣ <strong>电源频率波动</strong>：打点时间间隔不均匀影响速度计算精度</li>
            </ul>`,
            knowledge: `<div class="knowledge-box">
                <h3><i class="fas fa-graduation-cap"></i> 📚 打点计时器实验 · 考点与易错易混归纳</h3>
                <div class="knowledge-grid">
                    <div class="knowledge-col">
                        <h4>🎯 核心考点</h4>

                            <li>✔ 实验器材及安装（打点计时器、纸带、重锤、刻度尺）</li>
                            <li>✔ 实验步骤：先通电后释放纸带</li>
                            <li>✔ 纸带处理：测位移 → 算瞬时速度 → 比较ΔEp和ΔEk</li>
                            <li>✔ 图像法分析：v²/2 - h 图线斜率 = g</li>

                            <li>❌ 直接用 v=gt 或 v=√(2gh) 计算速度 — 错误！必须用纸带数据</li>
                            <li>❌ 重锤质量 <strong>不需要</strong> 测量（验证式中m可约去）</li>
                            <li>❌ 混淆下落高度 h 与位移差 — h 应是从起点到计数点的竖直距离</li>
                            <li>❌ 先释放重锤后通电 → 纸带上点迹少且初速不为零</li>

                        <div style="margin-top:12px;"><strong>💡 记忆口诀：</strong>“先通电，后放锤；测位移，点间隔；算瞬时，中间刻；守恒否，比动能。” </div>
                    </div>
                </div>
            </div>`
        },
        air: {
            name: "气垫导轨实验",
            sub: "近似无摩擦 · 光电门测速",
            principle: `<p><strong>📖 实验目的：</strong>利用气垫导轨几乎消除摩擦力，验证滑块沿斜面下滑过程中机械能守恒。</p>
            <p><strong>⚡ 验证原理：</strong>气垫层使滑块悬浮，摩擦力可忽略。滑块下滑时满足<span class="formula">mgΔh = ½mv²</span>（初速为零时）。</p>

                <li>4️⃣ <strong>水平调节误差</strong>：导轨未调水平影响势能变化计算</li>

            knowledge: `<div class="knowledge-box">
                <h3><i class="fas fa-chalkboard-user"></i> 📚 气垫导轨实验 · 考点与易错归纳</h3>
                <div class="knowledge-grid">
                    <div class="knowledge-col"><h4>🎯 核心考点</h4><ul><li>✔ 气垫导轨调水平的判断方法</li><li>✔ 光电门测速原理：v = d/Δt</li><li>✔ 验证 mgΔh = ½m(v₂² - v₁²)</li><li>✔ 误差来源及改进方法</li></ul></div>

                    <div class="knowledge-col"><h4>🧪 实验方法</h4><div><span class="method-badge">控制变量法</span><span class="method-badge">光电测速法</span><span class="method-badge">比值验证法</span></div></div>
                </div>
            </div>`
        },
        arc: {
            name: "圆弧轨道实验",
            sub: "曲线运动 · 动能势能转化",
            principle: `<p><strong>📖 实验目的：</strong>通过小球沿光滑圆弧轨道下滑，验证曲线运动中机械能守恒定律。</p>

            hasVideo: true,

        const root = document.getElementById('appRoot');
        root.innerHTML = `
            <div class="home-container">
                <div class="home-header">
                    <h1><i class="fas fa-atom"></i> 机械能守恒定律 · 智慧实验室</h1>
                    <p>📐 实验原理深度解析 | 高考考点归纳 | 可交互学习</p>
                </div>
                <div class="exp-cards">
                    <div class="exp-entry" data-exp="dot"><div class="exp-icon"><i class="fas fa-print"></i></div><h3>打点计时器</h3><p>自由落体·纸带分析</p></div>
                    <div class="exp-entry" data-exp="air"><div class="exp-icon"><i class="fas fa-train"></i></div><h3>气垫导轨</h3><p>近似无摩擦·光电门测速</p></div>
                    <div class="exp-entry" data-exp="arc"><div class="exp-icon"><i class="fas fa-chart-line"></i></div><h3>圆弧轨道</h3><p>曲线运动·能量转化</p></div>
                </div>
                <div class="footer-note"><i class="fas fa-lightbulb"></i> 点击实验卡片，学习原理、考点与易错点</div>
            </div>
        `;
        document.querySelectorAll('.exp-entry').forEach(card => {
            card.addEventListener('click', () => showExperiment(card.dataset.exp));
        });
    }

    // 实验分页面 (打点计时器无视频，其他实验保留视频)
    function showExperiment(expType) {
        const exp = experiments[expType];
        if (!exp) return;
        const root = document.getElementById('appRoot');
        // 根据 hasVideo 决定是否渲染视频区域
        const videoHtml = (exp.hasVideo && exp.videoUrl) ? `
            <div class="video-container">
                <div class="video-wrapper">
                    <iframe src="${exp.videoUrl}" title="${exp.videoTitle}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="video-caption"><i class="fas fa-video"></i> ${exp.videoTitle} （B站资源，可播放）</div>
            </div>
        ` : '';  // 打点计时器无视频，留空
        root.innerHTML = `
            <div class="exp-page">
                <div class="exp-page-header">
                    <div class="exp-title"><h2><i class="fas fa-flask"></i> ${exp.name}</h2><p>${exp.sub}</p></div>
                    <button class="btn-icon" id="backHomeBtn"><i class="fas fa-home"></i> 返回主页</button>
                </div>
                <div class="theory-section">
                    <div class="principle-box"><h3><i class="fas fa-book-open"></i> 🔬 实验原理与验证方法</h3>${exp.principle}</div>
                    ${videoHtml}
                    ${exp.knowledge}
                    <div class="error-box"><h4><i class="fas fa-chart-line"></i> 📊 误差来源系统分析</h4>${exp.errors}<p style="margin-top: 10px; font-size:0.75rem; color:#a07644;"><i class="fas fa-microscope"></i> 系统误差可通过改进装置减小，偶然误差通过多次测量取平均消除。</p></div>
                </div>
                <div class="back-home"><button id="backHomeBtn2"><i class="fas fa-arrow-left"></i> 返回实验选择</button></div>
                <div class="footer-note"><i class="fas fa-quote-left"></i> 机械能守恒条件：只有重力或弹力做功，其他力不做功或做功代数和为零。</div>
            </div>
        `;
        document.querySelectorAll('#backHomeBtn, #backHomeBtn2').forEach(btn => btn.addEventListener('click', showHome));
    }

    // 小星机器人 (可爱问答)
    function initRobot() {
        const robotDiv = document.getElementById('robotStar');
        const header = document.getElementById('robotHeader');
        const toggle = document.getElementById('toggleRobot');
        header.addEventListener('click', (e) => {
            if (e.target.id !== 'toggleRobot' && e.target.tagName !== 'I') return;
            robotDiv.classList.toggle('collapsed');
            toggle.classList.toggle('fa-chevron-down');
            toggle.classList.toggle('fa-chevron-up');
        });
        document.getElementById('askRobotBtn').addEventListener('click', () => {
            const input = document.getElementById('robotQuestion');
            const q = input.value.trim();
            if (!q) return;
            const chat = document.getElementById('robotChat');
            chat.innerHTML += `<div class="user-msg">🧑‍🎓 ${escapeHtml(q)}</div>`;
            const answer = getBotReply(q);
            chat.innerHTML += `<div class="bot-msg"><i class="fas fa-star"></i> 小星: ${answer}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;
        });
        document.getElementById('robotQuestion').addEventListener('keypress', e => { if(e.key === 'Enter') document.getElementById('askRobotBtn').click(); });
    }
    function getBotReply(q) {
        const lower = q.toLowerCase();
        if(lower.includes('打点计时器')) return "打点计时器实验中，速度必须用纸带数据求瞬时速度：v_n = (h_{n+1}-h_{n-1})/(2T)；重锤质量不需要测量；先通电再释放纸带。考点集中在纸带处理和误差分析。";
        if(lower.includes('气垫导轨')) return "气垫导轨实验通过喷气消除摩擦，验证mgΔh=½mv²。考前注意：导轨调水平、光电门测速原理、挡光片宽度足够小。误差主要来自气流不稳。";
        if(lower.includes('圆弧')) return "圆弧轨道验证曲线运动中机械能守恒。常见考点：最低点速度测量、轨道光滑假设、与圆周运动结合。易错点是忽略释放时初速度。";
        if(lower.includes('误差')) return "三种实验误差共性：摩擦阻力、测量精度。打点计时器还有纸带阻力；气垫导轨是气流不稳定；圆弧轨道是轨道摩擦和释放扰动。";
        if(lower.includes('考点') || lower.includes('易错')) return "高频考点：纸带速度计算、光电门测速、图像法斜率=g。易错点：直接用运动学公式算速度、先放重锤后通电、质量是否测量混淆。详细见页面放大版知识框！";
        return "可以问我：打点计时器、气垫导轨、圆弧轨道，或误差分析、考点归纳～ 小星帮你轻松搞定机械能守恒！";
    }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

    showHome();
    initRobot();
</script>
</body>
</html>
