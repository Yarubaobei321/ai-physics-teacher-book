<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="600" viewBox="0 0 1190 600" role="img"><title>教学问题与实验安排</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#285b79"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="30" fill="#203747" font-weight="600">定量探究的要求</text><text x="600" y="46" font-size="30" fill="#203747" font-weight="600">对应的实验安排</text><rect x="30" y="76" width="465" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="52" y="112" font-size="27" fill="#203747" font-weight="600">怎样改变匝数？</text><text x="52" y="148" font-size="21" fill="#526674" font-weight="400">同时保持位置与运动条件</text><path d="M510,126 L565,126" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="585" y="76" width="570" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="607" y="112" font-size="27" fill="#203747" font-weight="600">选择线圈接线柱</text><text x="607" y="148" font-size="21" fill="#526674" font-weight="400">核对接入绕组与实际匝数</text><rect x="30" y="201" width="465" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="52" y="237" font-size="27" fill="#203747" font-weight="600">怎样改变磁通量的条件？</text><text x="52" y="273" font-size="21" fill="#526674" font-weight="400">区分操作量与理论量</text><path d="M510,251 L565,251" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="585" y="201" width="570" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="607" y="237" font-size="27" fill="#203747" font-weight="600">改变小磁铁组合</text><text x="607" y="273" font-size="21" fill="#526674" font-weight="400">数量、排布和距离都需要说明</text><rect x="30" y="326" width="465" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="52" y="362" font-size="27" fill="#203747" font-weight="600">怎样控制并知道运动快慢？</text><text x="52" y="398" font-size="21" fill="#526674" font-weight="400">调节与测量分别安排</text><path d="M510,376 L565,376" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="585" y="326" width="570" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="607" y="362" font-size="27" fill="#203747" font-weight="600">调速装置＋转速仪</text><text x="607" y="398" font-size="21" fill="#526674" font-weight="400">用实际转速读数记录条件</text><rect x="30" y="451" width="465" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="52" y="487" font-size="27" fill="#203747" font-weight="600">怎样保存快速变化的电压？</text><text x="52" y="523" font-size="21" fill="#526674" font-weight="400">使信号可以回看和比较</text><path d="M510,501 L565,501" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="585" y="451" width="570" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="607" y="487" font-size="27" fill="#203747" font-weight="600">微电压传感器＋电脑</text><text x="607" y="523" font-size="21" fill="#526674" font-weight="400">保留波形，并说明取值方法</text></g></svg>