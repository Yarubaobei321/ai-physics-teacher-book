<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="640" viewBox="0 0 1190 640" role="img"><title>运动控制与两条测量路径</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#285b79"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="42" font-size="30" fill="#203747" font-weight="600">控制运动、测量转速、记录电压</text><rect x="30" y="80" width="300" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="52" y="116" font-size="27" fill="#203747" font-weight="600">调速装置</text><text x="52" y="152" font-size="21" fill="#526674" font-weight="400">改变电机运行状态</text><rect x="430" y="80" width="330" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="452" y="116" font-size="27" fill="#203747" font-weight="600">电机带动磁铁</text><text x="452" y="152" font-size="21" fill="#526674" font-weight="400">沿固定路径转动</text><rect x="850" y="80" width="310" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="872" y="116" font-size="27" fill="#203747" font-weight="600">固定线圈</text><text x="872" y="152" font-size="21" fill="#526674" font-weight="400">磁通量随相对位置改变</text><path d="M330,130 L430,130" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M760,130 L850,130" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="265" width="330" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="452" y="301" font-size="27" fill="#203747" font-weight="600">转速仪</text><text x="452" y="337" font-size="21" fill="#526674" font-weight="400">测量实际转速</text><rect x="850" y="265" width="310" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="872" y="301" font-size="27" fill="#203747" font-weight="600">微电压传感器＋电脑</text><text x="872" y="337" font-size="21" fill="#526674" font-weight="400">记录电压随时间的变化</text><path d="M595,180 L595,265" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1005,180 L1005,265" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="430" y="455" width="730" height="100" rx="9" fill="#f3f7f9" stroke="#c9d6df"/><text x="452" y="491" font-size="27" fill="#203747" font-weight="600">对应同一次实验条件</text><text x="452" y="527" font-size="21" fill="#526674" font-weight="400">同时保存：匝数、磁铁组合、位置、转速、波形与取值规则</text><path d="M595,365 L595,455" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1005,365 L1005,455" stroke="#285b79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="34" y="300" font-size="21" fill="#526674" font-weight="400">控制量：旋钮设置</text><text x="34" y="340" font-size="21" fill="#526674" font-weight="400">测量量：转速、端电压</text><text x="34" y="380" font-size="21" fill="#526674" font-weight="400">解释量：磁通量变化率</text><text x="30" y="608" font-size="20" fill="#526674" font-weight="400">功能关系示意；箭头不表示电气接线。</text></g></svg>