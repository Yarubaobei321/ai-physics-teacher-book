<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1340" viewBox="0 0 800 1340" role="img" aria-labelledby="title desc">
<title id="title">低速圆弧运动的三个关键状态</title><desc id="desc">m1 M3 R1 g10 u4。进入时滑块向右4，轨道静止；最高点高度0.6，双方向右1，滑块竖直速度零；底端分离滑块向左2，轨道向右2。三幅非等时刻间隔，位置不可跨幅比较。</desc>
<defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#D8751B"/></marker><marker id="orange-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#D8751B"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2875AD"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#2875AD"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#233849"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#233849"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7D8993"/></marker><marker id="gray-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#7D8993"/></marker></defs>
<rect width="800" height="1340" fill="white"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="57" font-size="36" fill="#233849" font-weight="650" text-anchor="start">低速：三个关键状态</text><text x="40" y="102" font-size="25" fill="#233849" font-weight="400" text-anchor="start">m=1 kg，M=3 kg，R=1 m，g=10 m/s²</text><rect x="24" y="125" width="752" height="337" rx="18" fill="white" stroke="#DCE5EB" stroke-width="2"/><text x="48" y="171" font-size="29" fill="#233849" font-weight="600" text-anchor="start">① 刚进入：u = 4 m/s</text><path d="M 300,352 A 170,170 0 0 0 470,182 L 470,352 Z" fill="#DDECF6" fill-opacity="0.8" stroke="#2875AD" stroke-width="3"/><line x1="62" y1="352" x2="734" y2="352" stroke="#7D8993" stroke-width="2"/><text x="426" y="334" font-size="29" fill="#2875AD" font-weight="600" text-anchor="start">M</text><line x1="300" y1="352" x2="492" y2="352" stroke="#D8751B" stroke-width="4" marker-end="url(#orange)"/><circle cx="300" cy="352" r="10" fill="#D8751B" stroke="white" stroke-width="2"/><text x="233" y="329" font-size="29" fill="#D8751B" font-weight="600" text-anchor="start">m</text><text x="139" y="274" font-size="27" fill="#D8751B" font-weight="400" text-anchor="start">vₓ = +4 m/s</text><text x="535" y="303" font-size="28" fill="#2875AD" font-weight="400" text-anchor="start">V = 0</text><text x="48" y="424" font-size="25" fill="#233849" font-weight="400" text-anchor="start">滑块向右进入，轨道初始静止。</text><rect x="24" y="485" width="752" height="356" rx="18" fill="white" stroke="#DCE5EB" stroke-width="2"/><text x="48" y="532" font-size="29" fill="#233849" font-weight="600" text-anchor="start">② 相对最高点：瞬时相对静止</text><path d="M 300,732 A 170,170 0 0 0 470,562 L 470,732 Z" fill="#DDECF6" fill-opacity="0.8" stroke="#2875AD" stroke-width="3"/><line x1="62" y1="732" x2="734" y2="732" stroke="#7D8993" stroke-width="2"/><text x="426" y="714" font-size="29" fill="#2875AD" font-weight="600" text-anchor="start">M</text><line x1="214" y1="630" x2="443.808" y2="630" stroke="#7D8993" stroke-width="1" stroke-dasharray="5 5"/><line x1="228" y1="732" x2="228" y2="630" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)" marker-start="url(#gray-start)"/><text x="63" y="685" font-size="25" fill="#233849" font-weight="400" text-anchor="start">h = 0.6 m</text><line x1="455.808" y1="630" x2="503.808" y2="630" stroke="#D8751B" stroke-width="4" marker-end="url(#orange)"/><circle cx="455.808" cy="630" r="10" fill="#D8751B" stroke="white" stroke-width="2"/><text x="486" y="607" font-size="26" fill="#D8751B" font-weight="400" text-anchor="start">vₓ = +1 m/s</text><text x="535" y="650" font-size="25" fill="#D8751B" font-weight="400" text-anchor="start">v<tspan baseline-shift="sub" font-size="70%">y</tspan> = 0</text><line x1="551" y1="702" x2="599" y2="702" stroke="#2875AD" stroke-width="4" marker-end="url(#blue)"/><text x="533" y="773" font-size="26" fill="#2875AD" font-weight="400" text-anchor="start">V = +1 m/s</text><text x="48" y="807" font-size="25" fill="#233849" font-weight="400" text-anchor="start">两者仍向右；随后滑块相对轨道下滑。</text><rect x="24" y="865" width="752" height="354" rx="18" fill="white" stroke="#DCE5EB" stroke-width="2"/><text x="48" y="913" font-size="29" fill="#233849" font-weight="600" text-anchor="start">③ 回到底端：立即分离</text><path d="M 300,1110 A 170,170 0 0 0 470,940 L 470,1110 Z" fill="#DDECF6" fill-opacity="0.8" stroke="#2875AD" stroke-width="3"/><line x1="62" y1="1110" x2="734" y2="1110" stroke="#7D8993" stroke-width="2"/><text x="426" y="1092" font-size="29" fill="#2875AD" font-weight="600" text-anchor="start">M</text><line x1="300" y1="1110" x2="204" y2="1110" stroke="#D8751B" stroke-width="4" marker-end="url(#orange)"/><circle cx="300" cy="1110" r="10" fill="#D8751B" stroke="white" stroke-width="2"/><text x="286" y="1086" font-size="29" fill="#D8751B" font-weight="600" text-anchor="start">m</text><text x="82" y="1038" font-size="27" fill="#D8751B" font-weight="400" text-anchor="start">vₓ = −2 m/s</text><line x1="537" y1="1080" x2="633" y2="1080" stroke="#2875AD" stroke-width="4" marker-end="url(#blue)"/><text x="525" y="1132" font-size="27" fill="#2875AD" font-weight="400" text-anchor="start">V = +2 m/s</text><text x="48" y="1183" font-size="25" fill="#233849" font-weight="400" text-anchor="start">滑块向左，轨道向右；均沿水平面运动。</text><text x="40" y="1270" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">三幅按事件排列，时间间隔不等；</text><text x="40" y="1308" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">不根据图间位置变化比较位移。</text></g>
</svg>