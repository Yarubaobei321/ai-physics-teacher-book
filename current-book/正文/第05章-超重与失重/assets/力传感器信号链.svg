<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="'PingFang SC','Songti SC','Noto Sans CJK SC',sans-serif" role="img" aria-label="力传感器信号链"><title>力传感器信号链</title><rect width="760" height="170" fill="#ffffff"/><text x="20.0" y="26.0" font-size="14" fill="#1f1f1d" text-anchor="start" font-weight="bold">自制压力传感器的信号链：哪一步出错，屏幕都照样有读数</text><rect x="20" y="50" width="106" height="66" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/><text x="73.0" y="78.0" font-size="13.5" fill="#1f1f1d" text-anchor="middle" font-weight="bold">力 F</text><text x="73.0" y="100.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">托盘受压</text><line x1="128.0" y1="83.0" x2="141.0" y2="83.0" stroke="#52514e" stroke-width="1.6"/><rect x="144" y="50" width="106" height="66" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/><text x="197.0" y="78.0" font-size="13.5" fill="#1f1f1d" text-anchor="middle" font-weight="bold">形变</text><text x="197.0" y="100.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">金属梁微弯</text><line x1="252.0" y1="83.0" x2="265.0" y2="83.0" stroke="#52514e" stroke-width="1.6"/><rect x="268" y="50" width="106" height="66" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/><text x="321.0" y="78.0" font-size="13.5" fill="#1f1f1d" text-anchor="middle" font-weight="bold">电阻变化</text><text x="321.0" y="100.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">应变片一增一减</text><line x1="376.0" y1="83.0" x2="389.0" y2="83.0" stroke="#52514e" stroke-width="1.6"/><rect x="392" y="50" width="106" height="66" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/><text x="445.0" y="78.0" font-size="13.5" fill="#1f1f1d" text-anchor="middle" font-weight="bold">几毫伏</text><text x="445.0" y="100.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">电桥输出</text><line x1="500.0" y1="83.0" x2="513.0" y2="83.0" stroke="#52514e" stroke-width="1.6"/><rect x="516" y="50" width="106" height="66" rx="8" fill="#fff" stroke="#2a78d6" stroke-width="1.6"/><text x="569.0" y="78.0" font-size="13.5" fill="#1f1f1d" text-anchor="middle" font-weight="bold">原始计数 N</text><text x="569.0" y="100.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">HX711 放大、转换</text><line x1="624.0" y1="83.0" x2="637.0" y2="83.0" stroke="#52514e" stroke-width="1.6"/><rect x="640" y="50" width="106" height="66" rx="8" fill="#fff" stroke="#eb6834" stroke-width="1.6"/><text x="693.0" y="78.0" font-size="13.5" fill="#1f1f1d" text-anchor="middle" font-weight="bold">F = k(N − N₀)</text><text x="693.0" y="100.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">零点 + 比例</text><text x="20.0" y="145.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">标定只定两个数：空载取 N₀，放已知砝码求 k；再用没参与标定的砝码检验，读数报告到哪一位由波动决定。</text></svg>