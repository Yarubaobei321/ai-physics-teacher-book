<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="'PingFang SC','Songti SC','Noto Sans CJK SC',sans-serif" role="img" aria-label="电梯下降的速度、加速度与视重"><title>电梯下降的速度、加速度与视重</title><rect width="800" height="550" fill="#ffffff"/><text x="150.0" y="30.0" font-size="14" fill="#1f1f1d" text-anchor="start" font-weight="bold">一次“电梯下降”：三段运动，三种视重（第 5 章实测估读值，取竖直向上为正）</text><rect x="209.8" y="45" width="65.8" height="445" fill="#2a78d6" opacity="0.06"/><text x="242.7" y="58.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">向下加速 · 失重</text><rect x="275.5" y="45" width="298.9" height="445" fill="#8a8984" opacity="0.06"/><text x="425.0" y="58.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">匀速下降 · 视重 = mg</text><rect x="574.5" y="45" width="65.8" height="445" fill="#eb6834" opacity="0.06"/><text x="607.3" y="58.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">向下减速 · 超重</text><text x="138.0" y="130.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">速度 v / (m·s⁻¹)</text><line x1="150.0" y1="94.0" x2="700.0" y2="94.0" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="98.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">0</text><polyline points="150.0,94.0 209.8,94.0 275.5,173.2 574.5,173.2 640.2,94.0 700.0,94.0" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="138.0" y="280.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">加速度 a / (m·s⁻²)</text><line x1="150.0" y1="280.0" x2="700.0" y2="280.0" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="284.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">0</text><line x1="150.0" y1="322.3" x2="700.0" y2="322.3" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="326.3" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">−2</text><line x1="150.0" y1="237.7" x2="700.0" y2="237.7" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="241.7" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">+2</text><polyline points="150.0,280.0 209.8,280.0 209.8,322.3 275.5,322.3 275.5,280.0 574.5,280.0 574.5,237.7 640.2,237.7 640.2,280.0 700.0,280.0" fill="none" stroke="#1f1f1d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="138.0" y="425.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="normal">视重 F / N</text><line x1="150.0" y1="426.1" x2="700.0" y2="426.1" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="430.1" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">0.447 = mg</text><line x1="150.0" y1="458.0" x2="700.0" y2="458.0" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="462.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">0.36</text><line x1="150.0" y1="392.0" x2="700.0" y2="392.0" stroke="#e4e3df" stroke-width="1" stroke-dasharray="3 3"/><text x="704.0" y="396.0" font-size="11" fill="#8a8984" text-anchor="start" font-weight="normal">0.54</text><polyline points="150.0,426.1 209.8,426.1 209.8,458.0 275.5,458.0 275.5,426.1 574.5,426.1 574.5,392.0 640.2,392.0 640.2,426.1 700.0,426.1" fill="none" stroke="#eb6834" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><line x1="209.8" y1="480.0" x2="209.8" y2="486.0" stroke="#8a8984" stroke-width="1"/><text x="209.8" y="502.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">0</text><line x1="275.5" y1="480.0" x2="275.5" y2="486.0" stroke="#8a8984" stroke-width="1"/><text x="275.5" y="502.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">0.33 s</text><line x1="574.5" y1="480.0" x2="574.5" y2="486.0" stroke="#8a8984" stroke-width="1"/><text x="574.5" y="502.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">1.83 s</text><line x1="640.2" y1="480.0" x2="640.2" y2="486.0" stroke="#8a8984" stroke-width="1"/><text x="640.2" y="502.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">2.16 s</text><text x="150.0" y="532.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">速度一直向下；视重却经历小于、等于、大于 mg 三段。判断超重失重看加速度方向，不看速度方向。</text></svg>