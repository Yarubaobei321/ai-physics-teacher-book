<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" width="760" height="394" font-family="'PingFang SC','Songti SC','Noto Sans CJK SC',sans-serif" role="img" aria-label="物理审核的路线"><title>物理审核的路线</title><rect width="760" height="394" fill="#ffffff"/><text x="20.0" y="28.0" font-size="15" fill="#1f1f1d" text-anchor="start" font-weight="bold">拿到 AI 交来的资源：先有预期，再看证据，对不上时追查</text><rect x="20" y="50" width="200" height="100" rx="8" fill="#fff" stroke="#1f1f1d" stroke-width="1.6"/><text x="120.0" y="74.0" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="bold">① 先写下预期</text><text x="120.0" y="94.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">用高中物理算一个关键状态</text><text x="120.0" y="111.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">例：圆弧轨道最高点 1 m/s、0.6 m</text><rect x="280" y="50" width="200" height="100" rx="8" fill="#fff" stroke="#1f1f1d" stroke-width="1.6"/><text x="380.0" y="74.0" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="bold">② 实际运行取证</text><text x="380.0" y="94.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">在浏览器里操作、打印、量</text><text x="380.0" y="111.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">不抄 AI 的“检查通过”</text><rect x="540" y="50" width="200" height="100" rx="8" fill="#fff" stroke="#1f1f1d" stroke-width="1.6"/><text x="640.0" y="74.0" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="bold">③ 并排比较</text><text x="640.0" y="94.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">原始条件 · 独立预期</text><text x="640.0" y="111.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">实际结果 · 怎样查的</text><line x1="220.0" y1="100.0" x2="278.0" y2="100.0" stroke="#52514e" stroke-width="1.6"/><path d="M278,100 l-8,-4 v8 z" fill="#52514e" transform="rotate(0.0 278 100)"/><line x1="480.0" y1="100.0" x2="538.0" y2="100.0" stroke="#52514e" stroke-width="1.6"/><path d="M538,100 l-8,-4 v8 z" fill="#52514e" transform="rotate(0.0 538 100)"/><rect x="540" y="200" width="200" height="90" rx="8" fill="#fff" stroke="#1baf7a" stroke-width="1.6"/><text x="640.0" y="224.0" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="bold">一致</text><text x="640.0" y="244.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">留下可复核的记录</text><text x="640.0" y="261.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">（第 3 章检查表）</text><rect x="220" y="200" width="280" height="140" rx="8" fill="#fff" stroke="#eb6834" stroke-width="1.6"/><text x="360.0" y="224.0" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="bold">不一致：先查最早的一环</text><text x="360.0" y="244.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">输入进没进计算？（第 16 章 P22）</text><text x="360.0" y="261.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">算法用了哪些数据？（第 2 章 1.500/1.467）</text><text x="360.0" y="278.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">报告和画面是同一份数据吗？（第 7 章）</text><text x="360.0" y="295.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">结果在物理上可能吗？（第 10 章 10.21 V > 9.3 V）</text><text x="360.0" y="312.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">测量本身可信吗？（第 9 章 端电压）</text><line x1="640.0" y1="150.0" x2="640.0" y2="198.0" stroke="#52514e" stroke-width="1.6"/><path d="M640,198 l-8,-4 v8 z" fill="#52514e" transform="rotate(90.0 640 198)"/><line x1="600.0" y1="150.0" x2="470.0" y2="198.0" stroke="#52514e" stroke-width="1.6"/><path d="M470,198 l-8,-4 v8 z" fill="#52514e" transform="rotate(159.7 470 198)"/><rect x="20" y="230" width="160" height="110" rx="8" fill="#fff" stroke="#1f1f1d" stroke-width="1.6"/><text x="100.0" y="254.0" font-size="14" fill="#1f1f1d" text-anchor="middle" font-weight="bold">一次只改一件事</text><text x="100.0" y="274.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">改前存旧版</text><text x="100.0" y="291.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">用同样参数复查</text><text x="100.0" y="308.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">也看没打算改的地方</text><line x1="220.0" y1="285.0" x2="182.0" y2="285.0" stroke="#52514e" stroke-width="1.6"/><path d="M182,285 l-8,-4 v8 z" fill="#52514e" transform="rotate(180.0 182 285)"/><line x1="100.0" y1="230.0" x2="100.0" y2="160.0" stroke="#52514e" stroke-width="1.6" stroke-dasharray="5 4"/><text x="108.0" y="196.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">回到 ①</text><text x="20.0" y="380.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">两个 AI 意见一致也可能一起错（第 3 章：都把拟合与逐差叫作“两个独立估计”）；裁决在教师。</text></svg>