="600.0" y2="340.0" stroke="#8a8984" stroke-width="1"/><text x="340.0" y="386.0" font-size="14" fill="#52514e" text-anchor="middle" font-weight="normal">遮光片宽度 d（越往右越窄，区间越短）</text><text x="80.0" y="28.0" font-size="14" fill="#1f1f1d" text-anchor="start" font-weight="bold">两种误差随遮光片宽度变化（第 3 章构造算例：v₀ = 0.50 m/s，a = 0.50 m/s²）</text><polyline points="80.0,88.7 253.3,211.1 426.7,275.6 600.0,307.8" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polyline points="80.0,307.8 253.3,275.6 426.7,204.7 600.0,75.8" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="80.0" cy="88.7" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/><circle cx="253.3" cy="211.1" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/><circle cx="426.7" cy="275.6" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/><circle cx="600.0" cy="307.8" r="4.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/><circle cx="80.0" cy="307.8" r="4.5" fill="#eb6834" stroke="#fff" stroke-width="2"/><circle cx="253.3" cy="275.6" r="4.5" fill="#eb6834" stroke="#fff" stroke-width="2"/><circle cx="426.7" cy="204.7" r="4.5" fill="#eb6834" stroke="#fff" stroke-width="2"/><circle cx="600.0" cy="75.8" r="4.5" fill="#eb6834" stroke="#fff" stroke-width="2"/><rect x="253.3" y="50" width="173.3" height="290" fill="#2a78d6" opacity="0.07"/><text x="340.0" y="68.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal">两者相当：1—2 cm</text><text x="612.0" y="311.8" font-size="13" fill="#1f1f1d" text-anchor="start" font-weight="normal">平均速度偏离</text><text x="612.0" y="328.8" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">前缘速度（实线）</text><text x="612.0" y="79.8" font-size="13" fill="#1f1f1d" text-anchor="start" font-weight="normal">宽度与计时的</text><text x="612.0" y="96.8" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">相对不确定度（虚线）</text><text x="80.0" y="430.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal">同一个取舍还出现在：超声波测速的五点拟合窗口、第 5 章电梯曲线的滤波截止频率——区间越短越接近“瞬时”，噪声也越大。</text></svg>