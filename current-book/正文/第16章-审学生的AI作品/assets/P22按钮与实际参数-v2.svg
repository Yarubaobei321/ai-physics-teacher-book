<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="455" viewBox="0 0 1160 455" role="img" aria-labelledby="title desc">
  <title id="title">P22按钮标示参数与实际计算参数</title>
  <desc id="desc">按钮标示3、5、6、1，点击后页面仍使用2、5、2、0；独立预期与页面显示对照。</desc>
  
<defs>
  
  <style>
    text { font-family: "PingFang SC", sans-serif; fill: #172234; }
    .head { font-size: 33px; font-weight: 700; }
    .body { font-size: 29px; }
    .small { font-size: 26px; }
    .note { font-size: 26px; fill: #394657; }
    .count { font-size: 40px; font-weight: 700; }
    .box { fill: #fff; stroke: #273548; stroke-width: 2; }
    .shade { fill: #f0f0f0; stroke: #273548; stroke-width: 2; }
    .light { fill: #fafafa; stroke: #435067; stroke-width: 1.6; }
    .rule { stroke: #273548; stroke-width: 2; fill: none; }
    .thin { stroke: #65758b; stroke-width: 1.4; fill: none; }
    .arrow { stroke: #273548; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .return { stroke: #394657; stroke-width: 2.2; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
  </style>

  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <path d="M0,0 L10,4 L0,8 Z" fill="#273548"/>
  </marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#65758b" stroke-width="2"/>
  </pattern>
</defs>

  <rect width="100%" height="100%" fill="#fff"/>
  
  <line x1="580" y1="25" x2="580" y2="350" class="rule"/>
  <g transform="translate(30 22)">
    <rect width="520" height="328" class="box"/>
    <rect width="520" height="55" fill="#e8f2fb"/>
    <text x="260" y="38" text-anchor="middle" class="head">按钮标示的条件</text>
    <text x="28" y="103" class="body">m<tspan baseline-shift="sub" font-size="23">1</tspan> = 3 kg，v<tspan baseline-shift="sub" font-size="23">1</tspan> = 5 m/s</text>
    <text x="28" y="145" class="body">m<tspan baseline-shift="sub" font-size="23">2</tspan> = 6 kg，v<tspan baseline-shift="sub" font-size="23">2</tspan> = 1 m/s</text>
    <line x1="28" y1="170" x2="492" y2="170" class="thin"/>
    <text x="28" y="207" class="small">若这组参数进入计算，独立预期为</text>
    <text x="28" y="252" class="body">p = 3×5 + 6×1 = 21 kg·m/s</text>
    <text x="28" y="298" class="body">E<tspan baseline-shift="sub" font-size="23">k</tspan> = ½×3×5² + ½×6×1² = 40.5 J</text>
  </g>
  <g transform="translate(610 22)">
    <rect width="520" height="328" class="box"/>
    <rect width="520" height="55" fill="#fff3df"/>
    <text x="260" y="38" text-anchor="middle" class="head">点击后的实际条件</text>
    <text x="28" y="103" class="body">m<tspan baseline-shift="sub" font-size="23">1</tspan> = 2 kg，v<tspan baseline-shift="sub" font-size="23">1</tspan> = 5 m/s</text>
    <text x="28" y="145" class="body">m<tspan baseline-shift="sub" font-size="23">2</tspan> = 2 kg，v<tspan baseline-shift="sub" font-size="23">2</tspan> = 0</text>
    <line x1="28" y1="170" x2="492" y2="170" class="thin"/>
    <text x="28" y="207" class="small">守恒表仍对应默认算例</text>
    <text x="28" y="252" class="body">总动量 10 kg·m/s，标为守恒</text>
    <text x="28" y="298" class="body">总动能 25 J，标为弹性碰撞守恒</text>
  </g>
  <line x1="30" y1="383" x2="1130" y2="383" class="thin"/>
  <text x="30" y="419" class="note">核对结论：按钮标示与实际计算使用了两组参数；默认算例本身另算。</text>

</svg>
