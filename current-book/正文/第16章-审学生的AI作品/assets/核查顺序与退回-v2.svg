<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="400" viewBox="0 0 1720 400"><title>核查顺序与定向退回</title><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8Z" fill="#273548"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172234}.head{font-size:27px;font-weight:600}.body{font-size:25px}.arrow{fill:none;stroke:#273548;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1720" height="400" fill="white"/><g transform="translate(20 25)"><rect width="310" height="175" fill="white" stroke="#273548" stroke-width="2"/><rect width="310" height="54" fill="#e8f2fb"/><text x="15" y="36" class="head">1 对象与条件</text><text x="20" y="100" class="body">系统、参考、理想化</text><text x="20" y="143" class="body">数据怎样得到</text></g><path d="M333 112H355" class="arrow"/><g transform="translate(360 25)"><rect width="310" height="175" fill="white" stroke="#273548" stroke-width="2"/><rect width="310" height="54" fill="#e8f6ef"/><text x="15" y="36" class="head">2 公式、数值与单位</text><text x="20" y="100" class="body">手算、单位、数量级</text><text x="20" y="143" class="body">公式适用条件</text></g><path d="M673 112H695" class="arrow"/><g transform="translate(700 25)"><rect width="310" height="175" fill="white" stroke="#273548" stroke-width="2"/><rect width="310" height="54" fill="#fff3df"/><text x="15" y="36" class="head">3 参数载入</text><text x="20" y="100" class="body">按钮和滑块</text><text x="20" y="143" class="body">是否改变模型输入</text></g><path d="M1013 112H1035" class="arrow"/><g transform="translate(1040 25)"><rect width="310" height="175" fill="white" stroke="#273548" stroke-width="2"/><rect width="310" height="54" fill="#f1edfa"/><text x="15" y="36" class="head">4 事件状态</text><text x="20" y="100" class="body">初态、末态</text><text x="20" y="143" class="body">是否属于同一事件</text></g><path d="M1353 112H1375" class="arrow"/><g transform="translate(1380 25)"><rect width="310" height="175" fill="white" stroke="#273548" stroke-width="2"/><rect width="310" height="54" fill="#e5ebf3"/><text x="15" y="36" class="head">5 表达一致</text><text x="20" y="100" class="body">动画、图、表、文字</text><text x="20" y="143" class="body">同条件、同一时刻</text></g><path d="M1535 207V255H855V208" class="arrow" stroke-dasharray="8 7"/><text x="1195" y="305" text-anchor="middle" class="body">图表冲突源于参数未载入 → 返回第 3 步</text><text x="20" y="371" font-size="25">遇到矛盾，先退回最早失效的环节，再继续后面的物理判断。</text></svg>