<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" role="img" aria-labelledby="title desc"><title id="title">同样返回底端，地面运动有三种结果</title><desc id="desc">m与M分别为1和3、1和1、3和1千克；分离时滑块地面速度分别为负2、0、正2米每秒，轨道速度分别为正2、正4、正6米每秒。所有情境相对轨道都向左离开。</desc><defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c97428"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2474ac"/></marker></defs><rect width="800" height="700" fill="#f7fafb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#20364c"><text x="30" y="45" font-size="29" font-weight="600">同样返回底端，地面运动有三种结果</text><text x="30" y="80" font-size="21">分离瞬间　橙色表示滑块 m，蓝色表示自由轨道 M</text><rect x="20" y="110" width="760" height="174" rx="9" fill="white"/><text x="40" y="155" font-size="26" font-weight="600">滑块向左</text><text x="40" y="192" font-size="22">m=1 kg，M=3 kg</text><path d="M345 215 A90 90 0 0 0 435 125" fill="none" stroke="#2474ac" stroke-width="6"/><line x1="270" y1="267" x2="742" y2="267" stroke="#9baab3" stroke-width="2"/><circle cx="345" cy="215" r="11" fill="#c97428"/><text x="455" y="155" font-size="22" fill="#2474ac">V=+2 m/s</text><line x1="455" y1="173" x2="495" y2="173" stroke="#2474ac" stroke-width="4" marker-end="url(#blue)"/><line x1="345" y1="240" x2="305" y2="240" stroke="#c97428" stroke-width="4" marker-end="url(#orange)"/><text x="405" y="248" font-size="22" fill="#a9601e">vₓ=−2 m/s</text><rect x="20" y="295" width="760" height="174" rx="9" fill="white"/><text x="40" y="340" font-size="26" font-weight="600">滑块静止</text><text x="40" y="377" font-size="22">m=1 kg，M=1 kg</text><path d="M345 400 A90 90 0 0 0 435 310" fill="none" stroke="#2474ac" stroke-width="6"/><line x1="270" y1="452" x2="742" y2="452" stroke="#9baab3" stroke-width="2"/><circle cx="345" cy="400" r="11" fill="#c97428"/><text x="455" y="340" font-size="22" fill="#2474ac">V=+4 m/s</text><line x1="455" y1="358" x2="535" y2="358" stroke="#2474ac" stroke-width="4" marker-end="url(#blue)"/><text x="405" y="433" font-size="22" fill="#a9601e">vₓ=0 m/s</text><rect x="20" y="480" width="760" height="174" rx="9" fill="white"/><text x="40" y="525" font-size="26" font-weight="600">滑块向右</text><text x="40" y="562" font-size="22">m=3 kg，M=1 kg</text><path d="M345 585 A90 90 0 0 0 435 495" fill="none" stroke="#2474ac" stroke-width="6"/><line x1="270" y1="637" x2="742" y2="637" stroke="#9baab3" stroke-width="2"/><circle cx="345" cy="585" r="11" fill="#c97428"/><text x="455" y="525" font-size="22" fill="#2474ac">V=+6 m/s</text><line x1="455" y1="543" x2="575" y2="543" stroke="#2474ac" stroke-width="4" marker-end="url(#blue)"/><line x1="345" y1="610" x2="385" y2="610" stroke="#c97428" stroke-width="4" marker-end="url(#orange)"/><text x="405" y="618" font-size="22" fill="#a9601e">vₓ=+2 m/s</text><text x="30" y="687" font-size="21">三种情境都相对轨道向左离开　vₓ − V = −4 m/s</text></g></svg>