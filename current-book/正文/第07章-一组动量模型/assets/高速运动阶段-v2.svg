<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1580" viewBox="0 0 800 1580" role="img" aria-labelledby="title desc">
<title id="title">高速圆弧运动：地面斜抛与相对轨道的竖直往返</title><desc id="desc">u6 m1 M3 R1 g10。到顶水平速度双方1.5，滑块竖直速度sqrt7。飞行地面轨迹为斜抛，最高高度1.35；相对匀速轨道竖直往返，额外上升0.35。回接竖直速度负sqrt7并连续进入轨道，底端分离滑块负3轨道正3。</desc>
<defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#D8751B"/></marker><marker id="orange-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#D8751B"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2875AD"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#2875AD"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#233849"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#233849"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7D8993"/></marker><marker id="gray-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#7D8993"/></marker></defs>
<rect width="800" height="1580" fill="white"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="57" font-size="36" fill="#233849" font-weight="650" text-anchor="start">高速：离轨、飞行与回接</text><text x="40" y="102" font-size="23" fill="#233849" font-weight="400" text-anchor="start">m=1 kg，M=3 kg，R=1 m，g=10 m/s²，u=6 m/s</text><rect x="24" y="125" width="752" height="643" rx="18" fill="white" stroke="#DCE5EB" stroke-width="2"/><text x="48" y="173" font-size="29" fill="#233849" font-weight="600" text-anchor="start">① 地面参考系：滑块做斜抛</text><path d="M 95,650 A 200,200 0 0 0 295,450 L 295,650 Z" fill="#DDECF6" fill-opacity="0.22" stroke="#2875AD" stroke-width="3" stroke-dasharray="8 6" opacity="0.45"/><path d="M 253.745,650 A 200,200 0 0 0 453.745,450 L 453.745,650 Z" fill="#DDECF6" fill-opacity="0.8" stroke="#2875AD" stroke-width="3"/><line x1="68" y1="650" x2="739" y2="650" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)"/><line x1="68" y1="650" x2="68" y2="266" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)"/><text x="740" y="686" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">x</text><text x="54" y="247" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">y</text><path d="M 295,450 Q 374.37253933193773,310.0 453.74507866387546,450" fill="none" stroke="#D8751B" stroke-width="4"/><line x1="573" y1="380" x2="652" y2="380" stroke="#7D8993" stroke-width="1" stroke-dasharray="5 5"/><line x1="389.373" y1="380" x2="563" y2="380" stroke="#7D8993" stroke-width="1" stroke-dasharray="5 5"/><line x1="638" y1="650" x2="638" y2="380" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)" marker-start="url(#gray-start)"/><text x="647" y="551" font-size="23" fill="#233849" font-weight="400" text-anchor="start">1.35 m</text><line x1="295" y1="450" x2="459.745" y2="450" stroke="#7D8993" stroke-width="1" stroke-dasharray="6 5"/><line x1="295" y1="450" x2="340" y2="450" stroke="#D8751B" stroke-width="3" marker-end="url(#orange)"/><line x1="295" y1="450" x2="295" y2="370.627" stroke="#D8751B" stroke-width="3" marker-end="url(#orange)"/><circle cx="295" cy="450" r="9" fill="#D8751B" stroke="white" stroke-width="2"/><text x="108" y="331" font-size="25" fill="#D8751B" font-weight="400" text-anchor="start">离轨：</text><text x="108" y="365" font-size="25" fill="#D8751B" font-weight="400" text-anchor="start">v<tspan baseline-shift="sub" font-size="70%">y</tspan> = √7 m/s</text><text x="94" y="493" font-size="24" fill="#D8751B" font-weight="400" text-anchor="start">vₓ = 1.5 m/s</text><text x="247" y="427" font-size="24" fill="#D8751B" font-weight="600" text-anchor="start">A</text><circle cx="374.373" cy="380" r="8" fill="#D8751B" stroke="white" stroke-width="2"/><line x1="374.373" y1="371" x2="395.373" y2="333" stroke="#D8751B" stroke-width="1"/><text x="387" y="285" font-size="25" fill="#D8751B" font-weight="600" text-anchor="start">B 最高点</text><text x="387" y="320" font-size="24" fill="#D8751B" font-weight="400" text-anchor="start">v<tspan baseline-shift="sub" font-size="70%">y</tspan> = 0</text><line x1="453.745" y1="450" x2="498.745" y2="450" stroke="#D8751B" stroke-width="3" marker-end="url(#orange)"/><line x1="453.745" y1="450" x2="453.745" y2="529.373" stroke="#D8751B" stroke-width="3" marker-end="url(#orange)"/><circle cx="453.745" cy="450" r="9" fill="#D8751B" stroke="white" stroke-width="2"/><text x="468.745" y="427" font-size="24" fill="#D8751B" font-weight="600" text-anchor="start">C</text><text x="481" y="470" font-size="24" fill="#D8751B" font-weight="400" text-anchor="start">vₓ = 1.5 m/s</text><text x="477" y="527" font-size="24" fill="#D8751B" font-weight="400" text-anchor="start">v<tspan baseline-shift="sub" font-size="70%">y</tspan> = −√7 m/s</text><text x="91" y="695" font-size="23" fill="#2875AD" font-weight="400" text-anchor="start">虚线：离轨时轨道</text><text x="367" y="695" font-size="23" fill="#2875AD" font-weight="400" text-anchor="start">实线：回接时轨道</text><text x="48" y="743" font-size="25" fill="#233849" font-weight="400" text-anchor="start">飞行中轨道以 1.5 m/s 向右匀速移动。</text><rect x="24" y="792" width="752" height="439" rx="18" fill="white" stroke="#DCE5EB" stroke-width="2"/><text x="48" y="840" font-size="29" fill="#233849" font-weight="600" text-anchor="start">② 相对轨道：沿同一竖直线往返</text><path d="M 366,1190 A 220,220 0 0 0 586,970 L 586,1190 Z" fill="#DDECF6" fill-opacity="0.8" stroke="#2875AD" stroke-width="3"/><line x1="63" y1="1190" x2="735" y2="1190" stroke="#7D8993" stroke-width="2"/><line x1="586" y1="970" x2="586" y2="893" stroke="#D8751B" stroke-width="3"/><line x1="586" y1="927" x2="586" y2="908" stroke="#D8751B" stroke-width="3" marker-end="url(#orange)"/><line x1="586" y1="936" x2="586" y2="955" stroke="#D8751B" stroke-width="3" marker-end="url(#orange)"/><circle cx="586" cy="970" r="9" fill="#D8751B" stroke="white" stroke-width="2"/><circle cx="586" cy="893" r="8" fill="#D8751B" stroke="white" stroke-width="2"/><text x="625" y="923" font-size="24" fill="#D8751B" font-weight="400" text-anchor="start">0.35 m</text><line x1="596" y1="893" x2="638" y2="893" stroke="#7D8993" stroke-width="1" stroke-dasharray="5 5"/><line x1="596" y1="970" x2="638" y2="970" stroke="#7D8993" stroke-width="1" stroke-dasharray="5 5"/><text x="48" y="916" font-size="26" fill="#233849" font-weight="400" text-anchor="start">相对水平速度为 0</text><text x="48" y="960" font-size="26" fill="#233849" font-weight="400" text-anchor="start">从端点上升 0.35 m</text><text x="48" y="1004" font-size="26" fill="#233849" font-weight="400" text-anchor="start">再沿同一直线落回。</text><text x="48" y="1083" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">此幅采用随轨道</text><text x="48" y="1121" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">匀速移动的参考系。</text><text x="545" y="1153" font-size="29" fill="#2875AD" font-weight="600" text-anchor="start">M</text><rect x="24" y="1255" width="752" height="245" rx="18" fill="white" stroke="#DCE5EB" stroke-width="2"/><text x="48" y="1304" font-size="28" fill="#233849" font-weight="600" text-anchor="start">③ 切向回接，再下滑到底端分离</text><text x="48" y="1353" font-size="25" fill="#233849" font-weight="400" text-anchor="start">回接时位置、速度连续，不增加反弹。</text><text x="48" y="1399" font-size="25" fill="#233849" font-weight="400" text-anchor="start">底端分离：滑块 −3 m/s；轨道 +3 m/s。</text><line x1="208" y1="1452" x2="124" y2="1452" stroke="#D8751B" stroke-width="4" marker-end="url(#orange)"/><text x="230" y="1461" font-size="28" fill="#D8751B" font-weight="400" text-anchor="start">m</text><text x="477" y="1461" font-size="28" fill="#2875AD" font-weight="400" text-anchor="start">M</text><line x1="527" y1="1452" x2="611" y2="1452" stroke="#2875AD" stroke-width="4" marker-end="url(#blue)"/><text x="40" y="1548" font-size="22" fill="#7D8993" font-weight="400" text-anchor="start"></text></g>
</svg>