<svg xmlns="http://www.w3.org/2000/svg" width="800" height="935" viewBox="0 0 800 935" role="img" aria-labelledby="title desc">
<title id="title">教程模型：质点滑块与可移动四分之一圆弧轨道</title><desc id="desc">白底科学示意。圆弧底端切线水平，上端切线竖直。圆心C位于底端正上方，角度theta从竖直向下的半径量起。m为不滚动质点，M轨道只作水平平移。</desc>
<defs><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#D8751B"/></marker><marker id="orange-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#D8751B"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2875AD"/></marker><marker id="blue-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#2875AD"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#233849"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#233849"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7D8993"/></marker><marker id="gray-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,5 L10,10 Z" fill="#7D8993"/></marker></defs>
<rect width="800" height="935" fill="white"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="57" font-size="36" fill="#233849" font-weight="650" text-anchor="start">本教程采用的物理模型</text><text x="40" y="103" font-size="26" fill="#233849" font-weight="400" text-anchor="start">质点滑块 m ＋ 可水平移动的轨道 M</text><text x="40" y="149" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">地面参考系：向右、向上为正</text><path d="M 210,640 A 330,330 0 0 0 540,310 L 540,640 Z" fill="#DDECF6" fill-opacity="0.8" stroke="#2875AD" stroke-width="3"/><line x1="76" y1="640" x2="752" y2="640" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)"/><line x1="76" y1="640" x2="76" y2="218" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)"/><text x="754" y="678" font-size="26" fill="#233849" font-weight="400" text-anchor="start">x</text><text x="61" y="201" font-size="26" fill="#233849" font-weight="400" text-anchor="start">y</text><text x="53" y="678" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">O</text><line x1="210" y1="310" x2="210" y2="640" stroke="#7D8993" stroke-width="2" stroke-dasharray="7 6"/><line x1="210" y1="310" x2="470.044" y2="513.168" stroke="#7D8993" stroke-width="2" stroke-dasharray="7 6"/><circle cx="210" cy="310" r="4" fill="#7D8993" stroke="white" stroke-width="2"/><text x="181" y="297" font-size="24" fill="#7D8993" font-weight="400" text-anchor="start">C</text><text x="330" y="393" font-size="28" fill="#7D8993" font-weight="400" text-anchor="start">R</text><path d="M 210,378 A 68,68 0 0 0 263.5847312452571,351.8649803221448" fill="none" stroke="#7D8993" stroke-width="2"/><text x="246" y="392" font-size="26" fill="#233849" font-weight="400" text-anchor="start">θ</text><line x1="540" y1="252" x2="540" y2="377" stroke="#7D8993" stroke-width="2" stroke-dasharray="6 5"/><text x="568" y="282" font-size="24" fill="#233849" font-weight="400" text-anchor="start">上端切线</text><text x="568" y="316" font-size="24" fill="#233849" font-weight="400" text-anchor="start">竖直</text><line x1="510" y1="295" x2="537" y2="295" stroke="#7D8993" stroke-width="2"/><circle cx="470.044" cy="513.168" r="11" fill="#D8751B" stroke="white" stroke-width="2"/><line x1="481.044" y1="506.168" x2="575" y2="460" stroke="#D8751B" stroke-width="2"/><text x="586" y="451" font-size="28" fill="#D8751B" font-weight="600" text-anchor="start">滑块 m</text><text x="586" y="486" font-size="24" fill="#D8751B" font-weight="400" text-anchor="start">视为质点</text><text x="415" y="609" font-size="28" fill="#2875AD" font-weight="600" text-anchor="start">轨道 M</text><line x1="79" y1="710" x2="210" y2="710" stroke="#7D8993" stroke-width="2" marker-end="url(#gray)" marker-start="url(#gray-start)"/><line x1="210" y1="654" x2="210" y2="718" stroke="#7D8993" stroke-width="1"/><text x="139" y="699" font-size="25" fill="#7D8993" font-weight="400" text-anchor="middle">X</text><line x1="355" y1="711" x2="463" y2="711" stroke="#2875AD" stroke-width="4" marker-end="url(#blue)"/><text x="480" y="720" font-size="26" fill="#2875AD" font-weight="400" text-anchor="start">仅水平平移</text><text x="210" y="755" font-size="25" fill="#233849" font-weight="400" text-anchor="start">底端切线水平，与地面平滑衔接</text><text x="40" y="816" font-size="25" fill="#233849" font-weight="400" text-anchor="start">接触面、地面光滑；轨道不转动；滑块不滚动</text><text x="40" y="863" font-size="25" fill="#233849" font-weight="400" text-anchor="start">x = X + R sinθ，y = R(1 − cosθ)</text><text x="40" y="905" font-size="22" fill="#7D8993" font-weight="400" text-anchor="start">原创几何示意；不代表网页运行结果</text></g>
</svg>