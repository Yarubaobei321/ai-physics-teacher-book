      {n:11,p:3,t:'三种方案放在一起，比较为什么没有发生',q:'三种验证机械能守恒方案同时出现，为什么仍只汇报各自方案？',c:'并列方案不会自动生成比较；需要共同比较轴、跨组角色、冲突追问和教师推进。',v:['还原自由落体、圆柱摆DIS和气垫导轨三条路径','还原六组与同方案一报一问的组织结构','分析教师引导停在同方案互审的位置','把对象、边界、速度获取、数据身份、误差和结论并排','记录同一课例由校内授课/打磨到王硕区级公开课的版本链'],s:['H02','H02-M4','W02','H08'],b:'第8章解释共同数字入口；本章只分析跨证据比较。取消黄／王双案例。',g:'各轮日期、贡献和未比较出现轮次待补；改进任务未复测。',f:true},
      {n:12,p:3,t:'一道题做完以后，学生到底是怎么想的',q:'公式和答案之外，怎样识别模型选择、条件连接和错误修正？',c:'分开原始表达、转写不确定、物理节点、关系断点和诊断假设，并把诊断转成下一任务。',v:['建立教师可审读的标准推理树','区分表达证据与诊断推断','从单摆／速度数据寻找真实推理过程','诊断只落到可验证追问，不贴能力标签'],s:['C02','W03','H01-B'],b:'聚焦一道题或数据任务中的推理；没有厚案例时与第13章合并。',g:'授权题、标准推理树、典型错误和误判记录均未齐。',conditional:true},
      {n:13,p:3,t:'对话里说对了，作品里为什么仍会出错',q:'教师怎样判断学生已经作出的物理判断、判断停点和下一步反馈？',c:'过程和成品是两条证据轨；保留学生说对的关系，补条件与验证要求，再检查是否进入成品。',v:['从158条消息中选择2—4个脱敏厚案例','并排学生原话、AI实现、成品和教师复核','用保留关系—补足条件—要求验证形成反馈','只有过程证据支持时才判断角色责任','严力耕材料只比较任务组织层'],s:['H01-B','H01','Y03'],b:'只分析学生过程判断，不重复第6章成品技术核查。P06跨章时承担不同证据角色。',g:'需作者选定2—4个代表案例与可公开图件。',f:true},
      {n:14,p:3,t:'选择一种技术以前，先看它要提供什么证据',q:'真实实验、教具、网页、传感器和AI都可用时怎样选择？',c:'先确定真实对象、所需证据、学生动作和维护成本，再决定媒介是否值得进入。',v:['按证据需求选择媒介','丁龙概念课与严力耕超失重仪只作相邻互补','双头光电门、HX711与ADS1220按测量条件比较','保留不使用和暂不自研的选择','删除机械能虚假双案例'],s:['D01','Y02','H08','H09','H06','H05'],b:'机械能H02/W02只作同一课例版本链，不进入比较。',g:'缺第二组真正独立比较；保留、并第2章或等待材料待裁决。',conditional:true,f:true},
      {n:15,p:4,t:'做了以后，什么证据能说明它有用',q:'页面、公开课、奖项和报道分别允许把价值说到哪里？',c:'项目存在、技术运行、物理正确、课堂使用、学习过程、学习变化和迁移价值是不同证据层次。',v:['用真实材料建立证据梯度','让学生、课堂、开发和合著材料互相校正','证据不足时仍写清边界和下一次补证','区分奖项、专利、申报与实践结果'],s:['H01—H11','W01—W05','Y01—Y04','D01','C05','H11'],b:'提供全书主张上限，不重复各章完整案例。',g:'需逐项核精度、法律状态、课堂效果和长期稳定的主张上限。'},
      {n:16,p:4,t:'一次实践怎样留下来、传开去、继续生长',q:'一项实践怎样被维护、分享、接手并长出下一轮问题？',c:'保存版本、责任、失败、步骤、边界和停止条件；新AI想法经过转译与实践门再入书。',v:['反馈按原话—澄清—取舍—修改—复验进入版本','页面、设备、图件、链接和授权责任可见','区分单页、模板、课程、技能包和系统的复用门槛','四位作者保留各自传播与沉淀路径','S1—S4通过最小作品、校验和审读后再入书','后台项目只在改变读者判断时进入'],s:['H03','H05','H07','W05','Y04','D01','C01—C05'],b:'第8章处理升格最低条件；本章处理长期维护、传播和新一轮生长。',g:'需找到至少一项由他人实际审读、接手或提出反馈的记录。'}
    ];
    const side=document.getElementById('sideNav'), root=document.getElementById('chapters');
    for(const p of [1,2,3,4]){
      const h=document.createElement('div');h.className='part-title';h.textContent=parts[p];side.appendChild(h);
      chapters.filter(c=>c.p===p).forEach(c=>{const a=document.createElement('a');a.href='#ch'+c.n;a.className='side-link'+(c.f?' focus':'');a.textContent=String(c.n).padStart(2,'0')+' '+c.t;side.appendChild(a)});
      const ph=document.createElement('div');ph.className='part-head';ph.dataset.part=p;ph.innerHTML=`<h2>${parts[p]}</h2><span>${chapters.filter(c=>c.p===p).length}章</span>`;root.appendChild(ph);
      chapters.filter(c=>c.p===p).forEach(c=>root.appendChild(makeCard(c)));
    }
    function makeCard(c){
      const el=document.createElement('article');el.id='ch'+c.n;el.className='chapter'+(c.f?' focus':'');el.dataset.part=c.p;el.dataset.n=c.n;
      el.innerHTML=`<div class="chapter-head"><div class="num">${String(c.n).padStart(2,'0')}</div><div><h3>${c.t}</h3><p class="question">${c.q}</p></div><span class="badge">${c.f?'优先裁决':c.conditional?'条件章':'待讨论'}</span></div><div class="chapter-body"><p class="core">${c.c}</p><div class="grid"><div class="block"><h4>价值点怎样展开</h4><ul>${c.v.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><div class="block"><h4>本地材料（点击打开Markdown卡）</h4><div class="sources">${c.s.map(x=>materialLinks[x]?`<a class="source" href="../../01_SOURCE/材料卡/${materialLinks[x]}" title="打开${x}材料卡">${x}</a>`:`<span class="source">${x}</span>`).join('')}</div></div><div class="block boundary" style="margin-top:10px"><h4>跨章边界</h4>${c.b}</div><div class="block gap" style="margin-top:10px"><h4>当前缺口</h4>${c.g}</div></div></div><div class="decision"><select aria-label="第${c.n}章临时状态" data-state="${c.n}"><option>待讨论</option><option>采用候选</option><option>需要修改</option><option>补材料后再审</option><option>并章／移章</option><option>暂缓／撤回</option></select><textarea aria-label="第${c.n}章临时批注" data-note="${c.n}" placeholder="本页临时批注；正式结论请回写Markdown裁决稿"></textarea></div><div class="decision-note">浏览器暂存，不自动修改项目文件。</div></div>`;
      return el;
    }
    const key='book16-review-20260830';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
    document.querySelectorAll('[data-state]').forEach(x=>{const n=x.dataset.state;if(saved[n])x.value=saved[n].state||'待讨论';x.addEventListener('change',save)});
    document.querySelectorAll('[data-note]').forEach(x=>{const n=x.dataset.note;if(saved[n])x.value=saved[n].note||'';x.addEventListener('input',save)});
    function save(){const data={};chapters.forEach(c=>{data[c.n]={state:document.querySelector(`[data-state="${c.n}"]`).value,note:document.querySelector(`[data-note="${c.n}"]`).value}});localStorage.setItem(key,JSON.stringify(data))}
    function applyFilter(){const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('filter').value;document.querySelectorAll('.chapter').forEach(el=>{const c=chapters.find(x=>x.n==el.dataset.n);const passText=!q||el.textContent.toLowerCase().includes(q);const passFilter=f==='all'||(f==='focus'&&[1,4,5,7,11,14].includes(c.n))||(f==='coauthor'&&[4,9,10].includes(c.n))||(f==='conditional'&&c.conditional);el.classList.toggle('hidden',!(passText&&passFilter))});document.querySelectorAll('.part-head').forEach(h=>{const any=[...document.querySelectorAll(`.chapter[data-part="${h.dataset.part}"]`)].some(x=>!x.classList.contains('hidden'));h.classList.toggle('hidden',!any)})}
    document.getElementById('search').addEventListener('input',applyFilter);document.getElementById('filter').addEventListener('change',applyFilter);
    document.getElementById('export').addEventListener('click',()=>{save();const lines=['# 全书16章HTML临时批注','',`导出时间：${new Date().toLocaleString()}`,'','> 本文件为浏览器临时批注，正式裁决仍需回写项目Markdown。',''];chapters.forEach(c=>{const state=document.querySelector(`[data-state="${c.n}"]`).value,note=document.querySelector(`[data-note="${c.n}"]`).value.trim();if(state!=='待讨论'||note){lines.push(`## 第${c.n}章 ${c.t}`,'',`- 状态：${state}`,`- 批注：${note||'（无）'}`,'')}});const blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='全书16章HTML临时批注.md';a.click();URL.revokeObjectURL(a.href)});
  </script>
