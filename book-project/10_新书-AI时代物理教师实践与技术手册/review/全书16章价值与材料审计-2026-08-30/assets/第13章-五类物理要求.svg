<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">学生提出的五类物理要求</title>
  <desc id="desc">五类可重叠要求的并列横条，人数分别为5、8、2、14、8。</desc>
  <defs><style>.t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#23313d}.h{font-size:30px;font-weight:700}.b{font-size:22px}.s{font-size:18px;fill:#5d6975}.v{font-size:24px;font-weight:700;fill:#fff}</style></defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafb"/>
  <text x="55" y="62" class="h">25份作业中出现的物理要求：五类并列，不是递进阶梯</text>
  <g transform="translate(55 105)">
    <text x="0" y="42" class="b">要求知识准确、概念正确或保证科学性</text><rect x="470" y="12" width="250" height="42" rx="8" fill="#6689a6"/><text x="735" y="42" class="b">5份</text>
    <text x="0" y="132" class="b">限定高中课程范围或不得超纲</text><rect x="470" y="102" width="400" height="42" rx="8" fill="#6d879a"/><text x="885" y="132" class="b">8份</text>
    <text x="0" y="222" class="b">要求符合理论依据或物理规律</text><rect x="470" y="192" width="100" height="42" rx="8" fill="#a48c3f"/><text x="585" y="222" class="b">2份</text>
    <text x="0" y="312" class="b">指出具体对象、条件、关系或时刻</text><rect x="470" y="282" width="700" height="42" rx="8" fill="#3f8068"/><text x="1120" y="312" class="v" text-anchor="end">14份</text>
    <text x="0" y="402" class="b">要求保留关键状态、计算或检查材料</text><rect x="470" y="372" width="400" height="42" rx="8" fill="#9b6f59"/><text x="885" y="402" class="b">8份</text>
  </g>
  <rect x="55" y="545" width="1090" height="63" rx="12" fill="#edf1f4"/><text x="80" y="584" class="s">读图提醒：同一份作业可以进入多行；这些数量不能相加，也不能换算成学生能力等级。</text>
</svg>
