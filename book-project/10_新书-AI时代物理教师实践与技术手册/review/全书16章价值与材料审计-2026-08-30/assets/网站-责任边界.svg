<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <title id="title">教师、AI与教学网站围绕同一课例协同</title>
  <desc id="desc">教师提出器材、物理模型、课堂流程和发布标准，AI完成实现、调试和候选方案，教学网站提供集成页面、移动端优化、固定域名和版本更新，真实课堂通过平板录入、即时反馈和无线投屏产生下一轮设计需求。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#394657"/></marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#172234}.title{font-size:36px;font-weight:750}.region-title{font-size:20px;font-weight:700;letter-spacing:1px}.head{font-size:27px;font-weight:750;fill:#fff}.body{font-size:18px;font-weight:600}.sub{font-size:16px;fill:#435067}.label{font-size:17px;font-weight:700;fill:#273548}.footer{font-size:19px;font-weight:650;fill:#273548}.region{stroke:#a9b2bf;stroke-width:2;stroke-dasharray:9 7}.card{stroke-width:3}.line{fill:none;stroke:#394657;stroke-width:3;marker-end:url(#arrow)}.feedback{fill:none;stroke:#394657;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1320" height="780" fill="#f5f7fa"/>
  <text x="660" y="58" text-anchor="middle" class="title">教师、AI与教学网站围绕同一课例协同</text>
  <rect x="42" y="92" width="555" height="560" rx="22" fill="#f8fbfd" class="region"/>
  <text x="70" y="128" class="region-title">设计与验收</text>
  <rect x="723" y="92" width="555" height="560" rx="22" fill="#fcfaf7" class="region"/>
  <text x="751" y="128" class="region-title">发布与教学</text>
  <g aria-label="教师专业判断">
    <rect x="92" y="158" width="455" height="154" rx="18" fill="#fff" stroke="#2f73a3" class="card"/>
    <path d="M110 158 H529 Q547 158 547 176 V220 H92 V176 Q92 158 110 158 Z" fill="#2f73a3"/>
    <text x="319.5" y="202" text-anchor="middle" class="head">教师专业判断</text>
    <text x="319.5" y="253" text-anchor="middle" class="body">器材 · 物理模型 · 课堂流程</text>
    <text x="319.5" y="284" text-anchor="middle" class="sub">提出需求，确定验收与发布标准</text>
  </g>
  <g aria-label="AI生成与调试">
    <rect x="92" y="418" width="455" height="154" rx="18" fill="#fff" stroke="#278a70" class="card"/>
    <path d="M110 418 H529 Q547 418 547 436 V480 H92 V436 Q92 418 110 418 Z" fill="#278a70"/>
    <text x="319.5" y="462" text-anchor="middle" class="head">AI生成与调试</text>
    <text x="319.5" y="513" text-anchor="middle" class="body">实现 · 故障定位 · 解释 · 候选方案</text>
    <text x="319.5" y="544" text-anchor="middle" class="sub">依据教师规格生成页面并持续修改</text>
  </g>
  <g aria-label="教学网站">
    <rect x="773" y="158" width="455" height="154" rx="18" fill="#fff" stroke="#b56a16" class="card"/>
    <path d="M791 158 H1210 Q1228 158 1228 176 V220 H773 V176 Q773 158 791 158 Z" fill="#b56a16"/>
    <text x="1000.5" y="202" text-anchor="middle" class="head">教学网站</text>
    <text x="1000.5" y="253" text-anchor="middle" class="body">集成页面 · 移动端优化</text>
    <text x="1000.5" y="284" text-anchor="middle" class="sub">固定域名 · 二维码 · 版本更新</text>
  </g>
  <g aria-label="真实课堂">
    <rect x="773" y="418" width="455" height="154" rx="18" fill="#fff" stroke="#7755a5" class="card"/>
    <path d="M791 418 H1210 Q1228 418 1228 436 V480 H773 V436 Q773 418 791 418 Z" fill="#7755a5"/>
    <text x="1000.5" y="462" text-anchor="middle" class="head">真实课堂</text>
    <text x="1000.5" y="513" text-anchor="middle" class="body">每组平板 · 即时反馈</text>
    <text x="1000.5" y="544" text-anchor="middle" class="sub">无线投屏 · 课堂汇报 · 课后访问</text>
  </g>
  <path d="M285 312 V408" class="line"/>
  <text x="214" y="366" text-anchor="middle" class="label">提出需求</text>
  <path d="M355 418 V322" class="line"/>
  <text x="430" y="366" text-anchor="middle" class="label">候选与解释</text>
  <path d="M547 235 H763" class="line"/>
  <text x="655" y="218" text-anchor="middle" class="label">决定发布</text>
  <path d="M547 470 C645 442 680 334 767 286" class="line"/>
  <text x="662" y="397" text-anchor="middle" class="label">实现与修改</text>
  <path d="M1000 312 V408" class="line"/>
  <text x="1080" y="366" text-anchor="middle" class="label">固定入口</text>
  <path d="M1000 572 C1010 632 1120 666 1190 690 H140 C88 690 64 660 64 620 V240 C64 220 74 205 82 205" class="feedback"/>
  <rect x="382" y="662" width="555" height="42" rx="21" fill="#e5ebf3"/>
  <text x="659.5" y="690" text-anchor="middle" class="label">课堂使用返回下一次设计</text>
  <rect x="188" y="726" width="944" height="38" rx="19" fill="#e7edf5"/>
  <text x="660" y="751" text-anchor="middle" class="footer">教师的专业判断贯穿需求、生成、验收、发布与课堂迭代</text>
</svg>
