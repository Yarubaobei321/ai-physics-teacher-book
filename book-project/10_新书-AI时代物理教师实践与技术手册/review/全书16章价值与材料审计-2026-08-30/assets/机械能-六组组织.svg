<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">三方案六组课堂组织</title>
  <desc id="desc">教师将学生方案归为三类，每种方案由分析组和提问组构成同方案配对，图中没有跨方案连线。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#28302f"/></marker>
    <style>
      .t{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#202827}.h{font-size:30px;font-weight:700}.s{font-size:23px}.n{font-size:19px;fill:#535c59}.box{fill:#fffdf8;stroke:#28302f;stroke-width:2}.head{fill:#e7e2d8;stroke:#28302f;stroke-width:2}.pair{stroke:#28302f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f7f3ea"/>
  <text x="600" y="55" text-anchor="middle" class="t h">教师整理学生方案并结合课堂容量归为三类</text>
  <path d="M600 78 L600 115 M200 115 L1000 115 M200 115 L200 145 M600 115 L600 145 M1000 115 L1000 145" stroke="#28302f" stroke-width="2.5" fill="none"/>
  <g transform="translate(55,145)">
    <rect x="0" y="0" width="290" height="74" rx="10" class="head"/><text x="145" y="46" text-anchor="middle" class="t s">方案一｜自由落体纸带法</text>
    <rect x="0" y="120" width="120" height="100" rx="10" class="box"/><text x="60" y="158" text-anchor="middle" class="t s">分析组</text><text x="60" y="187" text-anchor="middle" class="t n">完成实验</text><text x="60" y="211" text-anchor="middle" class="t n">分析汇报</text>
    <rect x="170" y="120" width="120" height="100" rx="10" class="box"/><text x="230" y="158" text-anchor="middle" class="t s">提问组</text><text x="230" y="187" text-anchor="middle" class="t n">完成实验</text><text x="230" y="211" text-anchor="middle" class="t n">提问核对</text>
    <path d="M120 170 L162 170" class="pair"/>
  </g>
  <g transform="translate(455,145)">
    <rect x="0" y="0" width="290" height="74" rx="10" class="head"/><text x="145" y="46" text-anchor="middle" class="t s">方案二｜沿曲线摆动DIS法</text>
    <rect x="0" y="120" width="120" height="100" rx="10" class="box"/><text x="60" y="158" text-anchor="middle" class="t s">分析组</text><text x="60" y="187" text-anchor="middle" class="t n">完成实验</text><text x="60" y="211" text-anchor="middle" class="t n">分析汇报</text>
    <rect x="170" y="120" width="120" height="100" rx="10" class="box"/><text x="230" y="158" text-anchor="middle" class="t s">提问组</text><text x="230" y="187" text-anchor="middle" class="t n">完成实验</text><text x="230" y="211" text-anchor="middle" class="t n">提问核对</text>
    <path d="M120 170 L162 170" class="pair"/>
  </g>
  <g transform="translate(855,145)">
    <rect x="0" y="0" width="290" height="74" rx="10" class="head"/><text x="145" y="46" text-anchor="middle" class="t s">方案三｜气垫导轨系统法</text>
    <rect x="0" y="120" width="120" height="100" rx="10" class="box"/><text x="60" y="158" text-anchor="middle" class="t s">分析组</text><text x="60" y="187" text-anchor="middle" class="t n">完成实验</text><text x="60" y="211" text-anchor="middle" class="t n">分析汇报</text>
    <rect x="170" y="120" width="120" height="100" rx="10" class="box"/><text x="230" y="158" text-anchor="middle" class="t s">提问组</text><text x="230" y="187" text-anchor="middle" class="t n">完成实验</text><text x="230" y="211" text-anchor="middle" class="t n">提问核对</text>
    <path d="M120 170 L162 170" class="pair"/>
  </g>
  <rect x="220" y="475" width="760" height="85" rx="12" class="box"/>
  <text x="600" y="512" text-anchor="middle" class="t s">共同汇报栏目</text>
  <text x="600" y="545" text-anchor="middle" class="t n">操作与原理　｜　数据与结论　｜　误差分析</text>
  <text x="600" y="598" text-anchor="middle" class="t n">实线表示本课已确认的同方案配对；图中不对应真实组号</text>
</svg>
