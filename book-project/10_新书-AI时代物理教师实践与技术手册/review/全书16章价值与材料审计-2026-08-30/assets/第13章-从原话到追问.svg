<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="title desc">
  <title id="title">从学生原话到下一轮物理追问</title>
  <desc id="desc">以光滑面上停止施力后做匀速直线运动为例，先保留正确关系，再补条件并设计验证。</desc>
  <defs><style>.t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#23313d}.h{font-size:28px;font-weight:700}.b{font-size:21px}.s{font-size:18px;fill:#5d6975}.a{stroke:#7b8995;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b8995"/></marker></defs>
  <rect width="1400" height="570" rx="24" fill="#f8fafb"/>
  <text x="55" y="62" class="h">教师反馈不急着判“对／错”，先看学生已经走到哪一步</text>
  <g transform="translate(45 125)"><rect width="290" height="260" rx="20" fill="#dfe9f2" stroke="#91aabc"/><text x="25" y="48" class="h">学生原话</text><text x="25" y="105" class="b">“光滑平面上，</text><text x="25" y="142" class="b">停止施力后物体</text><text x="25" y="179" class="b">做匀速直线运动”</text></g>
  <g transform="translate(400 125)"><rect width="270" height="260" rx="20" fill="#d9ebe4" stroke="#72a58f"/><text x="25" y="48" class="h">保留正确部分</text><text x="25" y="108" class="b">已把运动状态</text><text x="25" y="145" class="b">与合外力条件</text><text x="25" y="182" class="b">联系起来</text></g>
  <g transform="translate(735 125)"><rect width="270" height="260" rx="20" fill="#e8e4cf" stroke="#b8a96f"/><text x="25" y="48" class="h">补全成立条件</text><text x="25" y="108" class="b">研究哪个物体？</text><text x="25" y="145" class="b">撤去哪个力？</text><text x="25" y="182" class="b">还有其他水平力吗？</text></g>
  <g transform="translate(1070 125)"><rect width="285" height="260" rx="20" fill="#e7ded8" stroke="#b18c79"/><text x="25" y="48" class="h">要求学生验证</text><text x="25" y="108" class="b">画受力图</text><text x="25" y="145" class="b">说明合外力</text><text x="25" y="182" class="b">用页面记录速度</text></g>
  <path d="M335 255 H395" class="a"/><path d="M670 255 H730" class="a"/><path d="M1005 255 H1065" class="a"/>
  <text x="55" y="465" class="b">反馈句式：你已经指出______；它在______条件下成立；请用______证明页面满足这些条件。</text>
  <text x="55" y="515" class="s">这个句式保留学生已有认识，同时把缺少的对象、条件和证据交还给学生完成。</text>
</svg>
