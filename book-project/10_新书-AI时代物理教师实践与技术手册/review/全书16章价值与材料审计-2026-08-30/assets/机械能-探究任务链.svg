<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">机械能守恒分组实验的探究任务与课堂进程</title>
  <desc id="desc">从课前提出方案、教师归类，到六组实验、数据解释、同方案交流，再到下一轮跨方案比较的六个环节。</desc>
  <defs>
    <style>
      .top{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#222}
      .main{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111}
      .sub{font:500 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#444}
      .phase{font:600 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#333}
      .note{font:500 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#555}
      .box{fill:#fff;stroke:#333;stroke-width:2.2}
      .arrow{stroke:#555;stroke-width:2.5;fill:none;stroke-linecap:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1200" height="430" fill="#fff"/>

  <g text-anchor="middle">
    <text class="top" x="105" y="46">问题</text>
    <text class="top" x="303" y="46">组织</text>
    <text class="top" x="501" y="46">证据</text>
    <text class="top" x="699" y="46">解释</text>
    <text class="top" x="897" y="46">交流</text>
    <text class="top" x="1095" y="46">改进</text>
  </g>

  <g>
    <rect class="box" x="25" y="68" width="160" height="132" rx="10"/>
    <rect class="box" x="223" y="68" width="160" height="132" rx="10"/>
    <rect class="box" x="421" y="68" width="160" height="132" rx="10"/>
    <rect class="box" x="619" y="68" width="160" height="132" rx="10"/>
    <rect class="box" x="817" y="68" width="160" height="132" rx="10"/>
    <rect x="1015" y="68" width="160" height="132" rx="10" fill="#fafafa" stroke="#555" stroke-width="2.2" stroke-dasharray="9 6"/>
  </g>

  <g class="arrow" marker-end="url(#arrow)">
    <line x1="188" y1="134" x2="216" y2="134"/>
    <line x1="386" y1="134" x2="414" y2="134"/>
    <line x1="584" y1="134" x2="612" y2="134"/>
    <line x1="782" y1="134" x2="810" y2="134"/>
    <line x1="980" y1="134" x2="1008" y2="134"/>
  </g>

  <g text-anchor="middle">
    <text class="main" x="105" y="116">提出方案</text>
    <text class="sub" x="105" y="153">对象·关系式</text>
    <text class="sub" x="105" y="179">测量设想</text>

    <text class="main" x="303" y="116">归为三类</text>
    <text class="sub" x="303" y="153">守恒条件</text>
    <text class="sub" x="303" y="179">可测性·器材</text>

    <text class="main" x="501" y="116">六组实验</text>
    <text class="sub" x="501" y="153">每方案两组</text>
    <text class="sub" x="501" y="179">记录原始数据</text>

    <text class="main" x="699" y="116">能量比较</text>
    <text class="sub" x="699" y="153">形成结论</text>
    <text class="sub" x="699" y="179">解释偏差</text>

    <text class="main" x="897" y="116">同方案互评</text>
    <text class="sub" x="897" y="153">一组汇报</text>
    <text class="sub" x="897" y="179">一组提问</text>

    <text class="main" x="1095" y="116">跨方案比较</text>
    <text class="sub" x="1095" y="153">五项比较卡</text>
    <text class="sub" x="1095" y="179">形成共同产出</text>
  </g>

  <g stroke="#777" stroke-width="1.8" fill="none">
    <line x1="25" y1="242" x2="383" y2="242"/>
    <line x1="421" y1="242" x2="977" y2="242"/>
    <line x1="1015" y1="242" x2="1175" y2="242" stroke-dasharray="8 5"/>
  </g>
  <g class="phase" text-anchor="middle">
    <text x="204" y="278">课前设计</text>
    <text x="699" y="278">课堂实施</text>
    <text x="1095" y="278">下一轮改进</text>
  </g>

  <rect x="150" y="320" width="900" height="70" rx="12" fill="#f2f2f2" stroke="#b5b5b5" stroke-width="1.5"/>
  <text class="note" x="600" y="349" text-anchor="middle">共同驱动问题贯穿三条路径：研究对象与能量转化 → 验证关系 → 必测量 → 测量方法</text>
  <text class="note" x="600" y="376" text-anchor="middle">教师持续检查：对象与关系式、测量与数据、计算与结论、偏差与模型条件</text>
</svg>
