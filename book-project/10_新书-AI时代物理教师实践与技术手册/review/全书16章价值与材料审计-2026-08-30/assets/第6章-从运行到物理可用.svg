<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">从能打开到物理可用的三层判断</title>
  <desc id="desc">能打开、能操作、物理可用三层递进关系，前两层不能替代物理核查。</desc>
  <defs>
    <style>
      .t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#24313f}.h{font-size:30px;font-weight:700}.b{font-size:23px}.s{font-size:19px;fill:#536273}.n{font-size:44px;font-weight:700;fill:#fff}.arrow{stroke:#7b8b99;stroke-width:4;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#7b8b99"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f7f9fb"/>
  <text x="60" y="66" class="h">网页验收不是一次判断，而是三层不同问题</text>
  <path d="M365 262 H445" class="arrow"/><path d="M755 262 H835" class="arrow"/>
  <g transform="translate(60 120)">
    <rect width="305" height="285" rx="20" fill="#dfe9f2" stroke="#9bb2c5" stroke-width="2"/>
    <circle cx="52" cy="54" r="31" fill="#6689a6"/><text x="40" y="69" class="n">1</text>
    <text x="98" y="62" class="h">能打开</text>
    <text x="34" y="123" class="b">文件能加载</text><text x="34" y="163" class="b">页面主要区域可见</text>
    <line x1="34" y1="196" x2="270" y2="196" stroke="#9bb2c5"/>
    <text x="34" y="232" class="s">回答：能不能使用</text>
  </g>
  <g transform="translate(445 120)">
    <rect width="310" height="285" rx="20" fill="#e8e4cf" stroke="#b8a96f" stroke-width="2"/>
    <circle cx="52" cy="54" r="31" fill="#a48c3f"/><text x="40" y="69" class="n">2</text>
    <text x="98" y="62" class="h">能操作</text>
    <text x="34" y="123" class="b">按钮有响应</text><text x="34" y="163" class="b">滑块和输入框可用</text>
    <line x1="34" y1="196" x2="275" y2="196" stroke="#b8a96f"/>
    <text x="34" y="232" class="s">回答：功能有没有实现</text>
  </g>
  <g transform="translate(835 120)">
    <rect width="305" height="285" rx="20" fill="#d9ebe4" stroke="#72a58f" stroke-width="3"/>
    <circle cx="52" cy="54" r="31" fill="#3f8068"/><text x="40" y="69" class="n">3</text>
    <text x="98" y="62" class="h">物理可用</text>
    <text x="34" y="115" class="b">条件真正进入计算</text><text x="34" y="153" class="b">关键结果能够复算</text><text x="34" y="191" class="b">状态和图文相互一致</text>
    <line x1="34" y1="218" x2="270" y2="218" stroke="#72a58f"/>
    <text x="34" y="253" class="s">回答：物理解释是否可靠</text>
  </g>
  <text x="60" y="468" class="s">依赖关系：后一层需要前一层；证据边界：前一层通过，不能证明后一层通过。</text>
</svg>
