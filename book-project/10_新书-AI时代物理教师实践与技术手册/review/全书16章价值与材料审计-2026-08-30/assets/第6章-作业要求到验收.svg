<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">从作业要求到验收证据</title>
  <desc id="desc">将知识正确拆成核查对象、学生动作、提交证据和退回条件。</desc>
  <defs><style>.t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#24313f}.h{font-size:30px;font-weight:700}.b{font-size:23px}.s{font-size:19px;fill:#5d6a77}.n{font-size:42px;font-weight:700;fill:#fff}</style></defs>
  <rect width="1200" height="590" rx="24" fill="#f7f9fb"/>
  <text x="55" y="65" class="h">“保证物理正确”要补齐四项内容</text>
  <g transform="translate(75 125)"><rect width="470" height="150" rx="20" fill="#dfe9f2" stroke="#91aabc" stroke-width="2"/><circle cx="55" cy="55" r="32" fill="#6689a6"/><text x="43" y="70" class="n">1</text><text x="105" y="55" class="h">核查对象</text><text x="105" y="100" class="b">查哪个系统、条件或物理量</text></g>
  <g transform="translate(655 125)"><rect width="470" height="150" rx="20" fill="#e8e4cf" stroke="#b8a96f" stroke-width="2"/><circle cx="55" cy="55" r="32" fill="#a48c3f"/><text x="43" y="70" class="n">2</text><text x="105" y="55" class="h">学生动作</text><text x="105" y="100" class="b">操作、手算、比较或说明</text></g>
  <g transform="translate(75 335)"><rect width="470" height="150" rx="20" fill="#e7ded8" stroke="#b18c79" stroke-width="2"/><circle cx="55" cy="55" r="32" fill="#9b6f59"/><text x="43" y="70" class="n">3</text><text x="105" y="55" class="h">提交证据</text><text x="105" y="100" class="b">输入、算式、前后记录或图表</text></g>
  <g transform="translate(655 335)"><rect width="470" height="150" rx="20" fill="#d9ebe4" stroke="#72a58f" stroke-width="2"/><circle cx="55" cy="55" r="32" fill="#3f8068"/><text x="43" y="70" class="n">4</text><text x="105" y="55" class="h">退回条件</text><text x="105" y="100" class="b">出现什么结果就必须修改</text></g>
  <path d="M545 200 H650" stroke="#7d8a96" stroke-width="4"/><path d="M310 275 V330" stroke="#7d8a96" stroke-width="4"/><path d="M890 275 V330" stroke="#7d8a96" stroke-width="4"/>
  <text x="75" y="548" class="s">四项共同构成可执行要求：只有目标，没有动作、证据和退回条件，仍无法验收。</text>
</svg>
