<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">教师—AI建设教学网站的双循环</title>
  <desc id="desc">左侧开发循环由真实问题、教师规格、AI实现和教师验收构成；右侧教学循环由网站发布、真实使用、课堂观察和下一次建设构成；教学网站连接并保存两个循环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#343434"/></marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.loop{font-size:22px;font-weight:700}.name{font-size:18px;font-weight:700}.sub{font-size:14px;fill:#505050}.box{fill:#f7f7f7;stroke:#333;stroke-width:2}.center{fill:#dedede;stroke:#111;stroke-width:2.8}.line{stroke:#343434;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.boundary{fill:none;stroke:#9a9a9a;stroke-width:1.5;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1160" height="620" fill="#fff"/>
  <text x="580" y="45" text-anchor="middle" class="title">资源生成进入课堂，课堂使用返回下一次建设</text>

  <rect x="40" y="80" width="460" height="475" rx="22" class="boundary"/>
  <text x="270" y="118" text-anchor="middle" class="loop">开发循环</text>
  <rect x="660" y="80" width="460" height="475" rx="22" class="boundary"/>
  <text x="890" y="118" text-anchor="middle" class="loop">教学循环</text>

  <rect x="180" y="150" width="180" height="75" rx="9" class="box"/>
  <text x="270" y="181" text-anchor="middle" class="name">真实教学问题</text><text x="270" y="207" text-anchor="middle" class="sub">自研器材与本课流程</text>
  <rect x="70" y="325" width="180" height="75" rx="9" class="box"/>
  <text x="160" y="356" text-anchor="middle" class="name">教师写规格</text><text x="160" y="382" text-anchor="middle" class="sub">物理、数据、交互、课堂</text>
  <rect x="290" y="325" width="180" height="75" rx="9" class="box"/>
  <text x="380" y="356" text-anchor="middle" class="name">AI实现与调试</text><text x="380" y="382" text-anchor="middle" class="sub">页面、故障定位、候选</text>
  <rect x="180" y="455" width="180" height="75" rx="9" class="box"/>
  <text x="270" y="486" text-anchor="middle" class="name">教师验收</text><text x="270" y="512" text-anchor="middle" class="sub">以学生角色完整试用</text>

  <path d="M230 225 C165 250 145 295 155 320" class="line"/>
  <path d="M250 363 H285" class="line"/>
  <path d="M375 400 C375 435 330 450 315 455" class="line"/>
  <path d="M220 455 C165 425 150 410 155 405" class="line"/>

  <rect x="500" y="250" width="160" height="120" rx="14" class="center"/>
  <text x="580" y="295" text-anchor="middle" class="loop">教学网站</text>
  <text x="580" y="326" text-anchor="middle" class="sub">集成页面 · 模块复用</text>
  <text x="580" y="349" text-anchor="middle" class="sub">固定入口 · 统一汇聚</text>

  <rect x="800" y="150" width="180" height="75" rx="9" class="box"/>
  <text x="890" y="181" text-anchor="middle" class="name">资源进入教学</text><text x="890" y="207" text-anchor="middle" class="sub">课堂、课后与项目任务</text>
  <rect x="690" y="325" width="180" height="75" rx="9" class="box"/>
  <text x="780" y="356" text-anchor="middle" class="name">学生与教师使用</text><text x="780" y="382" text-anchor="middle" class="sub">打开、操作、分析、表达</text>
  <rect x="910" y="325" width="180" height="75" rx="9" class="box"/>
  <text x="1000" y="356" text-anchor="middle" class="name">观察课堂节奏</text><text x="1000" y="382" text-anchor="middle" class="sub">记录新的教学需要</text>
  <rect x="800" y="455" width="180" height="75" rx="9" class="box"/>
  <text x="890" y="486" text-anchor="middle" class="name">决定下一次建设</text><text x="890" y="512" text-anchor="middle" class="sub">修改页面或增加资源</text>

  <path d="M845 225 C780 250 760 295 775 320" class="line"/>
  <path d="M870 363 H905" class="line"/>
  <path d="M995 400 C995 435 945 450 930 455" class="line"/>
  <path d="M840 455 C785 425 770 410 775 405" class="line"/>

  <path d="M360 493 C455 485 480 395 525 372" class="line"/>
  <path d="M660 310 C710 270 755 210 795 198" class="line"/>
  <path d="M800 493 C715 485 690 400 635 374" class="line"/>
  <path d="M500 310 C455 270 410 220 355 198" class="line"/>

  <text x="580" y="590" text-anchor="middle" class="sub">教师的专业判断贯穿两个循环，网站保存并放大每一次真实教学实践。</text>
</svg>
