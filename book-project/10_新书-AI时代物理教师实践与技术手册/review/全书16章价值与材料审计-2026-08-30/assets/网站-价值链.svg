<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">从自研器材到教学网站的价值链</title>
  <desc id="desc">自研DIS传感器提出个性化配套需求，三个集成实验页面进入课堂，通过模块复用、固定入口和统一门户形成持续更新与资源积累。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#343434"/></marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.step{font-size:19px;font-weight:700}.sub{font-size:14px;fill:#525252}.num{font-size:16px;font-weight:700;fill:#fff}.box{fill:#f7f7f7;stroke:#333;stroke-width:2}.key{fill:#e5e5e5;stroke:#111;stroke-width:2.5}.line{stroke:#343434;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="470" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="title">从自研实验器材到持续资源建设</text>

  <path d="M195 215 H240 M390 215 H435 M585 215 H630 M780 215 H825 M975 215 H1020" class="line"/>

  <g transform="translate(45,150)">
    <rect width="150" height="130" rx="10" class="box"/><circle cx="75" cy="0" r="20" fill="#333"/><text x="75" y="6" text-anchor="middle" class="num">1</text>
    <text x="75" y="48" text-anchor="middle" class="step">自研器材</text><text x="75" y="78" text-anchor="middle" class="sub">DIS传感器</text><text x="75" y="101" text-anchor="middle" class="sub">双头光电门</text>
  </g>
  <g transform="translate(240,150)">
    <rect width="150" height="130" rx="10" class="box"/><circle cx="75" cy="0" r="20" fill="#333"/><text x="75" y="6" text-anchor="middle" class="num">2</text>
    <text x="75" y="48" text-anchor="middle" class="step">在线实验室</text><text x="75" y="78" text-anchor="middle" class="sub">三个实验入口</text><text x="75" y="101" text-anchor="middle" class="sub">原理·计算·图·习题</text>
  </g>
  <g transform="translate(435,150)">
    <rect width="150" height="130" rx="10" class="key"/><circle cx="75" cy="0" r="20" fill="#111"/><text x="75" y="6" text-anchor="middle" class="num">3</text>
    <text x="75" y="48" text-anchor="middle" class="step">分组使用</text><text x="75" y="78" text-anchor="middle" class="sub">每组平板录入</text><text x="75" y="101" text-anchor="middle" class="sub">即时反馈与投屏</text>
  </g>
  <g transform="translate(630,150)">
    <rect width="150" height="130" rx="10" class="box"/><circle cx="75" cy="0" r="20" fill="#333"/><text x="75" y="6" text-anchor="middle" class="num">4</text>
    <text x="75" y="48" text-anchor="middle" class="step">模块复用</text><text x="75" y="78" text-anchor="middle" class="sub">数据·计算·绘图</text><text x="75" y="101" text-anchor="middle" class="sub">快速适配新实验</text>
  </g>
  <g transform="translate(825,150)">
    <rect width="150" height="130" rx="10" class="box"/><circle cx="75" cy="0" r="20" fill="#333"/><text x="75" y="6" text-anchor="middle" class="num">5</text>
    <text x="75" y="48" text-anchor="middle" class="step">固定门户</text><text x="75" y="78" text-anchor="middle" class="sub">域名·链接·二维码</text><text x="75" y="101" text-anchor="middle" class="sub">课堂与课后访问</text>
  </g>
  <g transform="translate(1020,150)">
    <rect width="150" height="130" rx="10" class="box"/><circle cx="75" cy="0" r="20" fill="#333"/><text x="75" y="6" text-anchor="middle" class="num">6</text>
    <text x="75" y="48" text-anchor="middle" class="step">迭代与积累</text><text x="75" y="78" text-anchor="middle" class="sub">新课例继续定制</text><text x="75" y="101" text-anchor="middle" class="sub">教学经验长期沉淀</text>
  </g>

  <path d="M1095 300 C1095 390 510 410 510 305" class="line"/>
  <text x="810" y="397" text-anchor="middle" class="sub">新的器材与课例继续带来模块、页面和资源</text>
</svg>
