<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 700" role="img" aria-labelledby="title desc">
  <title id="title">一条输入规则的退回链</title>
  <desc id="desc">教师提出按大小排列两次速度，AI实现实时交换，试填暴露异常。AI先提出延后排序，教师重新检查课堂任务后取消自动排序，页面最终保留原始输入并用异常结果触发排错。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#2C6FA3"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#2F7A67"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 Z" fill="#C65F21"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6B6257" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243342; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 16px; fill: #617180; }
      .lane-label { font-size: 18px; font-weight: 700; }
      .step-title { font-size: 18px; font-weight: 700; }
      .step-text { font-size: 14px; fill: #4C5D69; }
      .step-no { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .arrow-label { font-size: 13px; font-weight: 600; }
      .outcome-title { font-size: 19px; font-weight: 700; fill: #FFFFFF; }
      .outcome-text { font-size: 15px; fill: #EAF8F4; }
      .teacher-box { fill: #E8F3FB; stroke: #2C6FA3; stroke-width: 2.2; }
      .ai-box { fill: #E8F5F0; stroke: #2F7A67; stroke-width: 2.2; }
      .alert-box { fill: #FFF0E6; stroke: #C65F21; stroke-width: 2.4; }
      .candidate-box { fill: #F3EEFA; stroke: #7A5AA6; stroke-width: 2.1; stroke-dasharray: 8 5; }
      .new-rule-box { fill: #E9F3FF; stroke: #235E99; stroke-width: 2.6; }
      .result-box { fill: #E7F6F5; stroke: #167C80; stroke-width: 2.4; }
      .teacher-line { stroke: #2C6FA3; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .ai-line { stroke: #2F7A67; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .alert-line { stroke: #C65F21; stroke-width: 3; fill: none; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1380" height="700" fill="#FFF9F0"/>
  <rect x="24" y="24" width="1332" height="652" rx="28" fill="#FFFDF8" stroke="#E6DCCF" stroke-width="1.5"/>

  <text x="690" y="68" text-anchor="middle" class="title">一条输入规则的退回链</text>
  <text x="690" y="96" text-anchor="middle" class="subtitle">程序故障只是入口，真正改变的是教学规则</text>

  <rect x="78" y="132" width="1240" height="176" rx="20" fill="#F4F9FD" stroke="#C7DDEB" stroke-width="1.5"/>
  <rect x="78" y="348" width="1240" height="176" rx="20" fill="#F4FAF7" stroke="#CBE2D9" stroke-width="1.5"/>
  <rect x="78" y="132" width="78" height="176" rx="20" fill="#DCECF8"/>
  <rect x="78" y="348" width="78" height="176" rx="20" fill="#DCEFE8"/>
  <text x="117" y="204" text-anchor="middle" class="lane-label" fill="#2C6FA3">教师</text>
  <text x="117" y="230" text-anchor="middle" class="lane-label" fill="#2C6FA3">判断</text>
  <text x="117" y="420" text-anchor="middle" class="lane-label" fill="#2F7A67">页面</text>
  <text x="117" y="446" text-anchor="middle" class="lane-label" fill="#2F7A67">实现</text>

  <!-- connectors -->
  <path d="M340 222 C370 222 375 408 405 408" class="teacher-line"/>
  <path d="M565 408 L610 408" class="ai-line"/>
  <path d="M780 408 L825 408" class="alert-line"/>
  <path d="M910 348 C910 320 895 300 895 286" class="ai-line"/>
  <path d="M1000 222 L1045 222" class="teacher-line"/>
  <path d="M1135 277 C1135 325 1185 348 1185 378" class="teacher-line"/>

  <!-- step 1 -->
  <g filter="url(#soft-shadow)">
    <rect x="180" y="170" width="160" height="104" rx="14" class="teacher-box"/>
  </g>
  <circle cx="200" cy="190" r="15" fill="#2C6FA3"/>
  <text x="200" y="196" text-anchor="middle" class="step-no">1</text>
  <text x="260" y="205" text-anchor="middle" class="step-title">初始口径</text>
  <text x="260" y="232" text-anchor="middle" class="step-text">较小速度记作 v₁</text>
  <text x="260" y="254" text-anchor="middle" class="step-text">较大速度记作 v₂</text>

  <!-- step 2 -->
  <g filter="url(#soft-shadow)">
    <rect x="405" y="378" width="160" height="104" rx="14" class="ai-box"/>
  </g>
  <circle cx="425" cy="398" r="15" fill="#2F7A67"/>
  <text x="425" y="404" text-anchor="middle" class="step-no">2</text>
  <text x="485" y="413" text-anchor="middle" class="step-title">AI实现规则</text>
  <text x="485" y="440" text-anchor="middle" class="step-text">每输入一个字符</text>
  <text x="485" y="462" text-anchor="middle" class="step-text">立即比较并交换</text>

  <!-- step 3 -->
  <g filter="url(#soft-shadow)">
    <rect x="610" y="378" width="170" height="104" rx="14" class="alert-box"/>
  </g>
  <circle cx="630" cy="398" r="15" fill="#C65F21"/>
  <text x="630" y="404" text-anchor="middle" class="step-no">3</text>
  <text x="695" y="413" text-anchor="middle" class="step-title">试填暴露异常</text>
  <text x="695" y="440" text-anchor="middle" class="step-text">v₂还没输完</text>
  <text x="695" y="462" text-anchor="middle" class="step-text">v₁已经变化</text>

  <!-- step 4 -->
  <g filter="url(#soft-shadow)">
    <rect x="825" y="378" width="170" height="104" rx="14" class="candidate-box"/>
  </g>
  <circle cx="845" cy="398" r="15" fill="#7A5AA6"/>
  <text x="845" y="404" text-anchor="middle" class="step-no">4</text>
  <text x="910" y="413" text-anchor="middle" class="step-title">AI提出修补</text>
  <text x="910" y="440" text-anchor="middle" class="step-text">输入完成以后</text>
  <text x="910" y="462" text-anchor="middle" class="step-text">再执行排序</text>
  <text x="910" y="505" text-anchor="middle" class="arrow-label" fill="#7A5AA6">程序可修，方案未采用</text>

  <!-- decision -->
  <g filter="url(#soft-shadow)">
    <path d="M895 158 L1000 222 L895 286 L790 222 Z" fill="#FFF4D9" stroke="#D38A18" stroke-width="2.5"/>
  </g>
  <circle cx="815" cy="190" r="15" fill="#D38A18"/>
  <text x="815" y="196" text-anchor="middle" class="step-no">5</text>
  <text x="895" y="212" text-anchor="middle" class="step-title">重新检查教学规则</text>
  <text x="895" y="238" text-anchor="middle" class="step-text">页面应否替学生</text>
  <text x="895" y="258" text-anchor="middle" class="step-text">重排原始记录？</text>

  <!-- step 6 -->
  <g filter="url(#soft-shadow)">
    <rect x="1045" y="170" width="180" height="104" rx="14" class="new-rule-box"/>
  </g>
  <circle cx="1065" cy="190" r="15" fill="#235E99"/>
  <text x="1065" y="196" text-anchor="middle" class="step-no">6</text>
  <text x="1135" y="205" text-anchor="middle" class="step-title">取消自动排序</text>
  <text x="1135" y="232" text-anchor="middle" class="step-text">输入什么就保留什么</text>
  <text x="1135" y="254" text-anchor="middle" class="step-text">修正理由必须可见</text>

  <!-- step 7 -->
  <g filter="url(#soft-shadow)">
    <rect x="1095" y="378" width="180" height="104" rx="14" class="result-box"/>
  </g>
  <circle cx="1115" cy="398" r="15" fill="#167C80"/>
  <text x="1115" y="404" text-anchor="middle" class="step-no">7</text>
  <text x="1185" y="413" text-anchor="middle" class="step-title">删除排序并复验</text>
  <text x="1185" y="440" text-anchor="middle" class="step-text">保留 v₁=2.0、v₂=1.0</text>
  <text x="1185" y="462" text-anchor="middle" class="step-text">异常结果触发排错</text>

  <text x="1015" y="210" text-anchor="middle" class="arrow-label" fill="#2C6FA3">不应重排</text>

  <rect x="190" y="566" width="1000" height="78" rx="20" fill="#176B67"/>
  <text x="690" y="598" text-anchor="middle" class="outcome-title">可迁移原则：页面保留原始观察与测量记录</text>
  <text x="690" y="626" text-anchor="middle" class="outcome-text">异常数据不是待清理的噪声，而是检查装置、输入与模型条件的入口</text>
</svg>
