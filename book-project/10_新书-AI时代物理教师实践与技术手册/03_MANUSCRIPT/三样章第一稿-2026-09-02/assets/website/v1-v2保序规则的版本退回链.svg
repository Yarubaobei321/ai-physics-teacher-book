<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">从界面异常到保留原始实验记录</title>
  <desc id="desc">速度输入触发自动交换后，AI定位触发点，教师进一步判断页面不应自动改写实验记录，AI据此删除排序并完成测试。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#343434"/></marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#171717}.title{font-size:28px;font-weight:700}.lane{font-size:19px;font-weight:700}.step{font-size:18px;font-weight:700}.sub{font-size:14px;fill:#505050}.box{fill:#f7f7f7;stroke:#333;stroke-width:2}.decision{fill:#e3e3e3;stroke:#111;stroke-width:2.5}.line{stroke:#343434;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.guide{stroke:#b5b5b5;stroke-width:1.5;stroke-dasharray:6 6}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#fff"/>
  <text x="550" y="45" text-anchor="middle" class="title">程序修补之后，再追问教学规则</text>
  <line x1="40" y1="280" x2="1060" y2="280" class="guide"/>
  <text x="58" y="108" class="lane">课堂与教师判断</text>
  <text x="58" y="330" class="lane">AI定位与实现</text>

  <rect x="70" y="150" width="190" height="100" rx="9" class="box"/>
  <text x="165" y="190" text-anchor="middle" class="step">输入出现异常</text>
  <text x="165" y="220" text-anchor="middle" class="sub">v₂首字符触发速度交换</text>

  <rect x="315" y="345" width="190" height="100" rx="9" class="box"/>
  <text x="410" y="385" text-anchor="middle" class="step">AI找到触发点</text>
  <text x="410" y="415" text-anchor="middle" class="sub">提出延后排序的修补方案</text>

  <rect x="560" y="135" width="205" height="125" rx="9" class="decision"/>
  <text x="662" y="178" text-anchor="middle" class="step">教师追问规则</text>
  <text x="662" y="208" text-anchor="middle" class="sub">页面为什么要替学生排序？</text>
  <text x="662" y="232" text-anchor="middle" class="sub">实验记录应保留原始次序</text>

  <rect x="820" y="345" width="205" height="100" rx="9" class="box"/>
  <text x="922" y="385" text-anchor="middle" class="step">AI落实新规则</text>
  <text x="922" y="415" text-anchor="middle" class="sub">删除排序、改提示、完成测试</text>

  <path d="M260 220 C300 245 300 350 315 375" class="line"/>
  <path d="M505 375 C545 350 545 250 560 225" class="line"/>
  <path d="M765 225 C805 250 805 350 820 375" class="line"/>

  <rect x="310" y="485" width="480" height="48" rx="24" class="decision"/>
  <text x="550" y="516" text-anchor="middle" class="step">可迁移原则：软件不在后台悄悄改写原始实验记录</text>
  <path d="M922 445 C900 495 805 510 795 510" class="line"/>
</svg>
