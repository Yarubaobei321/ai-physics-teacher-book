<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
  <title id="title">弹簧—物块模型的物理时间与显示时间</title>
  <desc id="desc">默认样例E1中，当前物理周期为3.1416秒，页面固定比较横轴为4.4429秒。播放在非初态的横轴末端取模回零，形成确定性跳变。问题已由源码和独立解析复算定位，页面尚未修改，也未完成修改后的浏览器操作复验。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .region-title { font-size: 12px; font-weight: 700; }
    .label { fill: #f8fafc; font-size: 11px; font-weight: 600; }
    .small { fill: #cbd5e1; font-size: 9px; }
    .tiny { fill: #94a3b8; font-size: 8px; }
    .mono { fill: #e2e8f0; font-size: 10px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <linearGradient id="extra-window" x1="0" x2="1">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title block -->
  <text x="40" y="42" class="title">图3　弹簧—物块模型的物理时间与显示时间</text>
  <text x="40" y="66" class="subtitle">同一时间尺度比较｜默认样例 E1：mA=mB=1 kg，v₀=3 m/s，k=2 N/m，ω=2 rad/s</text>
  <rect x="1010" y="26" width="270" height="48" rx="8" fill="#0f172a"/>
  <rect x="1010" y="26" width="270" height="48" rx="8" fill="rgba(136,19,55,0.36)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="1145" y="46" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle">证据边界</text>
  <text x="1145" y="62" class="tiny" text-anchor="middle">已定位；页面未修改／修改后浏览器复验未进行</text>

  <!-- Region boundaries -->
  <rect x="50" y="112" width="1220" height="225" rx="14" fill="rgba(8,51,68,0.16)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="70" y="139" fill="#22d3ee" class="region-title">A　当前系统的物理时间</text>
  <text x="1260" y="139" class="tiny" text-anchor="end">解析关系：T = 2π/ω</text>

  <rect x="50" y="365" width="1220" height="230" rx="14" fill="rgba(120,53,15,0.13)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="70" y="392" fill="#fbbf24" class="region-title">B　页面使用的固定比较横轴／播放窗口</text>
  <text x="1260" y="392" class="tiny" text-anchor="end">源码口径：2π/ωmin，ωmin 由 k=1 N/m 固定</text>

  <!-- Shared vertical guides -->
  <line x1="329" y1="156" x2="329" y2="565" stroke="#34d399" stroke-width="1" stroke-dasharray="3,5" opacity="0.35"/>
  <line x1="507" y1="156" x2="507" y2="565" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,5" opacity="0.35"/>
  <line x1="864" y1="156" x2="864" y2="565" stroke="#34d399" stroke-width="1.4" stroke-dasharray="4,5" opacity="0.7"/>
  <line x1="1160" y1="156" x2="1160" y2="565" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="4,5" opacity="0.75"/>

  <!-- Physical axis -->
  <line x1="150" y1="242" x2="864" y2="242" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow-cyan)"/>
  <line x1="864" y1="242" x2="1160" y2="242" stroke="#64748b" stroke-width="2" stroke-dasharray="7,6"/>
  <circle cx="150" cy="242" r="7" fill="#60a5fa"/>
  <circle cx="329" cy="242" r="7" fill="#34d399"/>
  <circle cx="507" cy="242" r="7" fill="#a78bfa"/>
  <circle cx="864" cy="242" r="9" fill="#34d399" stroke="#d1fae5" stroke-width="2"/>
  <circle cx="1160" cy="242" r="8" fill="#fb7185" stroke="#fecdd3" stroke-width="2"/>

  <text x="150" y="268" class="mono" text-anchor="middle">t=0</text>
  <text x="150" y="283" class="tiny" text-anchor="middle">初态</text>

  <!-- Event cards, physical time -->
  <rect x="239" y="164" width="180" height="58" rx="8" fill="#0f172a"/>
  <rect x="239" y="164" width="180" height="58" rx="8" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.3"/>
  <text x="329" y="187" class="label" text-anchor="middle">最大压缩／两物体共速</text>
  <text x="329" y="207" class="mono" text-anchor="middle">tmax=π/(2ω)=0.7854 s</text>

  <rect x="417" y="264" width="180" height="54" rx="8" fill="#0f172a"/>
  <rect x="417" y="264" width="180" height="54" rx="8" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="507" y="286" class="label" text-anchor="middle">第一次恢复原长</text>
  <text x="507" y="305" class="mono" text-anchor="middle">tsep=π/ω=1.5708 s</text>

  <rect x="752" y="164" width="224" height="58" rx="8" fill="#0f172a"/>
  <rect x="752" y="164" width="224" height="58" rx="8" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="864" y="187" class="label" text-anchor="middle">当前物理周期结束</text>
  <text x="864" y="207" class="mono" text-anchor="middle">T=2π/ω=3.1416 s｜回到初态</text>

  <rect x="1010" y="263" width="244" height="58" rx="8" fill="#0f172a"/>
  <rect x="1010" y="263" width="244" height="58" rx="8" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1132" y="286" class="label" text-anchor="middle">固定横轴末端</text>
  <text x="1132" y="305" fill="#fecdd3" font-size="9" text-anchor="middle">1.4142 个当前周期｜状态不等于初态</text>

  <!-- Display axis -->
  <rect x="864" y="433" width="296" height="44" rx="5" fill="url(#extra-window)"/>
  <line x1="150" y1="455" x2="1160" y2="455" stroke="#fbbf24" stroke-width="4"/>
  <circle cx="150" cy="455" r="7" fill="#60a5fa"/>
  <circle cx="864" cy="455" r="8" fill="#34d399" stroke="#d1fae5" stroke-width="2"/>
  <circle cx="1160" cy="455" r="9" fill="#fb7185" stroke="#fecdd3" stroke-width="2"/>

  <!-- Comparison-window bracket -->
  <line x1="150" y1="418" x2="1160" y2="418" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="150" y1="411" x2="150" y2="425" stroke="#fbbf24" stroke-width="1.5"/>
  <line x1="1160" y1="411" x2="1160" y2="425" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="655" y="409" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">固定比较横轴 = 4.4429 s</text>

  <text x="150" y="481" class="mono" text-anchor="middle">0</text>
  <text x="864" y="489" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">应在这里闭合</text>
  <text x="864" y="506" class="tiny" text-anchor="middle">当前物理周期 T=3.1416 s</text>
  <text x="1012" y="445" fill="#fecdd3" font-size="9" font-weight="600" text-anchor="middle">额外显示 1.3013 s</text>

  <rect x="995" y="493" width="250" height="58" rx="8" fill="#0f172a"/>
  <rect x="995" y="493" width="250" height="58" rx="8" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1120" y="516" class="label" text-anchor="middle">播放到横轴末端</text>
  <text x="1120" y="536" fill="#fecdd3" font-size="9" text-anchor="middle">非初态 → 取模直接回 t=0</text>

  <!-- Loop-back path -->
  <path d="M 1160 557 C 1110 578, 350 578, 175 563 C 155 560, 150 540, 150 486" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <rect x="535" y="548" width="250" height="26" rx="13" fill="#0f172a"/>
  <text x="660" y="566" fill="#fb7185" font-size="9" font-weight="700" text-anchor="middle">确定性跳变：比较窗口被当成播放周期</text>

  <!-- Evidence status -->
  <rect x="50" y="620" width="1220" height="112" rx="14" fill="rgba(30,41,59,0.62)" stroke="#475569" stroke-width="1"/>

  <rect x="70" y="642" width="555" height="68" rx="9" fill="#0f172a"/>
  <rect x="70" y="642" width="555" height="68" rx="9" fill="rgba(6,78,59,0.38)" stroke="#34d399" stroke-width="1.4"/>
  <text x="92" y="666" fill="#34d399" font-size="11" font-weight="700">已定位</text>
  <text x="92" y="686" class="small">源码固定横轴＋E1独立解析复算；末端相位与跳变可确定。</text>
  <text x="92" y="702" class="tiny">主体公式的E1、E2真值复算通过；本图只呈现时间身份冲突。</text>

  <rect x="650" y="642" width="600" height="68" rx="9" fill="#0f172a"/>
  <rect x="650" y="642" width="600" height="68" rx="9" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="672" y="666" fill="#fb7185" font-size="11" font-weight="700">尚未完成</text>
  <text x="672" y="686" class="small">页面未修改；修改后的浏览器操作、视觉状态复验和教师终审未进行。</text>
  <text x="672" y="702" class="tiny">不能写成“问题已修复”“页面已物理终审”或“已进入课堂”。</text>

  <text x="50" y="758" class="tiny">来源：H04动量模型物理审计闭环、H04弹簧—物块模型独立复算记录；数值为解析计算，不是实验采集。</text>
</svg>
