<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">v₁/v₂从实时排序故障到保序规则</title>
  <desc id="desc">四格状态流程呈现气垫导轨实验页面的规则退回：教师最初要求按数值大小定义v₁和v₂，AI将其实现为逐字符输入时的实时比较与交换，实际试填暴露字段身份被改写的问题，延后排序建议被退回，最终取消自动排序并用v₁等于2.0米每秒、v₂等于1.0米每秒的冻结副本复验保序。冻结副本已复验；本图不能证明线上当前版本、真实设备连接或所有浏览器长期稳定。</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 11px; }
    .panel-title { fill: #f8fafc; font-size: 14px; font-weight: 700; }
    .label { fill: #e2e8f0; font-size: 11px; font-weight: 600; }
    .body { fill: #cbd5e1; font-size: 10px; }
    .small { fill: #94a3b8; font-size: 9px; }
    .tiny { fill: #64748b; font-size: 8px; }
    .mono { fill: #f8fafc; font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#fb7185"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#34d399"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- process connectors: rendered before panels -->
  <path d="M 357 360 L 385 360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 692 360 L 720 360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 1027 360 L 1055 360" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- four process panels -->
  <rect x="40" y="126" width="317" height="470" rx="16" fill="#111827" stroke="#fbbf24" stroke-width="1.4"/>
  <rect x="375" y="126" width="317" height="470" rx="16" fill="#111827" stroke="#fb7185" stroke-width="1.6"/>
  <rect x="710" y="126" width="317" height="470" rx="16" fill="#111827" stroke="#a78bfa" stroke-width="1.4"/>
  <rect x="1045" y="126" width="355" height="470" rx="16" fill="#111827" stroke="#34d399" stroke-width="1.8"/>

  <!-- panel 1 boxes -->
  <circle cx="72" cy="162" r="17" fill="#78350f" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="72" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="101" y="168" class="panel-title">初始口径</text>
  <text x="61" y="198" fill="#fbbf24" font-size="9" font-weight="600">教师提出｜未经充分推敲</text>

  <rect x="61" y="224" width="275" height="122" rx="10" fill="#0f172a" stroke="#92400e"/>
  <text x="81" y="251" class="small">按数值大小定义字段</text>
  <rect x="82" y="270" width="108" height="48" rx="7" fill="#1e293b" stroke="#fbbf24"/>
  <text x="136" y="290" class="mono" text-anchor="middle">较小速度</text>
  <text x="136" y="308" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">→ v₁</text>
  <rect x="207" y="270" width="108" height="48" rx="7" fill="#1e293b" stroke="#fbbf24"/>
  <text x="261" y="290" class="mono" text-anchor="middle">较大速度</text>
  <text x="261" y="308" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">→ v₂</text>

  <rect x="61" y="377" width="275" height="112" rx="10" fill="rgba(120,53,15,0.22)" stroke="#92400e"/>
  <text x="81" y="405" class="label">隐含的身份规则</text>
  <text x="81" y="431" class="body">字段编号跟随数值大小</text>
  <text x="81" y="452" class="body">输入后还可以交换位置</text>
  <text x="81" y="475" class="small">这条要求随后交给AI实现</text>

  <rect x="74" y="523" width="249" height="42" rx="21" fill="#0f172a" stroke="#fbbf24"/>
  <text x="198" y="549" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">大小排序 = 字段身份</text>

  <!-- panel 2 boxes -->
  <circle cx="407" cy="162" r="17" fill="#881337" stroke="#fb7185" stroke-width="1.4"/>
  <text x="407" y="167" fill="#fecdd3" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="436" y="168" class="panel-title">逐字符触发故障</text>
  <text x="396" y="198" fill="#fb7185" font-size="9" font-weight="600">AI实现｜每收到一个字符立即比较</text>

  <rect x="396" y="224" width="275" height="116" rx="10" fill="#0f172a" stroke="#9f1239"/>
  <text x="416" y="250" class="small">实际试填中的中间状态</text>
  <rect x="416" y="266" width="235" height="27" rx="5" fill="#1e293b"/>
  <text x="430" y="285" class="mono">v₁ = 已填数字</text>
  <rect x="416" y="299" width="235" height="27" rx="5" fill="#1e293b" stroke="#fb7185"/>
  <text x="430" y="318" class="mono">v₂ = 0…</text>

  <path d="M 534 347 L 534 374" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-rose)"/>
  <rect x="396" y="382" width="275" height="102" rx="10" fill="rgba(136,19,55,0.28)" stroke="#fb7185"/>
  <text x="533" y="407" fill="#fecdd3" font-size="10" font-weight="700" text-anchor="middle">数字尚未输入完成</text>
  <text x="533" y="430" class="body" text-anchor="middle">程序已比较并交换两个数</text>
  <text x="533" y="453" fill="#fb7185" font-size="11" font-weight="700" text-anchor="middle">v₁改变／有时看起来像被清空</text>
  <text x="533" y="473" class="small" text-anchor="middle">原始记录身份被页面改写</text>

  <rect x="409" y="523" width="249" height="42" rx="21" fill="#0f172a" stroke="#fb7185"/>
  <text x="533" y="549" fill="#fecdd3" font-size="10" font-weight="700" text-anchor="middle">输入时序暴露规则问题</text>

  <!-- panel 3 boxes -->
  <circle cx="742" cy="162" r="17" fill="#4c1d95" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="742" y="167" fill="#ede9fe" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="771" y="168" class="panel-title">修补建议被退回</text>
  <text x="731" y="198" fill="#a78bfa" font-size="9" font-weight="600">回到实验对象和记录次序</text>

  <rect x="731" y="224" width="275" height="82" rx="10" fill="#0f172a" stroke="#7c3aed"/>
  <text x="751" y="250" fill="#c4b5fd" font-size="9" font-weight="700">AI建议</text>
  <text x="751" y="274" class="label">输入完成／失焦后再排序</text>
  <line x1="750" y1="281" x2="986" y2="238" stroke="#fb7185" stroke-width="2" opacity="0.85"/>

  <path d="M 868 314 L 868 340" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="731" y="348" width="275" height="126" rx="10" fill="rgba(76,29,149,0.28)" stroke="#a78bfa"/>
  <text x="751" y="375" fill="#c4b5fd" font-size="9" font-weight="700">教师复查字段身份</text>
  <text x="751" y="402" class="body">v₁／v₂对应两只光电门的</text>
  <text x="751" y="422" class="body">位置与原始记录次序</text>
  <line x1="751" y1="439" x2="986" y2="439" stroke="#475569"/>
  <text x="751" y="460" fill="#f8fafc" font-size="10" font-weight="700">决定：取消整个自动排序</text>

  <rect x="744" y="523" width="249" height="42" rx="21" fill="#0f172a" stroke="#a78bfa"/>
  <text x="868" y="549" fill="#ddd6fe" font-size="10" font-weight="700" text-anchor="middle">修功能 → 改规则</text>

  <!-- panel 4 boxes -->
  <circle cx="1077" cy="162" r="17" fill="#064e3b" stroke="#34d399" stroke-width="1.4"/>
  <text x="1077" y="167" fill="#d1fae5" font-size="13" font-weight="700" text-anchor="middle">4</text>
  <text x="1106" y="168" class="panel-title">保序规则＋冻结复验</text>
  <text x="1066" y="198" fill="#34d399" font-size="9" font-weight="600">最终规则｜输入什么，就保留什么</text>

  <rect x="1066" y="224" width="313" height="85" rx="10" fill="#0f172a" stroke="#059669"/>
  <text x="1086" y="250" class="small">故意违反“后一速度更大”的预期</text>
  <text x="1086" y="278" class="mono">v₁ = 2.0 m/s</text>
  <text x="1230" y="278" class="mono">v₂ = 1.0 m/s</text>

  <path d="M 1222 317 L 1222 342" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <rect x="1066" y="350" width="313" height="133" rx="10" fill="rgba(6,78,59,0.30)" stroke="#34d399" stroke-width="1.2"/>
  <text x="1086" y="379" fill="#6ee7b7" font-size="10" font-weight="700">冻结副本复验结果</text>
  <text x="1086" y="406" class="body">✓ 原输入顺序保留</text>
  <text x="1086" y="429" class="body">✓ 当前公式给出负的动能增加量</text>
  <text x="1086" y="452" class="body">✓ 计算、导出、清空已确认</text>
  <text x="1086" y="473" class="small">异常仍可见，供使用者继续检查</text>

  <rect x="1078" y="523" width="289" height="42" rx="21" fill="#052e2b" stroke="#34d399" stroke-width="1.4"/>
  <text x="1222" y="549" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">冻结副本已复验</text>

  <!-- title and evidence badge, rendered last -->
  <text x="40" y="43" class="title">图4　v₁/v₂从实时排序故障到保序规则</text>
  <text x="40" y="68" class="subtitle">字段身份退回链｜气垫导轨实验页面｜故障现场未留截图，本图依据开发会话、Git记录和冻结副本复验重绘</text>
  <rect x="1110" y="24" width="290" height="58" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="1.5"/>
  <text x="1255" y="48" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">冻结副本已复验</text>
  <text x="1255" y="68" fill="#a7f3d0" font-size="8" text-anchor="middle">保序＋当前公式计算／导出／清空</text>

  <!-- evidence boundary -->
  <rect x="40" y="626" width="1360" height="134" rx="16" fill="rgba(30,41,59,0.72)" stroke="#475569" stroke-width="1.2"/>
  <rect x="62" y="648" width="626" height="87" rx="10" fill="#0f172a" stroke="#34d399"/>
  <text x="82" y="674" fill="#34d399" font-size="11" font-weight="700">本图能够支持</text>
  <text x="82" y="698" class="body">实时排序故障可追溯；教师取消自动排序；冻结样例已按当前公式复验。</text>
  <text x="82" y="719" class="small">速度编号按光电门位置和记录次序保留，异常数据不由页面后台改写。</text>

  <rect x="712" y="648" width="666" height="87" rx="10" fill="#0f172a" stroke="#fb7185"/>
  <text x="732" y="674" fill="#fb7185" font-size="11" font-weight="700">本图不能支持</text>
  <text x="732" y="698" class="body">线上当前版本、真实设备连接、所有浏览器长期稳定或课堂学习效果。</text>
  <text x="732" y="719" class="small">冻结副本通过仍不等于整个网站、全部页面或发布环境已完成复验。</text>

  <text x="40" y="795" class="tiny">来源：B3《输入的v₁为什么自己变了》、三路线共享事实与证据边界；课例与各次贡献按原始记录分别署名。</text>
</svg>
