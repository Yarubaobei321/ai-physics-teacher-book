<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 25px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 13px; }
    .section { fill: #cbd5e1; font-size: 12px; font-weight: 600; letter-spacing: 1px; }
    .name { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    .meta { fill: #cbd5e1; font-size: 12px; font-weight: 500; }
    .desc { fill: #94a3b8; font-size: 11px; }
    .arrow-label { fill: #cbd5e1; font-size: 10px; font-weight: 600; }
    .stop-title { fill: #fecdd3; font-size: 12px; font-weight: 700; }
    .stop-text { fill: #fda4af; font-size: 10px; }
    .truth-title { fill: #fbbf24; font-size: 12px; font-weight: 700; letter-spacing: .5px; }
    .legend { fill: #94a3b8; font-size: 10px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="#0f172a"/>
  <rect width="1400" height="860" fill="url(#grid)"/>

  <text x="50" y="50" class="title">同一对象的几种说法如何互相限制</text>
  <text x="50" y="80" class="subtitle">对象 → 数据 → 页面 → 主张；每一步都由外部真值约束，并保留可以停止的位置</text>
  <text x="60" y="132" class="section">同一条解释链</text>

  <!-- Main-flow connectors -->
  <line x1="320" y1="235" x2="390" y2="235" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrow-cyan)"/>
  <line x1="650" y1="235" x2="720" y2="235" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow-emerald)"/>
  <line x1="980" y1="235" x2="1050" y2="235" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#arrow-violet)"/>
  <text x="355" y="215" class="arrow-label" text-anchor="middle">测量／记录</text>
  <text x="685" y="215" class="arrow-label" text-anchor="middle">算法／呈现</text>
  <text x="1015" y="215" class="arrow-label" text-anchor="middle">解释／决策</text>

  <!-- Stop branches -->
  <path d="M355 300 L355 358" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <path d="M685 300 L685 358" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>
  <path d="M1015 300 L1015 358" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-rose)"/>

  <!-- External-truth feedback connectors -->
  <path d="M190 585 L190 310" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrow-slate)"/>
  <path d="M520 585 L520 310" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrow-slate)"/>
  <path d="M850 585 L850 310" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrow-slate)"/>
  <path d="M1180 585 L1180 310" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrow-slate)"/>

  <!-- Opaque masks: main boxes -->
  <rect x="60" y="170" width="260" height="130" rx="10" fill="#0f172a"/>
  <rect x="390" y="170" width="260" height="130" rx="10" fill="#0f172a"/>
  <rect x="720" y="170" width="260" height="130" rx="10" fill="#0f172a"/>
  <rect x="1050" y="170" width="260" height="130" rx="10" fill="#0f172a"/>

  <!-- Main boxes -->
  <rect x="60" y="170" width="260" height="130" rx="10" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="2"/>
  <rect x="390" y="170" width="260" height="130" rx="10" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/>
  <rect x="720" y="170" width="260" height="130" rx="10" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="2"/>
  <rect x="1050" y="170" width="260" height="130" rx="10" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="2"/>

  <text x="190" y="207" class="name" text-anchor="middle">物理对象</text>
  <text x="190" y="235" class="meta" text-anchor="middle">系统 · 条件 · 状态</text>
  <text x="190" y="264" class="desc" text-anchor="middle">真实装置或现象在发生什么</text>

  <text x="520" y="207" class="name" text-anchor="middle">数据与记录</text>
  <text x="520" y="235" class="meta" text-anchor="middle">直接量 · 代理量 · 派生量</text>
  <text x="520" y="264" class="desc" text-anchor="middle">每一个数从哪里来</text>

  <text x="850" y="207" class="name" text-anchor="middle">页面与算法</text>
  <text x="850" y="235" class="meta" text-anchor="middle">函数 · 显示 · 交互 · 版本</text>
  <text x="850" y="264" class="desc" text-anchor="middle">页面怎样处理并表达数据</text>

  <text x="1180" y="207" class="name" text-anchor="middle">主张与行动</text>
  <text x="1180" y="235" class="meta" text-anchor="middle">趋势 · 通过 · 使用 · 发布</text>
  <text x="1180" y="264" class="desc" text-anchor="middle">证据允许说到哪一层</text>

  <!-- Stop boxes -->
  <rect x="265" y="365" width="180" height="92" rx="9" fill="#0f172a"/>
  <rect x="595" y="365" width="180" height="92" rx="9" fill="#0f172a"/>
  <rect x="925" y="365" width="180" height="92" rx="9" fill="#0f172a"/>
  <rect x="265" y="365" width="180" height="92" rx="9" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.6"/>
  <rect x="595" y="365" width="180" height="92" rx="9" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.6"/>
  <rect x="925" y="365" width="180" height="92" rx="9" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.6"/>
  <text x="355" y="393" class="stop-title" text-anchor="middle">停止点 1</text>
  <text x="355" y="418" class="stop-text" text-anchor="middle">对象或量的身份不清</text>
  <text x="355" y="438" class="stop-text" text-anchor="middle">退回定义与原始记录</text>
  <text x="685" y="393" class="stop-title" text-anchor="middle">停止点 2</text>
  <text x="685" y="418" class="stop-text" text-anchor="middle">独立反例没有通过</text>
  <text x="685" y="438" class="stop-text" text-anchor="middle">退回公式、算法或版本</text>
  <text x="1015" y="393" class="stop-title" text-anchor="middle">停止点 3</text>
  <text x="1015" y="418" class="stop-text" text-anchor="middle">主张越界或权利不清</text>
  <text x="1015" y="438" class="stop-text" text-anchor="middle">补证、内部试用或停发</text>

  <!-- External truth region -->
  <rect x="50" y="520" width="1300" height="220" rx="14" fill="rgba(120,53,15,.12)" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="9,5"/>
  <text x="75" y="550" class="truth-title">外部真值回路｜每一种说法都要接受独立来源约束</text>

  <rect x="70" y="585" width="240" height="110" rx="9" fill="#0f172a"/>
  <rect x="400" y="585" width="240" height="110" rx="9" fill="#0f172a"/>
  <rect x="730" y="585" width="240" height="110" rx="9" fill="#0f172a"/>
  <rect x="1060" y="585" width="240" height="110" rx="9" fill="#0f172a"/>
  <rect x="70" y="585" width="240" height="110" rx="9" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="400" y="585" width="240" height="110" rx="9" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="730" y="585" width="240" height="110" rx="9" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="1060" y="585" width="240" height="110" rx="9" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="190" y="616" class="meta" text-anchor="middle">真实装置与边界条件</text>
  <text x="190" y="643" class="desc" text-anchor="middle">系统、几何、状态、器材身份</text>
  <text x="190" y="668" class="desc" text-anchor="middle">不由页面外观替代</text>

  <text x="520" y="616" class="meta" text-anchor="middle">原始测量与记录</text>
  <text x="520" y="643" class="desc" text-anchor="middle">纸带、读数、工作簿、数据来源</text>
  <text x="520" y="668" class="desc" text-anchor="middle">理论生成值不冒充实测</text>

  <text x="850" y="616" class="meta" text-anchor="middle">独立推导与失败样例</text>
  <text x="850" y="643" class="desc" text-anchor="middle">手算、特殊值、冻结版本复验</text>
  <text x="850" y="668" class="desc" text-anchor="middle">检查门必须能被错误触发</text>

  <text x="1180" y="616" class="meta" text-anchor="middle">课堂、权利与维护记录</text>
  <text x="1180" y="643" class="desc" text-anchor="middle">谁使用、谁授权、谁负责</text>
  <text x="1180" y="668" class="desc" text-anchor="middle">范围与时间随证据更新</text>

  <line x1="70" y1="792" x2="112" y2="792" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7,5"/>
  <text x="122" y="796" class="legend">外部真值约束</text>
  <line x1="300" y1="792" x2="342" y2="792" stroke="#fb7185" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="352" y="796" class="legend">命中即停止并留下再次进入条件</text>
  <text x="1330" y="817" class="legend" text-anchor="end">Grok路线核心证据图 · 2026-08-31</text>
</svg>
