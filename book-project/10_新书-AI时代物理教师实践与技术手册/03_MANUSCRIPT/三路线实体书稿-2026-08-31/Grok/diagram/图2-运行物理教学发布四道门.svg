<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1040">
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { fill: #f8fafc; font-size: 25px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 13px; }
    .banner-title { fill: #ffe4e6; font-size: 16px; font-weight: 700; }
    .banner-text { fill: #fecdd3; font-size: 11px; }
    .hub-title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .hub-text { fill: #cbd5e1; font-size: 12px; }
    .gate-name { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    .gate-question { fill: #e2e8f0; font-size: 11px; font-weight: 500; }
    .gate-evidence { fill: #94a3b8; font-size: 10px; }
    .result-title { fill: #f8fafc; font-size: 11px; font-weight: 700; }
    .result-text { fill: #cbd5e1; font-size: 9.5px; }
    .boundary-title { fill: #cbd5e1; font-size: 10px; font-weight: 700; }
    .boundary-text { fill: #94a3b8; font-size: 9.5px; }
    .arrow-label { font-size: 9px; font-weight: 700; }
    .bottom-title { fill: #fbbf24; font-size: 13px; font-weight: 700; }
    .bottom-text { fill: #cbd5e1; font-size: 11px; }
    .tag { fill: #f8fafc; font-size: 10px; font-weight: 700; }
    .legend { fill: #94a3b8; font-size: 9.5px; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1450" height="1040" fill="#0f172a"/>
  <rect width="1450" height="1040" fill="url(#grid)"/>

  <text x="50" y="48" class="title">运行、物理、教学、发布四道门</text>
  <text x="50" y="78" class="subtitle">同一成果并行接受四种核查；每一门都能独立通过、退回或保持待核</text>

  <rect x="50" y="103" width="1350" height="72" rx="12" fill="#0f172a"/>
  <rect x="50" y="103" width="1350" height="72" rx="12" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.7"/>
  <text x="75" y="132" class="banner-title">四门并行，不串联代证</text>
  <text x="75" y="157" class="banner-text">运行通过 ≠ 物理通过　·　物理通过 ≠ 课堂使用　·　课堂使用 ≠ 学习效果　·　已经发布 ≠ 长期维护</text>

  <!-- Parallel branch connectors -->
  <path d="M320 510 L385 510 L385 270 L460 270" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M385 440 L460 440" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M385 610 L460 610" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <path d="M385 510 L385 780 L460 780" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-slate)"/>
  <circle cx="385" cy="270" r="4" fill="#94a3b8"/>
  <circle cx="385" cy="440" r="4" fill="#94a3b8"/>
  <circle cx="385" cy="610" r="4" fill="#94a3b8"/>
  <circle cx="385" cy="780" r="4" fill="#94a3b8"/>

  <!-- Per-gate pass/deny connectors -->
  <path d="M790 270 L835 270 L835 236 L880 236" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M835 270 L835 304 L880 304" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
  <path d="M790 440 L835 440 L835 406 L880 406" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M835 440 L835 474 L880 474" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
  <path d="M790 610 L835 610 L835 576 L880 576" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M835 610 L835 644 L880 644" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>
  <path d="M790 780 L835 780 L835 746 L880 746" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M835 780 L835 814 L880 814" fill="none" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrow-rose)"/>

  <!-- Opaque masks -->
  <rect x="50" y="370" width="270" height="280" rx="14" fill="#0f172a"/>
  <rect x="460" y="210" width="330" height="120" rx="10" fill="#0f172a"/>
  <rect x="460" y="380" width="330" height="120" rx="10" fill="#0f172a"/>
  <rect x="460" y="550" width="330" height="120" rx="10" fill="#0f172a"/>
  <rect x="460" y="720" width="330" height="120" rx="10" fill="#0f172a"/>

  <!-- Hub -->
  <rect x="50" y="370" width="270" height="280" rx="14" fill="rgba(30,41,59,.5)" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="185" y="414" class="hub-title" text-anchor="middle">待判断成果</text>
  <text x="185" y="451" class="hub-text" text-anchor="middle">装置 · 页面 · 流程 · 网站</text>
  <line x1="95" y1="477" x2="275" y2="477" stroke="#475569" stroke-width="1"/>
  <text x="185" y="515" class="hub-text" text-anchor="middle">同一对象同时进入四门</text>
  <text x="185" y="545" class="hub-text" text-anchor="middle">各门读取不同证据</text>
  <text x="185" y="575" class="hub-text" text-anchor="middle">各自保留通过／否决／待核</text>
  <text x="185" y="615" class="legend" text-anchor="middle">没有总分，也不互相补证</text>

  <!-- Gate 1 -->
  <rect x="460" y="210" width="330" height="120" rx="10" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="2"/>
  <text x="485" y="244" class="gate-name">运行门</text>
  <text x="485" y="272" class="gate-question">指定版本与条件下，能否完成动作？</text>
  <text x="485" y="300" class="gate-evidence">实物 · 操作记录 · 构建测试 · 冻结复现</text>

  <!-- Gate 2 -->
  <rect x="460" y="380" width="330" height="120" rx="10" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="2"/>
  <text x="485" y="414" class="gate-name">物理门</text>
  <text x="485" y="442" class="gate-question">对象、单位、数据身份与关系是否成立？</text>
  <text x="485" y="470" class="gate-evidence">推导 · 原始数据 · 校准 · 特殊值 · 残差</text>

  <!-- Gate 3 -->
  <rect x="460" y="550" width="330" height="120" rx="10" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="2"/>
  <text x="485" y="584" class="gate-name">教学门</text>
  <text x="485" y="612" class="gate-question">谁在什么任务中实际使用并留下什么？</text>
  <text x="485" y="640" class="gate-evidence">教案 · 课堂记录 · 操作路径 · 作品 · 反思</text>

  <!-- Gate 4 -->
  <rect x="460" y="720" width="330" height="120" rx="10" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="2"/>
  <text x="485" y="754" class="gate-name">发布门</text>
  <text x="485" y="782" class="gate-question">权利、隐私、版本、入口与维护是否清楚？</text>
  <text x="485" y="810" class="gate-evidence">授权 · 脱敏 · 固定入口 · 负责人 · 停用记录</text>

  <!-- Outcome boxes: row 1 -->
  <rect x="880" y="210" width="260" height="52" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.4"/>
  <rect x="880" y="278" width="260" height="52" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="900" y="232" class="result-title">通过</text>
  <text x="900" y="250" class="result-text">可说：指定版本完成了指定运行</text>
  <text x="900" y="300" class="result-title">否决／待核</text>
  <text x="900" y="318" class="result-text">补操作证据，或停止运行主张</text>

  <!-- Outcome boxes: row 2 -->
  <rect x="880" y="380" width="260" height="52" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.4"/>
  <rect x="880" y="448" width="260" height="52" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="900" y="402" class="result-title">通过</text>
  <text x="900" y="420" class="result-text">可说：登记范围内物理核查通过</text>
  <text x="900" y="470" class="result-title">否决／待核</text>
  <text x="900" y="488" class="result-text">退回对象、数据、算法或模型</text>

  <!-- Outcome boxes: row 3 -->
  <rect x="880" y="550" width="260" height="52" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.4"/>
  <rect x="880" y="618" width="260" height="52" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="900" y="572" class="result-title">通过</text>
  <text x="900" y="590" class="result-text">可说：特定任务中发生实际使用</text>
  <text x="900" y="640" class="result-title">否决／待核</text>
  <text x="900" y="658" class="result-text">保持设计状态，等待真实实施证据</text>

  <!-- Outcome boxes: row 4 -->
  <rect x="880" y="720" width="260" height="52" rx="8" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.4"/>
  <rect x="880" y="788" width="260" height="52" rx="8" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.4"/>
  <text x="900" y="742" class="result-title">通过</text>
  <text x="900" y="760" class="result-text">可说：授权版本可在登记范围发布</text>
  <text x="900" y="810" class="result-title">否决／待核</text>
  <text x="900" y="828" class="result-text">暂停发布，或撤回既有入口</text>

  <!-- Boundaries: what each gate still cannot prove -->
  <rect x="1180" y="210" width="220" height="120" rx="9" fill="rgba(30,41,59,.5)" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <rect x="1180" y="380" width="220" height="120" rx="9" fill="rgba(30,41,59,.5)" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <rect x="1180" y="550" width="220" height="120" rx="9" fill="rgba(30,41,59,.5)" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <rect x="1180" y="720" width="220" height="120" rx="9" fill="rgba(30,41,59,.5)" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="1200" y="238" class="boundary-title">这一门仍不能推出</text>
  <text x="1200" y="268" class="boundary-text">物理模型完整</text>
  <text x="1200" y="291" class="boundary-text">所有参数可靠</text>
  <text x="1200" y="318" class="boundary-text">课堂与效果另验</text>

  <text x="1200" y="408" class="boundary-title">这一门仍不能推出</text>
  <text x="1200" y="438" class="boundary-text">已经进入课堂</text>
  <text x="1200" y="461" class="boundary-text">学生已经理解</text>
  <text x="1200" y="488" class="boundary-text">权利与维护另验</text>

  <text x="1200" y="578" class="boundary-title">这一门仍不能推出</text>
  <text x="1200" y="608" class="boundary-text">学习结果发生</text>
  <text x="1200" y="631" class="boundary-text">能够普遍迁移</text>
  <text x="1200" y="658" class="boundary-text">发布许可另验</text>

  <text x="1200" y="748" class="boundary-title">这一门仍不能推出</text>
  <text x="1200" y="778" class="boundary-text">资源长期有效</text>
  <text x="1200" y="801" class="boundary-text">已被广泛采用</text>
  <text x="1200" y="828" class="boundary-text">物理与教学另验</text>

  <!-- Bottom synthesis rule -->
  <rect x="50" y="890" width="1350" height="100" rx="12" fill="rgba(120,53,15,.18)" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="75" y="920" class="bottom-title">对外主张合成规则</text>
  <text x="75" y="951" class="bottom-text">一句话只吸收每门已经通过的内容；任一否决或待核项独立保留为停止点，不用总分、平均值或相邻门补齐。</text>
  <rect x="950" y="912" width="95" height="34" rx="17" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/>
  <rect x="1055" y="912" width="95" height="34" rx="17" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <rect x="1160" y="912" width="95" height="34" rx="17" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/>
  <rect x="1265" y="912" width="95" height="34" rx="17" fill="rgba(120,53,15,.3)" stroke="#fbbf24"/>
  <text x="997" y="934" class="tag" text-anchor="middle">运行 ✓／×／待</text>
  <text x="1102" y="934" class="tag" text-anchor="middle">物理 ✓／×／待</text>
  <text x="1207" y="934" class="tag" text-anchor="middle">教学 ✓／×／待</text>
  <text x="1312" y="934" class="tag" text-anchor="middle">发布 ✓／×／待</text>
  <text x="1390" y="1015" class="legend" text-anchor="end">Grok路线核心证据图 · 2026-08-31</text>
</svg>
