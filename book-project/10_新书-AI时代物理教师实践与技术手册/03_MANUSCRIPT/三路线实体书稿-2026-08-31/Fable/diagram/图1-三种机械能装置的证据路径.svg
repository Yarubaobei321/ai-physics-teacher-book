<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">三种机械能装置的证据路径</title>
  <desc id="desc">纸带、圆柱体摆动和气垫导轨三种实验方案各自从对象、测量到关系式形成证据。同方案内分析已经发生，跨方案比较没有自然发生。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 15px; font-weight: 400; fill: #94a3b8; }
      .section { font-size: 15px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .box-label { font-size: 12px; font-weight: 600; }
      .body { font-size: 12px; font-weight: 400; fill: #cbd5e1; }
      .small { font-size: 11px; font-weight: 400; fill: #94a3b8; }
      .tiny { font-size: 10px; font-weight: 400; fill: #94a3b8; }
      .formula { font-size: 14px; font-weight: 600; fill: #f8fafc; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0f172a"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <rect x="44" y="174" width="1512" height="514" rx="18" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="10,6"/>
  <text x="66" y="202" class="section" fill="#fbbf24">三条独立证据路径｜共同主题不等于共同模型</text>

  <path d="M 284 290 L 284 632 L 800 728" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow-cyan)"/>
  <path d="M 800 290 L 800 704" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow-emerald)"/>
  <path d="M 1316 290 L 1316 632 L 800 728" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.75" marker-end="url(#arrow-violet)"/>
  <path d="M 800 812 L 800 858" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrow-rose)"/>

  <rect x="176" y="112" width="1248" height="64" rx="12" fill="#0f172a"/>
  <rect x="176" y="112" width="1248" height="64" rx="12" fill="rgba(120,53,15,0.28)" stroke="#fbbf24" stroke-width="1.5"/>

  <rect x="78" y="226" width="412" height="430" rx="14" fill="#0f172a"/>
  <rect x="78" y="226" width="412" height="430" rx="14" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="2"/>
  <rect x="594" y="226" width="412" height="430" rx="14" fill="#0f172a"/>
  <rect x="594" y="226" width="412" height="430" rx="14" fill="rgba(6,78,59,0.38)" stroke="#34d399" stroke-width="2"/>
  <rect x="1110" y="226" width="412" height="430" rx="14" fill="#0f172a"/>
  <rect x="1110" y="226" width="412" height="430" rx="14" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="2"/>

  <rect x="368" y="716" width="864" height="96" rx="14" fill="#0f172a"/>
  <rect x="368" y="716" width="864" height="96" rx="14" fill="rgba(6,78,59,0.36)" stroke="#34d399" stroke-width="2"/>
  <rect x="260" y="858" width="1080" height="88" rx="14" fill="#0f172a"/>
  <rect x="260" y="858" width="1080" height="88" rx="14" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="2"/>

  <text x="48" y="48" class="title">三种机械能装置，三条证据路径</text>
  <text x="48" y="78" class="subtitle">六个小组、三种方案、一个网页：证据同时到场以后，比较仍需被设计</text>

  <text x="800" y="137" class="box-title" text-anchor="middle">共同课堂问题</text>
  <text x="800" y="160" class="body" text-anchor="middle">机械能变化怎样由真实测量支持？｜公开课：6组、3方案、每方案2组</text>

  <text x="284" y="264" class="box-title" text-anchor="middle">纸带法</text>
  <text x="284" y="287" class="small" text-anchor="middle">从空间点迹推到两个时刻的速度</text>
  <line x1="106" y1="310" x2="462" y2="310" stroke="#164e63" stroke-width="1"/>
  <text x="112" y="340" class="box-label" fill="#67e8f9">对象</text>
  <text x="176" y="340" class="body">同一运动过程中的位置1 → 位置2</text>
  <text x="112" y="380" class="box-label" fill="#67e8f9">直接记录</text>
  <text x="196" y="380" class="body">纸带点迹、点距、时间间隔、Δh</text>
  <text x="112" y="420" class="box-label" fill="#67e8f9">派生量</text>
  <text x="188" y="420" class="body">由邻近时间段估算 v₁、v₂</text>
  <text x="112" y="460" class="box-label" fill="#67e8f9">关系式</text>
  <text x="284" y="490" class="formula" text-anchor="middle">mgΔh  ↔  ½m(v₂² − v₁²)</text>
  <rect x="108" y="520" width="352" height="100" rx="8" fill="rgba(8,51,68,0.28)" stroke="#155e75"/>
  <text x="128" y="548" class="box-label" fill="#67e8f9">必须保住的身份</text>
  <text x="128" y="574" class="body">高度差与速度对应同一对位置</text>
  <text x="128" y="598" class="body">速度不能借守恒式反造后再“验证”守恒</text>

  <text x="800" y="264" class="box-title" text-anchor="middle">圆柱体摆动</text>
  <text x="800" y="287" class="small" text-anchor="middle">从挡光事件推到质心最低点速度</text>
  <line x1="622" y1="310" x2="978" y2="310" stroke="#065f46" stroke-width="1"/>
  <text x="628" y="340" class="box-label" fill="#6ee7b7">对象</text>
  <text x="692" y="340" class="body">圆柱体质心：释放位置 → 最低点</text>
  <text x="628" y="380" class="box-label" fill="#6ee7b7">直接记录</text>
  <text x="712" y="380" class="body">Δh、挡光宽度、遮光时间</text>
  <text x="628" y="420" class="box-label" fill="#6ee7b7">派生量</text>
  <text x="704" y="420" class="body">质心经过最低点的速度 vᴅ</text>
  <text x="628" y="460" class="box-label" fill="#6ee7b7">关系式</text>
  <text x="800" y="490" class="formula" text-anchor="middle">mgΔh  ≈  ½mvᴅ²</text>
  <rect x="624" y="520" width="352" height="100" rx="8" fill="rgba(6,78,59,0.28)" stroke="#047857"/>
  <text x="644" y="548" class="box-label" fill="#6ee7b7">必须写出的模型缝隙</text>
  <text x="644" y="574" class="body">页面只计质心平动动能</text>
  <text x="644" y="598" class="body">自转项未测量，不能被曲线自动补齐</text>

  <text x="1316" y="264" class="box-title" text-anchor="middle">气垫导轨</text>
  <text x="1316" y="287" class="small" text-anchor="middle">系统边界决定势能与动能怎样入账</text>
  <line x1="1138" y1="310" x2="1494" y2="310" stroke="#5b21b6" stroke-width="1"/>
  <text x="1144" y="340" class="box-label" fill="#c4b5fd">对象</text>
  <text x="1208" y="340" class="body">滑块＋悬挂重物＋地球</text>
  <text x="1144" y="380" class="box-label" fill="#c4b5fd">直接记录</text>
  <text x="1228" y="380" class="body">M、m、h、两光电门的先后速度</text>
  <text x="1144" y="420" class="box-label" fill="#c4b5fd">身份约束</text>
  <text x="1228" y="420" class="body">v₁、v₂按位置与时刻保留原序</text>
  <text x="1144" y="460" class="box-label" fill="#c4b5fd">关系式</text>
  <text x="1316" y="490" class="formula" text-anchor="middle">mgh  ↔  ½(M＋m)(v₂² − v₁²)</text>
  <rect x="1140" y="520" width="352" height="100" rx="8" fill="rgba(76,29,149,0.28)" stroke="#7c3aed"/>
  <text x="1160" y="548" class="box-label" fill="#c4b5fd">必须保住的系统边界</text>
  <text x="1160" y="574" class="body">势能来自悬挂重物，动能含两物体</text>
  <text x="1160" y="598" class="body">水平、绳紧、阻力与滑轮影响需写条件</text>

  <text x="800" y="752" class="box-title" text-anchor="middle">同方案内的分析与提问：已经发生</text>
  <text x="800" y="780" class="body" text-anchor="middle">每种方案各有两组；学生围绕本组数据、装置与结果完成分析或提问</text>
  <text x="800" y="889" class="box-title" text-anchor="middle">跨方案比较：没有自然发生</text>
  <text x="800" y="916" class="body" text-anchor="middle">需要另设汇合任务：直接量／派生量怎样不同？系统边界怎样不同？哪一项能量尚未测量？</text>

  <circle cx="296" cy="914" r="13" fill="#fb7185"/>
  <path d="M 290 908 L 302 920 M 302 908 L 290 920" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <text x="48" y="976" class="tiny">事实边界：学生数据为手动录入并投屏；本图不主张自动采集、学习效果或跨方案比较已经完成。</text>
</svg>
