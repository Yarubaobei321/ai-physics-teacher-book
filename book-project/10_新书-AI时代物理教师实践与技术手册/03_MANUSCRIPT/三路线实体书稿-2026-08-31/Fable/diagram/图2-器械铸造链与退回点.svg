  <path d="M 1300 304 L 1320 304" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <path d="M 310 334 L 310 500" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <path d="M 630 334 L 630 500" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <path d="M 950 334 L 950 500" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>
  <path d="M 1270 334 L 1270 500" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-rose)"/>

  <path d="M 310 626 C 286 696, 186 687, 150 462" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow-rose)"/>
  <path d="M 630 626 C 606 696, 506 687, 470 462" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow-rose)"/>
  <path d="M 950 626 C 926 696, 826 687, 790 462" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow-rose)"/>
  <path d="M 1270 626 C 1246 696, 1146 687, 1110 462" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="5,5" marker-end="url(#arrow-rose)"/>

  <rect x="40" y="204" width="220" height="200" rx="14" fill="#0f172a"/>
  <rect x="40" y="204" width="220" height="200" rx="14" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="2"/>
  <rect x="360" y="204" width="220" height="200" rx="14" fill="#0f172a"/>
  <rect x="360" y="204" width="220" height="200" rx="14" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="2"/>
  <rect x="680" y="204" width="220" height="200" rx="14" fill="#0f172a"/>
  <rect x="680" y="204" width="220" height="200" rx="14" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="2"/>
  <rect x="1000" y="204" width="220" height="200" rx="14" fill="#0f172a"/>
  <rect x="1000" y="204" width="220" height="200" rx="14" fill="rgba(120,53,15,0.34)" stroke="#fbbf24" stroke-width="2"/>
  <rect x="1320" y="204" width="240" height="200" rx="14" fill="#0f172a"/>
  <rect x="1320" y="204" width="240" height="200" rx="14" fill="rgba(59,130,246,0.32)" stroke="#60a5fa" stroke-width="2"/>

  <g transform="translate(310,304)">
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#0f172a"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="rgba(120,53,15,0.45)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" class="node-num" fill="#fde68a" text-anchor="middle">查</text>
  </g>
  <g transform="translate(630,304)">
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#0f172a"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="rgba(120,53,15,0.45)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" class="node-num" fill="#fde68a" text-anchor="middle">查</text>
  </g>
  <g transform="translate(950,304)">
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#0f172a"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="rgba(120,53,15,0.45)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" class="node-num" fill="#fde68a" text-anchor="middle">查</text>
  </g>
  <g transform="translate(1270,304)">
    <polygon points="0,-30 30,0 0,30 -30,0" fill="#0f172a"/>
    <polygon points="0,-30 30,0 0,30 -30,0" fill="rgba(120,53,15,0.45)" stroke="#fbbf24" stroke-width="1.5"/>
    <text y="4" class="node-num" fill="#fde68a" text-anchor="middle">查</text>
  </g>

  <rect x="190" y="500" width="240" height="126" rx="12" fill="#0f172a"/>
  <rect x="190" y="500" width="240" height="126" rx="12" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.7"/>
  <rect x="510" y="500" width="240" height="126" rx="12" fill="#0f172a"/>
  <rect x="510" y="500" width="240" height="126" rx="12" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.7"/>
  <rect x="830" y="500" width="240" height="126" rx="12" fill="#0f172a"/>
  <rect x="830" y="500" width="240" height="126" rx="12" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.7"/>
  <rect x="1150" y="500" width="240" height="126" rx="12" fill="#0f172a"/>
  <rect x="1150" y="500" width="240" height="126" rx="12" fill="rgba(136,19,55,0.40)" stroke="#fb7185" stroke-width="1.7"/>

  <rect x="64" y="766" width="342" height="116" rx="12" fill="#0f172a"/>
  <rect x="64" y="766" width="342" height="116" rx="12" fill="rgba(8,51,68,0.38)" stroke="#22d3ee" stroke-width="1.6"/>
  <rect x="440" y="766" width="342" height="116" rx="12" fill="#0f172a"/>
  <rect x="440" y="766" width="342" height="116" rx="12" fill="rgba(6,78,59,0.38)" stroke="#34d399" stroke-width="1.6"/>
  <rect x="816" y="766" width="342" height="116" rx="12" fill="#0f172a"/>
  <rect x="816" y="766" width="342" height="116" rx="12" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.6"/>
  <rect x="1192" y="766" width="342" height="116" rx="12" fill="#0f172a"/>
  <rect x="1192" y="766" width="342" height="116" rx="12" fill="rgba(120,53,15,0.34)" stroke="#fbbf24" stroke-width="1.6"/>

  <text x="48" y="48" class="title">器械铸造链：每次身份改变，都留一个退回点</text>
  <text x="48" y="78" class="subtitle">原始证据经过测量、制品与课堂，才抵达一句可公开的话；任何一段都可以暂停、回查、重做</text>

  <text x="58" y="184" class="small">主链｜对象逐层改变身份</text>
  <text x="58" y="498" class="small" fill="#fda4af">退回区｜检查失败就回到上一对象，不用形容词跨过去</text>
  <text x="58" y="744" class="small" fill="#fde68a">可带走的器械｜每件器械只解决一类身份问题</text>

  <text x="150" y="234" class="node-num" fill="#67e8f9" text-anchor="middle">01</text>
  <text x="150" y="264" class="node-title" text-anchor="middle">原始现象／记录</text>
  <text x="66" y="302" class="body">• 实验器物与运动</text>
  <text x="66" y="329" class="body">• 点迹、读数、原始文件</text>
  <text x="66" y="356" class="body">• 学生作品与操作痕迹</text>
  <text x="66" y="384" class="small">先保存；不静默补齐或改写</text>

  <text x="470" y="234" class="node-num" fill="#6ee7b7" text-anchor="middle">02</text>
  <text x="470" y="264" class="node-title" text-anchor="middle">测量身份</text>
  <text x="386" y="302" class="body">• 直接量／代理量</text>
  <text x="386" y="329" class="body">• 派生量／人工处置</text>
  <text x="386" y="356" class="body">• 对象—信号—算法—显示</text>
  <text x="386" y="384" class="small">单位、位置、时刻都要对上</text>

  <text x="790" y="234" class="node-num" fill="#c4b5fd" text-anchor="middle">03</text>
  <text x="790" y="264" class="node-title" text-anchor="middle">页面／装置</text>
  <text x="706" y="302" class="body">• 模型、公式与协议</text>
  <text x="706" y="329" class="body">• 算法、界面与版本</text>
  <text x="706" y="356" class="body">• 动画、数值与图表</text>
  <text x="706" y="384" class="small">能运行后再接外部真值</text>

  <text x="1110" y="234" class="node-num" fill="#fde68a" text-anchor="middle">04</text>
  <text x="1110" y="264" class="node-title" text-anchor="middle">课堂动作</text>
  <text x="1026" y="302" class="body">• 观察与操作</text>
  <text x="1026" y="329" class="body">• 比较与解释</text>
  <text x="1026" y="356" class="body">• 教师组织与学生过程</text>
  <text x="1026" y="384" class="small">资源到场后仍需任务汇合</text>

  <text x="1440" y="234" class="node-num" fill="#93c5fd" text-anchor="middle">05</text>
  <text x="1440" y="264" class="node-title" text-anchor="middle">可说主张</text>
  <text x="1346" y="302" class="body">存在 → 运行 → 物理</text>
  <text x="1346" y="329" class="body">→ 课堂 → 过程 → 效果</text>
  <text x="1346" y="356" class="body">权利、隐私、版本另核</text>
  <text x="1346" y="384" class="small">证据到哪层，话说到哪层</text>

  <text x="310" y="529" class="checkpoint" text-anchor="middle">退回点 1｜对象换名了吗？</text>
  <text x="310" y="559" class="body" text-anchor="middle">空白是否变成0？</text>
  <text x="310" y="584" class="body" text-anchor="middle">代理量是否冒充直接量？</text>
  <text x="310" y="610" class="small" text-anchor="middle">退回原始记录与来源</text>

  <text x="630" y="529" class="checkpoint" text-anchor="middle">退回点 2｜加工改证据了吗？</text>
  <text x="630" y="559" class="body" text-anchor="middle">单位、顺序、算法是否可见？</text>
  <text x="630" y="584" class="body" text-anchor="middle">原始值是否仍可找回？</text>
  <text x="630" y="610" class="small" text-anchor="middle">退回测量身份与处理规则</text>

  <text x="950" y="529" class="checkpoint" text-anchor="middle">退回点 3｜真值在系统外吗？</text>
  <text x="950" y="559" class="body" text-anchor="middle">动画、数值与图表可同源自洽</text>
  <text x="950" y="584" class="body" text-anchor="middle">还需手算、标定或独立样例</text>
  <text x="950" y="610" class="small" text-anchor="middle">退回模型、公式与版本</text>

  <text x="1270" y="529" class="checkpoint" text-anchor="middle">退回点 4｜动作真的发生了吗？</text>
  <text x="1270" y="559" class="body" text-anchor="middle">三种证据到场，不会自动比较</text>
  <text x="1270" y="584" class="body" text-anchor="middle">页面存在，不会自动产生学习</text>
  <text x="1270" y="610" class="small" text-anchor="middle">退回任务、过程与课堂原件</text>

  <text x="235" y="802" class="tool-title" text-anchor="middle">数据来路表</text>
  <text x="235" y="832" class="body" text-anchor="middle">直接量｜代理量｜派生量｜人工处置</text>
  <text x="235" y="858" class="small" text-anchor="middle">回答“这一个数从哪里来”</text>

  <text x="611" y="802" class="tool-title" text-anchor="middle">五身份表</text>
  <text x="611" y="832" class="body" text-anchor="middle">对象｜物理量｜信号｜算法｜显示</text>
  <text x="611" y="858" class="small" text-anchor="middle">回答“屏幕数字究竟是谁”</text>

  <text x="987" y="802" class="tool-title" text-anchor="middle">外部真值双回路</text>
  <text x="987" y="832" class="body" text-anchor="middle">页面内部一致 × 独立解析／实测</text>
  <text x="987" y="858" class="small" text-anchor="middle">回答“自洽是否也物理成立”</text>

  <text x="1363" y="802" class="tool-title" text-anchor="middle">四项检查＋六层证据</text>
  <text x="1363" y="832" class="body" text-anchor="middle">运行｜物理｜教学｜发布</text>
  <text x="1363" y="858" class="small" text-anchor="middle">回答“这句话允许说到哪里”</text>

  <text x="48" y="968" class="tiny">图中退回点来自已核案例：单摆空白原点、法拉第单位与代理量、动量页面同源自洽、机械能跨方案比较未自然发生；不主张学习效果。</text>
</svg>
