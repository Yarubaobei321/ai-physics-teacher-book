  <style>
    :root { --paper:#f6f2e9; --card:#fffdf8; --ink:#202a35; --muted:#667085; --line:#ddd5c7; --blue:#225c73; --rose:#9b3d52; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 15% 10%,rgba(34,92,115,.13),transparent 28rem),radial-gradient(circle at 90% 80%,rgba(155,61,82,.10),transparent 30rem),var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; line-height:1.65; }
    main { width:min(1040px,calc(100% - 36px)); margin:0 auto; padding:70px 0; }
    .hero { padding:38px; border-radius:26px; background:rgba(255,253,248,.88); border:1px solid var(--line); box-shadow:0 22px 55px rgba(55,45,31,.12); }
    .tag { color:var(--blue); font-weight:800; letter-spacing:.12em; font-size:13px; }
    h1 { margin:8px 0 10px; font:700 clamp(38px,7vw,68px)/1.08 "Songti SC",STSong,serif; }
    .lead { max-width:760px; color:#475467; font-size:19px; margin:0; }
    .primary { display:inline-block; margin-top:24px; padding:12px 18px; border-radius:999px; background:var(--blue); color:white; font-weight:750; text-decoration:none; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:20px; }
    .card { display:block; padding:22px; border-radius:18px; background:rgba(255,253,248,.86); border:1px solid var(--line); color:inherit; text-decoration:none; transition:.18s ease; }
    .card:hover { transform:translateY(-2px); border-color:#9aa8b3; box-shadow:0 12px 28px rgba(55,45,31,.09); }
    .card strong { display:block; font-size:19px; }
    .card span { display:block; margin-top:5px; color:var(--muted); font-size:14px; }
    .figure-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
    figure { margin:0; overflow:hidden; border-radius:18px; background:#0f172a; border:1px solid #263449; }
    figure img { width:100%; display:block; }
    figcaption { padding:14px 16px; color:#d8e0ea; font-size:14px; }
    figcaption a { color:#7dd3fc; margin-right:14px; }
    footer { margin-top:28px; color:var(--muted); font-size:13px; }
    @media(max-width:720px){ .grid,.figure-row{grid-template-columns:1fr}.hero{padding:26px} }
  </style>
</head>
