  "formulas": [
    {
      "formula_id": "formula-water-current",
      "expression": "J = -sigma * grad(V); K = integral_0^h(J_parallel dz) ~= -sigma * h * grad_2D(V); div_2D(K) = 0",
      "variables": {
        "J": "水层体电流密度，单位A/m^2",
        "K": "沿水深积分后的面电流密度，单位A/m",
        "sigma": "水层电导率，单位S/m",
        "h": "水深，单位m",
        "V": "相对于参考端的电势，单位V"
      },
      "scope": "稳恒、薄层、无内部持续电荷积累；sigma与h在平面内近似恒定时化为二维Laplace方程。sigma或h整体改变主要影响总电流，不改变理想定电势问题的归一化V分布；空间不均、端电势变化与界面效应另行处理。",
      "verification_method": "由J=-sigma*grad(V)沿水深积分得面电流K=-sigma*h*grad_2D(V)，再用稳恒连续性div_2D(K)=0；独立物理终审见src-source-record-v2。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-source-record-v2", "src-deep-audit", "src-python-code"]
    },
    {
      "formula_id": "formula-field-gradient",
      "expression": "E = -grad(V)",
      "variables": {
        "E": "由电势得到的场强，单位V/m",
        "V": "电势，单位V；空间坐标以m计"
      },
      "scope": "场指向电势降低最快方向；绘图不得把正梯度当作电场。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-python-code", "src-ai-paper"]
    },
    {
      "formula_id": "formula-parallel-plate-point",
      "expression": "V_P = V_minus + U * (y_P - a) / (b - a)",
      "variables": {
        "V_P": "固定点P相对所选参考的电势，单位V",
        "V_minus": "下方负极板电势，单位V",
        "U": "两板由电源维持的电势差，单位V",
        "a": "下板位置，单位与b、y_P一致，建议m",
        "b": "上板位置，单位与a、y_P一致，建议m",
        "y_P": "固定点P的位置，单位与a、b一致，建议m"
      },
      "scope": "这是水槽稳恒导电场对恒压平行板问题的类比表达，不是真实电容器介质内的直接测量。P始终位于板间中央近似区、两板足够大且平行、电源持续连接、负极参考端不变、探针扰动可忽略；边缘区和真实水槽需数值模型。",
      "verification_method": "由恒压平行板中央区线性电势插值得到；对a、b直接求偏导，负板上移使V_P降低，正板下移使V_P升高。独立物理终审见src-source-record-v2。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-source-record-v2", "src-province-docx", "src-poster-horizontal"]
    }
  ],
