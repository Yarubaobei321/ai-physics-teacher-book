  "formulas": [
    {
      "formula_id": "formula-current-density",
      "expression": "J = -sigma * grad(V)",
      "variables": {
        "J": "水层中的电流密度",
        "sigma": "介质电导率",
        "V": "电势"
      },
      "scope": "均匀各向同性导电介质中的稳恒电流场；符号方向按电势降低方向。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-h11-deep-dive"]
    },
    {
      "formula_id": "formula-laplace",
      "expression": "div(sigma * grad(V)) = 0; constant sigma -> laplacian(V) = 0",
      "variables": {
        "sigma": "电导率",
        "V": "电势"
      },
      "scope": "稳恒、无内源且水层厚度与电导率近似均匀；厚度或电导率变化明显时需改模型。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-h11-deep-dive", "src-python-code"]
    },
    {
      "formula_id": "formula-electric-field",
      "expression": "E = -grad(V)",
      "variables": {
        "E": "由电势梯度得到的场矢量",
        "V": "电势"
      },
      "scope": "电场指向电势降低最快的方向；绘图箭头不得使用正梯度。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-ye-yang-paper", "src-python-test"]
    }
  ],
