      "fact_id": "fact-h04-off-canvas",
      "statement": "在允许参数mA=4 kg、mB=0.5 kg、v0=5 m/s、k=12 N/m下，按源码映射计算的横轴末端A、B和质心均越过960 px画布右边界。",
