  "formulas": [
    {
      "formula_id": "formula-h04-omega",
      "expression": "mu=mA*mB/(mA+mB); omega=sqrt(k/mu); vcm=mA*v0/(mA+mB)",
      "variables": {"mA": "A质量", "mB": "B质量", "k": "弹簧劲度系数", "v0": "A初速度", "mu": "约化质量", "omega": "相对运动角频率", "vcm": "质心速度"},
      "scope": "光滑水平面、理想轻弹簧、B初速度为0、以A初速度方向为正",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-h04-html", "src-h04-recalc"]
    },
    {
      "formula_id": "formula-h04-velocities",
      "expression": "vA=vcm+[mB/(mA+mB)]*v0*cos(omega*t); vB=vcm-[mA/(mA+mB)]*v0*cos(omega*t); x=(v0/omega)*sin(omega*t)",
      "variables": {"vA": "A速度", "vB": "B速度", "x": "相对原长的弹簧形变量", "t": "作用开始后的物理时间"},
      "scope": "两物体仍由弹簧相互作用；接触模式只取0到pi/omega",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-h04-html", "src-h04-recalc"]
    },
    {
      "formula_id": "formula-h04-times",
      "expression": "t_max=pi/(2*omega); t_sep=pi/omega; T_connected=2*pi/omega",
      "variables": {"t_max": "最大压缩时刻", "t_sep": "接触模式分离时刻", "T_connected": "始终连接模式物理周期"},
      "scope": "从弹簧原长、A向B运动的初态起算",
