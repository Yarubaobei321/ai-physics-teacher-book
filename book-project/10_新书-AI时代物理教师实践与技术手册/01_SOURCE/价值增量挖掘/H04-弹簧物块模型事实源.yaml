    {
      "fact_id": "fact-h04-connected-wrap",
      "statement": "连接模式使用最小劲度系数生成固定横轴和播放循环时长；当当前k大于最小值时，循环末端通常不是当前系统的整周期状态，取模回零会产生状态跳变。",
      "status": "inferred",
      "canonical": false,
