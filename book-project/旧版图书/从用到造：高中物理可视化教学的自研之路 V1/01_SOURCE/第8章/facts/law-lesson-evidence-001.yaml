      "formula_id": "falling-energy-001",
      "expression": "ΔE_k = 1/2 m(v_2^2-v_1^2),  ΔE_p = mg(h_2-h_1)",
      "scope": "物体—地球系统；空气阻力等非保守作用可忽略的近似。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-physics-review-006"]
    },
    {
      "formula_id": "air-track-system-002",
      "expression": "ΔE_k = 1/2(M+m)(v_2^2-v_1^2),  |ΔE_p| = mgh",
      "scope": "滑块M与悬挂物m组成系统；绳不可伸长、滑轮转动与摩擦影响可忽略或进入误差讨论。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-energy-ppt-002", "src-physics-review-006"]
    },
    {
      "formula_id": "pendulum-linear-003",
      "expression": "T = 2π√(L/g)",
      "scope": "小角度、摆线质量与伸长可忽略、摆球可视为质点；检验时可作T—√L图。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-pend-doc-004", "src-physics-review-006"]
    }
  ],
  "calculations": [
