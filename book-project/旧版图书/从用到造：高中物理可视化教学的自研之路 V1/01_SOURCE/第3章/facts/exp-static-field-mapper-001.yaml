  "title": "简易静电场描绘仪",
  "status": "verified",
  "facts": [
    {
      "fact_id": "fact-static-001",
      "statement": "装置以浅水槽中的微弱稳恒电流场模拟相应边界条件下的静电场，并以电势测量寻找等势点。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-static-province", "src-static-city", "src-static-publicity"]
    },
    {
      "fact_id": "fact-static-002",
      "statement": "装置配置五类可更换电极：单个点电荷模型、匀强电场模型、点电荷与大平板模型、等量同种电荷模型、等量异种电荷模型。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-static-province", "src-static-electrode-photo"]
    },
    {
      "fact_id": "fact-static-003",
      "statement": "装置支持描绘和验证两种观察方式：用探针寻找等势点并以彩色木条标记，或将仿真图置于透明水槽下方，沿预测等势线移动探针进行比较。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-static-province", "src-static-publicity", "src-static-mapping-photo"]
    },
    {
      "fact_id": "fact-static-004",
      "statement": "透明支架内设置45度反射镜，将水槽的俯视结构转为学生可见的正面视图；顶部相机可用于投影放大。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-static-province", "src-static-student-view"]
    },
    {
      "fact_id": "fact-static-005",
      "statement": "截至2026年8月12日没有真实课堂记录；该实验不是高中物理必做实验，书稿不据此编写课堂频次、学生表现或学习效果。",
      "status": "verified",
      "canonical": false,
      "source_ids": ["src-static-province", "src-static-city", "src-static-author-confirmation"]
    }
  ],
  "formulas": [
    {
      "formula_id": "formula-static-001",
      "expression": "E = -∇φ",
      "variables": {
        "E": "电场强度",
        "φ": "电势"
      },
      "scope": "静电场中电场强度与电势梯度的关系。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-static-province"]
    },
    {
      "formula_id": "formula-static-002",
      "expression": "J = σE = -σ∇φ",
      "variables": {
        "J": "电流密度",
        "σ": "介质电导率",
        "E": "电场强度",
        "φ": "电势"
      },
      "scope": "介质近似均匀、各向同性且满足欧姆定律时的稳恒电流场。",
      "status": "inferred",
      "canonical": false,
      "source_ids": ["src-static-province"]
    },
    {
      "formula_id": "formula-static-003",
      "expression": "∇²φ = 0",
      "variables": {
        "φ": "电势"
      },
      "scope": "无自由电荷的静电区域，或电导率均匀且无电流源汇的稳恒电流区域；两者边界条件还需对应。",
      "status": "inferred",
      "canonical": false,
      "source_ids": ["src-static-province"]
    }
  ],
