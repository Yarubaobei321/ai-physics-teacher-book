<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315f86"/></marker>
    <style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#18354d}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#577287}.head{font-size:21px;font-weight:700}.body{font-size:16px}.note{font-size:14px;fill:#577287}.source{fill:#fff8e8;stroke:#b58225;stroke-width:2}.wifi{fill:#edf5fb;stroke:#315f86;stroke-width:2}.usb{fill:#eef8f1;stroke:#4a8461;stroke-width:2}.ble{fill:#f4effa;stroke:#755495;stroke-width:2}.line{fill:none;stroke:#315f86;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:9 6}</style>
  </defs>
  <rect width="1200" height="650" fill="#fff"/>
  <text x="52" y="55" class="title">同一份 MicroPython，按课堂条件选择三条路径</text>
  <text x="52" y="84" class="sub">传输方式不同，积木和生成的代码保持一致</text>
  <rect x="375" y="120" width="450" height="92" rx="16" class="source"/>
  <text x="600" y="157" text-anchor="middle" class="head">学生端：积木 → MicroPython</text>
  <text x="600" y="188" text-anchor="middle" class="body">一份程序，三个出口</text>
  <path d="M600 212 V255 H210 V290" class="line"/><path d="M600 212 V290" class="line"/><path d="M600 212 V255 H990 V290" class="line dash"/>

  <rect x="55" y="290" width="310" height="225" rx="16" class="wifi"/>
  <text x="210" y="330" text-anchor="middle" class="head">WiFi 无线下发</text>
  <text x="210" y="365" text-anchor="middle" class="body">平板 → 教师服务器 → ESP32</text>
  <text x="210" y="399" text-anchor="middle" class="body">适合：教室、多组并行</text>
  <line x1="90" y1="425" x2="330" y2="425" stroke="#8ba8bd"/>
  <text x="210" y="455" text-anchor="middle" class="note">需要教室WiFi与教师服务器</text>
  <text x="210" y="482" text-anchor="middle" class="note">设备按N01等编号绑定</text>

  <rect x="445" y="290" width="310" height="225" rx="16" class="usb"/>
  <text x="600" y="330" text-anchor="middle" class="head">USB 有线直连</text>
  <text x="600" y="365" text-anchor="middle" class="body">电脑浏览器 → ESP32</text>
  <text x="600" y="399" text-anchor="middle" class="body">适合：初始化、烧录、单机调试</text>
  <line x1="480" y1="425" x2="720" y2="425" stroke="#8ba8bd"/>
  <text x="600" y="455" text-anchor="middle" class="note">依赖桌面Chrome/Edge的Web Serial</text>
  <text x="600" y="482" text-anchor="middle" class="note">安卓平板不支持</text>

  <rect x="835" y="290" width="310" height="225" rx="16" class="ble"/>
  <text x="990" y="330" text-anchor="middle" class="head">BLE 蓝牙直连</text>
  <text x="990" y="365" text-anchor="middle" class="body">支持浏览器 → ESP32</text>
  <text x="990" y="399" text-anchor="middle" class="body">适合：无WiFi、单板练习</text>
  <line x1="870" y1="425" x2="1110" y2="425" stroke="#8ba8bd"/>
  <text x="990" y="455" text-anchor="middle" class="note">停止循环程序可能触发软复位</text>
  <text x="990" y="482" text-anchor="middle" class="note">复位后需要重新连接</text>

  <rect x="225" y="555" width="750" height="48" rx="12" fill="#f5f7f9" stroke="#9cabb7"/>
  <text x="600" y="586" text-anchor="middle" class="body">课堂主路径是 WiFi；USB与BLE提供初始化、调试和无网络场景的退路</text>
  <text x="50" y="630" class="note">根据ESP32Blockly有线模式、蓝牙模式与系统架构材料绘制，示意图</text>
</svg>
