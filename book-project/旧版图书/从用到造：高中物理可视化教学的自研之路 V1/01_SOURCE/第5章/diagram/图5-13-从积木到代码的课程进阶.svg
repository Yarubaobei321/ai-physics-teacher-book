<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315f86"/></marker>
    <style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#18354d}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#577287}.head{font-size:19px;font-weight:700}.body{font-size:15px}.note{font-size:14px;fill:#577287}.stage{fill:#fff;stroke:#315f86;stroke-width:2}.bridge{fill:#fff8e8;stroke:#b58225;stroke-width:2}.line{fill:none;stroke:#315f86;stroke-width:2.5;marker-end:url(#arrow)}.axis{stroke:#9badba;stroke-width:4}</style>
  </defs>
  <rect width="1200" height="540" fill="#fff"/>
  <text x="52" y="55" class="title">图形化编程不是终点，而是一座逐步撤掉的脚手架</text>
  <text x="52" y="84" class="sub">42个课程例程把操作、结构、代码和项目任务连接成一条连续路径</text>
  <line x1="115" y1="280" x2="1085" y2="280" class="axis"/>
  <path d="M1085 280 H1135" class="line"/>

  <rect x="55" y="150" width="205" height="210" rx="16" class="stage"/>
  <text x="158" y="188" text-anchor="middle" class="head">1 先让硬件响应</text>
  <text x="158" y="225" text-anchor="middle" class="body">点灯、蜂鸣、显示</text><text x="158" y="252" text-anchor="middle" class="body">建立动作与结果联系</text>
  <circle cx="158" cy="280" r="9" fill="#315f86"/>
  <text x="158" y="326" text-anchor="middle" class="note">完整积木例程</text>

  <rect x="285" y="150" width="205" height="210" rx="16" class="stage"/>
  <text x="388" y="188" text-anchor="middle" class="head">2 组合通用积木</text>
  <text x="388" y="225" text-anchor="middle" class="body">传感器 → 判断 → 动作</text><text x="388" y="252" text-anchor="middle" class="body">改变引脚、阈值和采样</text>
  <circle cx="388" cy="280" r="9" fill="#315f86"/>
  <text x="388" y="326" text-anchor="middle" class="note">参数化、可迁移</text>

  <rect x="515" y="125" width="205" height="260" rx="16" class="bridge"/>
  <text x="618" y="168" text-anchor="middle" class="head">3 混合视图搭桥</text>
  <text x="618" y="210" text-anchor="middle" class="body">左侧保留积木结构</text><text x="618" y="237" text-anchor="middle" class="body">右侧观察MicroPython</text>
  <circle cx="618" cy="280" r="10" fill="#b58225"/>
  <text x="618" y="326" text-anchor="middle" class="note">形状对应缩进与语句</text>
  <text x="618" y="354" text-anchor="middle" class="note">核心概念不封成黑盒</text>

  <rect x="745" y="150" width="205" height="210" rx="16" class="stage"/>
  <text x="848" y="188" text-anchor="middle" class="head">4 进入文本代码</text>
  <text x="848" y="225" text-anchor="middle" class="body">变量、函数、状态机</text><text x="848" y="252" text-anchor="middle" class="body">异常处理与协议</text>
  <circle cx="848" cy="280" r="9" fill="#315f86"/>
  <text x="848" y="326" text-anchor="middle" class="note">MicroPython代码例程</text>

  <rect x="975" y="150" width="170" height="210" rx="16" class="stage"/>
  <text x="1060" y="188" text-anchor="middle" class="head">5 开放项目</text>
  <text x="1060" y="225" text-anchor="middle" class="body">联网、物联网</text><text x="1060" y="252" text-anchor="middle" class="body">综合科创任务</text>
  <circle cx="1060" cy="280" r="9" fill="#315f86"/>
  <text x="1060" y="326" text-anchor="middle" class="note">积木只保留为工具</text>

  <rect x="160" y="420" width="880" height="60" rx="14" fill="#f5f7f9" stroke="#9cabb7"/>
  <text x="600" y="446" text-anchor="middle" class="body">教师逐步减少界面替学生承担的复杂度</text>
  <text x="600" y="469" text-anchor="middle" class="body">学生逐步承担变量、结构、调试和系统设计</text>
  <text x="50" y="520" class="note">根据ESP32Blockly课程例程区、积木设计原则和examples.js绘制，示意图</text>
</svg>
