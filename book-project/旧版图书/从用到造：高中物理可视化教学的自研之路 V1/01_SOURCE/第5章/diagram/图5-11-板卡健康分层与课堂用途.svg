<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315f86"/></marker>
    <style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#18354d}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#577287}.head{font-size:20px;font-weight:700}.body{font-size:15px}.note{font-size:14px;fill:#577287}.proc{fill:#edf5fb;stroke:#315f86;stroke-width:2}.decision{fill:#fff8e8;stroke:#b58225;stroke-width:2}.good{fill:#eef8f1;stroke:#4a8461;stroke-width:2}.limited{fill:#f8f3e8;stroke:#9b7131;stroke-width:2}.fail{fill:#f9eeee;stroke:#9c4b4b;stroke-width:2}.line{fill:none;stroke:#315f86;stroke-width:2.2;marker-end:url(#arrow)}.branch{fill:none;stroke:#6b7d8b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="790" fill="#fff"/>
  <text x="52" y="55" class="title">先验证链路，再决定板卡进入哪一种课堂任务</text>
  <text x="52" y="84" class="sub">分层诊断可以避免把线缆、供电和时序问题误判成坏板</text>
  <rect x="455" y="115" width="290" height="64" rx="14" class="proc"/>
  <text x="600" y="154" text-anchor="middle" class="head">读取MAC，建立稳定身份</text>
  <path d="M600 179 V225" class="line"/>
  <polygon points="600,225 710,280 600,335 490,280" class="decision"/>
  <text x="600" y="275" text-anchor="middle" class="head">能下载并烧录？</text>
  <text x="600" y="299" text-anchor="middle" class="note">USB、Flash、校验</text>
  <path d="M710 280 H960 V650" class="branch"/><text x="755" y="266" class="note">否</text>
  <path d="M600 335 V380" class="line"/><text x="616" y="360" class="note">是</text>
  <polygon points="600,380 710,435 600,490 490,435" class="decision"/>
  <text x="600" y="430" text-anchor="middle" class="head">能稳定启动？</text>
  <text x="600" y="454" text-anchor="middle" class="note">REPL与自检脚本</text>
  <path d="M710 435 H900 V650" class="branch"/><text x="755" y="421" class="note">否</text>
  <path d="M600 490 V535" class="line"/><text x="616" y="515" class="note">是</text>

  <rect x="95" y="535" width="245" height="110" rx="14" class="proc"/>
  <text x="218" y="574" text-anchor="middle" class="head">BLE测试</text><text x="218" y="604" text-anchor="middle" class="body">先测低功耗无线环节</text>
  <rect x="405" y="535" width="245" height="110" rx="14" class="proc"/>
  <text x="528" y="574" text-anchor="middle" class="head">WiFi测试</text><text x="528" y="604" text-anchor="middle" class="body">再测高电流无线环节</text>
  <rect x="715" y="535" width="245" height="110" rx="14" class="proc"/>
  <text x="838" y="574" text-anchor="middle" class="head">交换与复测</text><text x="838" y="604" text-anchor="middle" class="body">换线、换口、稳定后再判定</text>
  <path d="M600 535 H340" class="line"/><path d="M340 590 H405" class="line"/><path d="M650 590 H715" class="line"/>

  <rect x="60" y="690" width="245" height="70" rx="14" class="good"/>
  <text x="182" y="720" text-anchor="middle" class="head">N类：WiFi + BLE通过</text><text x="182" y="746" text-anchor="middle" class="note">进入无线课堂主设备</text>
  <rect x="335" y="690" width="245" height="70" rx="14" class="limited"/>
  <text x="458" y="720" text-anchor="middle" class="head">B类：仅BLE可用</text><text x="458" y="746" text-anchor="middle" class="note">保留给蓝牙单机项目</text>
  <rect x="610" y="690" width="245" height="70" rx="14" class="limited"/>
  <text x="732" y="720" text-anchor="middle" class="head">C类：无线不可用</text><text x="732" y="746" text-anchor="middle" class="note">按功能保留基础实验</text>
  <rect x="885" y="690" width="245" height="70" rx="14" class="fail"/>
  <text x="1008" y="720" text-anchor="middle" class="head">F类：下载或启动失败</text><text x="1008" y="746" text-anchor="middle" class="note">退出课堂设备池</text>
  <path d="M838 645 V670 H182 V690" class="branch"/><path d="M838 670 H458 V690" class="branch"/><path d="M838 670 H732 V690" class="branch"/><text x="570" y="665" text-anchor="middle" class="note">综合BLE、WiFi与复测结果</text><path d="M960 650 V675 H1008 V690" class="branch"/>
  <text x="50" y="782" class="note">根据ESP32批量健康测试与板卡台账绘制，示意图；分类同时使用文字和线型，不只依赖颜色</text>
</svg>
