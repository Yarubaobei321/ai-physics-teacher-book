<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">同一件作品要同时对照过程与成品</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="90" y="185" width="600" height="500" rx="30" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><rect x="910" y="185" width="600" height="500" rx="30" fill="#fff5eb" stroke="#d97706" stroke-width="4"/><text x="390" y="255" text-anchor="middle" font-size="36" font-weight="700" fill="#1d4ed8">过程证据</text><text x="1210" y="255" text-anchor="middle" font-size="36" font-weight="700" fill="#b45309">成品证据</text><g font-size="27" fill="#334155"><text x="150" y="340">• 学生提出的目标与限制</text><text x="150" y="415">• 对AI或程序错误的诊断</text><text x="150" y="490">• 修改指令与取舍理由</text><text x="150" y="565">• 版本记录和验收决策</text><text x="970" y="340">• 知识与物理模型准确</text><text x="970" y="415">• 数据、交互与显示一致</text><text x="970" y="490">• 功能在规定条件下运行</text><text x="970" y="565">• 来源、隐私和版权合规</text></g><circle cx="800" cy="435" r="86" fill="#172033"/><text x="800" y="425" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">一致性</text><text x="800" y="467" text-anchor="middle" font-size="22" fill="#dbeafe">相互核验</text><rect x="330" y="735" width="940" height="90" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="3"/><text x="800" y="790" text-anchor="middle" font-size="27" font-weight="700" fill="#6d28d9">只有成品，无法判断是谁完成了关键思考；只有对话，也无法证明作品可靠</text></g></svg>
