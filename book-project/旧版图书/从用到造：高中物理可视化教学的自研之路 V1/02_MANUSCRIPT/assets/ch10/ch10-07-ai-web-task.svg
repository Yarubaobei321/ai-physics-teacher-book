<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="90" y="100" font-size="46" font-weight="700" fill="#172033">60分钟AI网页任务的约束设计</text><rect x="90" y="155" width="1420" height="120" rx="28" fill="#172033"/><text x="800" y="230" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">用AI制作一个可交互的知识科普网页</text><g fill="#fff" stroke="#d5dfeb" stroke-width="3"><rect x="90" y="330" width="430" height="270" rx="24"/><rect x="585" y="330" width="430" height="270" rx="24"/><rect x="1080" y="330" width="430" height="270" rx="24"/></g><g font-size="31" font-weight="700"><text x="305" y="390" text-anchor="middle" fill="#1d4ed8">文件约束</text><text x="800" y="390" text-anchor="middle" fill="#087f5b">知识约束</text><text x="1295" y="390" text-anchor="middle" fill="#b45309">交互约束</text></g><g font-size="25" fill="#475569" text-anchor="middle"><text x="305" y="455">单一HTML文件</text><text x="305" y="505">零外链、可本地打开</text><text x="305" y="555">独立提交</text><text x="800" y="455">主题聚焦、内容准确</text><text x="800" y="505">结构清楚、可被解释</text><text x="800" y="555">发现并修正AI错误</text><text x="1295" y="455">至少一处有效交互</text><text x="1295" y="505">交互服务知识理解</text><text x="1295" y="555">页面可读、响应正常</text></g><path d="M300 675H1300" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><text x="800" y="740" text-anchor="middle" font-size="28" fill="#1d4ed8">约束越清楚，学生与AI协作的过程越容易检查</text><text x="800" y="805" text-anchor="middle" font-size="22" fill="#64748b">任务方案可证明评价设计，实际能力结论需结合提交作品与过程记录</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs></svg>
