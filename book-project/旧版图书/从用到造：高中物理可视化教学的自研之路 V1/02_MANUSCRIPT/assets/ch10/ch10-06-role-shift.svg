<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">开放项目中，教师与学生的职责同时变化</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="95" y="180" width="650" height="570" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><rect x="855" y="180" width="650" height="570" rx="28" fill="#eefbf5" stroke="#0f9f6e" stroke-width="4"/><text x="420" y="250" text-anchor="middle" font-size="36" font-weight="700" fill="#1d4ed8">教师保留</text><text x="1180" y="250" text-anchor="middle" font-size="36" font-weight="700" fill="#087f5b">学生承担</text><g font-size="27" fill="#334155"><text x="155" y="335">• 安全边界与器材禁区</text><text x="155" y="405">• 最低功能与证据标准</text><text x="155" y="475">• 关键节点的技术诊断</text><text x="155" y="545">• 时间、资源与公开规则</text><text x="155" y="615">• 对事实、版权和伦理的把关</text><text x="915" y="335">• 从情境中定义具体问题</text><text x="915" y="405">• 选择传感、模型和算法</text><text x="915" y="475">• 记录失败并解释修改</text><text x="915" y="545">• 用数据证明功能边界</text><text x="915" y="615">• 汇报、答辩和接受质疑</text></g><rect x="535" y="680" width="530" height="100" rx="50" fill="#fff" stroke="#7c3aed" stroke-width="4"/><text x="800" y="742" text-anchor="middle" font-size="29" font-weight="700" fill="#6d28d9">开放的是方案，守住的是证据与边界</text></g></svg>
