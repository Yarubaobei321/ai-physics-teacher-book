<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">校园展示把项目带入真实沟通，但不自动产生学习证据</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><g fill="#fff" stroke="#d5dfeb" stroke-width="3"><rect x="100" y="210" width="330" height="260" rx="26"/><rect x="475" y="210" width="330" height="260" rx="26"/><rect x="850" y="210" width="330" height="260" rx="26"/><rect x="1225" y="210" width="280" height="260" rx="26"/></g><g font-size="31" font-weight="700" fill="#1d4ed8" text-anchor="middle"><text x="265" y="280">作品</text><text x="640" y="280">观众</text><text x="1015" y="280">追问</text><text x="1365" y="280">再设计</text></g><g font-size="24" fill="#475569" text-anchor="middle"><text x="265" y="345">装置、网页、数据</text><text x="265" y="390">演示和说明卡</text><text x="640" y="345">同伴、教师、家长</text><text x="640" y="390">跨年级学生</text><text x="1015" y="345">在哪些条件失效？</text><text x="1015" y="390">数据能支持什么？</text><text x="1365" y="345">修改表达</text><text x="1365" y="390">补做测试</text></g><path d="M430 340H475M805 340H850M1180 340H1225" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><rect x="195" y="580" width="1210" height="145" rx="28" fill="#fff7e8" stroke="#d97706" stroke-width="3"/><text x="800" y="635" text-anchor="middle" font-size="28" font-weight="700" fill="#b45309">展示现场能证明活动发生、作品被公开说明</text><text x="800" y="685" text-anchor="middle" font-size="25" fill="#475569">理解、迁移或能力提升仍需学生作品、过程记录和评价数据单独支撑</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs></svg>
