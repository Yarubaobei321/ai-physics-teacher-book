<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="95" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">把四个科学思维要素落到可观察动作</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><g fill="#fff" stroke-width="4"><rect x="90" y="170" width="680" height="260" rx="28" stroke="#2563eb"/><rect x="830" y="170" width="680" height="260" rx="28" stroke="#0f9f6e"/><rect x="90" y="490" width="680" height="260" rx="28" stroke="#d97706"/><rect x="830" y="490" width="680" height="260" rx="28" stroke="#7c3aed"/></g><g font-size="33" font-weight="700"><text x="135" y="235" fill="#1d4ed8">模型建构</text><text x="875" y="235" fill="#087f5b">科学推理</text><text x="135" y="555" fill="#b45309">科学论证</text><text x="875" y="555" fill="#6d28d9">质疑创新</text></g><g font-size="25" fill="#475569"><text x="135" y="295">确定对象、变量、方向和边界条件</text><text x="135" y="345">写出理想化与适用范围</text><text x="875" y="295">由条件推出预测，比较数据与模型</text><text x="875" y="345">解释偏差并修正推理链</text><text x="135" y="615">用数据、图像或反例支持主张</text><text x="135" y="665">回应不同解释和证据质量</text><text x="875" y="615">提出可检验问题，寻找失效条件</text><text x="875" y="665">改造方案并进行复验</text></g><text x="800" y="830" text-anchor="middle" font-size="24" fill="#64748b">动作可以留下痕迹；完整构念仍需多任务、多时间和多方法覆盖</text></g></svg>
