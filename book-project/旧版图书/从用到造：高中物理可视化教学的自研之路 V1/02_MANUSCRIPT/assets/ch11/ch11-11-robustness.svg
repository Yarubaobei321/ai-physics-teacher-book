<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">浏览器深度复核改变了局部分数，没有改写总体排序</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="90" y="190" width="420" height="500" rx="30" fill="#fff" stroke="#d5dfeb" stroke-width="3"/><rect x="590" y="190" width="420" height="500" rx="30" fill="#fff" stroke="#d5dfeb" stroke-width="3"/><rect x="1090" y="190" width="420" height="500" rx="30" fill="#fff" stroke="#d5dfeb" stroke-width="3"/><text x="300" y="265" text-anchor="middle" font-size="31" font-weight="700" fill="#1d4ed8">B1复核变化</text><text x="800" y="265" text-anchor="middle" font-size="31" font-weight="700" fill="#087f5b">总分均值</text><text x="1300" y="265" text-anchor="middle" font-size="31" font-weight="700" fill="#b45309">排序相关</text><g text-anchor="middle"><text x="300" y="370" font-size="40" font-weight="700" fill="#172033">10 ↑　5 ↓　10 =</text><text x="300" y="430" font-size="23" fill="#64748b">25/25完成复核</text><text x="800" y="370" font-size="40" font-weight="700" fill="#172033">64.52 → 64.88</text><text x="800" y="430" font-size="23" fill="#64748b">平均增加0.36分</text><text x="1300" y="370" font-size="56" font-weight="700" fill="#172033">ρ = 0.964</text><text x="1300" y="430" font-size="23" fill="#64748b">主数据与复核总分</text></g><g font-size="23" fill="#475569"><text x="145" y="540">• 说明真实运行检查有必要</text><text x="145" y="585">• 局部物理判断会被修正</text><text x="645" y="540">• 主要分布变化较小</text><text x="645" y="585">• 不等于量规已经有效</text><text x="1145" y="540">• 支持本样本排序稳定</text><text x="1145" y="585">• 不等于评定者间信度</text></g><text x="800" y="800" text-anchor="middle" font-size="24" fill="#64748b">稳健性检查只回答“结论是否依赖这一复核步骤”，不回答因果与效度</text></g></svg>
