<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">“看见表现”到“证明提升”之间有四级证据</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="115" y="560" width="310" height="170" rx="26" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><rect x="470" y="430" width="310" height="300" rx="26" fill="#eefbf5" stroke="#0f9f6e" stroke-width="4"/><rect x="825" y="300" width="310" height="430" rx="26" fill="#fff7e8" stroke="#d97706" stroke-width="4"/><rect x="1180" y="170" width="310" height="560" rx="26" fill="#f5edff" stroke="#7c3aed" stroke-width="4"/><g text-anchor="middle"><text x="270" y="620" font-size="32" font-weight="700" fill="#1d4ed8">出现过</text><text x="270" y="670" font-size="23" fill="#475569">一次可定位行为</text><text x="625" y="495" font-size="32" font-weight="700" fill="#087f5b">本任务表现</text><text x="625" y="545" font-size="23" fill="#475569">同一任务多项证据</text><text x="625" y="585" font-size="23" fill="#475569">可以编码与比较</text><text x="980" y="365" font-size="32" font-weight="700" fill="#b45309">学习变化</text><text x="980" y="415" font-size="23" fill="#475569">基线＋后测或比较</text><text x="980" y="455" font-size="23" fill="#475569">排除主要替代解释</text><text x="1335" y="235" font-size="32" font-weight="700" fill="#6d28d9">稳定能力与迁移</text><text x="1335" y="285" font-size="23" fill="#475569">未见任务、延时测查</text><text x="1335" y="325" font-size="23" fill="#475569">跨主题与独立答辩</text></g><path d="M180 790H1410" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="790" y="845" text-anchor="middle" font-size="25" fill="#2563eb">越向右，越需要比较、迁移和多来源证据</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs></svg>
