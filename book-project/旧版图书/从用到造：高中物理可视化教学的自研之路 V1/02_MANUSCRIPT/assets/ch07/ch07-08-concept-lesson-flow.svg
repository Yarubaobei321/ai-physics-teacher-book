<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.h{font-size:27px;font-weight:800}.b{font-size:20px;fill:#475569}.num{font-size:34px;font-weight:800;fill:#fff}.card{fill:#fff;stroke:#cbd5e1;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.dot{fill:#2563eb}</style>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" class="title">概念课的五个连续动作</text>
  <path d="M170 425H1430" class="arr"/>
  <g transform="translate(60 230)"><rect width="270" height="360" rx="25" class="card"/><circle cx="135" cy="30" r="36" class="dot"/><text x="135" y="43" text-anchor="middle" class="num">1</text><text x="135" y="115" text-anchor="middle" class="h">辨认对象</text><text x="135" y="175" text-anchor="middle" class="b">哪些导体构成系统</text><text x="135" y="220" text-anchor="middle" class="b">绝缘介质在哪里</text><text x="135" y="285" text-anchor="middle" class="b">证据：结构标注</text></g>
  <g transform="translate(365 230)"><rect width="270" height="360" rx="25" class="card"/><circle cx="135" cy="30" r="36" class="dot"/><text x="135" y="43" text-anchor="middle" class="num">2</text><text x="135" y="115" text-anchor="middle" class="h">建立模型</text><text x="135" y="175" text-anchor="middle" class="b">保留关键结构</text><text x="135" y="220" text-anchor="middle" class="b">说明简化条件</text><text x="135" y="285" text-anchor="middle" class="b">证据：模型图</text></g>
  <g transform="translate(670 230)"><rect width="270" height="360" rx="25" class="card"/><circle cx="135" cy="30" r="36" class="dot"/><text x="135" y="43" text-anchor="middle" class="num">3</text><text x="135" y="115" text-anchor="middle" class="h">分离变量</text><text x="135" y="175" text-anchor="middle" class="b">改变什么</text><text x="135" y="220" text-anchor="middle" class="b">保持什么</text><text x="135" y="285" text-anchor="middle" class="b">证据：预测卡</text></g>
  <g transform="translate(975 230)"><rect width="270" height="360" rx="25" class="card"/><circle cx="135" cy="30" r="36" class="dot"/><text x="135" y="43" text-anchor="middle" class="num">4</text><text x="135" y="115" text-anchor="middle" class="h">连接证据</text><text x="135" y="175" text-anchor="middle" class="b">现象与变量链</text><text x="135" y="220" text-anchor="middle" class="b">公式与成立条件</text><text x="135" y="285" text-anchor="middle" class="b">证据：解释文字</text></g>
  <g transform="translate(1280 230)"><rect width="270" height="360" rx="25" class="card"/><circle cx="135" cy="30" r="36" class="dot"/><text x="135" y="43" text-anchor="middle" class="num">5</text><text x="135" y="115" text-anchor="middle" class="h">检验迁移</text><text x="135" y="175" text-anchor="middle" class="b">换装置、换条件</text><text x="135" y="220" text-anchor="middle" class="b">识别同一概念</text><text x="135" y="285" text-anchor="middle" class="b">证据：新情境解释</text></g>
  <text x="800" y="760" text-anchor="middle" class="b">五步是设计检查表，不是经过效度验证的固定教学模式。</text>
</svg>
