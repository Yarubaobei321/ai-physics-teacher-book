<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.q{font-size:25px;font-weight:750}.b{font-size:20px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:3}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:4}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:4}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:4}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" class="title">围绕一个装置组织连续问题</text>
  <g transform="translate(100 170)"><rect width="620" height="150" rx="24" class="blue"/><text x="40" y="58" class="q">问题1　哪两个导体构成电容器？</text><text x="40" y="105" class="b">学生标出内层、外层、绝缘瓶壁和引线。</text></g>
  <path d="M410 330V390" class="arr"/>
  <g transform="translate(100 400)"><rect width="620" height="150" rx="24" class="green"/><text x="40" y="58" class="q">问题2　升起外层铝箔改变了什么？</text><text x="40" y="105" class="b">区分有效面积、距离、介质和杂散条件。</text></g>
  <path d="M410 560V620" class="arr"/>
  <g transform="translate(100 630)"><rect width="620" height="150" rx="24" class="amber"/><text x="40" y="58" class="q">问题3　张角为什么这样变化？</text><text x="40" y="105" class="b">用S—C—U链解释，并写明Q近似不变。</text></g>
  <g transform="translate(880 170)"><rect width="620" height="150" rx="24" class="box"/><text x="40" y="58" class="q">问题4　哪些现象会破坏这个解释？</text><text x="40" y="105" class="b">潮湿漏电、接线移动、边缘场与仪表电容。</text></g>
  <path d="M1190 330V390" class="arr"/>
  <g transform="translate(880 400)"><rect width="620" height="150" rx="24" class="blue"/><text x="40" y="58" class="q">问题5　换一种装置还能识别同一关系吗？</text><text x="40" y="105" class="b">迁移到触摸按键、液位传感器或可变电容器。</text></g>
  <path d="M730 705H860" class="arr"/>
  <text x="1190" y="720" text-anchor="middle" class="b">候选任务链：用于设计课堂，不代表已经实施。</text>
</svg>
