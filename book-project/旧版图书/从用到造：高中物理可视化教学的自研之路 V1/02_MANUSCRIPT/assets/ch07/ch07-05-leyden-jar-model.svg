<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.h{font-size:28px;font-weight:700}.b{font-size:22px;fill:#475569}.small{font-size:18px;fill:#64748b}.line{stroke:#334155;stroke-width:5;fill:none}.guide{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:12 10;fill:none}</style>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="90" class="title">莱顿瓶：从真实结构到可比较变量</text>
  <g transform="translate(150 180)">
    <path d="M170 80 Q120 110 125 210 L125 520 Q125 610 260 630 Q395 610 395 520 L395 210 Q400 110 350 80 Z" fill="#e0f2fe" stroke="#0f709e" stroke-width="5"/>
    <path d="M165 170 L165 520 Q165 570 260 585 Q355 570 355 520 L355 170" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>
    <path d="M115 310 L115 535 Q115 635 260 655 Q405 635 405 535 L405 310" fill="none" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
    <line x1="260" y1="150" x2="260" y2="55" class="line"/>
    <line x1="115" y1="450" x2="35" y2="450" class="line"/>
    <line x1="440" y1="310" x2="440" y2="535" class="dash"/>
    <line x1="420" y1="310" x2="460" y2="310" class="line"/><line x1="420" y1="535" x2="460" y2="535" class="line"/>
    <text x="555" y="430" text-anchor="end" class="h">有效重叠高度 L</text>
  </g>
  <g transform="translate(760 210)">
    <rect width="700" height="510" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="95" cy="90" r="34" fill="#f59e0b"/><text x="150" y="101" class="h">内层导体</text>
    <circle cx="95" cy="180" r="34" fill="#e0f2fe" stroke="#0f709e" stroke-width="4"/><text x="150" y="191" class="h">瓶壁：绝缘介质</text>
    <circle cx="95" cy="270" r="34" fill="#64748b"/><text x="150" y="281" class="h">外层导体</text>
    <path d="M80 375 H610" class="guide"/><text x="80" y="355" class="h">改变外层铝箔覆盖高度</text>
    <text x="80" y="430" class="b">优先保持：介质、瓶壁厚度、导体形状</text>
    <text x="80" y="475" class="b">实际装置仍有边缘场与杂散电容</text>
  </g>
  <text x="800" y="835" text-anchor="middle" class="small">结构示意，不代表实物尺寸和严格同轴形状；L表示内外导体的有效重叠长度。</text>
</svg>
