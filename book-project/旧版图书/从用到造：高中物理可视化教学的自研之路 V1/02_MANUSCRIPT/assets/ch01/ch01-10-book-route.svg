<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">全书用四篇回答同一个问题</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">一线教师怎样把真实教学判断转成可持续资源</text><g><rect x="提出可视化与科学思维问题" y="270" width="300" height="300" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="提出可视化与科学思维问题150" y="318" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">第一篇 为什么</text><text x="提出可视化与科学思维问题150" y="354" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">任务怎样变化</text></g><text x="提出可视化与科学思维问题150" y="485" font-size="18" font-weight="400" fill="#526174" text-anchor="middle">证据、维护、培训与共享</text><path d="M提出可视化与科学思维问题300 420 L提出可视化与科学思维问题365 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="教具、仿真、硬件与平台" y="270" width="300" height="300" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="教具、仿真、硬件与平台150" y="318" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">第二篇 怎么造</text><text x="教具、仿真、硬件与平台150" y="354" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">教师怎样创造</text></g><text x="教具、仿真、硬件与平台150" y="485" font-size="18" font-weight="400" fill="#526174" text-anchor="middle">证据、维护、培训与共享</text><path d="M教具、仿真、硬件与平台300 420 L教具、仿真、硬件与平台365 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="概念、规律、习题与项目" y="270" width="300" height="300" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="概念、规律、习题与项目150" y="318" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">第三篇 怎么用</text><text x="概念、规律、习题与项目150" y="354" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">资源怎样入课</text></g><text x="概念、规律、习题与项目150" y="485" font-size="18" font-weight="400" fill="#526174" text-anchor="middle">证据、维护、培训与共享</text><path d="M概念、规律、习题与项目300 420 L概念、规律、习题与项目365 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="证据、维护、培训与共享" y="270" width="300" height="300" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="证据、维护、培训与共享150" y="318" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">第四篇 那又怎样</text><text x="证据、维护、培训与共享150" y="354" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">怎样评价并持续</text></g><text x="证据、维护、培训与共享150" y="485" font-size="18" font-weight="400" fill="#526174" text-anchor="middle">证据、维护、培训与共享</text><text x="800" y="680" font-size="27" font-weight="700" fill="#2563eb" text-anchor="middle">主线：让物理对象看得见，让学生思维做得出，让教学证据留得下</text></svg>