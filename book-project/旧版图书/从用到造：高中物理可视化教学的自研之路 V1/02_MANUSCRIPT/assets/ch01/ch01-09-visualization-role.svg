<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">可视化把思维对象带到共同工作台上</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">对象可见、动作可做、过程可讨论、证据可检查</text><g><rect x="60" y="300" width="230" height="240" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="175" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">不可见对象</text><text x="175" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">场、结构、系统边界</text></g><path d="M290 420 L360 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="370" y="300" width="230" height="240" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="485" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">外部表征</text><text x="485" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">实物、图、动画、数据</text></g><path d="M600 420 L670 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="680" y="300" width="230" height="240" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="795" y="348" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">学生操作</text><text x="795" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">标注、调参、测量、比较</text></g><path d="M910 420 L980 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="990" y="300" width="230" height="240" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1105" y="348" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">公开思路</text><text x="1105" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">模型、条件、证据、解释</text></g><path d="M1220 420 L1290 420" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="1300" y="300" width="230" height="240" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1415" y="348" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">教师反馈</text><text x="1415" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">定位断点并设计下一任务</text></g><text x="800" y="650" font-size="25" font-weight="700" fill="#dc4c64" text-anchor="middle">看见并非终点；学生必须对表征作出判断并留下产物</text></svg>