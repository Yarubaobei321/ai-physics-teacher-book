<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">电磁俘能器题要求学生连续完成五层转换</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">根据2024年广东高考题意提炼</text><g><rect x="55" y="300" width="250" height="230" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="180" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">空间分区</text><text x="180" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">两块方向相反的磁场</text></g><path d="M305 415 L350 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="360" y="300" width="250" height="230" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="485" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">相对运动</text><text x="485" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">永磁铁上下振动</text></g><path d="M610 415 L655 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="665" y="300" width="250" height="230" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="790" y="348" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">有符号磁通量</text><text x="790" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">两区域代数相加</text></g><path d="M915 415 L960 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="970" y="300" width="250" height="230" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1095" y="348" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">变化率</text><text x="1095" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">关注ΔΦ/Δt</text></g><path d="M1220 415 L1265 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="1275" y="300" width="250" height="230" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1400" y="348" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">方向判断</text><text x="1400" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">楞次定律与能量</text></g><text x="800" y="650" font-size="25" font-weight="700" fill="#2563eb" text-anchor="middle">公式在最后出现；前四层决定公式中的量怎样定义</text></svg>