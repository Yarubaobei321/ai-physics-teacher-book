<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">科学思维可以拆成四类可观察行动</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">依据2020年修订高中物理课程标准重绘</text><g><rect x="585" y="345" width="430" height="170" rx="24" fill="#fff" stroke="#cbd7e6" stroke-width="3"/><text x="800" y="393" font-size="28" font-weight="700" fill="#cbd7e6" text-anchor="middle">科学思维</text><text x="800" y="429" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">从物理学视角认识与解决问题</text></g><g><rect x="80" y="220" width="400" height="150" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="280" y="268" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">模型建构</text><text x="280" y="304" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">把对象和过程转成模型</text></g><path d="M280 295 L585 385" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><g><rect x="1120" y="220" width="400" height="150" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="1320" y="268" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">科学推理</text><text x="1320" y="304" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">由条件推出关系与结论</text></g><path d="M1320 295 L1015 385" stroke="#0f9f6e" stroke-width="4" fill="none" marker-end="url(#a)"/><g><rect x="80" y="610" width="400" height="150" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="280" y="658" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">科学论证</text><text x="280" y="694" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">让证据支持解释与预测</text></g><path d="M280 685 L585 475" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#a)"/><g><rect x="1120" y="610" width="400" height="150" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1320" y="658" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">质疑创新</text><text x="1320" y="694" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">检验边界、修正并提出新方案</text></g><path d="M1320 685 L1015 475" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#a)"/></svg>