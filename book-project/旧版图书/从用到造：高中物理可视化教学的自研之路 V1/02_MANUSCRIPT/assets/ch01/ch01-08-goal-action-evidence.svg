<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">宏观目标要经过“动作—证据”才能落到课堂</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">从“培养”走向“学生具体做什么”</text><g><rect x="100" y="295" width="340" height="240" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="270" y="343" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">课程目标</text><text x="270" y="379" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">发展科学思维</text></g><path d="M440 415 L610 415" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#a)"/><g><rect x="610" y="295" width="380" height="240" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="800" y="343" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">学习动作</text><text x="800" y="379" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">建模、推理、论证、质疑</text></g><path d="M990 415 L1160 415" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#a)"/><g><rect x="1160" y="295" width="340" height="240" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="1330" y="343" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">学习证据</text><text x="1330" y="379" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">模型图、推理链、数据、修正</text></g><text x="800" y="650" font-size="25" font-weight="700" fill="#2563eb" text-anchor="middle">目标必须经过任务翻译，才能进入课堂观察与评价</text></svg>