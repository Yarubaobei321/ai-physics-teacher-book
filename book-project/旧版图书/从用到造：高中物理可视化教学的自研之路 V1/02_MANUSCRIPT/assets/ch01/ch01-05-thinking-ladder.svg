<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">从“知道模型”到“在新情境中检验模型”</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">2020年课标五级科学思维表现的动作化概括</text><g><rect x="80" y="600" width="260" height="180" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="210" y="648" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">水平1</text></g><text x="210" y="700" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">说出简单模型</text><text x="210" y="732" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">区别观点与证据</text><g><rect x="375" y="500" width="260" height="180" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="505" y="548" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">水平2</text></g><text x="505" y="600" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">熟悉情境应用模型</text><text x="505" y="632" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">使用直接证据</text><g><rect x="670" y="400" width="260" height="180" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="800" y="448" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">水平3</text></g><text x="800" y="500" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">选择恰当模型</text><text x="800" y="532" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">解释并提出质疑</text><g><rect x="965" y="300" width="260" height="180" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1095" y="348" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">水平4</text></g><text x="1095" y="400" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">实际问题转成模型</text><text x="1095" y="432" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">用证据证明结论</text><g><rect x="1260" y="200" width="260" height="180" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1390" y="248" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">水平5</text></g><text x="1390" y="300" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">新情境综合推理</text><text x="1390" y="332" font-size="18" font-weight="500" fill="#526174" text-anchor="middle">评估证据并多视角检验</text><path d="M110 815 L1500 170" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="800" y="840" font-size="24" font-weight="700" fill="#2563eb" text-anchor="middle">递进来自情境、模型、推理、证据和反思要求的共同提高</text></svg>