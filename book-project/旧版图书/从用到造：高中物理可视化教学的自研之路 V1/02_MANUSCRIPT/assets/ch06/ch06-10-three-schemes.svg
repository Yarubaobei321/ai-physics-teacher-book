<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f8fafc"/><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.t{font-size:44px;font-weight:800}.h{font-size:28px;font-weight:750}.b{font-size:20px;fill:#465469}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:3}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:3}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:3}.axis{stroke:#334155;stroke-width:5;fill:none}.thin{stroke:#64748b;stroke-width:3;fill:none}.obj{fill:#2563eb}</style><text x="80" y="85" class="t">同一守恒关系，三种测量路径</text>
<g transform="translate(70 180)"><rect width="450" height="610" rx="26" class="blue"/><text x="225" y="65" text-anchor="middle" class="h">落体法</text><line x1="220" y1="135" x2="220" y2="390" class="axis"/><circle cx="220" cy="170" r="30" class="obj"/><path d="M160 150V400" class="thin"/><path d="M145 170H175M145 220H175M145 270H175M145 320H175M145 370H175" class="thin"/><text x="225" y="455" text-anchor="middle" class="b">纸带位置 → 瞬时速度</text><text x="225" y="500" text-anchor="middle" class="b">比较势能变化与动能变化</text><text x="225" y="550" text-anchor="middle" class="b">关注打点、选点与读数误差</text></g>
<g transform="translate(575 180)"><rect width="450" height="610" rx="26" class="green"/><text x="225" y="65" text-anchor="middle" class="h">曲面下滑</text><path d="M80 165Q190 410 365 380" class="axis"/><circle cx="115" cy="225" r="28" class="obj"/><line x1="345" y1="300" x2="345" y2="430" class="thin"/><line x1="375" y1="300" x2="375" y2="430" class="thin"/><text x="225" y="455" text-anchor="middle" class="b">不同高度静止释放</text><text x="225" y="500" text-anchor="middle" class="b">双头光电门测速度</text><text x="225" y="550" text-anchor="middle" class="b">比较势能减少与动能增加</text></g>
<g transform="translate(1080 180)"><rect width="450" height="610" rx="26" class="amber"/><text x="225" y="65" text-anchor="middle" class="h">气垫导轨</text><line x1="65" y1="320" x2="380" y2="320" class="axis"/><rect x="260" y="255" width="90" height="62" rx="8" class="obj"/><line x1="100" y1="240" x2="100" y2="385" class="thin"/><line x1="190" y1="240" x2="190" y2="385" class="thin"/><path d="M65 320Q35 350 35 440" class="thin"/><rect x="12" y="440" width="46" height="55" fill="#f59e0b"/><text x="225" y="455" text-anchor="middle" class="b">滑块—钩码系统</text><text x="225" y="500" text-anchor="middle" class="b">两道光电门测速度</text><text x="225" y="550" text-anchor="middle" class="b">关注摩擦与系统边界</text></g></svg>
