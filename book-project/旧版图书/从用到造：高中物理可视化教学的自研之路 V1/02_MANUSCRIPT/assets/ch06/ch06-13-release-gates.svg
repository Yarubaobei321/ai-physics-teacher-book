<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs><rect width="1600" height="780" fill="#f8fafc"/><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#172033}.t{font-size:44px;font-weight:800}.h{font-size:28px;font-weight:750}.b{font-size:20px;fill:#4b596c}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.red{fill:#fff1f2;stroke:#fb7185;stroke-width:3}.line{stroke:#2563eb;stroke-width:5;marker-end:url(#a)}</style><text x="80" y="85" class="t">教学网页进入公开环境前的四道门</text>
