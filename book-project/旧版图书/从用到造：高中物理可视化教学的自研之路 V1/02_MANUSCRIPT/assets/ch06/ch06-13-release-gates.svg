<rect x="870" y="210" width="300" height="300" rx="26" class="red"/><text x="1020" y="280" text-anchor="middle" class="h">隐私门</text><text x="1020" y="335" text-anchor="middle" class="b">姓名与账号</text><text x="1020" y="378" text-anchor="middle" class="b">作品授权</text><text x="1020" y="421" text-anchor="middle" class="b">角色归属</text>
