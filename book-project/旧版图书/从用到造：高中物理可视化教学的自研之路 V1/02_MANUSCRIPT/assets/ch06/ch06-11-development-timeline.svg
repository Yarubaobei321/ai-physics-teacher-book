    <text x="24" y="325" class="phase">模拟实验与学生作品</text>
    <text x="24" y="365" class="body">动量章节模型</text>
    <text x="24" y="394" class="body">学生 AI 对话作品</text>
    <text x="24" y="423" class="body">从教师开发扩展到学生创作</text>
    <rect x="20" y="448" width="172" height="30" class="tag"/>
    <text x="34" y="469" class="commit">39e52e9 / 84ffd43</text>
  </g>

  <g transform="translate(835,0)">
    <circle cx="60" cy="205" r="18" class="dot"/>
    <rect x="0" y="250" width="235" height="245" class="card"/>
