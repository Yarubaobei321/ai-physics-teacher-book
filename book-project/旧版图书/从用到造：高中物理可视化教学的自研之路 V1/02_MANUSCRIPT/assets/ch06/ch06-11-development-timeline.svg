  <rect x="80" y="590" width="1440" height="270" class="card"/>
  <text x="115" y="640" class="phase">可用于论文的过程性结论</text>
  <text x="115" y="690" class="body">1. AI 协作持续把课堂需求、硬件连接、课程资源和公开审查沉淀为工程结构。</text>
  <text x="115" y="730" class="body">2. git 提交、文档、脚本、构建验证和部署记录构成了比事后回忆更可靠的研究证据。</text>
  <text x="115" y="770" class="body">3. 关键转折是 2026-06-30 至 07-02：开发重心从“生成内容”转向“验证证据、纠正 AI 误判、控制公开风险”。</text>
  <text x="115" y="810" class="body">4. 这条时间线可以作为“教师借助 AI 构建个人教学数字基础设施”的核心图。</text>

  <text x="80" y="925" class="commit">数据来源：当前仓库 git log、README、docs/architecture.md、docs/student-ai-work-adversarial-review.md、Codex rollout summaries。</text>
