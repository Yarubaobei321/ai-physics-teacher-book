<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <rect width="1600" height="980" fill="#f7fbff"/>
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill:#102033; }
    .title { font-size: 44px; font-weight: 800; }
    .sub { font-size: 22px; fill:#52677a; }
    .phase { font-size: 24px; font-weight: 800; }
    .date { font-size: 18px; fill:#1b68a8; font-weight: 700; }
    .body { font-size: 18px; fill:#364b5f; }
    .commit { font-size: 15px; fill:#667789; }
    .line { stroke:#1b68a8; stroke-width:6; stroke-linecap:round; }
    .dot { fill:#0f77c7; stroke:white; stroke-width:5; }
    .card { fill:white; stroke:#cfe0ef; stroke-width:2; rx:18; }
    .tag { fill:#eaf4ff; stroke:#b7d8f2; stroke-width:1.5; rx:12; }
  </style>

  <text x="80" y="82" class="title">数智育才网站 AI 协作开发时间线</text>
  <text x="80" y="122" class="sub">从“教师提出教学需求”到“Codex 辅助实现、验证、部署、审查”的过程性证据图</text>

