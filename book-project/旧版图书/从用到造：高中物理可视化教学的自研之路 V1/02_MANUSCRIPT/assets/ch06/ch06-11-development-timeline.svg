    <text x="24" y="325" class="phase">在线实验结构化</text>
    <text x="24" y="365" class="body">光电门教程</text>
    <text x="24" y="394" class="body">三套机械能实验</text>
    <text x="24" y="423" class="body">习题与实验回顾组件</text>
    <rect x="20" y="448" width="172" height="30" class="tag"/>
    <text x="34" y="469" class="commit">d262302 / 35f43ab</text>
  </g>

  <g transform="translate(590,0)">
    <circle cx="60" cy="205" r="18" class="dot"/>
    <rect x="0" y="250" width="235" height="245" class="card"/>
