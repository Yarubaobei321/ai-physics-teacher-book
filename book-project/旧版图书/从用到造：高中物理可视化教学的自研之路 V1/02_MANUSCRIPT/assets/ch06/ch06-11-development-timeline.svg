  <g transform="translate(100,0)">
    <circle cx="60" cy="205" r="18" class="dot"/>
    <rect x="0" y="250" width="235" height="245" class="card"/>
    <text x="24" y="288" class="date">2026-04-18 至 04-22</text>
    <text x="24" y="325" class="phase">门户与硬件接入</text>
    <text x="24" y="365" class="body">Astro 门户初建</text>
    <text x="24" y="394" class="body">DIS 接入 Web BLE</text>
    <text x="24" y="423" class="body">在线编程接入 Web Serial</text>
