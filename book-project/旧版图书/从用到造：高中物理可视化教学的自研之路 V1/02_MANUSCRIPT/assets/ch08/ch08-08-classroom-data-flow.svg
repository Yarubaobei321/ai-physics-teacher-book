<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.h{font-size:27px;font-weight:750}.b{font-size:20px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:4}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:4}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:4}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:10 10;fill:none}</style>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="90" class="title">数据更快进入比较，物理判断仍留在学生手中</text>
  <g transform="translate(80 300)"><rect width="245" height="170" rx="24" class="amber"/><text x="122" y="62" text-anchor="middle" class="h">实验装置</text><text x="122" y="105" text-anchor="middle" class="b">时间、距离、质量</text><text x="122" y="138" text-anchor="middle" class="b">先判断测量对象</text></g>
  <path d="M335 385H425" class="arr"/>
  <g transform="translate(435 300)"><rect width="245" height="170" rx="24" class="green"/><text x="122" y="62" text-anchor="middle" class="h">蓝牙传输</text><text x="122" y="105" text-anchor="middle" class="b">减少手工抄录</text><text x="122" y="138" text-anchor="middle" class="b">保留原始读数</text></g>
  <path d="M690 385H780" class="arr"/>
  <g transform="translate(790 300)"><rect width="245" height="170" rx="24" class="blue"/><text x="122" y="62" text-anchor="middle" class="h">平板网页</text><text x="122" y="105" text-anchor="middle" class="b">计算并生成图表</text><text x="122" y="138" text-anchor="middle" class="b">公式和字段可复核</text></g>
  <path d="M1045 385H1135" class="arr"/>
  <g transform="translate(1145 300)"><rect width="245" height="170" rx="24" class="box"/><text x="122" y="62" text-anchor="middle" class="h">无线投屏</text><text x="122" y="105" text-anchor="middle" class="b">组间结果并置</text><text x="122" y="138" text-anchor="middle" class="b">寻找一致与偏差</text></g>
  <path d="M1268 482C1268 665 1010 710 800 710C535 710 205 625 205 490" class="dash" marker-end="url(#a)"/>
  <rect x="420" y="635" width="760" height="120" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/>
  <text x="800" y="685" text-anchor="middle" class="h">比较之后必须回到模型</text><text x="800" y="727" text-anchor="middle" class="b">系统边界是否一致？测量量是否对应？偏差方向能否解释？是否需要复测？</text>
</svg>
