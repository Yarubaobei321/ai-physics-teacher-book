<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.n{font-size:28px;font-weight:850;fill:#fff}.h{font-size:23px;font-weight:780}.b{font-size:18px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" class="title">规律课六步：让关系在预测、证据和修正之间逐步站稳</text>
  <g transform="translate(55 270)"><circle cx="90" cy="0" r="42" fill="#2563eb"/><text x="90" y="10" text-anchor="middle" class="n">1</text><rect y="60" width="220" height="170" rx="24" class="box"/><text x="110" y="118" text-anchor="middle" class="h">提出问题</text><text x="110" y="158" text-anchor="middle" class="b">要解释哪种变化</text><text x="110" y="190" text-anchor="middle" class="b">什么算有效证据</text></g>
  <path d="M285 415H335" class="arr"/>
  <g transform="translate(345 270)"><circle cx="90" cy="0" r="42" fill="#0ea5e9"/><text x="90" y="10" text-anchor="middle" class="n">2</text><rect y="60" width="220" height="170" rx="24" class="box"/><text x="110" y="118" text-anchor="middle" class="h">选择系统</text><text x="110" y="158" text-anchor="middle" class="b">包含哪些对象</text><text x="110" y="190" text-anchor="middle" class="b">哪些作用可忽略</text></g>
  <path d="M575 415H625" class="arr"/>
  <g transform="translate(635 270)"><circle cx="90" cy="0" r="42" fill="#16a34a"/><text x="90" y="10" text-anchor="middle" class="n">3</text><rect y="60" width="220" height="170" rx="24" class="box"/><text x="110" y="118" text-anchor="middle" class="h">预测关系</text><text x="110" y="158" text-anchor="middle" class="b">变化方向与函数形式</text><text x="110" y="190" text-anchor="middle" class="b">先于数据作出判断</text></g>
  <path d="M865 415H915" class="arr"/>
  <g transform="translate(925 270)"><circle cx="90" cy="0" r="42" fill="#f59e0b"/><text x="90" y="10" text-anchor="middle" class="n">4</text><rect y="60" width="220" height="170" rx="24" class="box"/><text x="110" y="118" text-anchor="middle" class="h">设计测量</text><text x="110" y="158" text-anchor="middle" class="b">原始量如何得到</text><text x="110" y="190" text-anchor="middle" class="b">怎样转成物理量</text></g>
  <path d="M1155 415H1205" class="arr"/>
  <g transform="translate(1215 270)"><circle cx="90" cy="0" r="42" fill="#7c3aed"/><text x="90" y="10" text-anchor="middle" class="n">5</text><rect y="60" width="220" height="170" rx="24" class="box"/><text x="110" y="118" text-anchor="middle" class="h">比较证据</text><text x="110" y="158" text-anchor="middle" class="b">组内、组间、方案间</text><text x="110" y="190" text-anchor="middle" class="b">找一致与系统偏差</text></g>
  <path d="M1325 510C1325 680 1150 700 980 700H620" class="arr"/>
  <g transform="translate(390 615)"><circle cx="90" cy="0" r="42" fill="#e11d48"/><text x="90" y="10" text-anchor="middle" class="n">6</text><rect y="60" width="460" height="150" rx="24" class="box"/><text x="230" y="118" text-anchor="middle" class="h">修正解释并提出新问题</text><text x="230" y="158" text-anchor="middle" class="b">复核记录、操作和模型；决定复测、保留或修正</text></g>
  <path d="M390 750C220 750 165 620 165 515" stroke="#64748b" stroke-width="4" stroke-dasharray="10 10" fill="none" marker-end="url(#a)"/>
