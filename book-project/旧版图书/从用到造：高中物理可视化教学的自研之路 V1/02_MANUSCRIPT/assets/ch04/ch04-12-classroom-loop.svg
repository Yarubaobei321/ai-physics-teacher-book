<svg viewBox="0 0 1200 710" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5b7385"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:20px;font-weight:800}.n{font-size:15px}.s{font-size:13px;fill:#526879}.num{font-size:22px;font-weight:900;fill:#fff}</style></defs>
  <rect width="1200" height="710" fill="#fbfaf6"/><text x="58" y="58" class="t">仿真进入课堂的六步任务环</text><text x="58" y="88" class="s">本章提供可实施任务结构；真实课堂效果仍需学生产物和迁移证据</text>
  <circle cx="600" cy="382" r="114" fill="#193247"/><text x="600" y="365" style="fill:#fff" font-size="22" font-weight="800" text-anchor="middle">共同对象</text><text x="600" y="397" style="fill:#cfe2ef" font-size="16" text-anchor="middle">同一模型 · 同一组参数</text><text x="600" y="424" style="fill:#cfe2ef" font-size="14" text-anchor="middle">保存每次判断与修订</text>
  <g fill="none" stroke="#5b7385" stroke-width="3" marker-end="url(#a)"><path d="M450 180C520 126 680 126 750 180"/><path d="M915 245C967 302 967 430 915 487"/><path d="M750 575C680 628 520 628 450 575"/><path d="M285 487C233 430 233 302 285 245"/></g>
  <g transform="translate(205 140)"><rect width="270" height="118" rx="18" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#587e99"/><text x="38" y="46" class="num" text-anchor="middle">1</text><text x="75" y="36" class="h">预测</text><text x="26" y="78" class="n">先画趋势、方向或关键状态</text><text x="26" y="101" class="s">公开原有模型</text></g>
  <g transform="translate(725 140)"><rect width="270" height="118" rx="18" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#e68b2c"/><text x="38" y="46" class="num" text-anchor="middle">2</text><text x="75" y="36" class="h">操作</text><text x="26" y="78" class="n">一次只改一个有物理意义的量</text><text x="26" y="101" class="s">保存参数组</text></g>
  <g transform="translate(880 322)"><rect width="270" height="118" rx="18" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#438562"/><text x="38" y="46" class="num" text-anchor="middle">3</text><text x="75" y="36" class="h">暂停</text><text x="26" y="78" class="n">停在初态、临界态和末态</text><text x="26" y="101" class="s">标注关键帧</text></g>
  <g transform="translate(725 510)"><rect width="270" height="118" rx="18" fill="#f2eff8" stroke="#a798c0" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#756292"/><text x="38" y="46" class="num" text-anchor="middle">4</text><text x="75" y="36" class="h">比较</text><text x="26" y="78" class="n">找出预测与输出的冲突</text><text x="26" y="101" class="s">引用读数或图像</text></g>
  <g transform="translate(205 510)"><rect width="270" height="118" rx="18" fill="#fff0ec" stroke="#dba08f" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#c86650"/><text x="38" y="46" class="num" text-anchor="middle">5</text><text x="75" y="36" class="h">解释</text><text x="26" y="78" class="n">回到系统、假设、方程与边界</text><text x="26" y="101" class="s">写带条件结论</text></g>
  <g transform="translate(50 322)"><rect width="270" height="118" rx="18" fill="#edf3f5" stroke="#94aab5" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#36566c"/><text x="38" y="46" class="num" text-anchor="middle">6</text><text x="75" y="36" class="h">迁移</text><text x="26" y="78" class="n">换参数、装置或模型重新预测</text><text x="26" y="101" class="s">检验是否摆脱原画面</text></g>
  <rect x="305" y="663" width="590" height="36" rx="18" fill="#193247"/><text x="600" y="687" style="fill:#fff" font-size="15" font-weight="800" text-anchor="middle">读图产物：预测稿 + 参数表 + 关键帧 + 证据解释 + 迁移判断</text>
