<svg viewBox="0 0 1200 730" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5b7385"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:20px;font-weight:800}.n{font-size:15px}.s{font-size:13px;fill:#526879}.yn{font-size:14px;font-weight:800}</style></defs>
  <rect width="1200" height="730" fill="#fbfaf6"/><text x="58" y="58" class="t">选择工具时，先判断任务缺口</text><text x="58" y="88" class="s">成熟软件、模板化页面和自研网页各有合适位置，开发规模随需求增加</text>
  <rect x="410" y="116" width="380" height="66" rx="33" fill="#193247"/><text x="600" y="157" style="fill:#fff" font-size="20" font-weight="800" text-anchor="middle">当前教学问题是什么？</text>
  <path d="M600 182V223" stroke="#5b7385" stroke-width="3" marker-end="url(#a)"/>
  <g transform="translate(600 275)"><polygon points="0,-52 135,0 0,52 -135,0" fill="#fff5e8" stroke="#d99039" stroke-width="3"/><text y="-6" class="h" text-anchor="middle">现成软件能否完成</text><text y="22" class="s" text-anchor="middle">关键表征与学生动作？</text></g>
  <path d="M465 275H250V370" stroke="#5b7385" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="373" y="263" class="yn" style="fill:#438562">能</text>
  <path d="M735 275H950V370" stroke="#5b7385" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="825" y="263" class="yn" style="fill:#c86650">不能</text>
  <g transform="translate(80 370)"><rect width="340" height="235" rx="22" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><text x="170" y="42" class="h" text-anchor="middle">使用成熟软件</text><text x="28" y="84" class="n">适合</text><text x="44" y="115" class="s">数据拟合、几何作图、三维关系</text><text x="44" y="143" class="s">现场快速调参和演示</text><text x="28" y="181" class="n">仍需补上</text><text x="44" y="211" class="s">预测、记录、解释与评价任务</text></g>
  <g transform="translate(440 370)"><rect width="320" height="235" rx="22" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><text x="160" y="42" class="h" text-anchor="middle">改造模板或低代码</text><text x="28" y="84" class="n">适合</text><text x="44" y="115" class="s">页面布局稳定，物理模型可替换</text><text x="44" y="143" class="s">需要统一参数、图表和测试区</text><text x="28" y="181" class="n">重点验收</text><text x="44" y="211" class="s">模型边界和自动检查</text></g>
  <g transform="translate(780 370)"><rect width="340" height="235" rx="22" fill="#fff0ec" stroke="#dba08f" stroke-width="2"/><text x="170" y="42" class="h" text-anchor="middle">定制自研网页</text><text x="28" y="84" class="n">适合</text><text x="44" y="115" class="s">需要独特交互、模型切换或发布门</text><text x="44" y="143" class="s">现成工具无法保存所需学习证据</text><text x="28" y="181" class="n">开发责任</text><text x="44" y="211" class="s">物理、交互、测试和维护同时承担</text></g>
  <path d="M950 328V348H600V370" stroke="#5b7385" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="795" y="341" class="s">若只是缺统一外壳</text>
  <rect x="215" y="648" width="770" height="48" rx="24" fill="#193247"/><text x="600" y="679" style="fill:#fff" font-size="17" font-weight="800" text-anchor="middle">AI缩短实现时间；工具越定制，教师越要承担验证与维护责任</text>
</svg>
