<svg viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:800}.n{font-size:16px}.s{font-size:14px;fill:#526879}.big{font-size:42px;font-weight:900}</style></defs>
  <rect width="1200" height="650" fill="#fbfaf6"/><text x="58" y="58" class="t">一段仿真里同时存在三种时间</text><text x="58" y="88" class="s">时间尺度必须在页面和图注中分开标明</text>
  <g transform="translate(75 145)"><rect width="1050" height="105" rx="22" fill="#fff0ec" stroke="#dba08f" stroke-width="2"/><circle cx="58" cy="52" r="32" fill="#c86650"/><text x="58" y="63" style="fill:#fff" font-size="28" font-weight="900" text-anchor="middle">1</text><text x="115" y="42" class="h">物理过程时间</text><text x="115" y="76" class="n">三角形力时程的题式结果</text><text x="950" y="66" class="big" style="fill:#b64f3c" text-anchor="end">2.058 ms</text></g>
  <g transform="translate(75 282)"><rect width="1050" height="105" rx="22" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><circle cx="58" cy="52" r="32" fill="#587e99"/><text x="58" y="63" style="fill:#fff" font-size="28" font-weight="900" text-anchor="middle">2</text><text x="115" y="42" class="h">图表坐标时间</text><text x="115" y="76" class="n">力—时间、速度—时间曲线按真实毫秒标度绘制</text><path d="M760 75h230M760 75V32M760 75L990 35" stroke="#587e99" stroke-width="4" fill="none"/><text x="990" y="95" class="s" text-anchor="end">0—2.058 ms</text></g>
  <g transform="translate(75 419)"><rect width="1050" height="105" rx="22" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><circle cx="58" cy="52" r="32" fill="#438562"/><text x="58" y="63" style="fill:#fff" font-size="28" font-weight="900" text-anchor="middle">3</text><text x="115" y="42" class="h">屏幕显示时间</text><text x="115" y="76" class="n">为了看清下落、压缩和恢复，完整显示循环被放慢</text><text x="950" y="66" class="big" style="fill:#34704f" text-anchor="end">5.2 s</text></g>
  <rect x="220" y="562" width="760" height="54" rx="27" fill="#193247"/><text x="600" y="596" style="fill:#fff" font-size="18" font-weight="800" text-anchor="middle">显示循环约为物理压缩时间的2500倍，不能从播放时长读物理量</text>
</svg>
