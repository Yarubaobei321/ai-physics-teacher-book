<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#587e99"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:21px;font-weight:800}.n{font-size:17px}.s{font-size:14px;fill:#526879}.f{font-family:"Times New Roman",serif;font-size:22px;font-style:italic}</style></defs>
  <rect width="1200" height="680" fill="#fbfaf6"/><text x="58" y="58" class="t">三帧位移怎样进入速度反演</text><text x="58" y="88" class="s">示意依据：m=30 g，Δt=20 ms，s₁=6.26 cm，s₂=6.66 cm</text>
  <g transform="translate(60 125)"><rect width="310" height="290" rx="18" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><text x="24" y="38" class="h">第0帧　t=0</text><line x1="35" y1="238" x2="275" y2="238" stroke="#8ca0ad" stroke-width="4"/><circle cx="155" cy="98" r="31" fill="#e68b2c" stroke="#193247" stroke-width="3"/><path d="M155 139V202" stroke="#587e99" stroke-width="5" marker-end="url(#a)"/><text x="181" y="170" class="f">v₀</text><text x="24" y="271" class="s">记录位置 x₀</text></g>
  <g transform="translate(445 125)"><rect width="310" height="290" rx="18" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><text x="24" y="38" class="h">第1帧　t=Δt</text><line x1="35" y1="238" x2="275" y2="238" stroke="#8ca0ad" stroke-width="4"/><circle cx="155" cy="142" r="31" fill="#e68b2c" stroke="#193247" stroke-width="3"/><path d="M72 100V142M72 100h16M72 142h16" stroke="#c86650" stroke-width="3"/><text x="38" y="126" class="f">s₁</text><text x="24" y="271" class="n">x₁−x₀ = 6.26 cm</text></g>
  <g transform="translate(830 125)"><rect width="310" height="290" rx="18" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><text x="24" y="38" class="h">第2帧　t=2Δt</text><line x1="35" y1="238" x2="275" y2="238" stroke="#8ca0ad" stroke-width="4"/><circle cx="155" cy="188" r="31" fill="#e68b2c" stroke="#193247" stroke-width="3"/><path d="M72 142V188M72 142h16M72 188h16" stroke="#438562" stroke-width="3"/><text x="38" y="170" class="f">s₂</text><text x="24" y="271" class="n">x₂−x₁ = 6.66 cm</text></g>
  <path d="M370 270H430M755 270H815" stroke="#587e99" stroke-width="4" marker-end="url(#a)"/>
  <g transform="translate(110 466)"><rect width="980" height="150" rx="22" fill="#193247"/><text x="32" y="40" style="fill:#fff" font-size="19" font-weight="800">匀加速读图关系</text><text x="32" y="82" style="fill:#fff" font-family="Times New Roman" font-size="25">a = (s₂−s₁)/Δt² = 10.0 m/s²</text><text x="500" y="82" style="fill:#fff" font-family="Times New Roman" font-size="25">v接触前 = (3s₂−s₁)/(2Δt) = 3.43 m/s</text><text x="32" y="120" style="fill:#cfe2ef" font-size="16">页面还检查反演加速度与 g 的偏差；偏差过大时提示回查读图、帧间隔或匀加速假设。</text></g>
</svg>
