<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">可以移交的成果，不只是一份文件</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">离开原作者后仍能理解、打开、核验与维护</text><rect x="110" y="190" width="1380" height="570" rx="32" fill="#fff" stroke="#2563eb" stroke-width="4"/><text x="160" y="245" font-size="31" font-weight="700" fill="#2563eb" text-anchor="start">可移交资源包</text><g><rect x="170" y="310" width="290" height="135" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="315" y="358" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">正文/页面</text><text x="315" y="392" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">读者或学生实际使用</text></g><g><rect x="520" y="310" width="290" height="135" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="665" y="358" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">集中资产</text><text x="665" y="392" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">图片、数据与附件可解析</text></g><g><rect x="870" y="310" width="290" height="135" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="1015" y="358" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">证据台账</text><text x="1015" y="392" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">事实、来源与禁止越界</text></g><g><rect x="1220" y="310" width="290" height="135" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1365" y="358" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">版本记录</text><text x="1365" y="392" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">修改、冻结与回退点</text></g><g><rect x="345" y="565" width="290" height="135" rx="24" fill="#ffffff" stroke="#cbd7e6" stroke-width="3"/><text x="490" y="613" font-size="28" font-weight="700" fill="#cbd7e6" text-anchor="middle">使用说明</text><text x="490" y="647" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">对象、场景、操作与限制</text></g><g><rect x="895" y="565" width="290" height="135" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1040" y="613" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">授权说明</text><text x="1040" y="647" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">作者、隐私、第三方许可</text></g></svg>