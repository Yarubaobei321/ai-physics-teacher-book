<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">四课时把“会用工具”改写为“完成一轮开发”</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">课程申报设计：WHY—WHAT—HOW—DO</text><g><rect x="80" y="280" width="285" height="250" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="222.5" y="328" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">WHY</text><text x="222.5" y="362" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">发现校本资源问题</text></g><g><rect x="115" y="445" width="215" height="52" rx="26" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="222.5" y="480" font-size="20" font-weight="600" fill="#2563eb" text-anchor="middle">需求设想</text></g><path d="M365 405 L445 405" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="465" y="280" width="285" height="250" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="607.5" y="328" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">WHAT</text><text x="607.5" y="362" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">需求表达与工程协作</text></g><g><rect x="500" y="445" width="215" height="52" rx="26" fill="#ffffff" stroke="#0f9f6e" stroke-width="2"/><text x="607.5" y="480" font-size="20" font-weight="600" fill="#0f9f6e" text-anchor="middle">规则＋提示＋版本</text></g><path d="M750 405 L830 405" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="850" y="280" width="285" height="250" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="992.5" y="328" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">HOW</text><text x="992.5" y="362" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">完整开发与修复</text></g><g><rect x="885" y="445" width="215" height="52" rx="26" fill="#ffffff" stroke="#d97706" stroke-width="2"/><text x="992.5" y="480" font-size="20" font-weight="600" fill="#d97706" text-anchor="middle">网页＋过程记录</text></g><path d="M1135 405 L1215 405" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1235" y="280" width="285" height="250" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1377.5" y="328" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">DO</text><text x="1377.5" y="362" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">发布、反馈与迁移</text></g><g><rect x="1270" y="445" width="215" height="52" rx="26" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="1377.5" y="480" font-size="20" font-weight="600" fill="#7c3aed" text-anchor="middle">发布说明</text></g><text x="800" y="650" font-size="25" font-weight="600" fill="#dc4c64" text-anchor="middle">课程设计已经形成；培训实施结果需另以学员作品和过程数据核验</text></svg>