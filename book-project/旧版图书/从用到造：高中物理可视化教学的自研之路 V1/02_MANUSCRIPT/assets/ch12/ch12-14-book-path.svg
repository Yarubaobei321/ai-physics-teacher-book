<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">从“看见”到“持续创造”</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">全书最终指向教师的专业自主</text><g><rect x="80" y="300" width="240" height="260" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="200" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">发现不可见</text><text x="200" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">概念、过程、空间</text></g><path d="M320 430 L375 430" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="385" y="300" width="240" height="260" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="505" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">创造可操作对象</text><text x="505" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">教具、网页、硬件</text></g><path d="M625 430 L680 430" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="690" y="300" width="240" height="260" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="810" y="348" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">组织真实任务</text><text x="810" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">概念课、规律课、习题课、项目课</text></g><path d="M930 430 L985 430" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="995" y="300" width="240" height="260" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1115" y="348" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">保留可检查证据</text><text x="1115" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">过程、成品、数据与边界</text></g><path d="M1235 430 L1290 430" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1300" y="300" width="240" height="260" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1420" y="348" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">形成专业自主</text><text x="1420" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">可维护、可共享、可继续创造</text></g><g><rect x="505" y="680" width="590" height="52" rx="26" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="800" y="715" font-size="20" font-weight="600" fill="#2563eb" text-anchor="middle">教师把课堂判断转成可验证、可传递的作品</text></g></svg>