<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}.h{font-size:23px;font-weight:800;fill:#172033}.r{font-size:22px;font-weight:700;fill:#334155}.d{fill:#2563eb}.e{fill:#0f9f6e}.m{fill:#d97706}.q{fill:#7c3aed}.s{font-size:18px;fill:#64748b}</style><rect width="1600" height="1000" fill="#f8fafc"/><text x="70" y="75" font-size="44" font-weight="800" fill="#172033">媒介与科学思维是多对多关系</text><text x="70" y="118" font-size="22" fill="#526174">圆点表示“有条件支持”，仍需具体任务和学生产物</text><g transform="translate(0 25)"><rect x="330" y="180" width="1150" height="650" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><path d="M330 285H1480M330 390H1480M330 495H1480M330 600H1480M330 705H1480" stroke="#dbe3ee" stroke-width="2"/><path d="M610 180V830M895 180V830M1180 180V830" stroke="#dbe3ee" stroke-width="2"/><text x="470" y="245" text-anchor="middle" class="h">模型建构</text><text x="752" y="245" text-anchor="middle" class="h">科学推理</text><text x="1037" y="245" text-anchor="middle" class="h">科学论证</text><text x="1330" y="245" text-anchor="middle" class="h">质疑创新</text><text x="70" y="350" class="r">实物／模型</text><text x="70" y="455" class="r">图／过程图</text><text x="70" y="560" class="r">动画／仿真</text><text x="70" y="665" class="r">数据／图像</text><text x="70" y="770" class="r">项目／编程</text><g><circle cx="470" cy="338" r="18" class="d"/><circle cx="752" cy="338" r="12" class="e"/><circle cx="1037" cy="338" r="10" class="m"/><circle cx="1330" cy="338" r="12" class="q"/><circle cx="470" cy="443" r="16" class="d"/><circle cx="752" cy="443" r="18" class="e"/><circle cx="1037" cy="443" r="13" class="m"/><circle cx="1330" cy="443" r="12" class="q"/><circle cx="470" cy="548" r="14" class="d"/><circle cx="752" cy="548" r="18" class="e"/><circle cx="1037" cy="548" r="11" class="m"/><circle cx="1330" cy="548" r="15" class="q"/><circle cx="470" cy="653" r="10" class="d"/><circle cx="752" cy="653" r="15" class="e"/><circle cx="1037" cy="653" r="20" class="m"/><circle cx="1330" cy="653" r="16" class="q"/><circle cx="470" cy="758" r="15" class="d"/><circle cx="752" cy="758" r="17" class="e"/><circle cx="1037" cy="758" r="15" class="m"/><circle cx="1330" cy="758" r="22" class="q"/></g></g><text x="800" y="930" text-anchor="middle" font-size="24" font-weight="800" fill="#be123c">“用了动画”不能推出“发生推理”；“做了实验”也不能推出“完成论证”</text></svg>
