<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1700" height="900" fill="#f8fafc"/><text x="80" y="80" font-size="44" font-weight="800" fill="#172033">外部表征怎样进入科学思维</text><text x="80" y="122" font-size="22" fill="#526174">中间两层决定“展示”能否转成“学习”</text><g><rect x="55" y="280" width="260" height="250" rx="26" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="185" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#2563eb">学习障碍</text><text x="185" y="395" text-anchor="middle" font-size="21" fill="#334155">对象不可见</text><text x="185" y="430" text-anchor="middle" font-size="21" fill="#334155">过程太快</text><text x="185" y="465" text-anchor="middle" font-size="21" fill="#334155">关系难连</text></g><path d="M320 405H375" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><g><rect x="385" y="280" width="260" height="250" rx="26" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="515" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#0f9f6e">外部表征</text><text x="515" y="395" text-anchor="middle" font-size="21" fill="#334155">实物、图、数据</text><text x="515" y="430" text-anchor="middle" font-size="21" fill="#334155">符号、动画、仿真</text><text x="515" y="465" text-anchor="middle" font-size="21" fill="#64748b">提供共同对象</text></g><path d="M650 405H705" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><g><rect x="715" y="250" width="300" height="310" rx="26" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="865" y="315" text-anchor="middle" font-size="28" font-weight="800" fill="#d97706">学生行动</text><text x="865" y="370" text-anchor="middle" font-size="21" fill="#334155">预测、标注、调参</text><text x="865" y="407" text-anchor="middle" font-size="21" fill="#334155">测量、比较、解释</text><text x="865" y="444" text-anchor="middle" font-size="21" fill="#334155">质疑、修改、复核</text><text x="865" y="510" text-anchor="middle" font-size="22" font-weight="800" fill="#b45309">机制发生处</text></g><path d="M1020 405H1075" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><g><rect x="1085" y="250" width="300" height="310" rx="26" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="1235" y="315" text-anchor="middle" font-size="28" font-weight="800" fill="#7c3aed">可见产物</text><text x="1235" y="370" text-anchor="middle" font-size="21" fill="#334155">模型图、状态表</text><text x="1235" y="407" text-anchor="middle" font-size="21" fill="#334155">数据、论证、代码</text><text x="1235" y="444" text-anchor="middle" font-size="21" fill="#334155">错误定位、修订记录</text><text x="1235" y="510" text-anchor="middle" font-size="22" font-weight="800" fill="#6d28d9">证据留下处</text></g><path d="M1390 405H1445" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><g><rect x="1455" y="280" width="200" height="250" rx="26" fill="#fff0f2" stroke="#dc4c64" stroke-width="4"/><text x="1555" y="340" text-anchor="middle" font-size="28" font-weight="800" fill="#dc4c64">反馈</text><text x="1555" y="395" text-anchor="middle" font-size="21" fill="#334155">定位断点</text><text x="1555" y="430" text-anchor="middle" font-size="21" fill="#334155">调整任务</text><text x="1555" y="465" text-anchor="middle" font-size="21" fill="#334155">再次验证</text></g><path d="M1555 555C1555 745 865 745 865 575" fill="none" stroke="#dc4c64" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="1210" y="725" text-anchor="middle" font-size="22" font-weight="700" fill="#be123c">反馈回到下一轮行动</text></svg>
