<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1500" height="1000" fill="#f8fafc"/><text x="75" y="78" font-size="44" font-weight="800" fill="#172033">质疑创新从一处可检查的冲突开始</text><text x="75" y="120" font-size="22" fill="#526174">让模型、代码、数据和失败记录都进入共同工作台</text><g><rect x="570" y="190" width="360" height="150" rx="28" fill="#fff0f2" stroke="#dc4c64" stroke-width="4"/><text x="750" y="250" text-anchor="middle" font-size="30" font-weight="800" fill="#dc4c64">发现冲突</text><text x="750" y="295" text-anchor="middle" font-size="21" fill="#334155">预测与现象、数据或代码不一致</text><rect x="1030" y="420" width="360" height="150" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="1210" y="480" text-anchor="middle" font-size="30" font-weight="800" fill="#d97706">定位原因</text><text x="1210" y="525" text-anchor="middle" font-size="21" fill="#334155">模型、测量、单位还是实现</text><rect x="570" y="690" width="360" height="150" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="750" y="750" text-anchor="middle" font-size="30" font-weight="800" fill="#0f9f6e">修改方案</text><text x="750" y="795" text-anchor="middle" font-size="21" fill="#334155">只改一个关键变量并留档</text><rect x="110" y="420" width="360" height="150" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="290" y="480" text-anchor="middle" font-size="30" font-weight="800" fill="#2563eb">独立复核</text><text x="290" y="525" text-anchor="middle" font-size="21" fill="#334155">手算、另一仪器或另一数据链</text></g><path d="M935 280C1085 310 1175 360 1200 410" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1210 580C1145 680 1020 750 940 760" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M560 760C440 730 330 650 300 580" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M290 410C355 320 490 270 560 265" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><circle cx="750" cy="500" r="130" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="750" y="475" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">保留证据</text><text x="750" y="525" text-anchor="middle" font-size="21" fill="#334155">错误版本　修复说明</text><text x="750" y="560" text-anchor="middle" font-size="21" fill="#334155">验证结果　适用边界</text><text x="750" y="930" text-anchor="middle" font-size="24" font-weight="800" fill="#334155">创新可以很小：一个更可靠的测量、一条更清楚的反馈、一次有依据的修改</text></svg>
