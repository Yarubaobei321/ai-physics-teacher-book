<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="80" font-size="44" font-weight="800" fill="#172033">模型建构：增加观察，也进行删减</text><text x="80" y="122" font-size="22" fill="#526174">以莱顿瓶到平行板电容器为例</text><g><rect x="90" y="260" width="330" height="320" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="255" y="320" text-anchor="middle" font-size="29" font-weight="800" fill="#2563eb">真实装置</text><text x="255" y="380" text-anchor="middle" font-size="22" fill="#334155">瓶体、内外导体</text><text x="255" y="420" text-anchor="middle" font-size="22" fill="#334155">玻璃、导线、形状</text><text x="255" y="485" text-anchor="middle" font-size="21" fill="#64748b">先看全貌</text></g><path d="M425 420H530" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="477" y="395" text-anchor="middle" font-size="20" fill="#475569">比较</text><g><rect x="540" y="220" width="380" height="400" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="730" y="285" text-anchor="middle" font-size="29" font-weight="800" fill="#d97706">选择与删减</text><text x="730" y="345" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">保留</text><text x="730" y="385" text-anchor="middle" font-size="21" fill="#334155">两导体　绝缘介质　有效面积</text><text x="730" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#be123c">暂时忽略</text><text x="730" y="495" text-anchor="middle" font-size="21" fill="#334155">曲面细节　边缘场　非均匀厚度</text><text x="730" y="565" text-anchor="middle" font-size="21" fill="#64748b">写出适用条件</text></g><path d="M925 420H1030" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="977" y="395" text-anchor="middle" font-size="20" fill="#475569">抽象</text><g><rect x="1040" y="260" width="470" height="320" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="1275" y="320" text-anchor="middle" font-size="29" font-weight="800" fill="#0f9f6e">可操作模型</text><line x1="1160" y1="385" x2="1160" y2="485" stroke="#2563eb" stroke-width="18"/><line x1="1390" y1="385" x2="1390" y2="485" stroke="#dc4c64" stroke-width="18"/><text x="1275" y="420" text-anchor="middle" font-size="21" fill="#334155">介质</text><path d="M1180 520H1370" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/><text x="1275" y="555" text-anchor="middle" font-size="21" fill="#64748b">改变面积或间距，检验关系</text></g><rect x="250" y="700" width="1100" height="90" rx="22" fill="#f4edff" stroke="#a78bfa" stroke-width="3"/><text x="800" y="754" text-anchor="middle" font-size="25" font-weight="800" fill="#6d28d9">模型的价值来自有依据的保留与忽略，不来自图形比实物更简洁</text></svg>
