<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="80" font-size="44" font-weight="800" fill="#172033">让可视化支架逐步退出</text><text x="80" y="122" font-size="22" fill="#526174">从教师提供完整表征，到学生独立选择并生成表征</text><g><rect x="100" y="250" width="400" height="360" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="300" y="315" text-anchor="middle" font-size="30" font-weight="800" fill="#2563eb">阶段一　教师展示</text><text x="300" y="380" text-anchor="middle" font-size="22" fill="#334155">给出结构、变量和示例</text><text x="300" y="425" text-anchor="middle" font-size="22" fill="#334155">示范怎样读图与验证</text><text x="300" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">学生：辨认与解释</text><rect x="600" y="250" width="400" height="360" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="800" y="315" text-anchor="middle" font-size="30" font-weight="800" fill="#0f9f6e">阶段二　共同完成</text><text x="800" y="380" text-anchor="middle" font-size="22" fill="#334155">保留框架，隐藏部分关系</text><text x="800" y="425" text-anchor="middle" font-size="22" fill="#334155">由学生补图、调参和比较</text><text x="800" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">学生：生成与修正</text><rect x="1100" y="250" width="400" height="360" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="1300" y="315" text-anchor="middle" font-size="30" font-weight="800" fill="#d97706">阶段三　独立选择</text><text x="1300" y="380" text-anchor="middle" font-size="22" fill="#334155">只给问题、数据和约束</text><text x="1300" y="425" text-anchor="middle" font-size="22" fill="#334155">由学生决定表征与证据</text><text x="1300" y="510" text-anchor="middle" font-size="21" font-weight="700" fill="#475569">学生：迁移与论证</text></g><path d="M505 430H590" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1005 430H1090" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M190 700H1410" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round"/><path d="M190 700H1410" stroke="#7c3aed" stroke-width="16" stroke-linecap="round" stroke-dasharray="520 700"/><text x="190" y="750" text-anchor="start" font-size="21" fill="#6d28d9">教师表征多</text><text x="1410" y="750" text-anchor="end" font-size="21" fill="#475569">学生生成多</text><text x="800" y="835" text-anchor="middle" font-size="25" font-weight="800" fill="#be123c">若支架始终给出完整答案，迁移任务仍会暴露原来的断点</text></svg>
