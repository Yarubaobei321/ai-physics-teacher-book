<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
  <title id="title">静电场描绘仪的模拟链条</title>
  <desc id="desc">匹配边界形状和电势后，利用浅水槽中的稳恒电流场，通过探针读取电势、标出等势点，再与仿真图比较。</desc>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F4EA"/><stop offset="1" stop-color="#EAF3F2"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#193746" flood-opacity=".12"/></filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L11 6 0 12z" fill="#3A6F6B"/></marker>
  </defs>
  <rect width="1400" height="590" rx="32" fill="url(#b)"/>
  <text x="70" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#17324D">从不可见的场，到可以逐点检验的等势线</text>
  <text x="70" y="112" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#596873">模拟成立依赖三个条件：介质近似均匀、研究区域内没有源汇、边界几何与电势条件对应。</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" filter="url(#s)">
    <rect x="70" y="170" width="235" height="245" rx="24" fill="#FFFFFF" stroke="#D9C79E" stroke-width="2"/>
    <text x="105" y="217" font-size="21" fill="#886B2B">目标对象</text><text x="105" y="258" font-size="29" font-weight="700" fill="#17324D">静电场</text>
    <path d="M123 336c45-72 83-72 129 0M123 336c45 72 83 72 129 0" fill="none" stroke="#E8B45A" stroke-width="4"/>
    <circle cx="116" cy="336" r="12" fill="#D95C59"/><circle cx="260" cy="336" r="12" fill="#4377B8"/>
    <text x="105" y="383" font-size="17" fill="#596873">场线看不见，电势可计算</text>

    <rect x="340" y="170" width="235" height="245" rx="24" fill="#FFFFFF" stroke="#B7D3CF" stroke-width="2"/>
    <text x="375" y="217" font-size="21" fill="#477C76">物理替身</text><text x="375" y="258" font-size="29" font-weight="700" fill="#17324D">稳恒电流场</text>
    <rect x="395" y="302" width="125" height="60" rx="9" fill="#B9DDE3" opacity=".7"/><path d="M412 332h90" stroke="#3A6F6B" stroke-width="4" stroke-dasharray="7 7"/>
    <text x="375" y="383" font-size="17" fill="#596873">浅水层提供弱导电介质</text>

    <rect x="610" y="170" width="235" height="245" rx="24" fill="#FFFFFF" stroke="#B7D3CF" stroke-width="2"/>
    <text x="645" y="217" font-size="21" fill="#477C76">测量动作</text><text x="645" y="258" font-size="29" font-weight="700" fill="#17324D">探针读电势</text>
    <path d="M732 288v76" stroke="#17324D" stroke-width="6"/><circle cx="732" cy="370" r="10" fill="#E8B45A"/><rect x="671" y="296" width="50" height="37" rx="6" fill="#DCEAE7"/><text x="696" y="321" text-anchor="middle" font-size="19" fill="#17324D">V</text>
    <text x="645" y="383" font-size="17" fill="#596873">寻找相同读数的位置</text>

    <rect x="880" y="170" width="235" height="245" rx="24" fill="#FFFFFF" stroke="#B7D3CF" stroke-width="2"/>
    <text x="915" y="217" font-size="21" fill="#477C76">空间痕迹</text><text x="915" y="258" font-size="29" font-weight="700" fill="#17324D">标出等势点</text>
    <path d="M934 353c30-68 98-68 128 0M951 353c21-45 73-45 94 0" fill="none" stroke="#3A6F6B" stroke-width="4"/>
    <g fill="#E8B45A"><circle cx="955" cy="323" r="7"/><circle cx="997" cy="302" r="7"/><circle cx="1038" cy="323" r="7"/></g>
    <text x="915" y="383" font-size="17" fill="#596873">点的集合显出线的形状</text>

    <rect x="1150" y="170" width="180" height="245" rx="24" fill="#FFFFFF" stroke="#D9C79E" stroke-width="2"/>
    <text x="1185" y="217" font-size="21" fill="#886B2B">对照证据</text><text x="1185" y="258" font-size="29" font-weight="700" fill="#17324D">仿真比较</text>
    <path d="M1192 302h96M1192 329h96M1192 356h96" stroke="#79B8B1" stroke-width="4"/><path d="M1204 289v82M1240 289v82M1276 289v82" stroke="#E8B45A" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="1185" y="383" font-size="17" fill="#596873">解释吻合与偏差</text>
  </g>
  <g stroke="#3A6F6B" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M305 292h25"/><path d="M575 292h25"/><path d="M845 292h25"/><path d="M1115 292h25"/></g>
  <rect x="217" y="470" width="966" height="74" rx="18" fill="#17324D"/>
  <text x="700" y="502" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="24" fill="#FFFFFF">J = σE = −σ∇φ　　∇·J = 0　　⇒　　∇²φ = 0</text>
  <text x="700" y="530" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#CFE4E1">在均匀、各向同性介质且区域内无电流源汇时，与无自由电荷静电区域满足同类边值方程。</text>
</svg>
