<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.h{font-size:27px;font-weight:780}.b{font-size:20px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.loss{stroke:#e11d48;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">滑槽阶段：不用知道阻力怎样变化，也能追踪总能量账目</text>
<rect x="100" y="260" width="360" height="210" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/><text x="280" y="325" text-anchor="middle" class="h">M点入口</text><text x="280" y="372" text-anchor="middle" class="b">B质量 2m，速度 v₀</text><text x="280" y="410" text-anchor="middle" class="b">平台上方高度差 3L</text>
<path d="M475 365H720" class="arr"/><text x="600" y="335" text-anchor="middle" class="h">重力势能减少</text><text x="600" y="400" text-anchor="middle" class="b">2mg·3L</text>
<rect x="740" y="260" width="360" height="210" rx="26" fill="#ecfdf5" stroke="#34d399" stroke-width="4"/><text x="920" y="325" text-anchor="middle" class="h">N点出口</text><text x="920" y="372" text-anchor="middle" class="b">速度 2v₀</text><text x="920" y="410" text-anchor="middle" class="b">动能改变可直接计算</text>
<path d="M1100 365H1330" class="loss"/><rect x="1250" y="225" width="280" height="280" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="4"/><text x="1390" y="315" text-anchor="middle" class="h">克服阻力做功 W</text><text x="1390" y="370" text-anchor="middle" class="b">进入内能与其他耗散</text><text x="1390" y="420" text-anchor="middle" class="h">W=6mgL－3mv₀²</text>
<rect x="220" y="640" width="1160" height="130" rx="24" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="800" y="692" text-anchor="middle" class="h">全过程关系：入口动能＋重力势能减少＝出口动能＋克服阻力做功</text><text x="800" y="736" text-anchor="middle" class="b">题目没有给阻力随路径的函数，因此不应强行逐小段计算；始末状态已经足够。</text></svg>
