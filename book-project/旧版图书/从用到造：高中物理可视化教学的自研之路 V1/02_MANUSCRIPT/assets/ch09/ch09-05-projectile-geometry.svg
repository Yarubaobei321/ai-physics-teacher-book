<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.h{font-size:26px;font-weight:780}.b{font-size:20px;fill:#475569}.dash{stroke:#2563eb;stroke-width:4;stroke-dasharray:10 9;fill:none}.solid{stroke:#334155;stroke-width:5;fill:none}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">平抛阶段：把碰后速度与“圆盘直径两端”翻译成几何方程</text>
<line x1="150" y1="260" x2="740" y2="260" class="solid"/><rect x="650" y="220" width="90" height="40" fill="#94a3b8"/><text x="695" y="205" text-anchor="middle" class="h">N</text><line x1="740" y1="260" x2="740" y2="680" class="dash"/><text x="780" y="465" class="h">高度 L</text>
<path d="M740 260Q1000 300 1180 650" class="dash"/><path d="M740 260Q850 360 940 650" stroke="#16a34a" stroke-width="4" stroke-dasharray="10 9" fill="none"/><circle cx="940" cy="650" r="12" fill="#16a34a"/><circle cx="1180" cy="650" r="12" fill="#2563eb"/><line x1="850" y1="650" x2="1270" y2="650" class="solid"/><ellipse cx="1060" cy="650" rx="210" ry="65" fill="none" stroke="#f59e0b" stroke-width="5"/><line x1="940" y1="650" x2="1180" y2="650" stroke="#e11d48" stroke-width="5"/><text x="1060" y="625" text-anchor="middle" class="h">直径两端</text><text x="1060" y="720" text-anchor="middle" class="b">圆心距N：s；圆盘半径：r</text>
<rect x="120" y="705" width="560" height="130" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><text x="400" y="755" text-anchor="middle" class="h">同一飞行时间</text><text x="400" y="798" text-anchor="middle" class="b">t=√(2L/g)</text>
<rect x="820" y="735" width="650" height="110" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="3"/><text x="1145" y="780" text-anchor="middle" class="h">s－r=v₂t，s＋r=v₁t</text><text x="1145" y="820" text-anchor="middle" class="b">相加消去r，得到圆心位置s</text></svg>
