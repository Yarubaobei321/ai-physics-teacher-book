<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:44px;font-weight:800}.head{font-size:24px;font-weight:800}.h{font-size:22px;font-weight:760}.b{font-size:18px;fill:#475569}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style><rect width="1600" height="1000" fill="#f8fafc"/><text x="70" y="80" class="title">一张状态—模型表，防止公式跨阶段串线</text><g transform="translate(65 130)"><rect width="1470" height="90" rx="16" fill="#dbeafe"/><text x="130" y="56" text-anchor="middle" class="head">阶段</text><text x="420" y="56" text-anchor="middle" class="head">对象与始末状态</text><text x="790" y="56" text-anchor="middle" class="head">主要模型</text><text x="1120" y="56" text-anchor="middle" class="head">阶段输出</text><text x="1370" y="56" text-anchor="middle" class="head">检查点</text>
<g transform="translate(0 105)"><rect width="1470" height="160" rx="16" class="cell" fill="#eff6ff"/><text x="130" y="52" text-anchor="middle" class="h">传送带</text><text x="420" y="48" text-anchor="middle" class="h">单个药品盒</text><text x="420" y="84" text-anchor="middle" class="b">静止 → 与带共速 v₀</text><text x="790" y="48" text-anchor="middle" class="h">匀加速 / 牛顿第二定律</text><text x="790" y="84" text-anchor="middle" class="b">a=μg（相对滑动阶段）</text><text x="1120" y="63" text-anchor="middle" class="h">t=v₀/(μg)</text><text x="1370" y="48" text-anchor="middle" class="h">摩擦方向</text><text x="1370" y="84" text-anchor="middle" class="b">共速后状态</text></g>
<g transform="translate(0 280)"><rect width="1470" height="160" rx="16" class="cell" fill="#ecfdf5"/><text x="130" y="52" text-anchor="middle" class="h">滑槽</text><text x="420" y="48" text-anchor="middle" class="h">A或B，M→N</text><text x="420" y="84" text-anchor="middle" class="b">入口 v₀；出口由题设给出</text><text x="790" y="48" text-anchor="middle" class="h">全过程动能定理</text><text x="790" y="84" text-anchor="middle" class="b">重力功－克阻功=ΔEₖ</text><text x="1120" y="48" text-anchor="middle" class="h">A：0；B：2v₀</text><text x="1120" y="84" text-anchor="middle" class="b">同一路径支撑阻力功</text><text x="1370" y="48" text-anchor="middle" class="h">不需假设</text><text x="1370" y="84" text-anchor="middle" class="b">阻力恒定</text></g>
<g transform="translate(0 455)"><rect width="1470" height="160" rx="16" class="cell" fill="#fffbeb"/><text x="130" y="52" text-anchor="middle" class="h">碰撞</text><text x="420" y="48" text-anchor="middle" class="h">A：静止；B：2v₀</text><text x="420" y="84" text-anchor="middle" class="b">碰后速度 v₁、v₂</text><text x="790" y="48" text-anchor="middle" class="h">动量＋能量损失</text><text x="790" y="84" text-anchor="middle" class="b">两个方程共同约束</text><text x="1120" y="48" text-anchor="middle" class="h">两组代数候选</text><text x="1120" y="84" text-anchor="middle" class="b">由分离条件筛选</text><text x="1370" y="48" text-anchor="middle" class="h">A应不慢于B</text><text x="1370" y="84" text-anchor="middle" class="b">否则不能分离</text></g>
<g transform="translate(0 630)"><rect width="1470" height="160" rx="16" class="cell" fill="#f5f3ff"/><text x="130" y="52" text-anchor="middle" class="h">平抛</text><text x="420" y="48" text-anchor="middle" class="h">A、B从N离台</text><text x="420" y="84" text-anchor="middle" class="b">同高度，同初始竖直速度</text><text x="790" y="48" text-anchor="middle" class="h">独立运动＋几何约束</text><text x="790" y="84" text-anchor="middle" class="b">t=√(2L/g)</text><text x="1120" y="48" text-anchor="middle" class="h">s±r=v·t</text><text x="1120" y="84" text-anchor="middle" class="b">求圆心至N距离s</text><text x="1370" y="48" text-anchor="middle" class="h">s与r区分</text><text x="1370" y="84" text-anchor="middle" class="b">落点顺序一致</text></g></g></svg>
