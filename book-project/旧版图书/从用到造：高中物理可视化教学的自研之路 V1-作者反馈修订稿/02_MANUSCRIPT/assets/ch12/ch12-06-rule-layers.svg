<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">长期规则、单次需求和证据分层保存</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">减少重复交代，也防止一次修改覆盖全部约定</text><g><rect x="130" y="200" width="1340" height="150" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="800" y="248" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">长期规则层</text><text x="800" y="282" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">角色、范围、科学性原则、视觉、修改纪律、版本习惯</text></g><path d="M800 350 L800 420" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="250" y="420" width="1100" height="150" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="800" y="468" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">单次任务层</text><text x="800" y="502" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">对象、难点、交互、数据、特殊点与交付物</text></g><path d="M800 570 L800 640" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="370" y="640" width="860" height="130" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="800" y="688" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">证据与变更层</text><text x="800" y="722" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">验收记录、问题证据、修复说明、版本与授权</text></g></svg>