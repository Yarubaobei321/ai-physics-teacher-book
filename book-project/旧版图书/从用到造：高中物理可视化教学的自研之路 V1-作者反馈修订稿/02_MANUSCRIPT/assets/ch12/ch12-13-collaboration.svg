<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">多人合著需要围绕同一对象分工</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">角色可以由同一人兼任，责任不能消失</text><g><rect x="610" y="330" width="380" height="170" rx="24" fill="#ffffff" stroke="#cbd7e6" stroke-width="3"/><text x="800" y="378" font-size="28" font-weight="700" fill="#172033" text-anchor="middle">共同对象</text><text x="800" y="412" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">同一PRD＋同一事实档案</text></g><g><rect x="100" y="210" width="400" height="150" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="300" y="258" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">内容负责人</text><text x="300" y="292" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">教学问题、任务与文字</text></g><path d="M300 285 L610 380" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="1100" y="210" width="400" height="150" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="1300" y="258" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">实现负责人</text><text x="1300" y="292" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">网页、装置与图件</text></g><path d="M1300 285 L990 380" stroke="#0f9f6e" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="100" y="610" width="400" height="150" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="300" y="658" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">验真负责人</text><text x="300" y="692" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">学科、数据与边界</text></g><path d="M300 685 L610 450" stroke="#dc4c64" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="1100" y="610" width="400" height="150" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1300" y="658" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">出版维护负责人</text><text x="1300" y="692" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">资产、版本、授权与导出</text></g><path d="M1300 685 L990 450" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow)"/></svg>