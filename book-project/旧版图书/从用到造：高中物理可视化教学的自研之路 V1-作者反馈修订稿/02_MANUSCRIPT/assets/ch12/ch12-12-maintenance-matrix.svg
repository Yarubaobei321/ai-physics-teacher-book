<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">维护优先级由风险和课堂影响共同决定</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">先处理会误导学生、暴露信息或中断课堂的问题</text><line x1="330" y1="735" x2="1450" y2="735" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/><line x1="330" y1="735" x2="330" y2="180" stroke="#172033" stroke-width="3" marker-end="url(#arrow)"/><text x="1440" y="785" font-size="22" font-weight="600" fill="#172033" text-anchor="end">课堂影响</text><text x="265" y="210" font-size="22" font-weight="600" fill="#172033" text-anchor="middle" transform="rotate(-90 265 210)">发生风险</text><rect x="330" y="180" width="560" height="277" fill="#fff6e5" stroke="#cbd7e6"/><rect x="890" y="180" width="560" height="277" fill="#fff0f2" stroke="#cbd7e6"/><rect x="330" y="457" width="560" height="278" fill="#eafaf4" stroke="#cbd7e6"/><rect x="890" y="457" width="560" height="278" fill="#eaf2ff" stroke="#cbd7e6"/><text x="610" y="245" font-size="30" font-weight="700" fill="#d97706" text-anchor="middle">计划修复</text><text x="610" y="300" font-size="22" font-weight="400" fill="#172033" text-anchor="middle">外观、说明、低频功能</text><text x="1170" y="245" font-size="30" font-weight="700" fill="#dc4c64" text-anchor="middle">立即停用或修复</text><text x="1170" y="300" font-size="22" font-weight="400" fill="#172033" text-anchor="middle">物理错误、隐私、数据错位</text><text x="610" y="525" font-size="30" font-weight="700" fill="#0f9f6e" text-anchor="middle">批量整理</text><text x="610" y="580" font-size="22" font-weight="400" fill="#172033" text-anchor="middle">文件命名、压缩、归档</text><text x="1170" y="525" font-size="30" font-weight="700" fill="#2563eb" text-anchor="middle">优先验证</text><text x="1170" y="580" font-size="22" font-weight="400" fill="#172033" text-anchor="middle">入口失效、核心交互、课堂加载</text></svg>