<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">PRD把教学判断分成六层</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">先写清“怎样算做对”，再进入实现</text><rect x="210" y="180" width="1180" height="76" rx="18" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/><text x="260" y="229" font-size="25" font-weight="700" fill="#2563eb" text-anchor="start">对象与场景</text><text x="550" y="229" font-size="22" font-weight="400" fill="#172033" text-anchor="start">学段、学生、课堂/课后、设备</text><rect x="210" y="280" width="1180" height="76" rx="18" fill="#fff0f2" stroke="#dc4c64" stroke-width="2"/><text x="260" y="329" font-size="25" font-weight="700" fill="#dc4c64" text-anchor="start">难点与误区</text><text x="550" y="329" font-size="22" font-weight="400" fill="#172033" text-anchor="start">要改变哪一种理解或行动</text><rect x="210" y="380" width="1180" height="76" rx="18" fill="#eafaf4" stroke="#0f9f6e" stroke-width="2"/><text x="260" y="429" font-size="25" font-weight="700" fill="#0f9f6e" text-anchor="start">内容与交互</text><text x="550" y="429" font-size="22" font-weight="400" fill="#172033" text-anchor="start">看什么、调什么、比较什么</text><rect x="210" y="480" width="1180" height="76" rx="18" fill="#f4edff" stroke="#7c3aed" stroke-width="2"/><text x="260" y="529" font-size="25" font-weight="700" fill="#7c3aed" text-anchor="start">技术边界</text><text x="550" y="529" font-size="22" font-weight="400" fill="#172033" text-anchor="start">离线、桌面、兼容、资源来源</text><rect x="210" y="580" width="1180" height="76" rx="18" fill="#fff6e5" stroke="#d97706" stroke-width=