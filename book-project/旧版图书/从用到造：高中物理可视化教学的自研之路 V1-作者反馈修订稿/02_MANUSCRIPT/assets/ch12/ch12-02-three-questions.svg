<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">资源立项先过三道门</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">技术可做不等于教学值得做</text><g><rect x="90" y="300" width="350" height="210" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="265" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">一问：真难点</text><text x="265" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">学生最容易错或最难想象</text></g><path d="M440 405 L585 405" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="585" y="300" width="350" height="210" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="760" y="348" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">二问：真缺口</text><text x="760" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">现有资源无法完成什么任务</text></g><path d="M935 405 L1080 405" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1080" y="300" width="420" height="210" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="1290" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">三问：真使用</text><text x="1290" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">谁在何时怎样操作并留下什么</text></g><g><rect x="625" y="605" width="350" height="52" rx="26" fill="#f4edff" stroke="#7c3aed" stroke-width="2"/><text x="800" y="640" font-size="20" font-weight="600" fill="#7c3aed" text-anchor="middle">三问都有明确答案 → 进入PRD</text></g><text x="800" y="710" font-size="25" font-weight="600" fill="#526174" text-anchor="middle">答不清的一问，就是立项前需要补做的教学分析</text></svg>