<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">“能打开”只是第一眼，发布前要过五道门</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">本书网页审阅只验桌面端；课程平板要求留在课程场景</text><g><rect x="65" y="300" width="250" height="230" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="190" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">学科门</text><text x="190" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">公式、模型、答案</text></g><path d="M315 415 L360 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="370" y="300" width="250" height="230" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="495" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">功能门</text><text x="495" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">参数、反馈、重置</text></g><path d="M620 415 L665 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="675" y="300" width="250" height="230" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="800" y="348" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">桌面门</text><text x="800" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">显示、加载、浏览器</text></g><path d="M925 415 L970 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="980" y="300" width="250" height="230" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1105" y="348" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">合规门</text><text x="1105" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">隐私、来源、授权</text></g><path d="M1230 415 L1275 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1285" y="300" width="250" height="230" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1410" y="348" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">留档门</text><text x="1410" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">版本、需求、修复</text></g><text x="800" y="650" font-size="26" font-weight="700" fill="#dc4c64" text-anchor="middle">任一关口未通过：返回对应环节修复，并保存证据</text></svg>