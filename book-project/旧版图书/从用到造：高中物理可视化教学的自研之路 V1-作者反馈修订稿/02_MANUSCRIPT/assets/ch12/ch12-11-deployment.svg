<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">发布有三个层级，没有必要一步到公网</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">共享范围与维护责任同步扩大</text><g><rect x="110" y="300" width="360" height="240" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="290" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">本地直用</text><text x="290" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">单文件、断网可开、交付最快</text></g><path d="M470 420 L620 420" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="620" y="300" width="360" height="240" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="800" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">校内共享</text><text x="800" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">统一入口、有限范围、便于协作</text></g><path d="M980 420 L1130 420" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1130" y="300" width="360" height="240" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1310" y="348" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">公网发布</text><text x="1310" y="382" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">域名、访问、合规与持续维护</text></g><text x="800" y="655" font-size="25" font-weight="700" fill="#526174" text-anchor="middle">按教学需要选择最低足够层级；层级越高，维护与合规责任越多</text></svg>