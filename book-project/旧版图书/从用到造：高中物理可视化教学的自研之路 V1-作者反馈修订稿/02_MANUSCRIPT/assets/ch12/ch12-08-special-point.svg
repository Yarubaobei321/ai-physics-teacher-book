<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">特殊点核验：用独立预期检查程序输出</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">物理教师保留最终判断权</text><g><rect x="90" y="315" width="300" height="200" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="240" y="363" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">选特殊状态</text><text x="240" y="397" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">可手算、边界清楚</text></g><path d="M390 415 L500 415" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="500" y="315" width="300" height="200" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="650" y="363" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">独立计算</text><text x="650" y="397" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">写出预期值与单位</text></g><path d="M800 415 L910 415" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="910" y="315" width="300" height="200" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="1060" y="363" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">运行页面</text><text x="1060" y="397" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">记录页面输出</text></g><path d="M1210 415 L1320 415" fill="none" stroke="#2563eb" stroke-width="4"  marker-end="url(#arrow)"/><g transform="translate(1405,415)"><polygon points="0,-95 115,0 0,95 -115,0" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="0" y="-8" font-size="26" font-weight="700" fill="#dc4c64" text-anchor="middle">一致？</text><text x="0" y="30" font-size="18" font-weight="400" fill="#526174" text-anchor="middle">数值＋行为</text></g><path d="M1405 510 V650 H240 V525" fill="none" stroke="#dc4c64" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="820" y="690" font-size="24" font-weight="600" fill="#dc4c64" text-anchor="middle">不一致：回到模型、公式、单位或程序逐项定位</text></svg>