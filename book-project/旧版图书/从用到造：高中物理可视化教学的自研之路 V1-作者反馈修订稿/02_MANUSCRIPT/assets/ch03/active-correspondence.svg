<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">活版电路拼图的四层对应关系</title>
  <desc id="desc">学生从模块表面电路符号出发，通过内部元件和磁吸触点完成真实电气连接，并以电路现象检验拼接结果。</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F2D3A" flood-opacity=".13"/></filter>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L10 5.5 0 11z" fill="#366B67"/></marker>
  </defs>
  <rect width="1400" height="520" rx="32" fill="#F4F7F5"/>
  <text x="70" y="72" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#17324D">一块模块同时承担四种表征</text>
  <text x="70" y="111" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#596873">拼图的关键并非“拼得快”，而是让图纸、元件、连接和现象彼此校验。</text>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" filter="url(#s)">
    <rect x="70" y="165" width="270" height="245" rx="24" fill="#FFFFFF" stroke="#D5C294" stroke-width="2"/>
    <text x="105" y="212" font-size="21" fill="#8A6A22">表面</text><text x="105" y="251" font-size="30" font-weight="700" fill="#17324D">电路符号</text>
    <path d="M115 315h38m34 0h85" stroke="#17324D" stroke-width="5"/><path d="M153 292v46m34-33v20" stroke="#17324D" stroke-width="6"/>
    <text x="105" y="375" font-size="18" fill="#596873">读取图纸中的抽象关系</text>

    <rect x="400" y="165" width="270" height="245" rx="24" fill="#FFFFFF" stroke="#B7D3CF" stroke-width="2"/>
    <text x="435" y="212" font-size="21" fill="#477C76">内部</text><text x="435" y="251" font-size="30" font-weight="700" fill="#17324D">元件与导线</text>
    <rect x="451" y="292" width="70" height="38" rx="7" fill="#E8B45A"/><path d="M521 311h94" stroke="#17324D" stroke-width="5"/><circle cx="615" cy="311" r="10" fill="#79B8B1"/>
    <text x="435" y="375" font-size="18" fill="#596873">确认符号背后的实体结构</text>

    <rect x="730" y="165" width="270" height="245" rx="24" fill="#FFFFFF" stroke="#B7D3CF" stroke-width="2"/>
    <text x="765" y="212" font-size="21" fill="#477C76">侧面</text><text x="765" y="251" font-size="30" font-weight="700" fill="#17324D">磁吸触点</text>
    <rect x="782" y="285" width="70" height="64" rx="10" fill="#DCEAE7"/><rect x="878" y="285" width="70" height="64" rx="10" fill="#DCEAE7"/>
    <circle cx="852" cy="317" r="12" fill="#E8B45A"/><circle cx="878" cy="317" r="12" fill="#E8B45A"/><path d="M852 317h26" stroke="#17324D" stroke-width="5"/>
    <text x="765" y="375" font-size="18" fill="#596873">拼合位置，也接通电路</text>

    <rect x="1060" y="165" width="270" height="245" rx="24" fill="#FFFFFF" stroke="#D5C294" stroke-width="2"/>
    <text x="1095" y="212" font-size="21" fill="#8A6A22">结果</text><text x="1095" y="251" font-size="30" font-weight="700" fill="#17324D">电路现象</text>
    <circle cx="1195" cy="313" r="42" fill="#FFF2BD" stroke="#E8B45A" stroke-width="5"/><path d="M1195 271v-22m0 128v-22m-64-42h-22m172 0h-22m-110-46-16-16m124 124-16-16m0-92 16-16m-124 124 16-16" stroke="#E8B45A" stroke-width="6" stroke-linecap="round"/>
    <text x="1095" y="375" font-size="18" fill="#596873">以亮灭、读数检验判断</text>
  </g>
  <g stroke="#366B67" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M340 287h50"/><path d="M670 287h50"/><path d="M1000 287h50"/></g>
  <text x="700" y="474" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#596873">符号—结构—连接—现象形成闭环，错误也因而可以被定位和解释。</text>
</svg>
