<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">自制教具的可视化设计链</title>
  <desc id="desc">从教学难点，经过确定隐藏关系、选择可见载体、设计学生动作，最终获得学习证据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F3EA"/><stop offset="1" stop-color="#EEF5F3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17324D" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L10,6 L0,12 Z" fill="#3B6C6A"/></marker>
  </defs>
  <rect width="1400" height="470" rx="32" fill="url(#bg)"/>
  <text x="70" y="74" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#17324D">先追问“要让什么被看见”，再决定做什么教具</text>
  <text x="70" y="112" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#51606D">一件教具的价值，取决于它能否把关键关系转化为可观察、可操作、可比较的证据。</text>
  <g filter="url(#shadow)" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="65" y="175" width="220" height="190" rx="22" fill="#FFFFFF" stroke="#D7C7A8" stroke-width="2"/>
    <circle cx="108" cy="216" r="22" fill="#E8B45A"/><text x="108" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">1</text>
    <text x="92" y="270" font-size="26" font-weight="700" fill="#17324D">教学难点</text>
    <text x="92" y="309" font-size="18" fill="#51606D">学生在哪里失去</text><text x="92" y="337" font-size="18" fill="#51606D">对象、过程或关系？</text>

    <rect x="327" y="175" width="220" height="190" rx="22" fill="#FFFFFF" stroke="#B9D0CD" stroke-width="2"/>
    <circle cx="370" cy="216" r="22" fill="#79B8B1"/><text x="370" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text>
    <text x="354" y="270" font-size="26" font-weight="700" fill="#17324D">隐藏关系</text>
    <text x="354" y="309" font-size="18" fill="#51606D">符号与实物？</text><text x="354" y="337" font-size="18" fill="#51606D">电势与空间位置？</text>

    <rect x="589" y="175" width="220" height="190" rx="22" fill="#FFFFFF" stroke="#B9D0CD" stroke-width="2"/>
    <circle cx="632" cy="216" r="22" fill="#3B6C6A"/><text x="632" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text>
    <text x="616" y="270" font-size="26" font-weight="700" fill="#17324D">可见载体</text>
    <text x="616" y="309" font-size="18" fill="#51606D">实物、读数、轨迹、</text><text x="616" y="337" font-size="18" fill="#51606D">颜色、镜像或仿真</text>

    <rect x="851" y="175" width="220" height="190" rx="22" fill="#FFFFFF" stroke="#B9D0CD" stroke-width="2"/>
    <circle cx="894" cy="216" r="22" fill="#3B6C6A"/><text x="894" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">4</text>
    <text x="878" y="270" font-size="26" font-weight="700" fill="#17324D">学生动作</text>
    <text x="878" y="309" font-size="18" fill="#51606D">拼接、测量、标记、</text><text x="878" y="337" font-size="18" fill="#51606D">预测、比较与修正</text>

    <rect x="1113" y="175" width="220" height="190" rx="22" fill="#FFFFFF" stroke="#D7C7A8" stroke-width="2"/>
    <circle cx="1156" cy="216" r="22" fill="#E8B45A"/><text x="1156" y="224" text-anchor="middle" font-size="22" font-weight="700" fill="#17324D">5</text>
    <text x="1140" y="270" font-size="26" font-weight="700" fill="#17324D">学习证据</text>
    <text x="1140" y="309" font-size="18" fill="#51606D">学生留下什么可检验</text><text x="1140" y="337" font-size="18" fill="#51606D">的判断与作品？</text>
  </g>
  <g stroke="#3B6C6A" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M285 270 H317"/><path d="M547 270 H579"/><path d="M809 270 H841"/><path d="M1071 270 H1103"/>
  </g>
  <text x="700" y="427" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#65727D">装置只是中间环节；最终要回到学生能否用证据解释物理关系。</text>
</svg>
