  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:44px;font-weight:800}.axis{stroke:#334155;stroke-width:3}.grid{stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 8}.tick{font-size:18px;fill:#475569}.label{font-size:22px;font-weight:700}.fit{stroke:#2563eb;stroke-width:5;fill:none}.pt{fill:#16a34a;stroke:#fff;stroke-width:3}.out{fill:#e11d48;stroke:#fff;stroke-width:4}.note{font-size:19px;fill:#475569}</style>
