<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.n{font-size:30px;font-weight:850;fill:#fff}.h{font-size:25px;font-weight:780}.b{font-size:19px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" class="title">异常点诊断：从可核查处开始，一层一层回到物理模型</text>
  <g transform="translate(80 245)"><circle cx="90" cy="90" r="54" fill="#2563eb"/><text x="90" y="101" text-anchor="middle" class="n">1</text><rect x="170" width="260" height="180" rx="24" class="box"/><text x="300" y="62" text-anchor="middle" class="h">公式与单位</text><text x="300" y="104" text-anchor="middle" class="b">周期是否除以次数</text><text x="300" y="138" text-anchor="middle" class="b">长度、时间单位是否一致</text></g>
  <path d="M520 335H600" class="arr"/>
  <g transform="translate(610 245)"><circle cx="90" cy="90" r="54" fill="#16a34a"/><text x="90" y="101" text-anchor="middle" class="n">2</text><rect x="170" width="260" height="180" rx="24" class="box"/><text x="300" y="62" text-anchor="middle" class="h">原始记录</text><text x="300" y="104" text-anchor="middle" class="b">录入、抄写、计数边界</text><text x="300" y="138" text-anchor="middle" class="b">保留原表，不覆盖原值</text></g>
  <path d="M1050 335H1130" class="arr"/>
  <g transform="translate(1140 245)"><circle cx="90" cy="90" r="54" fill="#f59e0b"/><text x="90" y="101" text-anchor="middle" class="n">3</text><rect x="170" width="260" height="180" rx="24" class="box"/><text x="300" y="62" text-anchor="middle" class="h">实验操作</text><text x="300" y="104" text-anchor="middle" class="b">摆长、振幅、释放动作</text><text x="300" y="138" text-anchor="middle" class="b">光电门、遮光与触发</text></g>
  <path d="M1360 450C1360 565 1190 600 1060 600" class="arr"/>
  <g transform="translate(790 545)"><circle cx="90" cy="90" r="54" fill="#7c3aed"/><text x="90" y="101" text-anchor="middle" class="n">4</text><rect x="170" width="300" height="180" rx="24" class="box"/><text x="320" y="62" text-anchor="middle" class="h">模型条件</text><text x="320" y="104" text-anchor="middle" class="b">系统边界、近似是否成立</text><text x="320" y="138" text-anchor="middle" class="b">是否遗漏转动能或阻力</text></g>
  <path d="M790 635H680" class="arr"/>
  <g transform="translate(250 545)"><circle cx="90" cy="90" r="54" fill="#e11d48"/><text x="90" y="101" text-anchor="middle" class="n">5</text><rect x="170" width="300" height="180" rx="24" class="box"/><text x="320" y="62" text-anchor="middle" class="h">复测与裁决</text><text x="320" y="104" text-anchor="middle" class="b">重复测量并写明处理理由</text><text x="320" y="138" text-anchor="middle" class="b">保留、修正或解释偏离</text></g>
  <rect x="300" y="790" width="1000" height="70" rx="18" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="800" y="835" text-anchor="middle" class="h">“人为误差”不是结论；可复核的动作、记录和条件才是解释。</text>
</svg>
