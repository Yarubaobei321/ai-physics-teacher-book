<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:44px;font-weight:800}.head{font-size:24px;font-weight:800}.h{font-size:23px;font-weight:750}.b{font-size:18px;fill:#475569}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff}.green{fill:#ecfdf5}.amber{fill:#fffbeb}.warn{fill:#fff1f2}</style>
  <rect width="1600" height="1000" fill="#f8fafc"/><text x="80" y="80" class="title">三套方案验证同一规律，需要三种不同的证据翻译</text>
  <g transform="translate(70 135)">
    <rect width="1460" height="100" rx="18" fill="#dbeafe"/>
    <text x="155" y="61" text-anchor="middle" class="head">方案</text><text x="420" y="61" text-anchor="middle" class="head">研究系统</text><text x="760" y="61" text-anchor="middle" class="head">直接测量</text><text x="1080" y="61" text-anchor="middle" class="head">计算比较</text><text x="1350" y="61" text-anchor="middle" class="head">重点复核</text>
    <g transform="translate(0 110)"><rect width="1460" height="190" rx="18" class="cell blue"/><text x="155" y="56" text-anchor="middle" class="h">自由落体</text><text x="155" y="92" text-anchor="middle" class="b">纸带计时</text><text x="420" y="72" text-anchor="middle" class="h">物体—地球</text><text x="420" y="110" text-anchor="middle" class="b">空气阻力近似忽略</text><text x="760" y="58" text-anchor="middle" class="h">点间距离、时间</text><text x="760" y="96" text-anchor="middle" class="b">质量、位置高度</text><text x="1080" y="72" text-anchor="middle" class="h">ΔEₖ 与 |ΔEₚ|</text><text x="1080" y="110" text-anchor="middle" class="b">用邻点求瞬时速度</text><text x="1350" y="58" text-anchor="middle" class="h">起点选择</text><text x="1350" y="96" text-anchor="middle" class="b">纸带摩擦、点迹</text></g>
    <g transform="translate(0 315)"><rect width="1460" height="190" rx="18" class="cell green"/><text x="155" y="56" text-anchor="middle" class="h">曲面轨道</text><text x="155" y="92" text-anchor="middle" class="b">单光电门</text><text x="420" y="58" text-anchor="middle" class="h">物体—地球</text><text x="420" y="96" text-anchor="middle" class="b">滚动时含转动能</text><text x="760" y="58" text-anchor="middle" class="h">高度、遮光时间</text><text x="760" y="96" text-anchor="middle" class="b">有效遮光宽度</text><text x="1080" y="58" text-anchor="middle" class="h">速度与能量变化</text><text x="1080" y="96" text-anchor="middle" class="b">v≈d/Δt</text><text x="1350" y="58" text-anchor="middle" class="h">遮光几何</text><text x="1350" y="96" text-anchor="middle" class="b">滚动、摩擦、碰门</text></g>
    <g transform="translate(0 520)"><rect width="1460" height="190" rx="18" class="cell amber"/><text x="155" y="56" text-anchor="middle" class="h">气垫导轨</text><text x="155" y="92" text-anchor="middle" class="b">双光电门</text><text x="420" y="58" text-anchor="middle" class="h">滑块＋悬挂物</text><text x="420" y="96" text-anchor="middle" class="b">两者速度大小相同</text><text x="760" y="58" text-anchor="middle" class="h">触发时差、间距</text><text x="760" y="96" text-anchor="middle" class="b">两物体质量、下降高度</text><text x="1080" y="58" text-anchor="middle" class="h">½(M+m)Δv² 与 mgh</text><text x="1080" y="96" text-anchor="middle" class="b">按同一系统比较</text><text x="1350" y="58" text-anchor="middle" class="h">系统边界</text><text x="1350" y="96" text-anchor="middle" class="b">滑轮转动、漏气、摩擦</text></g>
    <rect y="735" width="1460" height="100" rx="18" class="warn"/><text x="730" y="778" text-anchor="middle" class="h">同一句“机械能近似守恒”，背后对应不同的系统、测量模型和误差结构</text><text x="730" y="814" text-anchor="middle" class="b">方案比较的重点是解释差异，不是挑出一套“误差最小”的装置就结束。</text>
  </g>
</svg>
