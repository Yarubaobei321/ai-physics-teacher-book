<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">“套公式”容易跨过四个关键断点</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">错误往往发生在方程之前和答案之后</text><g><rect x="60" y="340" width="240" height="220" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="180" y="388" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">情境</text><text x="180" y="424" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">读完题干</text></g><path d="M300 450 L350 450" fill="none" stroke="#dc4c64" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><g><rect x="360" y="340" width="240" height="220" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="480" y="388" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">对象/阶段</text><text x="480" y="424" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">谁在何时运动</text></g><path d="M600 450 L650 450" fill="none" stroke="#dc4c64" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><g><rect x="660" y="340" width="240" height="220" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="780" y="388" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">模型/条件</text><text x="780" y="424" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">为什么能用</text></g><path d="M900 450 L950 450" fill="none" stroke="#0f9f6e" stroke-width="4"  marker-end="url(#a)"/><g><rect x="960" y="340" width="240" height="220" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="1080" y="388" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">方程</text><text x="1080" y="424" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">代数运算</text></g><path d="M1200 450 L1250 450" fill="none" stroke="#dc4c64" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><g><rect x="1260" y="340" width="240" height="220" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1380" y="388" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">复核</text><text x="1380" y="424" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">边界与证据</text></g><text x="800" y="660" font-size="26" font-weight="700" fill="#dc4c64" text-anchor="middle">学生会算某个方程，不等于已经完成前后的建模与复核</text></svg>