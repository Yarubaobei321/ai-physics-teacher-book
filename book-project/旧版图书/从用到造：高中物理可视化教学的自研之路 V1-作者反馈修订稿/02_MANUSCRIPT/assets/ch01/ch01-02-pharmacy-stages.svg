<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.n{font-size:28px;font-weight:850;fill:#fff}.h{font-size:26px;font-weight:780}.b{font-size:19px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.tag{font-size:17px;font-weight:700;fill:#2563eb}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">先把长题干切成四段，再追踪阶段之间传递的状态量</text>
<g transform="translate(65 270)"><circle cx="150" cy="0" r="43" fill="#2563eb"/><text x="150" y="10" text-anchor="middle" class="n">1</text><rect y="65" width="300" height="200" rx="24" class="box"/><text x="150" y="125" text-anchor="middle" class="h">传送带加速</text><text x="150" y="168" text-anchor="middle" class="b">A、B依次轻放</text><text x="150" y="202" text-anchor="middle" class="b">相对滑动 → 达到共速</text><text x="150" y="238" text-anchor="middle" class="tag">出口状态：M点，速度 v₀</text></g><path d="M375 435H445" class="arr"/>
<g transform="translate(455 270)"><circle cx="150" cy="0" r="43" fill="#16a34a"/><text x="150" y="10" text-anchor="middle" class="n">2</text><rect y="65" width="300" height="200" rx="24" class="box"/><text x="150" y="125" text-anchor="middle" class="h">螺旋滑槽</text><text x="150" y="168" text-anchor="middle" class="b">A到N恰好停下</text><text x="150" y="202" text-anchor="middle" class="b">B到N速度 2v₀</text><text x="150" y="238" text-anchor="middle" class="tag">入口由上一段末状态给出</text></g><path d="M765 435H835" class="arr"/>
<g transform="translate(845 270)"><circle cx="150" cy="0" r="43" fill="#f59e0b"/><text x="150" y="10" text-anchor="middle" class="n">3</text><rect y="65" width="300" height="200" rx="24" class="box"/><text x="150" y="125" text-anchor="middle" class="h">极短碰撞</text><text x="150" y="168" text-anchor="middle" class="b">动量约束</text><text x="150" y="202" text-anchor="middle" class="b">能量损失约束</text><text x="150" y="238" text-anchor="middle" class="tag">出口状态：v₁、v₂</text></g><path d="M1155 435H1225" class="arr"/>
<g transform="translate(1235 270)"><circle cx="150" cy="0" r="43" fill="#7c3aed"/><text x="150" y="10" text-anchor="middle" class="n">4</text><rect y="65" width="300" height="200" rx="24" class="box"/><text x="150" y="125" text-anchor="middle" class="h">离台平抛</text><text x="150" y="168" text-anchor="middle" class="b">同一高度、同一飞行时间</text><text x="150" y="202" text-anchor="middle" class="b">落在圆盘直径两端</text><text x="150" y="238" text-anchor="middle" class="tag">用几何条件检验碰后解</text></g>
<rect x="220" y="660" width="1160" height="120" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><text x="800" y="708" text-anchor="middle" class="h">阶段接口不是一句“接着运动”</text><text x="800" y="748" text-anchor="middle" class="b">每段的末位置、末速度和时刻，必须成为下一段可核查的初始状态。</text></svg>
