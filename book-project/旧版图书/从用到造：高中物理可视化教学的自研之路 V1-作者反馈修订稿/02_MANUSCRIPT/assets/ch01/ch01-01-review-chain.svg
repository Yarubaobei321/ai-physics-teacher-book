<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="context-stroke"/></marker><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style></defs><rect width="1600" height="900" fill="#f7f9fc"/><path d="M0 130H1600" stroke="#e8edf4" stroke-width="2"/><text x="80" y="72" font-size="43" font-weight="700" fill="#172033" text-anchor="start">高三复习已经留下大量“题目—错误—修正”记录</text><text x="80" y="112" font-size="21" font-weight="400" fill="#526174" text-anchor="start">下一步要继续保留学生怎样建模和复核</text><g><rect x="70" y="300" width="220" height="230" rx="24" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="180" y="348" font-size="28" font-weight="700" fill="#2563eb" text-anchor="middle">收集错题</text><text x="180" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">题目与错误答案</text></g><path d="M290 415 L365 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="385" y="300" width="220" height="230" rx="24" fill="#eafaf4" stroke="#0f9f6e" stroke-width="3"/><text x="495" y="348" font-size="28" font-weight="700" fill="#0f9f6e" text-anchor="middle">分类整理</text><text x="495" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">章节、类型、原因</text></g><path d="M605 415 L680 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="700" y="300" width="220" height="230" rx="24" fill="#fff6e5" stroke="#d97706" stroke-width="3"/><text x="810" y="348" font-size="28" font-weight="700" fill="#d97706" text-anchor="middle">考后反思</text><text x="810" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">时间、粗心、模型</text></g><path d="M920 415 L995 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="1015" y="300" width="220" height="230" rx="24" fill="#f4edff" stroke="#7c3aed" stroke-width="3"/><text x="1125" y="348" font-size="28" font-weight="700" fill="#7c3aed" text-anchor="middle">定期重做</text><text x="1125" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">再次暴露错误</text></g><path d="M1235 415 L1310 415" fill="none" stroke="#526174" stroke-width="4"  marker-end="url(#a)"/><g><rect x="1330" y="300" width="220" height="230" rx="24" fill="#fff0f2" stroke="#dc4c64" stroke-width="3"/><text x="1440" y="348" font-size="28" font-weight="700" fill="#dc4c64" text-anchor="middle">面批面改</text><text x="1440" y="384" font-size="19" font-weight="400" fill="#526174" text-anchor="middle">解释与修正</text></g><text x="800" y="660" font-size="25" font-weight="700" fill="#dc4c64" text-anchor="middle">真实工作记录能够证明持续投入；学生如何建模仍需过程作品来观察</text></svg>