<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1050"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1700" height="1050" fill="#f8fafc"/><text x="75" y="75" font-size="44" font-weight="800" fill="#172033">一项可视化任务的六问设计画布</text><text x="75" y="118" font-size="22" fill="#526174">先回答教学问题，再选择媒介与技术</text><g><rect x="75" y="210" width="480" height="235" rx="25" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="315" y="270" text-anchor="middle" font-size="29" font-weight="800" fill="#2563eb">1　学生卡在哪里？</text><text x="315" y="325" text-anchor="middle" font-size="21" fill="#334155">对象、过程、关系、证据还是方法</text><text x="315" y="380" text-anchor="middle" font-size="20" fill="#64748b">用真实错误和任务表现定位</text><rect x="610" y="210" width="480" height="235" rx="25" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="850" y="270" text-anchor="middle" font-size="29" font-weight="800" fill="#0f9f6e">2　需要看见什么？</text><text x="850" y="325" text-anchor="middle" font-size="21" fill="#334155">结构、状态、变量、条件或异常</text><text x="850" y="380" text-anchor="middle" font-size="20" fill="#64748b">确定真正的可视化对象</text><rect x="1145" y="210" width="480" height="235" rx="25" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="1385" y="270" text-anchor="middle" font-size="29" font-weight="800" fill="#d97706">3　用什么表征？</text><text x="1385" y="325" text-anchor="middle" font-size="21" fill="#334155">实物、图、图像、数据、符号或仿真</text><text x="1385" y="380" text-anchor="middle" font-size="20" fill="#64748b">选择最低足够媒介</text><rect x="75" y="560" width="480" height="235" rx="25" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="315" y="620" text-anchor="middle" font-size="29" font-weight="800" fill="#7c3aed">4　学生必须做什么？</text><text x="315" y="675" text-anchor="middle" font-size="21" fill="#334155">预测、标注、操作、比较、解释</text><text x="315" y="730" text-anchor="middle" font-size="20" fill="#64748b">写出可以观察的动作</text><rect x="610" y="560" width="480" height="235" rx="25" fill="#fff0f2" stroke="#dc4c64" stroke-width="4"/><text x="850" y="620" text-anchor="middle" font-size="29" font-weight="800" fill="#dc4c64">5　留下什么产物？</text><text x="850" y="675" text-anchor="middle" font-size="21" fill="#334155">模型图、数据、解释、代码、修订</text><text x="850" y="730" text-anchor="middle" font-size="20" fill="#64748b">没有产物就难以反馈</text><rect x="1145" y="560" width="480" height="235" rx="25" fill="#e6f7fb" stroke="#0891b2" stroke-width="4"/><text x="1385" y="620" text-anchor="middle" font-size="29" font-weight="800" fill="#0891b2">6　怎样独立验证？</text><text x="1385" y="675" text-anchor="middle" font-size="21" fill="#334155">特殊点、另一数据链、迁移任务</text><text x="1385" y="730" text-anchor="middle" font-size="20" fill="#64748b">说明结论的上限</text></g><path d="M555 330H600" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1090 330H1135" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1385 450V540" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1140 680H1100" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M605 680H565" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="250" y="890" width="1200" height="85" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="850" y="942" text-anchor="middle" font-size="24" font-weight="800" fill="#334155">技术名称不进入第一问；它在第三问才出现</text></svg>
