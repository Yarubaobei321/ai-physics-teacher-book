<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="80" font-size="44" font-weight="800" fill="#172033">一张数据图还需要四层证据说明</text><text x="80" y="122" font-size="22" fill="#526174">以单摆9组记录中的需复核点为例</text><g><rect x="70" y="290" width="280" height="260" rx="26" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="210" y="350" text-anchor="middle" font-size="29" font-weight="800" fill="#2563eb">数据来源</text><text x="210" y="405" text-anchor="middle" font-size="21" fill="#334155">谁测、怎样测</text><text x="210" y="442" text-anchor="middle" font-size="21" fill="#334155">单位、精度、分组</text><text x="210" y="505" text-anchor="middle" font-size="20" fill="#64748b">保留原始记录</text><rect x="460" y="290" width="280" height="260" rx="26" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="600" y="350" text-anchor="middle" font-size="29" font-weight="800" fill="#0f9f6e">处理方法</text><text x="600" y="405" text-anchor="middle" font-size="21" fill="#334155">变量转换</text><text x="600" y="442" text-anchor="middle" font-size="21" fill="#334155">拟合与坐标尺度</text><text x="600" y="505" text-anchor="middle" font-size="20" fill="#64748b">方法可复算</text><rect x="850" y="290" width="280" height="260" rx="26" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="990" y="350" text-anchor="middle" font-size="29" font-weight="800" fill="#d97706">异常诊断</text><text x="990" y="405" text-anchor="middle" font-size="21" fill="#334155">记录、操作</text><text x="990" y="442" text-anchor="middle" font-size="21" fill="#334155">模型还是仪器</text><text x="990" y="505" text-anchor="middle" font-size="20" fill="#64748b">先解释，再取舍</text><rect x="1240" y="290" width="280" height="260" rx="26" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="1380" y="350" text-anchor="middle" font-size="29" font-weight="800" fill="#7c3aed">主张边界</text><text x="1380" y="405" text-anchor="middle" font-size="21" fill="#334155">图支持什么</text><text x="1380" y="442" text-anchor="middle" font-size="21" fill="#334155">还不能说明什么</text><text x="1380" y="505" text-anchor="middle" font-size="20" fill="#64748b">结论不越级</text></g><path d="M355 420H450" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M745 420H840" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1135 420H1230" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="250" y="665" width="1100" height="95" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="800" y="705" text-anchor="middle" font-size="25" font-weight="800" fill="#be123c">偏离拟合线 ≠ 错误数据 ≠ 应当删除</text><text x="800" y="742" text-anchor="middle" font-size="21" fill="#475569">可视化让异常显眼；科学论证决定怎样解释它</text></svg>
