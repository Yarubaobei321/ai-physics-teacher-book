<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="80" font-size="44" font-weight="800" fill="#172033">可视化的三层含义</text><text x="80" y="122" font-size="22" fill="#526174">从信息可达，到学生行动，再到可检查的思维证据</text><g><rect x="105" y="270" width="390" height="330" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="300" y="335" text-anchor="middle" font-size="31" font-weight="800" fill="#2563eb">看得见</text><text x="300" y="390" text-anchor="middle" font-size="23" fill="#334155">现象、结构、过程、关系</text><text x="300" y="432" text-anchor="middle" font-size="20" fill="#64748b">解决“信息能否到达”</text><text x="300" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">媒介提供入口</text></g><path d="M500 435H600" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><g><rect x="610" y="270" width="390" height="330" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="805" y="335" text-anchor="middle" font-size="31" font-weight="800" fill="#0f9f6e">做得出</text><text x="805" y="390" text-anchor="middle" font-size="23" fill="#334155">预测、标注、调参、测量</text><text x="805" y="432" text-anchor="middle" font-size="20" fill="#64748b">解决“学生怎样加工”</text><text x="805" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">任务触发思考</text></g><path d="M1005 435H1105" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><g><rect x="1115" y="270" width="390" height="330" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="1310" y="335" text-anchor="middle" font-size="31" font-weight="800" fill="#d97706">说得清</text><text x="1310" y="390" text-anchor="middle" font-size="23" fill="#334155">模型、条件、证据、修正</text><text x="1310" y="432" text-anchor="middle" font-size="20" fill="#64748b">解决“思路怎样被检查”</text><text x="1310" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">产物支持反馈</text></g><rect x="190" y="690" width="1220" height="90" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="800" y="744" text-anchor="middle" font-size="26" font-weight="800" fill="#be123c">画面清楚，只完成第一层；科学思维还要进入行动与证据</text></svg>
