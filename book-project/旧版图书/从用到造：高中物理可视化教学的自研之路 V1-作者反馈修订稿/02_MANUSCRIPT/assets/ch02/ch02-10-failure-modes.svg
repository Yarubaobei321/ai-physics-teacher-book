<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950"><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style><rect width="1600" height="950" fill="#f8fafc"/><text x="70" y="75" font-size="44" font-weight="800" fill="#172033">六种会阻断思维的可视化</text><text x="70" y="118" font-size="22" fill="#526174">每种失效模式都对应一个可检查的修复动作</text><g><rect x="100" y="210" width="420" height="245" rx="25" fill="#fff0f2" stroke="#dc4c64" stroke-width="4"/><text x="310" y="265" text-anchor="middle" font-size="28" font-weight="800" fill="#dc4c64">物理模型画错</text><text x="310" y="315" text-anchor="middle" font-size="21" fill="#334155">轨迹、比例或方向违背规律</text><text x="310" y="380" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">修复：特殊点与独立计算</text><rect x="590" y="210" width="420" height="245" rx="25" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="800" y="265" text-anchor="middle" font-size="28" font-weight="800" fill="#d97706">页面替学生作答</text><text x="800" y="315" text-anchor="middle" font-size="21" fill="#334155">打开即显示关系、结论与解释</text><text x="800" y="380" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">修复：预测、选择与解释</text><rect x="1080" y="210" width="420" height="245" rx="25" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="1290" y="265" text-anchor="middle" font-size="28" font-weight="800" fill="#7c3aed">信息同时过载</text><text x="1290" y="315" text-anchor="middle" font-size="21" fill="#334155">多图、多色、多动画争夺注意</text><text x="1290" y="380" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">修复：分步揭示与暂停点</text><rect x="100" y="550" width="420" height="245" rx="25" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="310" y="605" text-anchor="middle" font-size="28" font-weight="800" fill="#2563eb">数据失去来源</text><text x="310" y="655" text-anchor="middle" font-size="21" fill="#334155">只保留漂亮曲线，隐藏测量链</text><text x="310" y="720" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">修复：原始记录与误差</text><rect x="590" y="550" width="420" height="245" rx="25" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="800" y="605" text-anchor="middle" font-size="28" font-weight="800" fill="#0f9f6e">图像只作装饰</text><text x="800" y="655" text-anchor="middle" font-size="21" fill="#334155">正文和任务都不需要使用它</text><text x="800" y="720" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">修复：明确读图动作</text><rect x="1080" y="550" width="420" height="245" rx="25" fill="#e6f7fb" stroke="#0891b2" stroke-width="4"/><text x="1290" y="605" text-anchor="middle" font-size="28" font-weight="800" fill="#0891b2">操作没有反馈</text><text x="1290" y="655" text-anchor="middle" font-size="21" fill="#334155">学生点击后不知道对错与原因</text><text x="1290" y="720" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">修复：可解释的结果与复核</text></g><text x="800" y="880" text-anchor="middle" font-size="24" font-weight="800" fill="#334155">最常见的问题不是“不够好看”，而是学生无事可做、证据无处可查</text></svg>
