<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1500" height="1000" fill="#f8fafc"/><text x="75" y="78" font-size="44" font-weight="800" fill="#172033">物理学习发生在表征之间的往返</text><text x="75" y="120" font-size="22" fill="#526174">转换时必须说明保留了什么、忽略了什么、用什么检验</text><g><rect x="575" y="190" width="350" height="160" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="750" y="250" text-anchor="middle" font-size="30" font-weight="800" fill="#2563eb">真实对象与现象</text><text x="750" y="298" text-anchor="middle" font-size="22" fill="#334155">装置、动作、测量</text><rect x="1030" y="430" width="350" height="160" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="1205" y="490" text-anchor="middle" font-size="30" font-weight="800" fill="#0f9f6e">物理模型</text><text x="1205" y="538" text-anchor="middle" font-size="22" fill="#334155">系统、条件、状态</text><rect x="575" y="690" width="350" height="160" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="750" y="750" text-anchor="middle" font-size="30" font-weight="800" fill="#d97706">数学与图像关系</text><text x="750" y="798" text-anchor="middle" font-size="22" fill="#334155">方程、函数、几何</text><rect x="120" y="430" width="350" height="160" rx="28" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="295" y="490" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">数据与证据</text><text x="295" y="538" text-anchor="middle" font-size="22" fill="#334155">记录、误差、异常</text></g><path d="M925 270C1080 285 1185 345 1200 420" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="1092" y="290" font-size="20" fill="#475569">抽象与删减</text><path d="M1205 595C1165 685 1030 748 935 765" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="1080" y="705" font-size="20" fill="#475569">表达与推导</text><path d="M565 765C450 745 330 675 300 600" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="370" y="705" font-size="20" fill="#475569">预测与计算</text><path d="M295 420C330 335 450 285 565 270" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><text x="360" y="315" font-size="20" fill="#475569">观察与测量</text><path d="M470 510H1020" stroke="#dc4c64" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#a)"/><text x="745" y="485" text-anchor="middle" font-size="21" font-weight="700" fill="#be123c">证据检验模型</text><rect x="525" y="438" width="450" height="140" rx="70" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="750" y="495" text-anchor="middle" font-size="28" font-weight="800" fill="#172033">学生解释转换理由</text><text x="750" y="540" text-anchor="middle" font-size="21" fill="#64748b">每一次换表征，都可能暴露理解断点</text></svg>
