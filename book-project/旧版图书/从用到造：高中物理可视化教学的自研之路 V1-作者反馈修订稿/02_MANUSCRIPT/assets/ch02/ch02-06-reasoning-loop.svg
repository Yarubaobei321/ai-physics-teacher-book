<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1500" height="950" fill="#f8fafc"/><text x="75" y="78" font-size="44" font-weight="800" fill="#172033">动态表征进入推理的五个动作</text><text x="75" y="120" font-size="22" fill="#526174">先预测，再运行；暂停比较，随后解释与迁移</text><g><rect x="105" y="330" width="230" height="190" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="220" y="395" text-anchor="middle" font-size="29" font-weight="800" fill="#2563eb">预测</text><text x="220" y="445" text-anchor="middle" font-size="21" fill="#334155">先写趋势与理由</text><rect x="370" y="240" width="230" height="190" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="485" y="305" text-anchor="middle" font-size="29" font-weight="800" fill="#0f9f6e">操作</text><text x="485" y="355" text-anchor="middle" font-size="21" fill="#334155">改变一个条件</text><rect x="635" y="190" width="230" height="190" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="750" y="255" text-anchor="middle" font-size="29" font-weight="800" fill="#d97706">暂停</text><text x="750" y="305" text-anchor="middle" font-size="21" fill="#334155">选取关键状态</text><rect x="900" y="240" width="230" height="190" rx="28" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="1015" y="305" text-anchor="middle" font-size="29" font-weight="800" fill="#7c3aed">比较</text><text x="1015" y="355" text-anchor="middle" font-size="21" fill="#334155">预期与结果对照</text><rect x="1165" y="330" width="230" height="190" rx="28" fill="#fff0f2" stroke="#dc4c64" stroke-width="4"/><text x="1280" y="395" text-anchor="middle" font-size="29" font-weight="800" fill="#dc4c64">解释</text><text x="1280" y="445" text-anchor="middle" font-size="21" fill="#334155">用模型说明差异</text></g><path d="M335 410L382 360" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M600 315L635 300" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M865 300L900 315" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1130 360L1175 410" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M1280 535C1280 745 220 745 220 535" fill="none" stroke="#dc4c64" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#a)"/><text x="750" y="720" text-anchor="middle" font-size="26" font-weight="800" fill="#be123c">改变情境或装置，重新预测：迁移检验原有解释</text><rect x="300" y="790" width="900" height="80" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="750" y="840" text-anchor="middle" font-size="23" fill="#334155">若页面自动给出结论，学生只完成了“运行”</text></svg>
