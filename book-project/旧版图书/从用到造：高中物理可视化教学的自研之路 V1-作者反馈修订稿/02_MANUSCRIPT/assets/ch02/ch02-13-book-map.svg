<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#64748b"/></marker><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style></defs><rect width="1700" height="1000" fill="#f8fafc"/><text x="75" y="75" font-size="44" font-weight="800" fill="#172033">科学思维四要素贯穿全书案例</text><text x="75" y="118" font-size="22" fill="#526174">不同章节改变主焦点，四种行动仍彼此连接</text><g><rect x="70" y="215" width="360" height="570" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="250" y="280" text-anchor="middle" font-size="30" font-weight="800" fill="#2563eb">模型建构</text><text x="250" y="340" text-anchor="middle" font-size="22" fill="#334155">静电场与活版电路</text><text x="250" y="385" text-anchor="middle" font-size="22" fill="#334155">莱顿瓶与电容器</text><text x="250" y="430" text-anchor="middle" font-size="22" fill="#334155">复杂情境过程图</text><path d="M130 485H370" stroke="#93c5fd" stroke-width="3"/><text x="250" y="545" text-anchor="middle" font-size="21" fill="#475569">选择对象与系统</text><text x="250" y="585" text-anchor="middle" font-size="21" fill="#475569">保留和忽略特征</text><text x="250" y="625" text-anchor="middle" font-size="21" fill="#475569">说明模型条件</text><rect x="470" y="215" width="360" height="570" rx="28" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="650" y="280" text-anchor="middle" font-size="30" font-weight="800" fill="#0f9f6e">科学推理</text><text x="650" y="340" text-anchor="middle" font-size="22" fill="#334155">仿真中的参数变化</text><text x="650" y="385" text-anchor="middle" font-size="22" fill="#334155">机械能三方案比较</text><text x="650" y="430" text-anchor="middle" font-size="22" fill="#334155">药品传送阶段衔接</text><path d="M530 485H770" stroke="#86efac" stroke-width="3"/><text x="650" y="545" text-anchor="middle" font-size="21" fill="#475569">预测趋势</text><text x="650" y="585" text-anchor="middle" font-size="21" fill="#475569">连接条件与结论</text><text x="650" y="625" text-anchor="middle" font-size="21" fill="#475569">迁移到新情境</text><rect x="870" y="215" width="360" height="570" rx="28" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="1050" y="280" text-anchor="middle" font-size="30" font-weight="800" fill="#d97706">科学论证</text><text x="1050" y="340" text-anchor="middle" font-size="22" fill="#334155">单摆原始数据</text><text x="1050" y="385" text-anchor="middle" font-size="22" fill="#334155">传感器测量链</text><text x="1050" y="430" text-anchor="middle" font-size="22" fill="#334155">学生作品双轨评价</text><path d="M930 485H1170" stroke="#fcd34d" stroke-width="3"/><text x="1050" y="545" text-anchor="middle" font-size="21" fill="#475569">区分观点与证据</text><text x="1050" y="585" text-anchor="middle" font-size="21" fill="#475569">处理误差与异常</text><text x="1050" y="625" text-anchor="middle" font-size="21" fill="#475569">限定结论强度</text><rect x="1270" y="215" width="360" height="570" rx="28" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="1450" y="280" text-anchor="middle" font-size="30" font-weight="800" fill="#7c3aed">质疑创新</text><text x="1450" y="340" text-anchor="middle" font-size="22" fill="#334155">ESP32Blockly项目</text><text x="1450" y="385" text-anchor="middle" font-size="22" fill="#334155">教学网页与AI评价</text><text x="1450" y="430" text-anchor="middle" font-size="22" fill="#334155">版本、验真与维护</text><path d="M1330 485H1570" stroke="#c4b5fd" stroke-width="3"/><text x="1450" y="545" text-anchor="middle" font-size="21" fill="#475569">发现冲突</text><text x="1450" y="585" text-anchor="middle" font-size="21" fill="#475569">修改方案</text><text x="1450" y="625" text-anchor="middle" font-size="21" fill="#475569">独立复核并共享</text></g><path d="M430 725H460M830 725H860M1230 725H1260" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><rect x="285" y="865" width="1130" height="75" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="850" y="912" text-anchor="middle" font-size="24" font-weight="800" fill="#334155">教具、仿真、数据和平台只是入口；思维由学生完成的任务连接起来</text></svg>
