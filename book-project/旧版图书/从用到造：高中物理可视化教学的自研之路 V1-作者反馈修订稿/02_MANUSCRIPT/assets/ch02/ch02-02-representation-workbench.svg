<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950"><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}</style><rect width="1600" height="950" fill="#f8fafc"/><text x="80" y="80" font-size="44" font-weight="800" fill="#172033">同一个物理过程，可以放在六种工作台上</text><text x="80" y="122" font-size="22" fill="#526174">每种表征都应回答一个具体问题</text><g transform="translate(0,10)"><rect x="110" y="220" width="400" height="220" rx="26" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><text x="310" y="275" text-anchor="middle" font-size="29" font-weight="800" fill="#2563eb">实物与现象</text><text x="310" y="325" text-anchor="middle" font-size="22" fill="#334155">对象怎样组成？发生了什么？</text><text x="310" y="382" text-anchor="middle" font-size="20" fill="#64748b">观察、触摸、测量</text><rect x="600" y="220" width="400" height="220" rx="26" fill="#eafaf4" stroke="#0f9f6e" stroke-width="4"/><text x="800" y="275" text-anchor="middle" font-size="29" font-weight="800" fill="#0f9f6e">结构图与过程图</text><text x="800" y="325" text-anchor="middle" font-size="22" fill="#334155">哪些部分相关？在哪里分段？</text><text x="800" y="382" text-anchor="middle" font-size="20" fill="#64748b">标注、分层、排序</text><rect x="1090" y="220" width="400" height="220" rx="26" fill="#fff6e5" stroke="#d97706" stroke-width="4"/><text x="1290" y="275" text-anchor="middle" font-size="29" font-weight="800" fill="#d97706">图像与几何</text><text x="1290" y="325" text-anchor="middle" font-size="22" fill="#334155">量怎样变化？边界在哪里？</text><text x="1290" y="382" text-anchor="middle" font-size="20" fill="#64748b">读点、读斜率、找临界</text><rect x="110" y="535" width="400" height="220" rx="26" fill="#f4edff" stroke="#7c3aed" stroke-width="4"/><text x="310" y="590" text-anchor="middle" font-size="29" font-weight="800" fill="#7c3aed">数据与表格</text><text x="310" y="640" text-anchor="middle" font-size="22" fill="#334155">证据怎样支持或冲突？</text><text x="310" y="697" text-anchor="middle" font-size="20" fill="#64748b">比较、拟合、诊断异常</text><rect x="600" y="535" width="400" height="220" rx="26" fill="#fff0f2" stroke="#dc4c64" stroke-width="4"/><text x="800" y="590" text-anchor="middle" font-size="29" font-weight="800" fill="#dc4c64">符号与方程</text><text x="800" y="640" text-anchor="middle" font-size="22" fill="#334155">关系怎样精确表达？</text><text x="800" y="697" text-anchor="middle" font-size="20" fill="#64748b">定义、推导、量纲检查</text><rect x="1090" y="535" width="400" height="220" rx="26" fill="#e6f7fb" stroke="#0891b2" stroke-width="4"/><text x="1290" y="590" text-anchor="middle" font-size="29" font-weight="800" fill="#0891b2">动画与仿真</text><text x="1290" y="640" text-anchor="middle" font-size="22" fill="#334155">条件改变后会发生什么？</text><text x="1290" y="697" text-anchor="middle" font-size="20" fill="#64748b">预测、调参、暂停、复核</text></g><text x="800" y="865" text-anchor="middle" font-size="25" font-weight="800" fill="#334155">选择标准：它增加了哪一种学生行动，而不是它用了哪一种软件</text></svg>
