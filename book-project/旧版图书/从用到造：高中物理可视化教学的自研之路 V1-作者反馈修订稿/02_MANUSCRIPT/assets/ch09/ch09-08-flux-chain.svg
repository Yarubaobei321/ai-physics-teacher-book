<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.h{font-size:25px;font-weight:780}.b{font-size:19px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">不要从“磁铁在上还是在下”直接跳到电流方向</text>
<g transform="translate(65 310)"><rect width="245" height="180" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/><text x="122" y="62" text-anchor="middle" class="h">相对位置 x</text><text x="122" y="105" text-anchor="middle" class="b">分界线在线圈中的位置</text><text x="122" y="140" text-anchor="middle" class="b">运动方向与速度</text></g><path d="M320 400H400" class="arr"/>
<g transform="translate(410 310)"><rect width="245" height="180" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="4"/><text x="122" y="62" text-anchor="middle" class="h">有符号面积</text><text x="122" y="105" text-anchor="middle" class="b">S₊与S₋怎样变化</text><text x="122" y="140" text-anchor="middle" class="b">先统一正方向</text></g><path d="M665 400H745" class="arr"/>
<g transform="translate(755 310)"><rect width="245" height="180" rx="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/><text x="122" y="62" text-anchor="middle" class="h">总磁通量 Φ</text><text x="122" y="105" text-anchor="middle" class="b">B(S₊−S₋)</text><text x="122" y="140" text-anchor="middle" class="b">位置决定瞬时值</text></g><path d="M1010 400H1090" class="arr"/>
<g transform="translate(1100 310)"><rect width="245" height="180" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="4"/><text x="122" y="62" text-anchor="middle" class="h">变化率 dΦ/dt</text><text x="122" y="105" text-anchor="middle" class="b">速度决定变化快慢</text><text x="122" y="140" text-anchor="middle" class="b">|E|=n|dΦ/dt|</text></g><path d="M1355 400H1430" class="arr"/>
<g transform="translate(1280 585)"><rect width="250" height="150" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="4"/><text x="125" y="58" text-anchor="middle" class="h">方向</text><text x="125" y="100" text-anchor="middle" class="b">用楞次定律判断</text></g><path d="M1405 500V575" class="arr"/>
<rect x="180" y="650" width="890" height="110" rx="22" class="box"/><text x="625" y="694" text-anchor="middle" class="h">“位置更高”没有自动决定电动势更大</text><text x="625" y="736" text-anchor="middle" class="b">同一位置可以有不同速度；同一磁通量也可以对应不同变化率。</text></svg>
