<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.h{font-size:25px;font-weight:780}.b{font-size:19px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}.bad{stroke:#e11d48;stroke-width:4;fill:none;marker-end:url(#a)}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">综合题的错误常发生在接口，不只发生在公式内部</text>
