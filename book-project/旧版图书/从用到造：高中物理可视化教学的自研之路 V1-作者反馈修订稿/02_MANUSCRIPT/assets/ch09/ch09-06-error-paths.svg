<g transform="translate(470 525)"><rect width="260" height="170" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="130" y="54" text-anchor="middle" class="h">阶段越界</text><text x="130" y="95" text-anchor="middle" class="b">把匀加速公式</text><text x="130" y="128" text-anchor="middle" class="b">沿用到共速以后</text></g>
<g transform="translate(850 525)"><rect width="260" height="170" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="130" y="54" text-anchor="middle" class="h">状态断裂</text><text x="130" y="95" text-anchor="middle" class="b">下一段初速度</text><text x="130" y="128" text-anchor="middle" class="b">没有回到上一段末态</text></g>
<g transform="translate(1230 525)"><rect width="260" height="170" rx="22" fill="#fff1f2" stroke="#fb7185" stroke-width="3"/><text x="130" y="54" text-anchor="middle" class="h">模型错配</text><text x="130" y="95" text-anchor="middle" class="b">碰撞中使用机械能守恒</text><text x="130" y="128" text-anchor="middle" class="b">或滑槽中强求恒力</text></g>
