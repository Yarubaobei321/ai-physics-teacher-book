<g transform="translate(850 220)"><rect width="260" height="145" rx="22" class="box"/><text x="130" y="55" text-anchor="middle" class="h">状态</text><text x="130" y="98" text-anchor="middle" class="b">位置、速度、时刻</text></g><path d="M1120 292H1220" class="arr"/>
<g transform="translate(1230 220)"><rect width="260" height="145" rx="22" class="box"/><text x="130" y="55" text-anchor="middle" class="h">模型</text><text x="130" y="98" text-anchor="middle" class="b">运动、能量、动量、平抛</text></g>
