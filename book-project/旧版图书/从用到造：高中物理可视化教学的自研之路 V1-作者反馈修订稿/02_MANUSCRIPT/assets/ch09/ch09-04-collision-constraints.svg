<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.h{font-size:28px;font-weight:800}.b{font-size:20px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">碰撞阶段：两个方程给出候选解，运动情境负责最后筛选</text>
<rect x="80" y="180" width="400" height="190" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="4"/><text x="280" y="245" text-anchor="middle" class="h">碰前状态</text><text x="280" y="292" text-anchor="middle" class="b">A：质量m，速度0</text><text x="280" y="332" text-anchor="middle" class="b">B：质量2m，速度2v₀</text><path d="M490 275H570" class="arr"/>
<rect x="580" y="150" width="440" height="250" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="4"/><text x="800" y="215" text-anchor="middle" class="h">双重约束</text><text x="800" y="265" text-anchor="middle" class="b">2m·2v₀ = mv₁ + 2mv₂</text><text x="800" y="312" text-anchor="middle" class="b">碰后动能 = 碰前动能的 3/4</text><text x="800" y="355" text-anchor="middle" class="b">未知量v₁、v₂；形成两组代数候选</text><path d="M1030 275H1110" class="arr"/>
<rect x="1120" y="180" width="400" height="190" rx="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="4"/><text x="1320" y="245" text-anchor="middle" class="h">两组候选</text><text x="1320" y="292" text-anchor="middle" class="b">① v₁=2v₀，v₂=v₀</text><text x="1320" y="332" text-anchor="middle" class="b">② v₁=2v₀/3，v₂=5v₀/3</text>
<path d="M1320 385V500" class="arr"/><rect x="880" y="510" width="640" height="180" rx="24" fill="#fff1f2" stroke="#fb7185" stroke-width="4"/><text x="1200" y="570" text-anchor="middle" class="h">分离条件：前方A碰后不能慢于后方B</text><text x="1200" y="615" text-anchor="middle" class="b">候选②会使B继续追上A，与“碰撞结束后各自平抛”不符</text><text x="1200" y="655" text-anchor="middle" class="h">保留候选①</text>
<rect x="80" y="510" width="680" height="180" rx="24" class="box"/><text x="420" y="570" text-anchor="middle" class="h">“另一组舍去”不是完整理由</text><text x="420" y="615" text-anchor="middle" class="b">代数解必须重新放回对象位置、运动方向和接触关系中检验</text><text x="420" y="655" text-anchor="middle" class="b">情境约束是方程之外的物理信息</text></svg>
