<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:44px;font-weight:800}.head{font-size:24px;font-weight:800}.h{font-size:22px;font-weight:760}.b{font-size:18px;fill:#475569}.cell{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style><rect width="1600" height="1000" fill="#f8fafc"/><text x="70" y="80" class="title">先判断学生卡在哪里，再选择可视化媒介</text><g transform="translate(70 135)"><rect width="1460" height="90" rx="16" fill="#dbeafe"/><text x="165" y="56" text-anchor="middle" class="head">媒介</text><text x="490" y="56" text-anchor="middle" class="head">主要解决</text><text x="880" y="56" text-anchor="middle" class="head">学生必须完成的动作</text><text x="1280" y="56" text-anchor="middle" class="head">使用风险</text>
<g transform="translate(0 105)"><rect width="1460" height="135" rx="16" class="cell"/><text x="165" y="55" text-anchor="middle" class="h">过程分镜</text><text x="490" y="55" text-anchor="middle" class="h">阶段顺序和事件边界</text><text x="880" y="55" text-anchor="middle" class="h">命名始末状态与接口</text><text x="1280" y="55" text-anchor="middle" class="h">只看动画，不写状态</text></g>
<g transform="translate(0 255)"><rect width="1460" height="135" rx="16" class="cell"/><text x="165" y="55" text-anchor="middle" class="h">受力图</text><text x="490" y="55" text-anchor="middle" class="h">对象与相互作用</text><text x="880" y="55" text-anchor="middle" class="h">确定研究对象和方向</text><text x="1280" y="55" text-anchor="middle" class="h">把所有阶段画成同一张图</text></g>
<g transform="translate(0 405)"><rect width="1460" height="135" rx="16" class="cell"/><text x="165" y="55" text-anchor="middle" class="h">能量流图</text><text x="490" y="55" text-anchor="middle" class="h">初末能量与耗散</text><text x="880" y="55" text-anchor="middle" class="h">选择系统并标注能量去向</text><text x="1280" y="55" text-anchor="middle" class="h">用箭头代替数量关系</text></g>
<g transform="translate(0 555)"><rect width="1460" height="135" rx="16" class="cell"/><text x="165" y="55" text-anchor="middle" class="h">函数图</text><text x="490" y="55" text-anchor="middle" class="h">变量随位置或时间的变化</text><text x="880" y="55" text-anchor="middle" class="h">解释斜率、面积和分段点</text><text x="1280" y="55" text-anchor="middle" class="h">只看曲线形状，不连物理量</text></g>
<g transform="translate(0 705)"><rect width="1460" height="135" rx="16" class="cell"/><text x="165" y="55" text-anchor="middle" class="h">推理流程图</text><text x="490" y="55" text-anchor="middle" class="h">条件、模型与结论的依赖</text><text x="880" y="55" text-anchor="middle" class="h">为每条箭头写出理由</text><text x="1280" y="55" text-anchor="middle" class="h">记流程标签，遇新题仍不会切分</text></g></g></svg>
