<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs><style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:45px;font-weight:800}.n{font-size:28px;font-weight:850;fill:#fff}.h{font-size:25px;font-weight:780}.b{font-size:19px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style><rect width="1600" height="900" fill="#f8fafc"/><text x="70" y="85" class="title">习题课五步：把答案之前的思维动作变成可检查产出</text>
<g transform="translate(55 295)"><circle cx="115" cy="0" r="43" fill="#2563eb"/><text x="115" y="10" text-anchor="middle" class="n">1</text><rect y="65" width="230" height="190" rx="24" class="box"/><text x="115" y="124" text-anchor="middle" class="h">读情境</text><text x="115" y="166" text-anchor="middle" class="b">圈对象、动作、条件</text><text x="115" y="201" text-anchor="middle" class="b">改写为物理语言</text></g><path d="M295 455H355" class="arr"/>
<g transform="translate(365 295)"><circle cx="115" cy="0" r="43" fill="#0ea5e9"/><text x="115" y="10" text-anchor="middle" class="n">2</text><rect y="65" width="230" height="190" rx="24" class="box"/><text x="115" y="124" text-anchor="middle" class="h">切阶段</text><text x="115" y="166" text-anchor="middle" class="b">找事件边界</text><text x="115" y="201" text-anchor="middle" class="b">写每段始末状态</text></g><path d="M605 455H665" class="arr"/>
<g transform="translate(675 295)"><circle cx="115" cy="0" r="43" fill="#16a34a"/><text x="115" y="10" text-anchor="middle" class="n">3</text><rect y="65" width="230" height="190" rx="24" class="box"/><text x="115" y="124" text-anchor="middle" class="h">选表征</text><text x="115" y="166" text-anchor="middle" class="b">受力、能量、函数</text><text x="115" y="201" text-anchor="middle" class="b">只选当前需要的图</text></g><path d="M915 455H975" class="arr"/>
<g transform="translate(985 295)"><circle cx="115" cy="0" r="43" fill="#f59e0b"/><text x="115" y="10" text-anchor="middle" class="n">4</text><rect y="65" width="230" height="190" rx="24" class="box"/><text x="115" y="124" text-anchor="middle" class="h">连状态</text><text x="115" y="166" text-anchor="middle" class="b">上一段末态</text><text x="115" y="201" text-anchor="middle" class="b">成为下一段初态</text></g><path d="M1225 455H1285" class="arr"/>
<g transform="translate(1295 295)"><circle cx="115" cy="0" r="43" fill="#e11d48"/><text x="115" y="10" text-anchor="middle" class="n">5</text><rect y="65" width="230" height="190" rx="24" class="box"/><text x="115" y="124" text-anchor="middle" class="h">查结果</text><text x="115" y="166" text-anchor="middle" class="b">单位、方向、极限</text><text x="115" y="201" text-anchor="middle" class="b">代数解回到情境</text></g>
<rect x="250" y="680" width="1100" height="120" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/><text x="800" y="727" text-anchor="middle" class="h">每一步都要留下可检查的产出：标注、分镜、模型图、状态表或检验理由</text><text x="800" y="769" text-anchor="middle" class="b">可视化承担外部记忆和关系组织，学生仍需为每一条连接作出物理解释。</text></svg>
