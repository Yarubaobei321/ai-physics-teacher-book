<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.h{font-size:26px;font-weight:750}.b{font-size:20px;fill:#475569}.box{fill:#fff;stroke:#94a3b8;stroke-width:3}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:4}.green{fill:#ecfdf5;stroke:#34d399;stroke-width:4}.amber{fill:#fffbeb;stroke:#f59e0b;stroke-width:4}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.cond{fill:#fff1f2;stroke:#fb7185;stroke-width:3}</style>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" class="title">充电后断开电源：面积变化怎样传到静电计</text>
  <rect x="80" y="150" width="1440" height="90" rx="20" class="cond"/><text x="800" y="205" text-anchor="middle" class="h">成立条件：起电机已断开；短时间内漏电可忽略；静电计和引线属于连接系统</text>
  <g transform="translate(90 360)"><rect width="250" height="150" rx="24" class="amber"/><text x="125" y="62" text-anchor="middle" class="h">有效面积 S</text><text x="125" y="108" text-anchor="middle" class="b">外层铝箔升降</text></g>
  <path d="M350 435H450" class="arr"/>
  <g transform="translate(460 360)"><rect width="250" height="150" rx="24" class="green"/><text x="125" y="62" text-anchor="middle" class="h">电容 C</text><text x="125" y="108" text-anchor="middle" class="b">随有效面积同向变化</text></g>
  <path d="M720 435H820" class="arr"/>
  <g transform="translate(830 360)"><rect width="250" height="150" rx="24" class="blue"/><text x="125" y="62" text-anchor="middle" class="h">电势差 U=Q/C</text><text x="125" y="108" text-anchor="middle" class="b">与C反向变化</text></g>
  <path d="M1090 435H1190" class="arr"/>
  <g transform="translate(1200 360)"><rect width="250" height="150" rx="24" class="box"/><text x="125" y="62" text-anchor="middle" class="h">静电计张角</text><text x="125" y="108" text-anchor="middle" class="b">随电势差改变</text></g>
  <rect x="180" y="650" width="560" height="110" rx="20" class="green"/><text x="460" y="698" text-anchor="middle" class="h">面积增大 → C增大 → U减小 → 张角减小</text><text x="460" y="735" text-anchor="middle" class="b">其他条件相对不变</text>
  <rect x="860" y="650" width="560" height="110" rx="20" class="amber"/><text x="1140" y="698" text-anchor="middle" class="h">面积减小 → C减小 → U增大 → 张角增大</text><text x="1140" y="735" text-anchor="middle" class="b">Q只在短时间内近似不变</text>
</svg>
