<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><path d="M0 0L12 4L0 8Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;fill:#172033}.title{font-size:46px;font-weight:800}.h{font-size:31px;font-weight:800}.b{font-size:22px;fill:#475569}.n{font-size:64px;font-weight:800;fill:#2563eb}.card{fill:#fff;stroke:#cbd5e1;stroke-width:3}.arr{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}</style>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="80" y="90" class="title">概念建构跨越三层表征</text>
  <g transform="translate(80 200)"><rect width="400" height="480" rx="28" class="card"/><text x="55" y="80" class="n">1</text><text x="200" y="145" text-anchor="middle" class="h">真实对象</text><text x="200" y="230" text-anchor="middle" class="b">瓶体、铝箔、引线</text><text x="200" y="280" text-anchor="middle" class="b">静电计、起电机</text><text x="200" y="355" text-anchor="middle" class="h">学生动作</text><text x="200" y="415" text-anchor="middle" class="b">辨认、制作、观察</text></g>
  <path d="M500 440H590" class="arr"/>
  <g transform="translate(600 200)"><rect width="400" height="480" rx="28" class="card"/><text x="55" y="80" class="n">2</text><text x="200" y="145" text-anchor="middle" class="h">物理模型</text><text x="200" y="230" text-anchor="middle" class="b">两个导体＋绝缘介质</text><text x="200" y="280" text-anchor="middle" class="b">面积、距离、介质</text><text x="200" y="355" text-anchor="middle" class="h">学生动作</text><text x="200" y="415" text-anchor="middle" class="b">抽象、控制、预测</text></g>
  <path d="M1020 440H1110" class="arr"/>
  <g transform="translate(1120 200)"><rect width="400" height="480" rx="28" class="card"/><text x="55" y="80" class="n">3</text><text x="200" y="145" text-anchor="middle" class="h">符号关系</text><text x="200" y="230" text-anchor="middle" class="b">C=εS/d</text><text x="200" y="280" text-anchor="middle" class="b">U=Q/C（Q近似不变）</text><text x="200" y="355" text-anchor="middle" class="h">学生动作</text><text x="200" y="415" text-anchor="middle" class="b">解释、检验、迁移</text></g>
  <text x="800" y="790" text-anchor="middle" class="b">概念课的关键任务：让学生在三层之间来回对应，而不只记住最后一行公式。</text>
</svg>
