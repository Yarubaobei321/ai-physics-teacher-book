<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:19px;font-weight:800}.n{font-size:15px}.s{font-size:13px;fill:#526879}.num{font-size:20px;font-weight:900;fill:#fff}</style></defs>
  <rect width="1200" height="820" fill="#fbfaf6"/><text x="58" y="58" class="t">教师仿真设计卡：六问写清以后再开发</text><text x="58" y="88" class="s">每一格都应落到具体对象、动作或可核验产物</text>
  <g transform="translate(65 125)"><rect width="520" height="180" rx="20" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#587e99"/><text x="42" y="49" class="num" text-anchor="middle">1</text><text x="82" y="42" class="h">学生在哪里卡住？</text><text x="32" y="88" class="n">□ 看不见结构　□ 跟不上过程　□ 连不起关系</text><text x="32" y="123" class="n">□ 不会判断证据　□ 不会识别模型边界</text><line x1="32" y1="154" x2="485" y2="154" stroke="#9fb7c7"/></g>
  <g transform="translate(615 125)"><rect width="520" height="180" rx="20" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#e68b2c"/><text x="42" y="49" class="num" text-anchor="middle">2</text><text x="82" y="42" class="h">模型保留和忽略什么？</text><text x="32" y="88" class="n">研究对象：____________________________</text><text x="32" y="123" class="n">成立条件：____________________________</text><text x="32" y="158" class="n">失效边界：____________________________</text></g>
  <g transform="translate(65 330)"><rect width="520" height="180" rx="20" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#438562"/><text x="42" y="49" class="num" text-anchor="middle">3</text><text x="82" y="42" class="h">哪些量允许改变？</text><text x="32" y="88" class="n">原题量：_______________________________</text><text x="32" y="123" class="n">标准化输入：___________________________</text><text x="32" y="158" class="n">一次比较只改变：_______________________</text></g>
  <g transform="translate(615 330)"><rect width="520" height="180" rx="20" fill="#f2eff8" stroke="#a798c0" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#756292"/><text x="42" y="49" class="num" text-anchor="middle">4</text><text x="82" y="42" class="h">学生要完成哪些动作？</text><text x="32" y="88" class="n">□ 预测　□ 调参　□ 暂停　□ 比较</text><text x="32" y="123" class="n">□ 解释　□ 质疑　□ 修改　□ 迁移</text><text x="32" y="158" class="n">关键暂停点：___________________________</text></g>
  <g transform="translate(65 535)"><rect width="520" height="180" rx="20" fill="#fff0ec" stroke="#dba08f" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#c86650"/><text x="42" y="49" class="num" text-anchor="middle">5</text><text x="82" y="42" class="h">怎样证明程序没有明显错？</text><text x="32" y="88" class="n">特殊点：_______________________________</text><text x="32" y="123" class="n">不变量：_______________________________</text><text x="32" y="158" class="n">必须拒绝的参数：_______________________</text></g>
  <g transform="translate(615 535)"><rect width="520" height="180" rx="20" fill="#edf3f5" stroke="#94aab5" stroke-width="2"/><circle cx="42" cy="42" r="24" fill="#36566c"/><text x="42" y="49" class="num" text-anchor="middle">6</text><text x="82" y="42" class="h">留下什么学习证据？</text><text x="32" y="88" class="n">□ 预测稿　□ 参数表　□ 关键帧标注</text><text x="32" y="123" class="n">□ 警告解释　□ 修订版本　□ 迁移作答</text><text x="32" y="158" class="n">教师反馈入口：_________________________</text></g>
  <rect x="225" y="755" width="750" height="42" rx="21" fill="#193247"/><text x="600" y="782" style="fill:#fff" font-size="16" font-weight="800" text-anchor="middle">完成卡片后再选择GeoGebra、COMSOL、模板页或自研网页</text>
</svg>
