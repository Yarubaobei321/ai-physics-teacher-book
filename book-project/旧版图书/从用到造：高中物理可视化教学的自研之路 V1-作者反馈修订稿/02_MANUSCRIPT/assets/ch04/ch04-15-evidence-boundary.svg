<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5b7385"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:21px;font-weight:800}.n{font-size:15px}.s{font-size:13px;fill:#526879}.big{font-size:40px;font-weight:900}</style></defs>
  <rect width="1200" height="700" fill="#fbfaf6"/><text x="58" y="58" class="t">仿真证据的三层边界</text><text x="58" y="88" class="s">每一层回答不同问题，前一层通过不能自动推出后一层成立</text>
  <g stroke="#5b7385" stroke-width="4" marker-end="url(#a)"><path d="M385 350H430"/><path d="M770 350H815"/></g>
  <g transform="translate(45 145)"><rect width="340" height="410" rx="22" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><text x="28" y="48" class="h">第一层　内部一致性</text><text x="28" y="90" class="n">回答：程序是否满足预设模型？</text><line x1="28" y1="112" x2="312" y2="112" stroke="#b9cbd7"/><text x="28" y="154" class="n">• 原题回归</text><text x="28" y="188" class="n">• 特殊点与极端值</text><text x="28" y="222" class="n">• 守恒量和不变量</text><text x="28" y="256" class="n">• 越界参数否决</text><text x="170" y="324" class="big" style="fill:#587e99" text-anchor="middle">77 + 10</text><text x="170" y="354" class="s" text-anchor="middle">当前列出测试全部通过</text><rect x="28" y="377" width="284" height="4" fill="#587e99"/></g>
  <g transform="translate(430 145)"><rect width="340" height="410" rx="22" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><text x="28" y="48" class="h">第二层　外部验证</text><text x="28" y="90" class="n">回答：模型与现实相符到什么程度？</text><line x1="28" y1="112" x2="312" y2="112" stroke="#e3c499"/><text x="28" y="154" class="n">• 实验传感数据</text><text x="28" y="188" class="n">• 另一种算法或软件</text><text x="28" y="222" class="n">• 网格与步长收敛</text><text x="28" y="256" class="n">• 不确定度与误差范围</text><text x="170" y="324" class="big" style="fill:#d37b20" text-anchor="middle">待补</text><text x="170" y="354" class="s" text-anchor="middle">薄膜力曲线和COMSOL工程均未外部复核</text><rect x="28" y="377" width="284" height="4" fill="#e68b2c"/></g>
  <g transform="translate(815 145)"><rect width="340" height="410" rx="22" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><text x="28" y="48" class="h">第三层　课堂证据</text><text x="28" y="90" class="n">回答：学生怎样使用并发生何种变化？</text><line x1="28" y1="112" x2="312" y2="112" stroke="#a9c9b4"/><text x="28" y="154" class="n">• 预测与参数记录</text><text x="28" y="188" class="n">• 错误和修订过程</text><text x="28" y="222" class="n">• 解释与迁移任务</text><text x="28" y="256" class="n">• 时间、对象和课堂条件</text><text x="170" y="324" class="big" style="fill:#34704f" text-anchor="middle">待采</text><text x="170" y="354" class="s" text-anchor="middle">当前章节不报告学习效果</text><rect x="28" y="377" width="284" height="4" fill="#438562"/></g>
  <rect x="160" y="602" width="880" height="54" rx="27" fill="#193247"/><text x="600" y="636" style="fill:#fff" font-size="18" font-weight="800" text-anchor="middle">准确表述：当前版本通过内部检查，外部验证与课堂证据仍需分别建立</text>
</svg>
