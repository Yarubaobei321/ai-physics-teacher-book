<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#e68b2c"/></marker><marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#587e99"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:22px;font-weight:800}.n{font-size:16px}.s{font-size:14px;fill:#526879}.math{font-family:"Times New Roman",serif;font-size:21px}</style></defs>
  <rect width="1200" height="720" fill="#fbfaf6"/><text x="58" y="58" class="t">把参数放在临界值两侧，结局才具有比较意义</text><text x="58" y="88" class="s">曲面小车模型：光滑水平面、理想曲面，系统水平动量守恒并计入重力势能</text>
  <g transform="translate(55 135)"><rect width="520" height="420" rx="22" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><text x="28" y="42" class="h">低速组　v₀=0.72vc</text><line x1="60" y1="325" x2="460" y2="325" stroke="#193247" stroke-width="5"/><path d="M120 325C185 322 205 115 260 115S335 322 400 325" fill="none" stroke="#587e99" stroke-width="8"/><rect x="88" y="325" width="344" height="40" rx="8" fill="#9fb7c7"/><circle cx="177" cy="246" r="22" fill="#e68b2c" stroke="#193247" stroke-width="3"/><path d="M178 215c-54-10-68-56-30-83" fill="none" stroke="#e68b2c" stroke-width="5" marker-end="url(#ao)"/><line x1="249" y1="115" x2="249" y2="325" stroke="#c86650" stroke-width="2" stroke-dasharray="8 6"/><text x="249" y="100" class="s" text-anchor="middle">未到最高点</text><text x="28" y="394" class="n">在左侧转折，相对速度变为零后返回左端</text></g>
  <g transform="translate(625 135)"><rect width="520" height="420" rx="22" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><text x="28" y="42" class="h">高速组　v₀=1.12vc</text><line x1="60" y1="325" x2="460" y2="325" stroke="#193247" stroke-width="5"/><path d="M120 325C185 322 205 115 260 115S335 322 400 325" fill="none" stroke="#587e99" stroke-width="8"/><rect x="88" y="325" width="344" height="40" rx="8" fill="#9fb7c7"/><circle cx="315" cy="167" r="22" fill="#e68b2c" stroke="#193247" stroke-width="3"/><path d="M222 113c60-30 123 11 125 86" fill="none" stroke="#e68b2c" stroke-width="5" marker-end="url(#ao)"/><line x1="260" y1="115" x2="260" y2="325" stroke="#438562" stroke-width="2" stroke-dasharray="8 6"/><text x="260" y="100" class="s" text-anchor="middle">越过最高点</text><text x="28" y="394" class="n">到顶仍有相对速度，随后从右侧下滑</text></g>
  <g transform="translate(160 598)"><rect width="880" height="74" rx="18" fill="#193247"/><text x="440" y="30" style="fill:#fff" font-family="Times New Roman" font-size="23" text-anchor="middle">vc = √[2gH(M+m)/M]</text><text x="440" y="57" style="fill:#cfe2ef" font-size="16" text-anchor="middle">只改初速度，保留质量与曲面高度，才能把“出口方向”归因于跨越临界条件。</text></g>
</svg>
