<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5b7385"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:21px;font-weight:800}.n{font-size:16px}.s{font-size:14px;fill:#526879}.num{font-size:18px;font-weight:900;fill:#fff}</style></defs>
  <rect width="1200" height="760" fill="#fbfaf6"/><text x="58" y="58" class="t">可检验物理仿真的六层结构</text><text x="58" y="88" class="s">每一层回答一个不同问题，缺层时画面仍能运行，解释却可能失去依据</text>
  <g stroke="#5b7385" stroke-width="3" marker-end="url(#a)"><path d="M600 185V207"/><path d="M600 283V305"/><path d="M600 381V403"/><path d="M600 479V501"/><path d="M600 577V599"/></g>
  <g transform="translate(190 112)"><rect width="820" height="73" rx="16" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><circle cx="42" cy="36" r="23" fill="#587e99"/><text x="42" y="43" class="num" text-anchor="middle">1</text><text x="82" y="31" class="h">来源边界</text><text x="250" y="31" class="n">哪些量来自题目、实验或图像？</text><text x="250" y="56" class="s">原题参数、读图值、标准化输入、开发者扩展分别标记</text></g>
  <g transform="translate(190 210)"><rect width="820" height="73" rx="16" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><circle cx="42" cy="36" r="23" fill="#e68b2c"/><text x="42" y="43" class="num" text-anchor="middle">2</text><text x="82" y="31" class="h">模型假设</text><text x="250" y="31" class="n">保留什么、忽略什么、在哪些条件下成立？</text><text x="250" y="56" class="s">研究对象、参考系、守恒条件、几何近似和状态接口</text></g>
  <g transform="translate(190 308)"><rect width="820" height="73" rx="16" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><circle cx="42" cy="36" r="23" fill="#438562"/><text x="42" y="43" class="num" text-anchor="middle">3</text><text x="82" y="31" class="h">核心计算</text><text x="250" y="31" class="n">输入怎样变成物理量和状态？</text><text x="250" y="56" class="s">单位换算、方程、求解顺序与阶段切换集中管理</text></g>
  <g transform="translate(190 406)"><rect width="820" height="73" rx="16" fill="#f2eff8" stroke="#a798c0" stroke-width="2"/><circle cx="42" cy="36" r="23" fill="#756292"/><text x="42" y="43" class="num" text-anchor="middle">4</text><text x="82" y="31" class="h">多种输出</text><text x="250" y="31" class="n">动画、图表、读数与公式是否指向同一状态？</text><text x="250" y="56" class="s">同源参数保持同步，同时说明显示节奏与物理时间</text></g>
  <g transform="translate(190 504)"><rect width="820" height="73" rx="16" fill="#fff0ec" stroke="#dba08f" stroke-width="2"/><circle cx="42" cy="36" r="23" fill="#c86650"/><text x="42" y="43" class="num" text-anchor="middle">5</text><text x="82" y="31" class="h">检查与警告</text><text x="250" y="31" class="n">特殊点、极端值和越界参数会怎样？</text><text x="250" y="56" class="s">错误输入被拒绝，近似失效被提示，测试失败阻断输出</text></g>
  <g transform="translate(190 602)"><rect width="820" height="73" rx="16" fill="#edf3f5" stroke="#94aab5" stroke-width="2"/><circle cx="42" cy="36" r="23" fill="#36566c"/><text x="42" y="43" class="num" text-anchor="middle">6</text><text x="82" y="31" class="h">学习任务</text><text x="250" y="31" class="n">学生预测、操作、比较和解释什么？</text><text x="250" y="56" class="s">保存参数、判断、错误与修订，形成可反馈的学习产物</text></g>
  <path d="M1050 148h70v490h-70" fill="none" stroke="#193247" stroke-width="3"/><text x="1146" y="395" class="h" text-anchor="middle" transform="rotate(90 1146 395)">模型工作台</text>
</svg>
