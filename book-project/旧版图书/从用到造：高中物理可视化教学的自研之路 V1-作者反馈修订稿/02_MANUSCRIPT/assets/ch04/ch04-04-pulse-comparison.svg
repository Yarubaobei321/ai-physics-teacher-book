<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:21px;font-weight:800}.n{font-size:16px}.s{font-size:14px;fill:#526879}.math{font-family:"Times New Roman",serif;font-size:18px}</style></defs>
  <rect width="1200" height="720" fill="#fbfaf6"/><text x="58" y="58" class="t">峰值相同，力时程不同，压缩时间就不同</text><text x="58" y="88" class="s">三组曲线都取Fmax=100 N、Δp=0.1029 kg·m/s；面积必须等于动量变化</text>
  <g transform="translate(45 130)"><rect width="350" height="400" rx="18" fill="#eef5fa" stroke="#8eb1ca" stroke-width="2"/><text x="24" y="38" class="h">三角形：线性增长</text><line x1="55" y1="300" x2="318" y2="300" stroke="#193247" stroke-width="2"/><line x1="55" y1="300" x2="55" y2="82" stroke="#193247" stroke-width="2"/><path d="M55 300L303 92L303 300Z" fill="#7caccb" fill-opacity=".35" stroke="#587e99" stroke-width="5"/><text x="43" y="82" class="math" text-anchor="end">Fmax</text><text x="303" y="326" class="math" text-anchor="middle">2.058 ms</text><text x="24" y="354" class="n">平均力：50 N</text><text x="24" y="382" class="s">k=1/2</text></g>
  <g transform="translate(425 130)"><rect width="350" height="400" rx="18" fill="#fff5e8" stroke="#dfae72" stroke-width="2"/><text x="24" y="38" class="h">矩形：恒力</text><line x1="55" y1="300" x2="318" y2="300" stroke="#193247" stroke-width="2"/><line x1="55" y1="300" x2="55" y2="82" stroke="#193247" stroke-width="2"/><path d="M55 300V92H180V300Z" fill="#efb86f" fill-opacity=".42" stroke="#e68b2c" stroke-width="5"/><text x="43" y="82" class="math" text-anchor="end">Fmax</text><text x="180" y="326" class="math" text-anchor="middle">1.029 ms</text><text x="24" y="354" class="n">平均力：100 N</text><text x="24" y="382" class="s">k=1</text></g>
  <g transform="translate(805 130)"><rect width="350" height="400" rx="18" fill="#edf7f1" stroke="#87b797" stroke-width="2"/><text x="24" y="38" class="h">四分之一周期正弦</text><line x1="55" y1="300" x2="318" y2="300" stroke="#193247" stroke-width="2"/><line x1="55" y1="300" x2="55" y2="82" stroke="#193247" stroke-width="2"/><path d="M55 300C120 292 187 230 251 92L251 300Z" fill="#76b88f" fill-opacity=".38" stroke="#438562" stroke-width="5"/><text x="43" y="82" class="math" text-anchor="end">Fmax</text><text x="251" y="326" class="math" text-anchor="middle">1.616 ms</text><text x="24" y="354" class="n">平均力：63.66 N</text><text x="24" y="382" class="s">k=2/π</text></g>
  <g transform="translate(120 570)"><rect width="960" height="88" rx="18" fill="#193247"/><text x="480" y="38" style="fill:#fff" font-family="Times New Roman" font-size="24" text-anchor="middle">Δp = ∫F(t)dt = kFmax·Δt</text><text x="480" y="66" style="fill:#cfe2ef" font-size="16" text-anchor="middle">峰值只给出曲线最高点；求冲量还必须说明曲线形状或平均力。</text></g>
</svg>
