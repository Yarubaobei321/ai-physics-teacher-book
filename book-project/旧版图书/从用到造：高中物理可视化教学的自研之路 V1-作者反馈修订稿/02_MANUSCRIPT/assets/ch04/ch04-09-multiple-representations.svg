  <g transform="translate(80 515)"><rect width="290" height="130" rx="18" fill="#fff0ec" stroke="#dba08f" stroke-width="2"/><text x="24" y="37" class="h">关键帧读数</text><text x="28" y="74" class="n">最高点 / 转折点</text><text x="28" y="101" class="n">v球=…　v车=…</text><text x="24" y="120" class="s">看特殊状态的定量关系</text></g>
