<svg viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5b7385"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:20px;font-weight:800}.n{font-size:15px}.s{font-size:13px;fill:#526879}</style></defs>
  <rect width="1200" height="740" fill="#fbfaf6"/><text x="58" y="58" class="t">多表征同步工作台：共享状态，承担不同读图任务</text><text x="58" y="88" class="s">同源计算保证画面一致；独立验证仍需手算、实验或另一种模型</text>
  <circle cx="600" cy="370" r="116" fill="#193247"/><text x="600" y="350" style="fill:#fff" font-size="23" font-weight="800" text-anchor="middle">同一组模型状态</text><text x="600" y="383" style="fill:#cfe2ef" font-size="16" text-anchor="middle">m, M, v₀, H, t</text><text x="600" y="413" style="fill:#cfe2ef" font-size="14" text-anchor="middle">位置 · 速度 · 能量</text>
  <g stroke="#5b7385" stroke-width="3" marker-end="url(#a)"><path d="M515 291L357 190"/><path d="M685 291L843 190"/><path d="M484 370H335"/><path d="M716 370H865"/><path d="M515 449L357 550"/><path d="M685 449L843 550"/></g>
