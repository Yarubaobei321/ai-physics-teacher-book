  <rect x="250" y="682" width="700" height="38" rx="19" fill="#193247"/><text x="600" y="707" style="fill:#fff" font-size="16" font-weight="800" text-anchor="middle">课堂中按问题逐步揭示，避免六块信息同时争夺注意</text>
