<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#5b7385"/></marker><style>text{font-family:"PingFang SC","Noto Sans SC",sans-serif;fill:#193247}.t{font-size:34px;font-weight:800}.h{font-size:20px;font-weight:800}.n{font-size:16px}.s{font-size:14px;fill:#526879}.big{font-size:46px;font-weight:900}</style></defs>
  <rect width="1200" height="720" fill="#fbfaf6"/><text x="58" y="58" class="t">一组页面怎样变成可检索的模型资源库</text><text x="58" y="88" class="s">当前开发版：20个页面入口，其中19个使用通用模型规格，薄膜冲击使用专用模型</text>
