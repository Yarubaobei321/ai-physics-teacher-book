<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <style>
    text{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}
    .title{font-size:48px;font-weight:800;fill:#172033}.sub{font-size:24px;fill:#526174}
    .group{font-size:28px;font-weight:800;fill:#fff}.item{font-size:24px;font-weight:700;fill:#172033}.desc{font-size:19px;fill:#526174}.arrow{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="70" y="82" class="title">六个动量仿真，共同回答四个课堂问题</text>
  <text x="70" y="126" class="sub">先看系统边界和关键状态，再比较约束变化与多过程连接</text>

  <rect x="70" y="190" width="450" height="610" rx="24" fill="#eef5ff" stroke="#8bb9f2" stroke-width="3"/>
  <rect x="70" y="190" width="450" height="82" rx="24" fill="#2563eb"/><text x="295" y="244" text-anchor="middle" class="group">弹簧与相互作用</text>
  <text x="110" y="342" class="item">弹簧—小球（物块）</text><text x="110" y="380" class="desc">动量守恒时，动能为何仍会变化</text>
  <path d="M120 430H470" class="arrow"/>
  <text x="110" y="505" class="item">接触后分离 / 连接后振动</text><text x="110" y="543" class="desc">弹性势能必须进入能量账本</text>

  <rect x="575" y="190" width="450" height="610" rx="24" fill="#eefbf6" stroke="#8bd4b6" stroke-width="3"/>
  <rect x="575" y="190" width="450" height="82" rx="24" fill="#0f9f6e"/><text x="800" y="244" text-anchor="middle" class="group">轻绳与约束</text>
  <text x="615" y="342" class="item">小球—圆环</text><text x="615" y="380" class="desc">质心线怎样约束水平位置与速度</text>
  <text x="615" y="474" class="item">悬绳小球—滑环</text><text x="615" y="512" class="desc">最低点、最高点如何切换状态模型</text>
  <path d="M625 575H975" class="arrow"/>
  <text x="615" y="650" class="item">共同任务</text><text x="615" y="688" class="desc">标出外力、约束方向与关键状态</text>

  <rect x="1080" y="190" width="450" height="610" rx="24" fill="#fff7ed" stroke="#f3b66c" stroke-width="3"/>
  <rect x="1080" y="190" width="450" height="82" rx="24" fill="#d97706"/><text x="1305" y="244" text-anchor="middle" class="group">可移动曲面</text>
  <text x="1120" y="342" class="item">小球—半圆槽</text><text x="1120" y="380" class="desc">离槽瞬间为何要切换约束模型</text>
  <text x="1120" y="474" class="item">小球—曲面小车</text><text x="1120" y="512" class="desc">共速与临界速度怎样决定返回或越过</text>
  <text x="1120" y="606" class="item">滑块—曲面</text><text x="1120" y="644" class="desc">飞出、落回与再接触如何分段</text>

  <rect x="190" y="850" width="1220" height="90" rx="20" fill="#172033"/>
  <text x="800" y="907" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">系统边界 → 守恒条件 → 关键状态 → 模型切换与证据解释</text>
</svg>
