<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">v4研究性量规把过程证据与成品质量分轨</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="90" y="170" width="690" height="540" rx="30" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><rect x="820" y="170" width="690" height="540" rx="30" fill="#fff5eb" stroke="#d97706" stroke-width="4"/><text x="435" y="240" text-anchor="middle" font-size="38" font-weight="700" fill="#1d4ed8">A轨 · 过程证据 60</text><text x="1165" y="240" text-anchor="middle" font-size="38" font-weight="700" fill="#b45309">B轨 · 成品质量 40</text><g font-size="26" fill="#334155"><text x="150" y="325">A1　问题定义与规格前置　15</text><text x="150" y="390">A2　迭代诊断与纠错　　　15</text><text x="150" y="455">A3　物理建模表达　　　　12</text><text x="150" y="520">A4　验收与数据校验　　　12</text><text x="150" y="585">A5　版本与取舍　　　　　 6</text><text x="880" y="325">B1　物理正确性　　　　　15</text><text x="880" y="405">B2　教学可用性　　　　　10</text><text x="880" y="485">B3　交互完整性　　　　　 8</text><text x="880" y="565">B4　呈现与可访问性　　　 7</text></g><rect x="340" y="755" width="920" height="80" rx="25" fill="#172033"/><text x="800" y="806" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">两轨不得互相倒推；证据不达标时触发封顶或暂缓</text></g></svg>
