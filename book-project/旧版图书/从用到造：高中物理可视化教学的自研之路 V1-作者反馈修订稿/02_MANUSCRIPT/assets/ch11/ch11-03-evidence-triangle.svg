<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">评价围绕同一任务收集四类互补证据</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><polygon points="800,185 250,695 1350,695" fill="#edf4ff" stroke="#2563eb" stroke-width="5"/><circle cx="800" cy="250" r="115" fill="#fff" stroke="#2563eb" stroke-width="4"/><circle cx="335" cy="650" r="115" fill="#fff" stroke="#0f9f6e" stroke-width="4"/><circle cx="1265" cy="650" r="115" fill="#fff" stroke="#d97706" stroke-width="4"/><circle cx="800" cy="535" r="130" fill="#172033"/><g text-anchor="middle"><text x="800" y="240" font-size="33" font-weight="700" fill="#1d4ed8">过程</text><text x="800" y="285" font-size="23" fill="#475569">对话、日志、版本</text><text x="335" y="640" font-size="33" font-weight="700" fill="#087f5b">成品</text><text x="335" y="685" font-size="23" fill="#475569">作品、源码、运行</text><text x="1265" y="640" font-size="33" font-weight="700" fill="#b45309">解释</text><text x="1265" y="685" font-size="23" fill="#475569">访谈、答辩、追问</text><text x="800" y="525" font-size="34" font-weight="700" fill="#fff">任务条件</text><text x="800" y="570" font-size="22" fill="#dbeafe">对象 · 时间 · 工具 · 标准</text></g><text x="800" y="825" text-anchor="middle" font-size="25" fill="#64748b">数据或分数脱离任务条件，就失去可解释的边界</text></g></svg>
