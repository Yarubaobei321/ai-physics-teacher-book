<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">一句效果结论要连续通过五个问题</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><g fill="#fff" stroke="#d5dfeb" stroke-width="3"><rect x="85" y="300" width="260" height="240" rx="25"/><rect x="380" y="300" width="260" height="240" rx="25"/><rect x="675" y="300" width="260" height="240" rx="25"/><rect x="970" y="300" width="260" height="240" rx="25"/><rect x="1265" y="300" width="260" height="240" rx="25"/></g><g text-anchor="middle"><g font-size="29" font-weight="700" fill="#1d4ed8"><text x="215" y="360">测了什么</text><text x="510" y="360">谁的变化</text><text x="805" y="360">与谁比较</text><text x="1100" y="360">还有何解释</text><text x="1395" y="360">能否迁移</text></g><g font-size="23" fill="#475569"><text x="215" y="420">行为、作品</text><text x="215" y="460">还是稳定能力</text><text x="510" y="420">样本、年级</text><text x="510" y="460">缺失与选择</text><text x="805" y="420">前后、对照</text><text x="805" y="460">或基准任务</text><text x="1100" y="420">先验、模型</text><text x="1100" y="460">时间与教师</text><text x="1395" y="420">新主题</text><text x="1395" y="460">延时与答辩</text></g></g><path d="M345 420H380M640 420H675M935 420H970M1230 420H1265" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><rect x="260" y="650" width="1080" height="100" rx="28" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="800" y="712" text-anchor="middle" font-size="29" font-weight="700" fill="#be123c">任一问题答不上来，结论就要降级为观察、关联或待检假设</text></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs></svg>
