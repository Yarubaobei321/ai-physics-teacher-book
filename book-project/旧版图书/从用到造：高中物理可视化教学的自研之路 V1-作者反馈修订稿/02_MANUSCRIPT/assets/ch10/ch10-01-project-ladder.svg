<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="105" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">项目能力随脚手架撤除而生长</text>
  <text x="92" y="155" font-size="24" fill="#64748b" font-family="PingFang SC,Microsoft YaHei,sans-serif">同一硬件对象不断增加学生要承担的判断</text>
  <path d="M170 720H1430" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <g font-family="PingFang SC,Microsoft YaHei,sans-serif">
    <rect x="120" y="520" width="300" height="180" rx="28" fill="#e8f0ff" stroke="#2563eb" stroke-width="4"/><text x="270" y="580" text-anchor="middle" font-size="32" font-weight="700" fill="#1d4ed8">完整积木</text><text x="270" y="630" text-anchor="middle" font-size="24" fill="#334155">载入 · 运行 · 改参数</text><text x="270" y="668" text-anchor="middle" font-size="22" fill="#64748b">教师提供完整起点</text>
    <rect x="470" y="400" width="300" height="300" rx="28" fill="#eefbf5" stroke="#0f9f6e" stroke-width="4"/><text x="620" y="465" text-anchor="middle" font-size="32" font-weight="700" fill="#087f5b">半积木＋代码</text><text x="620" y="520" text-anchor="middle" font-size="24" fill="#334155">对照 · 替换 · 补算法</text><text x="620" y="565" text-anchor="middle" font-size="22" fill="#64748b">校准、滤波、状态</text><text x="620" y="610" text-anchor="middle" font-size="22" fill="#64748b">逐步交给学生</text>
    <rect x="820" y="280" width="300" height="420" rx="28" fill="#fff7e8" stroke="#d97706" stroke-width="4"/><text x="970" y="345" text-anchor="middle" font-size="32" font-weight="700" fill="#b45309">代码项目</text><text x="970" y="400" text-anchor="middle" font-size="24" fill="#334155">定义任务 · 选器材</text><text x="970" y="445" text-anchor="middle" font-size="24" fill="#334155">建模 · 测试 · 迭代</text><text x="970" y="500" text-anchor="middle" font-size="22" fill="#64748b">教师只保留边界</text><text x="970" y="545" text-anchor="middle" font-size="22" fill="#64748b">与最低验收标准</text>
    <rect x="1170" y="160" width="300" height="540" rx="28" fill="#f5edff" stroke="#7c3aed" stroke-width="4"/><text x="1320" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#6d28d9">公开研究与创造</text><text x="1320" y="285" text-anchor="middle" font-size="24" fill="#334155">解释证据 · 回答质疑</text><text x="1320" y="330" text-anchor="middle" font-size="24" fill="#334155">说明失败 · 提出改进</text><text x="1320" y="395" text-anchor="middle" font-size="22" fill="#64748b">作品、数据、日志</text><text x="1320" y="440" text-anchor="middle" font-size="22" fill="#64748b">共同接受检验</text>
    <text x="150" y="790" font-size="24" fill="#2563eb">脚手架多</text><path d="M270 782H1300" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="1320" y="790" font-size="24" fill="#2563eb">学生决策多</text>
  </g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs>
</svg>
