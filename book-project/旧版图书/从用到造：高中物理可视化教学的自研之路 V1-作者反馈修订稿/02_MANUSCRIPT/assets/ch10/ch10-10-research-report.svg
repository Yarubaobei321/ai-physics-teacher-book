<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="95" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">八分钟汇报把项目重新组织成证据论证</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M155 430H1450" stroke="#cbd5e1" stroke-width="7"/><g fill="#fff" stroke="#2563eb" stroke-width="4"><circle cx="180" cy="430" r="70"/><circle cx="430" cy="430" r="70"/><circle cx="680" cy="430" r="70"/><circle cx="930" cy="430" r="70"/><circle cx="1180" cy="430" r="70"/><circle cx="1430" cy="430" r="70"/></g><g font-size="25" font-weight="700" fill="#1d4ed8" text-anchor="middle"><text x="180" y="423">问题</text><text x="180" y="457">与边界</text><text x="430" y="423">方法</text><text x="430" y="457">与制作</text><text x="680" y="423">原始结果</text><text x="680" y="457">与现象</text><text x="930" y="423">分析</text><text x="930" y="457">与误差</text><text x="1180" y="423">结论</text><text x="1180" y="457">与不足</text><text x="1430" y="423">答辩</text><text x="1430" y="457">与追问</text></g><g font-size="22" fill="#64748b" text-anchor="middle"><text x="180" y="570">为什么值得做</text><text x="430" y="570">具体怎样做</text><text x="680" y="570">实际看到了什么</text><text x="930" y="570">为何出现、能否相信</text><text x="1180" y="570">做到哪里、还差什么</text><text x="1430" y="570">能否回应反例</text></g><rect x="240" y="690" width="1120" height="95" rx="26" fill="#eefbf5" stroke="#0f9f6e" stroke-width="3"/><text x="800" y="748" text-anchor="middle" font-size="28" font-weight="700" fill="#087f5b">现场演示只证明“此刻能运行”，研究汇报还要说明条件、数据与局限</text></g></svg>
