<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="100" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">开放项目进入课堂前，要依次通过四道闸门</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><path d="M130 450H1460" stroke="#cbd5e1" stroke-width="12"/><g><rect x="120" y="250" width="300" height="400" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="4"/><rect x="475" y="250" width="300" height="400" rx="28" fill="#eefbf5" stroke="#0f9f6e" stroke-width="4"/><rect x="830" y="250" width="300" height="400" rx="28" fill="#fff7e8" stroke="#d97706" stroke-width="4"/><rect x="1185" y="250" width="300" height="400" rx="28" fill="#f5edff" stroke="#7c3aed" stroke-width="4"/></g><g font-size="33" font-weight="700" text-anchor="middle"><text x="270" y="325" fill="#1d4ed8">物理闸门</text><text x="625" y="325" fill="#087f5b">工程闸门</text><text x="980" y="325" fill="#b45309">现场闸门</text><text x="1335" y="325" fill="#6d28d9">公开闸门</text></g><g font-size="24" fill="#334155" text-anchor="middle"><text x="270" y="405">原理与条件准确</text><text x="270" y="455">量程和单位清楚</text><text x="270" y="505">不存在误导解释</text><text x="625" y="405">供电、发热、运动</text><text x="625" y="455">故障可恢复</text><text x="625" y="505">器材不会误接</text><text x="980" y="405">分区、护具、演练</text><text x="980" y="455">人员职责明确</text><text x="980" y="505">禁止模仿项目隔离</text><text x="1335" y="405">肖像与个人信息</text><text x="1335" y="455">图片、代码和来源</text><text x="1335" y="505">发布范围获授权</text></g><text x="800" y="760" text-anchor="middle" font-size="27" fill="#64748b">任何一道未通过，都应缩小任务、改为教师演示或暂缓公开</text></g></svg>
