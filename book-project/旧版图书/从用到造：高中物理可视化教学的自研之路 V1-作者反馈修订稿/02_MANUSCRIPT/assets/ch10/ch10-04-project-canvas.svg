<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f7f9fc"/><text x="90" y="95" font-size="46" font-weight="700" fill="#172033" font-family="PingFang SC,Microsoft YaHei,sans-serif">把“做一个智能装置”改写成可验证任务</text><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><g fill="#fff" stroke="#d5dfeb" stroke-width="3"><rect x="90" y="150" width="450" height="220" rx="24"/><rect x="575" y="150" width="450" height="220" rx="24"/><rect x="1060" y="150" width="450" height="220" rx="24"/><rect x="90" y="415" width="450" height="220" rx="24"/><rect x="575" y="415" width="450" height="220" rx="24"/><rect x="1060" y="415" width="450" height="220" rx="24"/></g><g font-size="29" font-weight="700" fill="#1d4ed8"><text x="125" y="205">1 真实问题</text><text x="610" y="205">2 物理量与模型</text><text x="1095" y="205">3 传感与执行</text><text x="125" y="470">4 控制规则</text><text x="610" y="470">5 验收证据</text><text x="1095" y="470">6 边界与风险</text></g><g font-size="24" fill="#475569"><text x="125" y="255">谁在什么情境中遇到困难？</text><text x="125" y="300">现有方案哪里不够用？</text><text x="610" y="255">要测什么量？怎样换算？</text><text x="610" y="300">适用条件和误差从哪里来？</text><text x="1095" y="255">传感器能给出什么原始量？</text><text x="1095" y="300">动作需要什么供电与接口？</text><text x="125" y="520">阈值怎样确定？状态如何转换？</text><text x="125" y="565">异常输入怎样处理？</text><text x="610" y="520">保存哪些数据、截图和版本？</text><text x="610" y="565">怎样判断“达到目标”？</text><text x="1095" y="520">隐私、版权、用电与机械风险</text><text x="1095" y="565">哪些操作必须由教师完成？</text></g><rect x="240" y="700" width="1120" height="100" rx="28" fill="#eaf2ff" stroke="#2563eb" stroke-width="3"/><text x="800" y="760" text-anchor="middle" font-size="30" font-weight="700" fill="#1d4ed8">一页任务画布先固定问题、证据和边界，再允许方案开放</text></g></svg>
