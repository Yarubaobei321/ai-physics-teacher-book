      "fact_id": "leyden-structure-001",
      "statement": "装置以瓶体作为绝缘介质，在内外表面设置导体并分别引出连接，可作为电容器结构的实物模型。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-cap-doc-001", "src-cap-ppt-002", "src-cap-photo-003"]
    },
    {
      "fact_id": "leyden-variable-002",
      "statement": "设计通过改变内外导体的有效重叠高度改变有效正对面积，同时尽量保持瓶壁厚度与介质不变。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-cap-doc-001"]
    },
    {
      "fact_id": "leyden-classroom-003",
      "statement": "装置是否在具体班级实施以及学生是否亲手制作，现有材料不能确认。",
      "status": "pending",
      "canonical": true,
      "source_ids": ["src-cap-doc-001", "src-cap-ppt-002"]
    }
  ],
  "formulas": [
    {
      "formula_id": "cap-parallel-plate-001",
      "expression": "C = εS/d",
      "variables": {"C": "电容", "ε": "介质的介电性质", "S": "有效正对面积", "d": "导体间距离"},
      "scope": "理想平行板近似；忽略边缘效应。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-physics-check-004"]
    },
    {
      "formula_id": "cap-coaxial-002",
      "expression": "C = 2πεL / ln(b/a)",
      "variables": {"L": "内外圆柱导体有效重叠长度", "a": "内导体等效半径", "b": "外导体等效内半径"},
      "scope": "同轴圆柱近似；几何形状和介质固定时C与L成正比。",
      "status": "verified",
      "canonical": false,
      "source_ids": ["src-physics-check-004"]
    },
    {
      "formula_id": "isolated-system-003",
      "expression": "U = Q/C",
      "variables": {"Q": "充电后断开电源时近似保持的系统电荷量", "U": "电容器两端电势差"},
      "scope": "充电源已断开、漏电可忽略、静电计接入影响纳入系统时。面积减小导致C减小，U增大。",
      "status": "verified",
      "canonical": true,
      "source_ids": ["src-physics-check-004"]
    }
  ],
