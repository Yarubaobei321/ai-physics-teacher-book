<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315f86"/></marker>
    <style>
      text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#18354d}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#577287}.box-title{font-size:20px;font-weight:700}.body{font-size:16px}.note{font-size:14px;fill:#577287}.box{fill:#fff;stroke:#315f86;stroke-width:2}.constraint{fill:#edf5fb;stroke:#7ba2c2;stroke-width:1.5}.decision{fill:#fff8e8;stroke:#b58225;stroke-width:1.5}.device{fill:#eef8f1;stroke:#4a8461;stroke-width:2}.flow{fill:none;stroke:#315f86;stroke-width:2.5;marker-end:url(#arrow)}.merge{fill:none;stroke:#315f86;stroke-width:2.2}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="52" y="55" class="title">课堂条件如何转成三端架构</text>
  <text x="52" y="84" class="sub">先固定终端、人数与器材，再决定代码怎样从学生手中到达真实硬件</text>

  <text x="60" y="135" class="box-title">课堂约束</text>
  <rect x="50" y="155" width="210" height="72" rx="12" class="constraint"/>
  <text x="155" y="185" text-anchor="middle" class="box-title">36名学生 · 8组</text><text x="155" y="211" text-anchor="middle" class="note">需要并行而不是逐台演示</text>
  <rect x="280" y="155" width="210" height="72" rx="12" class="constraint"/>
  <text x="385" y="185" text-anchor="middle" class="box-title">安卓平板为主</text><text x="385" y="211" text-anchor="middle" class="note">不能依赖桌面IDE</text>
  <rect x="510" y="155" width="210" height="72" rx="12" class="constraint"/>
  <text x="615" y="185" text-anchor="middle" class="box-title">教室具备WiFi</text><text x="615" y="211" text-anchor="middle" class="note">无线下发可以作为主路径</text>
  <rect x="740" y="155" width="210" height="72" rx="12" class="constraint"/>
  <text x="845" y="185" text-anchor="middle" class="box-title">固定ESP32器材</text><text x="845" y="211" text-anchor="middle" class="note">无需多板卡生态</text>
  <rect x="970" y="155" width="180" height="72" rx="12" class="constraint"/>
  <text x="1060" y="185" text-anchor="middle" class="box-title">要即时回显</text><text x="1060" y="211" text-anchor="middle" class="note">实验变化要能被看见</text>

  <path d="M155 227 V250 H1060" class="merge"/><path d="M385 227 V250" class="merge"/><path d="M615 227 V250" class="merge"/><path d="M845 227 V250" class="merge"/><path d="M1060 227 V250" class="merge"/><path d="M600 250 V270" class="flow"/>
  <rect x="330" y="270" width="540" height="82" rx="14" class="decision"/>
  <text x="600" y="303" text-anchor="middle" class="box-title">三项设计决定</text>
  <text x="600" y="332" text-anchor="middle" class="body">Web PWA承担编辑 · MicroPython免去编译 · 教师服务器集中路由</text>

  <path d="M600 352 V405" class="flow"/>
  <text x="60" y="410" class="box-title">三端协同</text>
  <rect x="80" y="435" width="280" height="150" rx="16" class="box"/>
  <text x="220" y="475" text-anchor="middle" class="box-title">学生端 PWA</text>
  <text x="220" y="510" text-anchor="middle" class="body">拖动积木</text><text x="220" y="537" text-anchor="middle" class="body">生成 MicroPython</text><text x="220" y="564" text-anchor="middle" class="note">平板浏览器</text>
  <rect x="460" y="435" width="280" height="150" rx="16" class="box"/>
  <text x="600" y="475" text-anchor="middle" class="box-title">教师端服务器</text>
  <text x="600" y="510" text-anchor="middle" class="body">托管页面 · 管理设备</text><text x="600" y="537" text-anchor="middle" class="body">按编号路由代码</text><text x="600" y="564" text-anchor="middle" class="note">教师Mac</text>
  <rect x="840" y="435" width="280" height="150" rx="16" class="device"/>
  <text x="980" y="475" text-anchor="middle" class="box-title">设备端 ESP32</text>
  <text x="980" y="510" text-anchor="middle" class="body">接收并运行程序</text><text x="980" y="537" text-anchor="middle" class="body">回传串口数据</text><text x="980" y="564" text-anchor="middle" class="note">MicroPython固件</text>
  <path d="M360 485 H460" class="flow"/><text x="410" y="472" text-anchor="middle" class="note">代码</text>
  <path d="M740 485 H840" class="flow"/><text x="790" y="472" text-anchor="middle" class="note">按设备编号下发</text>
  <path d="M840 550 H760 V625 H440 V550 H360" class="flow"/><text x="600" y="648" text-anchor="middle" class="note">串口输出沿原路径返回，学生在同一页面观察数据</text>
  <text x="50" y="695" class="note">根据ESP32Blockly《需求分析与技术路线》及项目源码绘制，示意图</text>
</svg>
